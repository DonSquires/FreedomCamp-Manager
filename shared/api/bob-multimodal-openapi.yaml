openapi: 3.0.3
info:
  title: Bob Multimodal Privacy Gateway API
  version: 1.0.0
  description: |
    Privacy-first multimodal API gateway for Bob orchestration.
    This spec is aligned to the Supabase Edge Function route:
    /functions/v1/bob-multimodal-gateway/v1/bob/*
servers:
  - url: https://{project}.supabase.co/functions/v1/bob-multimodal-gateway
    variables:
      project:
        default: your-project-id
security:
  - bearerAuth: []
paths:
  /v1/bob/interpret:
    post:
      summary: Interpret request and plan capabilities
      operationId: bobInterpret
      tags: [Bob]
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/BobScopesHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterpretRequest'
      responses:
        '200':
          description: Interpretation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterpretResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/bob/request_ai:
    post:
      summary: Dispatch request to Bob capability
      operationId: bobRequestAi
      tags: [Bob]
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/BobScopesHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestAiRequest'
      responses:
        '200':
          description: AI execution status/result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestAiResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '502': { $ref: '#/components/responses/UpstreamError' }
  /v1/bob/response:
    post:
      summary: Ingest interaction feedback for Bob learning
      operationId: bobResponseFeedback
      tags: [Bob, Learning]
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/BobScopesHeader'
        - $ref: '#/components/parameters/IdempotencyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResponseFeedbackRequest'
      responses:
        '202':
          description: Feedback accepted and optionally ingested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseFeedbackResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '502': { $ref: '#/components/responses/UpstreamError' }
  /v1/bob/execution:
    post:
      summary: Execute approved actions with provenance metadata
      operationId: bobExecution
      tags: [Bob]
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/BobScopesHeader'
        - $ref: '#/components/parameters/IdempotencyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionRequest'
      responses:
        '200':
          description: Execution accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/bob/privacy/consent:
    post:
      summary: Register or update consent profile
      operationId: bobPrivacyConsent
      tags: [Bob, Privacy]
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/BobScopesHeader'
        - $ref: '#/components/parameters/IdempotencyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentRequest'
      responses:
        '202':
          description: Consent update accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/bob/privacy/delete:
    post:
      summary: Register deletion request
      operationId: bobPrivacyDelete
      tags: [Bob, Privacy]
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/BobScopesHeader'
        - $ref: '#/components/parameters/IdempotencyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteRequest'
      responses:
        '202':
          description: Deletion request accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400': { $ref: '#/components/responses/BadRequest' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    RequestIdHeader:
      in: header
      name: x-request-id
      required: false
      schema:
        type: string
    BobScopesHeader:
      in: header
      name: x-bob-scopes
      required: false
      schema:
        type: string
      description: Comma/space-separated scopes (e.g. bob:interpret bob:privacy)
    IdempotencyHeader:
      in: header
      name: idempotency-key
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid request payload or missing required field
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Missing required capability scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UpstreamError:
      description: Upstream AI provider error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    PrivacyPreferences:
      type: object
      properties:
        level:
          type: string
          enum: [low, standard, high]
        redact_pii:
          type: boolean
      additionalProperties: false
    InterpretRequest:
      type: object
      required: [session_id, context]
      properties:
        session_id:
          type: string
        user_id:
          type: string
        context:
          type: object
          properties:
            input_text: { type: string }
            channel: { type: string }
            timestamp: { type: string, format: date-time }
            modality: { type: string }
          required: [input_text]
        requested_capabilities:
          type: array
          items: { type: string }
        privacy_preferences:
          $ref: '#/components/schemas/PrivacyPreferences'
    InterpretResponse:
      type: object
      properties:
        session_id: { type: string }
        intent: { type: string }
        entities:
          type: object
          additionalProperties: true
        confidence: { type: number }
        planned_capabilities:
          type: array
          items: { type: string }
        notes: { type: string }
    RequestAiRequest:
      type: object
      required: [session_id, ai_type, payload]
      properties:
        session_id: { type: string }
        ai_type:
          type: string
          enum: [text, drawing, vision, speech, translate, assess]
        payload:
          type: object
          additionalProperties: true
    RequestAiResponse:
      type: object
      properties:
        session_id: { type: string }
        ai_type: { type: string }
        execution_id: { type: string }
        status:
          type: string
          enum: [in_progress, completed, failed]
        result:
          type: object
          additionalProperties: true
    ResponseFeedbackRequest:
      type: object
      required: [session_id, interaction, privacy]
      properties:
        session_id: { type: string }
        source:
          type: string
          description: Logical source label for feedback stream
        source_provider:
          type: string
          description: External reference provider label (reference-only)
        interaction:
          type: object
          required: [prompt, response]
          properties:
            prompt: { type: string }
            response: { type: string }
            outcome: { type: string }
            rating:
              type: integer
              minimum: 1
              maximum: 5
        privacy:
          type: object
          required: [consent_provided, data_sharing]
          properties:
            consent_provided: { type: boolean }
            data_sharing:
              type: string
              enum: [minimal]
            redact_pii: { type: boolean }
    ResponseFeedbackResponse:
      type: object
      properties:
        session_id: { type: string }
        status: { type: string }
        idempotency_key: { type: string }
        learned: { type: boolean }
        source_provider: { type: string }
        ingest_result:
          type: object
          additionalProperties: true
    ExecutionRequest:
      type: object
      required: [session_id, actions]
      properties:
        session_id: { type: string }
        actions:
          type: array
          items:
            type: object
            properties:
              action: { type: string }
              capability: { type: string }
              ai_service: { type: string }
              params:
                type: object
                additionalProperties: true
            required: [action]
    ExecutionResponse:
      type: object
      properties:
        session_id: { type: string }
        execution_id: { type: string }
        status: { type: string }
        idempotency_key: { type: string }
        result:
          type: object
          properties:
            confirmed_actions:
              type: array
              items:
                type: object
                additionalProperties: true
    ConsentRequest:
      type: object
      required: [session_id, user_id, consent]
      properties:
        session_id: { type: string }
        user_id: { type: string }
        consent:
          type: object
          properties:
            sharing_with:
              type: array
              items: { type: string }
            granularity: { type: string }
            limits:
              type: object
              properties:
                retention_days: { type: integer }
                redaction_level: { type: string }
    ConsentResponse:
      type: object
      properties:
        session_id: { type: string }
        status: { type: string }
        idempotency_key: { type: string }
        consent:
          type: object
          additionalProperties: true
    DeleteRequest:
      type: object
      required: [session_id, user_id, scope]
      properties:
        session_id: { type: string }
        user_id: { type: string }
        scope:
          type: array
          items: { type: string }
        deletion_reason: { type: string }
        timestamp: { type: string, format: date-time }
    DeleteResponse:
      type: object
      properties:
        session_id: { type: string }
        status: { type: string }
        idempotency_key: { type: string }
        processing_id: { type: string }
        estimated_completion: { type: string, format: date-time }
    ErrorResponse:
      type: object
      properties:
        error: { type: string }
        errorId: { type: string }
        details:
          type: object
          additionalProperties: true
