# Supabase CLI configuration
# Used by 'supabase link', 'supabase db push', and 'supabase functions deploy'
# Reference: https://supabase.com/docs/guides/cli/config

project_id = "xbfnlzmpumthnjmtqufp"  # public project reference, not a secret

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false

# ── Edge Function JWT verification settings ──────────────────────────────────
#
# get-weather: fetches weather via external AI API — no user data is exposed,
# so JWT verification is not required.  Removing it also ensures the Supabase
# gateway lets CORS pre-flight (OPTIONS) requests through without a token.
[functions.get-weather]
verify_jwt = false

# alpr-process: uses SERVICE_ROLE_KEY internally.  JWT is NOT verified at the
# gateway so that browser CORS pre-flight OPTIONS requests (which carry no
# Authorization header) reach the function handler and receive the correct
# Access-Control-Allow-Origin response headers.
[functions.alpr-process]
verify_jwt = false
