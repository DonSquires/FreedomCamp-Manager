# Supabase CLI configuration
# Used by 'supabase link', 'supabase db push', and 'supabase functions deploy'
# Reference: https://supabase.com/docs/guides/cli/config
#
# NEW PROJECT: run `supabase link --project-ref YOUR_NEW_REF` to update this
# field, or edit it manually to match your new project reference.

project_id = "kxwjcupuxnnbnzcgmkoi"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
# Production site URL — use the apex domain as the canonical anchor.
# This value is pushed to the hosted project via `supabase config push` and is
# used by Supabase (GoTrue + PostgREST) as the primary CORS allowed origin.
# Use the apex domain here; add the www subdomain and any preview URLs in
# additional_redirect_urls so auth redirects still work from those origins.
site_url = "https://fcmanager.co.nz"
# All allowed redirect origins:
#  - www subdomain (apex is site_url; subdomains go here)
#  - hosted app build URL
#  - wildcard covering every ephemeral preview build
#  - localhost for local development
additional_redirect_urls = [
  "https://www.fcmanager.co.nz",
  "https://freedomcampmanager.onspace.build",
  "https://*.onspace.build",
  "https://*.onspace.build/**",
  "https://*.vercel.app",
  "https://*.vercel.app/**",
  "http://localhost:5173",
  "http://localhost:5173/**",
  "http://localhost:3000",
  "http://localhost:3000/**"
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false

# ── Edge Function JWT verification settings ──────────────────────────────────
#
# get-weather: fetches weather via external AI API — no user data is exposed,
# so JWT verification is not required.  Removing it also ensures the Supabase
# gateway lets CORS pre-flight (OPTIONS) requests through without a token.
[functions.get-weather]
verify_jwt = false

# alpr-process: uses SERVICE_ROLE_KEY internally.  JWT is NOT verified at the
# gateway so that browser CORS pre-flight OPTIONS requests (which carry no
# Authorization header) reach the function handler and receive the correct
# Access-Control-Allow-Origin response headers.
[functions.alpr-process]
verify_jwt = false

# process-officer-scan: called fire-and-forget from the FieldOfficerPortal and
# also server-side from other edge functions (vehicle-ingest).  Server-side
# callers use ES256-signed JWTs which Supabase gateway rejects at the
# network layer before the function runs (execution_id: null in logs).
# JWT ownership is validated inside the function using the service-role client.
[functions.process-officer-scan]
verify_jwt = false

# generate-infringement: ES256-signed user JWTs are rejected by the Supabase
# gateway before the function runs (returns 401, execution_id: null).
# The function verifies ownership internally via supabaseAdmin.auth.getUser(token).
[functions.generate-infringement]
verify_jwt = false

# render-infringement-notice: same ES256 gateway issue as generate-infringement.
# Auth is validated inside the function body using the service-role client.
[functions.render-infringement-notice]
verify_jwt = false

# vehicle-ingest: browser and mobile clients send ES256-signed user JWTs that
# Supabase gateway can reject before the function runs (401 with execution_id:
# null). The function validates the caller internally via service-role auth and
# profile lookup, so gateway JWT verification must be disabled.
[functions.vehicle-ingest]
verify_jwt = false

# reingest-photos: admin UI calls this directly from the browser and hits the
# same gateway ES256 rejection pattern as vehicle-ingest. The function performs
# its own auth/profile checks internally.
[functions.reingest-photos]
verify_jwt = false

# cleanup-and-recalculate: browser calls can be rejected at the gateway with
# 401 before execution_id is created (even with valid ES256 user JWTs). We
# disable gateway verification and validate Authorization + role in function.
[functions.cleanup-and-recalculate]
verify_jwt = false

# duplicate-detection: browser calls can be rejected at the gateway with 401
# before execution starts; auth + role are validated in function.
[functions.duplicate-detection]
verify_jwt = false

# sync-scv-list: follows the same browser ES256 pattern where gateway can
# return 401 before function execution starts. Auth + admin role are validated
# inside the function body.
[functions.sync-scv-list]
verify_jwt = false

# create-user: admin/master users invite new users from the browser; their
# ES256-signed JWTs are rejected by the Supabase gateway before the function
# runs (401, execution_id: null). The function validates the caller's JWT
# internally via supabaseAdmin.auth.getUser(token) and checks role before
# creating any auth users.
[functions.create-user]
verify_jwt = false

# recalculate-compliance-v3: admin/master trigger compliance recalculation from
# the browser; ES256-signed JWTs are rejected at the gateway (401, execution_id:
# null). Auth + admin role are validated inside the function body.
[functions.recalculate-compliance-v3]
verify_jwt = false
