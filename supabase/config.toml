# process-face-scan: browser callers send ES256-signed JWTs that the Supabase
# gateway rejects before the function runs (401, execution_id: null).
# The function validates the caller's JWT internally via supabase.auth.getUser(token).
[functions.process-face-scan]
verify_jwt = false

# ptt-signaling-token performs its own Authorization header validation and
# user lookup via supabase.auth.getUser(accessToken). Keep gateway JWT
# verification disabled to avoid pre-execution 401 Invalid JWT responses.
[functions.ptt-signaling-token]
verify_jwt = false

# biosecurity-assess / smoke-assess / translate-message: browser callers send
# HS256-signed Supabase JWTs but the hosted project's gateway may be configured
# for ES256, causing a 401 "Unsupported JWT algorithm" before the function runs.
# Each function validates auth internally via requireAuth (supabase.auth.getUser).
[functions.biosecurity-assess]
verify_jwt = false

[functions.smoke-assess]
verify_jwt = false

[functions.translate-message]
verify_jwt = false

# speech-to-intent / transcribe-audio: keep gateway JWT verification disabled
# to avoid pre-execution 401s from hosted gateway algorithm mismatch.
# Both functions enforce auth inside the handler via requireAuth.
[functions.speech-to-intent]
verify_jwt = false

[functions.transcribe-audio]
verify_jwt = false

# ptt-assess: Bob AI PTT diagnostics endpoint.  Validates auth internally.
[functions.ptt-assess]
verify_jwt = false

