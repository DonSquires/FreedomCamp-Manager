version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '03:10'
      timezone: Pacific/Auckland
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - security
      - automation
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '03:30'
      timezone: Pacific/Auckland
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - automation
