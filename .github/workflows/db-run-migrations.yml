name: Database — Run Migrations (developer utility)

# Developer utility for listing pending migrations or applying a specific one.
# For production-gated schema pushes use db-push.yml instead.
#
# Actions:
#   list          — print pending migrations (dry run, no DB writes)
#   apply-all     — run supabase db push --include-all --yes
#   apply-one     — apply a specific migration file via psql
#
# Required secrets:
#   SUPABASE_ACCESS_TOKEN  — Supabase personal access token (sbp_…)
#   SUPABASE_PROJECT_REF   — Supabase project reference ID
#   SUPABASE_DB_PASSWORD   — Database password for the linked project

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'list'
        type: choice
        options: [list, apply-all, apply-one]
      migration_file:
        description: '[apply-one] Migration filename (e.g. 20260424000001_foo.sql)'
        required: false
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-migrations:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check required secrets
        run: |
          missing=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$SUPABASE_PROJECT_REF"  ] && missing="$missing SUPABASE_PROJECT_REF"
          [ -z "$SUPABASE_DB_PASSWORD"  ] && missing="$missing SUPABASE_DB_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing"
            echo "::notice::Add these at: GitHub repo → Settings → Secrets → Actions"
            exit 1
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: List pending migrations
        if: github.event.inputs.action == 'list'
        run: |
          echo "=== Pending migrations in supabase/migrations/ ==="
          ls -1 supabase/migrations/*.sql | xargs -n1 basename | sort
          echo ""
          echo "Dry run complete — no changes were applied."
          echo "Choose 'apply-all' or 'apply-one' to apply migrations."

      - name: Apply specific migration (psql)
        if: github.event.inputs.action == 'apply-one'
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          FILE="supabase/migrations/${{ github.event.inputs.migration_file }}"
          if [ -z "${{ github.event.inputs.migration_file }}" ]; then
            echo "::error::migration_file input is required for apply-one"
            exit 1
          fi
          if [ ! -f "$FILE" ]; then
            echo "::error::Migration file not found: $FILE"
            exit 1
          fi
          echo "Applying migration: $FILE"
          PGPASSWORD="$SUPABASE_DB_PASSWORD" psql \
            "postgresql://postgres.${SUPABASE_PROJECT_REF}:${SUPABASE_DB_PASSWORD}@aws-0-ap-southeast-2.pooler.supabase.com:5432/postgres" \
            -f "$FILE" \
            -v ON_ERROR_STOP=1
          echo "✅ Migration applied."

      - name: Apply all pending migrations
        if: github.event.inputs.action == 'apply-all'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --include-all --yes
          echo "✅ All pending migrations applied."
