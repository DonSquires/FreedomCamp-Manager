name: Ops Nightly Self-Learning Pretrain

on:
  schedule:
    - cron: '0 0 * * *'   # once a day at midnight UTC
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  pretrain-self-learning:
    name: Trigger Bob Self-Learning Pretrain
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Normalize Bob runtime endpoint and auth key
        run: |
          BASE_URL="${BOB_SERVICE_URL:-${INFERENCE_SERVICE_URL:-}}"
          API_KEY="${BOB_INFERENCE_API_KEY:-${INFERENCE_API_KEY:-}}"

          if [ -z "$BASE_URL" ] || [ -z "$API_KEY" ]; then
            echo "INFERENCE_SERVICE_URL=$BASE_URL" >> "$GITHUB_ENV"
            echo "INFERENCE_API_KEY=$API_KEY" >> "$GITHUB_ENV"
            exit 0
          fi

          BASE_URL="${BASE_URL%/}"
          if [[ "$BASE_URL" != http://* && "$BASE_URL" != https://* ]]; then
            BASE_URL="https://$BASE_URL"
          fi

          echo "INFERENCE_SERVICE_URL=$BASE_URL" >> "$GITHUB_ENV"
          echo "INFERENCE_API_KEY=$API_KEY" >> "$GITHUB_ENV"
        env:
          INFERENCE_SERVICE_URL: ${{ secrets.INFERENCE_SERVICE_URL }}
          BOB_SERVICE_URL: ${{ secrets.BOB_SERVICE_URL }}
          INFERENCE_API_KEY: ${{ secrets.INFERENCE_API_KEY }}
          BOB_INFERENCE_API_KEY: ${{ secrets.BOB_INFERENCE_API_KEY }}

      - name: Validate required secrets
        run: |
          missing=""
          [ -z "$INFERENCE_SERVICE_URL" ] && missing="$missing INFERENCE_SERVICE_URL"
          [ -z "$INFERENCE_API_KEY" ] && missing="$missing INFERENCE_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing"
            exit 1
          fi
        env:
          INFERENCE_SERVICE_URL: ${{ env.INFERENCE_SERVICE_URL }}
          INFERENCE_API_KEY: ${{ env.INFERENCE_API_KEY }}

      - name: Trigger runtime pretrain
        env:
          INFERENCE_SERVICE_URL: ${{ env.INFERENCE_SERVICE_URL }}
          INFERENCE_API_KEY: ${{ env.INFERENCE_API_KEY }}
          PRETRAIN_PROFILE: ${{ vars.SELF_LEARNING_PRETRAIN_PROFILE }}
          PRETRAIN_MULTIPLIER: ${{ vars.SELF_LEARNING_PRETRAIN_MULTIPLIER }}
        run: |
          PROFILE=${PRETRAIN_PROFILE:-nz-enforcement-v1}
          MULTIPLIER=${PRETRAIN_MULTIPLIER:-6}
          BASE_URL="${INFERENCE_SERVICE_URL%/}"

          if echo "$BASE_URL" | grep -Eq '^https://api\.runpod\.ai/v2/[^/]+(/(run|runsync))?/?$'; then
            echo "::error::Resolved training URL points to RunPod serverless API (${BASE_URL}), which does not expose /learn/pretrain."
            echo "::error::Set BOB_SERVICE_URL secret to the RunPod Bob service/gateway URL that serves /learn/pretrain."
            exit 1
          fi

          echo "🧠 Triggering /learn/pretrain profile=${PROFILE} multiplier=${MULTIPLIER}"

          HTTP_STATUS=$(curl -s -o /tmp/pretrain-response.json -w "%{http_code}" \
            --max-time 45 \
            -X POST "${BASE_URL}/learn/pretrain" \
            -H "Content-Type: application/json" \
            -H "x-inference-api-key: ${INFERENCE_API_KEY}" \
            -d "{\"profile\":\"${PROFILE}\",\"multiplier\":${MULTIPLIER}}")

          cat /tmp/pretrain-response.json

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Pretrain trigger failed with HTTP $HTTP_STATUS"
            exit 1
          fi

          echo "✅ Nightly pretrain trigger completed"
