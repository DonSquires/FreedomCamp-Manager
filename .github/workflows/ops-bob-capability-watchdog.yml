name: Ops - Bob Capability Watchdog

# Continuous strict capability checks for Bob delegation paths.
# No fallback routing is performed here: checks either pass or fail.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      target:
        description: Which target to validate
        required: false
        default: both
        type: choice
        options: [both, serverless, pod]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  serverless-capability-check:
    name: Bob Serverless Capability Check
    runs-on: ubuntu-latest
    if: github.event.inputs.target == '' || github.event.inputs.target == 'both' || github.event.inputs.target == 'serverless'
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Validate required serverless secrets
        run: |
          missing=""
          [ -z "$RUNPOD_ENDPOINT_ID" ] && missing="$missing RUNPOD_ENDPOINT_ID"
          if [ -z "$RUNPOD_ENDPOINT_API_KEY" ] && [ -z "$INFERENCE_API_KEY" ] && [ -z "$RUNPOD_API_KEY" ]; then
            missing="$missing RUNPOD_ENDPOINT_API_KEY|INFERENCE_API_KEY|RUNPOD_API_KEY"
          fi
          if [ -n "$missing" ]; then
            echo "::error::Missing serverless secrets:$missing"
            exit 1
          fi
          echo "✅ Serverless secrets present"
        env:
          RUNPOD_ENDPOINT_API_KEY: ${{ secrets.RUNPOD_ENDPOINT_API_KEY }}
          INFERENCE_API_KEY: ${{ secrets.INFERENCE_API_KEY }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_ENDPOINT_ID: ${{ secrets.RUNPOD_ENDPOINT_ID }}

      - name: Run strict serverless capability gate
        id: serverless_auth
        run: |
          set -euo pipefail
          endpoint="https://api.runpod.ai/v2/${RUNPOD_ENDPOINT_ID}"

          try_key() {
            local label="$1"
            local key="$2"
            if [ -z "$key" ]; then
              return 1
            fi
            status=$(curl -sS -o /tmp/serverless_auth_probe.json -w "%{http_code}" \
              -X POST "${endpoint}/runsync" \
              -H "Authorization: Bearer ${key}" \
              -H "Content-Type: application/json" \
              -d '{"input":{"action":"chat","message":"auth probe","history":[],"model":"qwen2.5:7b","temperature":0}}' || true)
            if [ "$status" = "401" ]; then
              echo "Serverless auth probe failed with ${label} (401)"
              return 1
            fi
            echo "Serverless auth probe accepted ${label} (HTTP ${status})"
            echo "resolved_key=${key}" >> "$GITHUB_OUTPUT"
            return 0
          }

          try_key "RUNPOD_ENDPOINT_API_KEY" "${RUNPOD_ENDPOINT_API_KEY}" \
            || try_key "INFERENCE_API_KEY" "${INFERENCE_API_KEY}" \
            || try_key "RUNPOD_API_KEY" "${RUNPOD_API_KEY}" \
            || { echo "::error::No valid serverless API key resolved"; exit 1; }
        env:
          RUNPOD_ENDPOINT_ID: ${{ secrets.RUNPOD_ENDPOINT_ID }}
          RUNPOD_ENDPOINT_API_KEY: ${{ secrets.RUNPOD_ENDPOINT_API_KEY }}
          INFERENCE_API_KEY: ${{ secrets.INFERENCE_API_KEY }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}

      - name: Run strict serverless capability gate
        run: |
          REQUIRED="${BOB_WATCHDOG_SERVERLESS_REQUIRED:-chat}"
          echo "Checking serverless capabilities: $REQUIRED"
          node scripts/bob-capability-gate.mjs --mode serverless --required "$REQUIRED" --strict
        env:
          INFERENCE_SERVICE_URL: https://api.runpod.ai/v2/${{ secrets.RUNPOD_ENDPOINT_ID }}
          INFERENCE_API_KEY: ${{ steps.serverless_auth.outputs.resolved_key }}
          BOB_CAPABILITY_STRICT: 'true'
          BOB_WATCHDOG_SERVERLESS_REQUIRED: ${{ vars.BOB_WATCHDOG_SERVERLESS_REQUIRED }}

  pod-capability-check:
    name: Bob Pod Capability Check
    runs-on: ubuntu-latest
    if: github.event.inputs.target == '' || github.event.inputs.target == 'both' || github.event.inputs.target == 'pod'
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Decide pod check eligibility
        id: decide
        run: |
          set -euo pipefail
          if [ -z "${BOB_SERVICE_URL:-}" ] || [ -z "${INFERENCE_API_KEY:-}" ]; then
            echo "run_pod=false" >> "$GITHUB_OUTPUT"
            echo "Pod secrets not set; skipping pod watchdog check."
          elif echo "${BOB_SERVICE_URL}" | grep -Eq '^https://api\.runpod\.ai/v2/'; then
            echo "run_pod=false" >> "$GITHUB_OUTPUT"
            echo "BOB_SERVICE_URL points to serverless endpoint; skipping pod watchdog check."
          elif [ "$(curl -sS -o /dev/null -w "%{http_code}" --max-time 8 "${BOB_SERVICE_URL%/}/health" || true)" != "200" ]; then
            echo "run_pod=false" >> "$GITHUB_OUTPUT"
            echo "BOB_SERVICE_URL health is not 200; skipping pod watchdog check."
          else
            echo "run_pod=true" >> "$GITHUB_OUTPUT"
            echo "Pod secrets present; running pod watchdog check."
          fi
        env:
          BOB_SERVICE_URL: ${{ secrets.BOB_SERVICE_URL }}
          INFERENCE_API_KEY: ${{ secrets.INFERENCE_API_KEY != '' && secrets.INFERENCE_API_KEY || secrets.RUNPOD_ENDPOINT_API_KEY != '' && secrets.RUNPOD_ENDPOINT_API_KEY || secrets.RUNPOD_API_KEY }}

      - name: Skip pod check (secrets missing)
        if: steps.decide.outputs.run_pod != 'true'
        run: |
          echo "Pod capability check skipped due to missing BOB_SERVICE_URL/INFERENCE_API_KEY secrets."

      - name: Run strict pod capability gate
        if: steps.decide.outputs.run_pod == 'true'
        run: |
          REQUIRED="${BOB_WATCHDOG_POD_REQUIRED:-chat,health,self_heal}"
          echo "Checking pod capabilities: $REQUIRED"
          node scripts/bob-capability-gate.mjs --mode pod --required "$REQUIRED" --strict
        env:
          INFERENCE_SERVICE_URL: ${{ secrets.BOB_SERVICE_URL }}
          INFERENCE_API_KEY: ${{ secrets.INFERENCE_API_KEY != '' && secrets.INFERENCE_API_KEY || secrets.RUNPOD_ENDPOINT_API_KEY != '' && secrets.RUNPOD_ENDPOINT_API_KEY || secrets.RUNPOD_API_KEY }}
          BOB_CAPABILITY_STRICT: 'true'
          BOB_WATCHDOG_POD_REQUIRED: ${{ vars.BOB_WATCHDOG_POD_REQUIRED }}
