name: Database — Migration Check

# Validates that local migration files are consistent and that no short-form
# drift versions are present in the remote database before a deployment.
#
# This workflow runs automatically on push to main or pull requests that touch
# migration files, and can also be triggered manually for ad-hoc checks.
#
# Required repository secrets (same as db-push.yml):
#   SUPABASE_ACCESS_TOKEN   — Supabase personal access token (sbp_…)
#   SUPABASE_DB_PASSWORD    — Database password for the linked project
#   SUPABASE_PROJECT_REF    — Supabase project reference ID

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  pull_request:
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

env:
  # supabase/setup-cli@v1 still bundles Node.js 20; force the runner to use
  # Node.js 24 so the action keeps working after the June 2026 cut-over.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  migration_check:
    name: Validate migration consistency
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Run migration integrity guard script
        run: |
          set -euo pipefail
          chmod +x scripts/check-migration-integrity.sh
          scripts/check-migration-integrity.sh

      - name: Check for duplicate migration version prefixes
        run: |
          set -euo pipefail
          echo "Checking for duplicate migration version prefixes..."

          # Extract the leading date/timestamp from each migration filename.
          # Both formats are valid:
          #   YYYYMMDD_description.sql          → prefix = YYYYMMDD
          #   YYYYMMDDHHMMSS_description.sql    → prefix = YYYYMMDDHHMMSS
          # A conflict occurs only when a YYYYMMDD short-form file coexists
          # with a YYYYMMDDNNNNNN timestamped file for the same calendar day.

          MIGRATION_DIR="supabase/migrations"
          duplicates=0

          while IFS= read -r file; do
            base="$(basename "$file" .sql)"
            short_prefix="${base%%_*}"  # strip everything after first underscore

            # Only flag YYYYMMDD (8-digit) prefixes that also have longer variants.
            if [[ "${#short_prefix}" -eq 8 ]]; then
              matches=$(find "$MIGRATION_DIR" -name "${short_prefix}[0-9]*_*.sql" | wc -l)
              if [ "$matches" -gt 0 ]; then
                echo "::warning file=$file::Short-form migration '$short_prefix' coexists with timestamped variants. This causes drift on the remote database. Consider removing or renaming this file."
                duplicates=$((duplicates + 1))
              fi
            fi
          done < <(find "$MIGRATION_DIR" -name "????????_*.sql" | sort)

          if [ "$duplicates" -gt 0 ]; then
            echo "::warning::Found $duplicates migration(s) with short-form/long-form conflicts."
            echo "  See docs/MIGRATION_TROUBLESHOOTING.md for resolution steps."
          else
            echo "No short-form/long-form migration conflicts detected."
          fi

      - name: Check for exact-duplicate migration version numbers
        run: |
          set -euo pipefail
          echo "Checking for exact-duplicate migration version numbers..."

          # Two or more files sharing the same version prefix (YYYYMMDD or
          # YYYYMMDDHHMMSS) will cause Supabase CLI to insert the same row into
          # schema_migrations twice, producing a unique-constraint violation and
          # breaking db push with a non-recoverable loop.

          MIGRATION_DIR="supabase/migrations"
          exact_dupes=0

          while IFS= read -r version; do
            count=$(find "$MIGRATION_DIR" -name "${version}_*.sql" | wc -l)
            if [ "$count" -gt 1 ]; then
              echo "::error::Migration version $version has $count files. Each version must be unique."
              find "$MIGRATION_DIR" -name "${version}_*.sql" | while read -r f; do
                echo "  $f"
              done
              exact_dupes=$((exact_dupes + 1))
            fi
          done < <(find "$MIGRATION_DIR" -name "*.sql" \
                     | sed 's|.*/||; s|\.sql$||; s|_.*||' \
                     | sort -u)

          if [ "$exact_dupes" -gt 0 ]; then
            echo "::error::Found $exact_dupes exact-duplicate migration version(s). Rename the conflicting files before pushing."
            exit 1
          else
            echo "No exact-duplicate migration versions detected."
          fi

      - name: Check for future-dated migration files
        run: |
          set -euo pipefail
          echo "Checking for future-dated migration files..."

          # Migration files should never be dated further ahead than the
          # actual current date, because any migration added with today's date
          # (YYYYMMDD) will sort *before* already-applied future-dated files.
          # Supabase would then silently mark the new file as "applied" without
          # running its SQL — schema changes would be skipped.
          #
          # This check computes the calendar date encoded in each migration
          # filename and warns when it is more than 1 day ahead of today.

          MIGRATION_DIR="supabase/migrations"
          today=$(TZ=Pacific/Auckland date +%Y%m%d)
          future_count=0
          latest_future_version=""

          while IFS= read -r file; do
            base="$(basename "$file" .sql)"
            version_prefix="${base%%_*}"
            # Extract the 8-digit calendar date regardless of whether the
            # version is YYYYMMDD or YYYYMMDDNNNNNN format.
            cal_date="${version_prefix:0:8}"

            if [[ "$cal_date" =~ ^[0-9]{8}$ ]] && [[ "$cal_date" -gt "$today" ]]; then
              future_count=$((future_count + 1))
              latest_future_version="$version_prefix"
            fi
          done < <(find "$MIGRATION_DIR" -name "*.sql" | sort)

          if [ "$future_count" -gt 0 ]; then
            echo "::warning::$future_count migration file(s) are dated in the future (latest: $latest_future_version, today: $today)."
            echo "::warning::Any new migration added with today's date ($today) will sort BEFORE these files."
            echo "::warning::Supabase db push will silently mark such files as 'applied' without running their SQL."
            echo "::warning::New migrations MUST use a version dated AFTER $latest_future_version to avoid silent skipping."
            echo "::warning::See docs/MIGRATION_TROUBLESHOOTING.md#future-dated-migrations for guidance."
          else
            echo "No future-dated migration files detected."
          fi

      - name: Resolve Supabase credentials
        id: creds
        run: |
          if [[ -n "${SUPABASE_DB_PASSWORD:-}" && -n "${SUPABASE_PROJECT_REF:-}" ]]; then
            echo "has_creds=true"                      >> "$GITHUB_OUTPUT"
            echo "project_id=${SUPABASE_PROJECT_REF}" >> "$GITHUB_OUTPUT"
            echo "target=${SUPABASE_PROJECT_REF}"      >> "$GITHUB_OUTPUT"
          else
            echo "has_creds=false"                    >> "$GITHUB_OUTPUT"
            echo "project_id="                        >> "$GITHUB_OUTPUT"
            echo "target=(not configured)"            >> "$GITHUB_OUTPUT"
          fi

      - name: Check remote migration state
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' && steps.creds.outputs.has_creds == 'true' }}
        run: |
          set -euo pipefail
          echo "Checking remote migration state for ${{ steps.creds.outputs.target }}…"
          supabase link \
            --project-ref "${{ steps.creds.outputs.project_id }}" \
            --password    "$SUPABASE_DB_PASSWORD"
          echo "Current remote migration state:"
          supabase migration list || true

      - name: Warn if secrets are absent
        if: ${{ env.SUPABASE_ACCESS_TOKEN == '' || steps.creds.outputs.has_creds == 'false' }}
        run: |
          echo "::notice::Remote migration check skipped — Supabase secrets not configured."
          echo "  To enable remote state validation, set the following repository secrets:"
          echo "    SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, SUPABASE_PROJECT_REF"
