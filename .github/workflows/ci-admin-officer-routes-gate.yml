name: CI Admin Officer Routes Gate

on:
  pull_request:
    paths:
      - src/App.tsx
      - data/admin-officer-routes-baseline.json
      - data/admin-officer-routes-snapshot.json
      - scripts/check-admin-officer-routes.mjs
      - .github/workflows/ci-admin-officer-routes-gate.yml
  workflow_dispatch:

jobs:
  admin-officer-routes-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Admin Officer Routes Governance Check
        run: node scripts/check-admin-officer-routes.mjs

      - name: Upload Admin Officer Routes Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-officer-routes-governance-reports
          path: |
            data/prepared/admin-officer-routes-report.json
            data/prepared/admin-officer-routes-trend.json
          if-no-files-found: error
