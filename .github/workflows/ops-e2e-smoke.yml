name: E2E Smoke Tests

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to test against (leave blank to build + preview locally)"
        required: false
        type: string
      spec_filter:
        description: "Spec file glob to run (e.g. tests/e2e/capability-overview.spec.ts). Leave blank for all."
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: e2e-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-smoke:
    name: E2E Smoke (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      CI: true
      # Supabase
      VITE_SUPABASE_URL:            ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY:       ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY:    ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PLAYWRIGHT_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PLAYWRIGHT_SUPABASE_SERVICE_ROLE_KEY != '' && secrets.PLAYWRIGHT_SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Playwright role credentials
      PLAYWRIGHT_MASTER_EMAIL:      ${{ secrets.PLAYWRIGHT_MASTER_EMAIL }}
      PLAYWRIGHT_MASTER_PASSWORD:   ${{ secrets.PLAYWRIGHT_MASTER_PASSWORD }}
      PLAYWRIGHT_ADMIN_ORG1_EMAIL:  ${{ secrets.PLAYWRIGHT_ADMIN_ORG1_EMAIL != '' && secrets.PLAYWRIGHT_ADMIN_ORG1_EMAIL || secrets.PLAYWRIGHT_ADMIN_EMAIL }}
      PLAYWRIGHT_ADMIN_ORG1_PASSWORD: ${{ secrets.PLAYWRIGHT_ADMIN_ORG1_PASSWORD != '' && secrets.PLAYWRIGHT_ADMIN_ORG1_PASSWORD || secrets.PLAYWRIGHT_ADMIN_PASSWORD }}
      PLAYWRIGHT_ADMIN_EMAIL:       ${{ secrets.PLAYWRIGHT_ADMIN_EMAIL != '' && secrets.PLAYWRIGHT_ADMIN_EMAIL || secrets.PLAYWRIGHT_ADMIN_ORG1_EMAIL }}
      PLAYWRIGHT_ADMIN_PASSWORD:    ${{ secrets.PLAYWRIGHT_ADMIN_PASSWORD != '' && secrets.PLAYWRIGHT_ADMIN_PASSWORD || secrets.PLAYWRIGHT_ADMIN_ORG1_PASSWORD }}
      PLAYWRIGHT_OFFICER_ORG1_EMAIL: ${{ secrets.PLAYWRIGHT_OFFICER_ORG1_EMAIL != '' && secrets.PLAYWRIGHT_OFFICER_ORG1_EMAIL || secrets.PLAYWRIGHT_OFFICER_EMAIL }}
      PLAYWRIGHT_OFFICER_ORG1_PASSWORD: ${{ secrets.PLAYWRIGHT_OFFICER_ORG1_PASSWORD != '' && secrets.PLAYWRIGHT_OFFICER_ORG1_PASSWORD || secrets.PLAYWRIGHT_OFFICER_PASSWORD }}
      PLAYWRIGHT_OFFICER_EMAIL:     ${{ secrets.PLAYWRIGHT_OFFICER_EMAIL != '' && secrets.PLAYWRIGHT_OFFICER_EMAIL || secrets.PLAYWRIGHT_OFFICER_ORG1_EMAIL }}
      PLAYWRIGHT_OFFICER_PASSWORD:  ${{ secrets.PLAYWRIGHT_OFFICER_PASSWORD != '' && secrets.PLAYWRIGHT_OFFICER_PASSWORD || secrets.PLAYWRIGHT_OFFICER_ORG1_PASSWORD }}
      # Shared fallback: if role-specific creds are missing, fall back to master creds
      PLAYWRIGHT_ALLOW_SHARED_CREDENTIAL_FALLBACK: '1'
      # Default base URL (overridden below after build/preview)
      DEFAULT_PLAYWRIGHT_BASE_URL: ${{ secrets.FRONTEND_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # ── If no external base URL provided, build and serve locally ──────────
      - name: Build app
        if: ${{ github.event.inputs.base_url == '' || github.event.inputs.base_url == null }}
        run: npm run build

      - name: Start preview server
        if: ${{ github.event.inputs.base_url == '' || github.event.inputs.base_url == null }}
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 &
          echo $! > /tmp/preview.pid
          # Wait until the server responds
          for i in $(seq 1 40); do
            if curl -fsS --max-time 5 http://127.0.0.1:4173/ >/dev/null 2>&1; then
              echo "Preview server ready after ${i}s"
              break
            fi
            if [ "$i" -eq 40 ]; then
              echo "::error::Preview server did not start in time"
              exit 1
            fi
            sleep 2
          done

      - name: Resolve base URL
        run: |
          if [ -n "${{ github.event.inputs.base_url }}" ]; then
            TARGET_URL="${{ github.event.inputs.base_url }}"
          elif [ -n "$DEFAULT_PLAYWRIGHT_BASE_URL" ]; then
            # Verify the external deployed URL is reachable, otherwise fall back to local preview
            if curl -fsS --max-time 10 "${DEFAULT_PLAYWRIGHT_BASE_URL}/login" >/dev/null 2>&1; then
              TARGET_URL="$DEFAULT_PLAYWRIGHT_BASE_URL"
            else
              echo "::warning::FRONTEND_URL unreachable — falling back to local preview"
              TARGET_URL="http://127.0.0.1:4173"
            fi
          else
            TARGET_URL="http://127.0.0.1:4173"
          fi
          echo "PLAYWRIGHT_BASE_URL=$TARGET_URL" >> "$GITHUB_ENV"
          echo "Resolved PLAYWRIGHT_BASE_URL=$TARGET_URL"

      - name: Run E2E smoke suite
        id: e2e_smoke_suite
        continue-on-error: true
        run: |
          SPECS="${{ github.event.inputs.spec_filter }}"
          if [ -z "$SPECS" ]; then
            SPECS="tests/e2e/"
          fi
          npx playwright test $SPECS \
            --project=chromium \
            --reporter=list \
            --timeout=60000

      - name: Enforce E2E smoke suite (strict mode)
        if: steps.e2e_smoke_suite.outcome == 'failure' && vars.E2E_SMOKE_STRICT == 'true'
        run: exit 1

      - name: Report E2E smoke suite (non-strict)
        if: steps.e2e_smoke_suite.outcome == 'failure' && vars.E2E_SMOKE_STRICT != 'true'
        run: echo "::warning::E2E smoke suite failed but continuing (non-strict mode). Set E2E_SMOKE_STRICT=true to enforce."

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-smoke-results-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
