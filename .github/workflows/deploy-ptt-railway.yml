name: Deploy PTT Server to Railway

# Deploys the Push-to-Talk signaling server (ptt-server/) to Railway and
# syncs PTT_SERVER_URL + PROXY_SECRET into Supabase secrets so the
# ptt-signaling-token edge function can reach the server.
#
# Auto-triggers on any push to main that touches ptt-server/ files.
# Can also be triggered manually via workflow_dispatch.
#
# Required GitHub secrets:
#   RAILWAY_PTT_TOKEN      — Railway project token for the PTT server project
#   RAILWAY_PTT_SERVICE_ID — Railway project → Service → Settings → Service ID
#
# Optional GitHub secrets (enable the extra steps below):
#   PTT_SERVER_URL         — Deployed Railway URL (e.g. https://ptt.railway.app)
#                            If set: health-checked after deploy AND synced to Supabase
#   PROXY_SECRET           — Shared secret between Edge Function and PTT server
#                            If set: synced to Supabase alongside PTT_SERVER_URL
#   SUPABASE_ACCESS_TOKEN  — Supabase personal access token (supabase.com → Account → Access Tokens)
#   SUPABASE_PROJECT_REF   — Supabase project reference ID (Settings → General)
#
# After your first Railway deploy, copy the public URL from
#   Railway → Service → Settings → Networking
# and add it as the PTT_SERVER_URL GitHub secret. On the next run the URL
# will be forwarded to Supabase automatically.

on:
  push:
    branches: [main]
    paths:
      - 'ptt-server/**'
      - '.github/workflows/deploy-ptt-railway.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-ptt:
    name: Deploy PTT Server to Railway
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check required secrets
        id: check-secrets
        run: |
          missing=""
          [ -z "$RAILWAY_PTT_TOKEN" ]      && missing="$missing RAILWAY_PTT_TOKEN"
          [ -z "$RAILWAY_PTT_SERVICE_ID" ] && missing="$missing RAILWAY_PTT_SERVICE_ID"

          if [ -n "$missing" ]; then
            echo "::warning::Required secrets not configured ($missing) — deployment skipped."
            echo ""
            echo "To enable PTT server deployments, add the following secrets at:"
            echo "  https://github.com/${{ github.repository }}/settings/secrets/actions"
            echo ""
            echo "  RAILWAY_PTT_TOKEN:      Railway project token (Project → Settings → Tokens)"
            echo "  RAILWAY_PTT_SERVICE_ID: Railway service ID (Service → Settings → Service ID)"
            echo ""
            echo "Optional secrets that enable health-check and Supabase sync:"
            echo "  PTT_SERVER_URL:         Public URL after first deploy (e.g. https://ptt.railway.app)"
            echo "  PROXY_SECRET:           Shared secret between Edge Function and PTT server"
            echo "  SUPABASE_ACCESS_TOKEN:  Supabase personal access token"
            echo "  SUPABASE_PROJECT_REF:   Supabase project reference ID"
            echo "secrets_present=false" >> "$GITHUB_OUTPUT"
          else
            echo "✅ Railway PTT secrets present"
            echo "secrets_present=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          RAILWAY_PTT_TOKEN:      ${{ secrets.RAILWAY_PTT_TOKEN }}
          RAILWAY_PTT_SERVICE_ID: ${{ secrets.RAILWAY_PTT_SERVICE_ID }}

      - name: Checkout repository
        if: steps.check-secrets.outputs.secrets_present == 'true'
        uses: actions/checkout@v5

      - name: Install Railway CLI
        if: steps.check-secrets.outputs.secrets_present == 'true'
        run: |
          RAILWAY_CLI_VERSION="4.31.0"
          TARGET="x86_64-unknown-linux-gnu"
          URL="https://github.com/railwayapp/cli/releases/download/v${RAILWAY_CLI_VERSION}/railway-v${RAILWAY_CLI_VERSION}-${TARGET}.tar.gz"
          TMP_DIR=$(mktemp -d)
          cd "$TMP_DIR"
          curl -fsSL -o railway.tar.gz "$URL"
          tar -xzf railway.tar.gz
          mkdir -p "$HOME/.railway/bin"
          install -m 0755 railway "$HOME/.railway/bin/railway"
          echo "$HOME/.railway/bin" >> "$GITHUB_PATH"

      - name: Validate Railway token
        id: validate-token
        if: steps.check-secrets.outputs.secrets_present == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_PTT_TOKEN }}
        run: |
          echo "🔑 Validating Railway PTT token..."
          if ! railway service list --json > /dev/null 2>&1; then
            echo "::warning::Could not confirm RAILWAY_PTT_TOKEN via 'railway service list'."
            echo "Project-scoped tokens can fail this check; deployment will still be attempted."
          else
            echo "✅ Railway PTT token is valid"
          fi
          echo "token_valid=true" >> "$GITHUB_OUTPUT"

      - name: Deploy PTT server to Railway
        if: >-
          steps.check-secrets.outputs.secrets_present == 'true' &&
          steps.validate-token.outputs.token_valid == 'true'
        env:
          RAILWAY_TOKEN:          ${{ secrets.RAILWAY_PTT_TOKEN }}
          RAILWAY_PTT_SERVICE_ID: ${{ secrets.RAILWAY_PTT_SERVICE_ID }}
        run: |
          cd ptt-server
          echo "🚂 Deploying ptt-server to Railway..."
          railway up --service "$RAILWAY_PTT_SERVICE_ID" --detach
          echo "✅ Deploy triggered. Check Railway dashboard for status."
          echo ""
          echo "Railway Dashboard: https://railway.app/dashboard"

      - name: Verify PTT server health
        if: >-
          steps.check-secrets.outputs.secrets_present == 'true' &&
          steps.validate-token.outputs.token_valid == 'true'
        env:
          PTT_SERVER_URL: ${{ secrets.PTT_SERVER_URL }}
        run: |
          if [ -z "$PTT_SERVER_URL" ]; then
            echo "ℹ️  PTT_SERVER_URL not set — skipping health check."
            echo ""
            echo "After the first deploy, copy the public URL from:"
            echo "  Railway → Service → Settings → Networking"
            echo "Then add it as the PTT_SERVER_URL GitHub secret."
            echo "On the next run the URL will be health-checked and synced to Supabase automatically."
            exit 0
          fi

          echo "⏳ Waiting 45s for Railway to finish deploying..."
          sleep 45

          echo "🏥 Checking health at ${PTT_SERVER_URL}/health ..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "${PTT_SERVER_URL}/health" || echo "000")
          BODY=$(curl -s --max-time 30 "${PTT_SERVER_URL}/health" || true)

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::PTT server health check failed with HTTP $HTTP_STATUS"
            echo "Body preview: ${BODY:0:200}"
            exit 1
          fi

          if ! echo "$BODY" | grep -qi 'ptt\|signaling\|push-to-talk'; then
            echo "::warning::PTT health response did not include expected marker. Body preview: ${BODY:0:200}"
          else
            echo "✅ PTT server health check passed"
          fi

      - name: Install Supabase CLI
        if: >-
          steps.check-secrets.outputs.secrets_present == 'true' &&
          steps.validate-token.outputs.token_valid == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}
          PTT_SERVER_URL:        ${{ secrets.PTT_SERVER_URL }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "ℹ️  SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_REF not set — skipping Supabase secrets sync."
            echo ""
            echo "To enable automatic Supabase secrets sync, add:"
            echo "  SUPABASE_ACCESS_TOKEN — supabase.com → Account → Access Tokens → Generate new token"
            echo "  SUPABASE_PROJECT_REF  — Supabase Dashboard → Project Settings → General → Reference ID"
            exit 0
          fi

          if [ -z "$PTT_SERVER_URL" ]; then
            echo "ℹ️  PTT_SERVER_URL not set — skipping Supabase secrets sync."
            echo "Add PTT_SERVER_URL as a GitHub secret to enable this step."
            exit 0
          fi

          echo "📦 Installing Supabase CLI..."
          SUPABASE_CLI_VERSION="2.22.6"
          URL="https://github.com/supabase/cli/releases/download/v${SUPABASE_CLI_VERSION}/supabase_linux_amd64.tar.gz"
          TMP_DIR=$(mktemp -d)
          cd "$TMP_DIR"
          curl -fsSL -o supabase.tar.gz "$URL"
          tar -xzf supabase.tar.gz
          mkdir -p "$HOME/.local/bin"
          install -m 0755 supabase "$HOME/.local/bin/supabase"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "✅ Supabase CLI installed"

      - name: Sync PTT secrets to Supabase
        if: >-
          steps.check-secrets.outputs.secrets_present == 'true' &&
          steps.validate-token.outputs.token_valid == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}
          PTT_SERVER_URL:        ${{ secrets.PTT_SERVER_URL }}
          PROXY_SECRET:          ${{ secrets.PROXY_SECRET }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$PTT_SERVER_URL" ]; then
            echo "ℹ️  Supabase sync skipped (missing SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, or PTT_SERVER_URL)."
            exit 0
          fi

          echo "🔐 Syncing PTT secrets to Supabase project ${SUPABASE_PROJECT_REF}..."

          SECRETS_ARGS="PTT_SERVER_URL=${PTT_SERVER_URL}"
          if [ -n "$PROXY_SECRET" ]; then
            SECRETS_ARGS="${SECRETS_ARGS} PROXY_SECRET=${PROXY_SECRET}"
          fi

          if "$HOME/.local/bin/supabase" secrets set $SECRETS_ARGS \
              --project-ref "$SUPABASE_PROJECT_REF"; then
            echo "✅ Supabase secrets updated:"
            echo "   • PTT_SERVER_URL = ${PTT_SERVER_URL}"
            [ -n "$PROXY_SECRET" ] && echo "   • PROXY_SECRET   = (set)"
            echo ""
            echo "The ptt-signaling-token edge function will pick up these values on next invocation."
          else
            echo "::error::Failed to set Supabase secrets. Check SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF."
            exit 1
          fi
