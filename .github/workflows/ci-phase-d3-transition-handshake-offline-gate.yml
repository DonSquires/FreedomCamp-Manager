name: CI Phase D3 Transition/Handshake/Offline Gate

# Path-filtered gate for D3 active-org transition, hybrid handshake, and offline replay conflict controls.

on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/e2e/phase-d3-transition-handshake-offline.spec.ts'
      - 'supabase/migrations/20260710000005_phase_d3_transition_handshake_offline.sql'
      - 'supabase/migrations/20260701000003_hybrid_workspace_handshake.sql'
      - 'supabase/migrations/20260705000001_geo_tenant_access.sql'
      - 'src/hooks/useTransitionReplayD3.ts'
      - 'src/hooks/useHybridWorkspaceHandshake.ts'
      - 'src/hooks/useGeofenceOrgTransition.ts'
      - 'src/hooks/useOfflineQueue.ts'
      - 'tests/e2e/setup.ts'
      - 'playwright.api.config.ts'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/ci-phase-d3-transition-handshake-offline-gate.yml'
  push:
    branches: [main]
    paths:
      - 'tests/e2e/phase-d3-transition-handshake-offline.spec.ts'
      - 'supabase/migrations/20260710000005_phase_d3_transition_handshake_offline.sql'
      - 'supabase/migrations/20260701000003_hybrid_workspace_handshake.sql'
      - 'supabase/migrations/20260705000001_geo_tenant_access.sql'
      - 'src/hooks/useTransitionReplayD3.ts'
      - 'src/hooks/useHybridWorkspaceHandshake.ts'
      - 'src/hooks/useGeofenceOrgTransition.ts'
      - 'src/hooks/useOfflineQueue.ts'
      - 'tests/e2e/setup.ts'
      - 'playwright.api.config.ts'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/ci-phase-d3-transition-handshake-offline-gate.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  phase-d3-transition-handshake-offline-gate:
    name: Phase D3 Transition/Handshake/Offline Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Phase D3 transition/handshake/offline gate suite
        id: phase_gate_suite
        continue-on-error: true
        run: |
          bunx playwright test \
            tests/e2e/phase-d3-transition-handshake-offline.spec.ts \
            --config=playwright.api.config.ts \
            --reporter=list

      - name: Enforce Phase gate suite (strict mode)
        if: steps.phase_gate_suite.outcome == 'failure' && vars.PHASE_GATES_STRICT == 'true'
        run: |
          echo "::error::Phase gate suite failed and strict mode is enabled (PHASE_GATES_STRICT=true)."
          exit 1

      - name: Report Phase gate suite (non-strict)
        if: steps.phase_gate_suite.outcome == 'failure' && vars.PHASE_GATES_STRICT != 'true'
        run: |
          echo "::warning::Phase gate suite failed but strict mode is disabled; continuing."

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase-d3-transition-handshake-offline-gate-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
