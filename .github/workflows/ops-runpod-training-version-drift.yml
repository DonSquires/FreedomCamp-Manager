name: Ops RunPod Training Memory Drift Check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'   # once a day at midnight UTC
  push:
    paths:
      - 'runpod-worker/training_memory.json'
      - '.github/workflows/ops-runpod-training-version-drift.yml'

jobs:
  check-training-memory-version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compare repo vs deployed training memory version
        env:
          RUNPOD_API_URL: ${{ secrets.RUNPOD_API_URL }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import time
          import urllib.request

          run_url = os.environ.get('RUNPOD_API_URL', '').strip()
          api_key = os.environ.get('RUNPOD_API_KEY', '').strip()

          if not run_url or not api_key:
            print('::warning title=RunPod secrets missing::RUNPOD_API_URL or RUNPOD_API_KEY is not configured; drift check skipped.')
            sys.exit(0)

          endpoint_match = re.search(r'/v2/([^/]+)/', run_url)
          if not endpoint_match:
            print('::warning title=Invalid RUNPOD_API_URL::Could not parse endpoint id from RUNPOD_API_URL; drift check skipped.')
            sys.exit(0)

          endpoint_id = endpoint_match.group(1)
          headers = {'Authorization': f'Bearer {api_key}', 'Content-Type': 'application/json'}
          repo_version = json.load(open('runpod-worker/training_memory.json', 'r', encoding='utf-8')).get('version')

          def post(payload, timeout=120):
            req = urllib.request.Request(run_url, data=json.dumps(payload).encode(), headers=headers, method='POST')
            with urllib.request.urlopen(req, timeout=timeout) as resp:
              return json.load(resp)

          def get_status(job_id, timeout=60):
            url = f'https://api.runpod.ai/v2/{endpoint_id}/status/{job_id}'
            req = urllib.request.Request(url, headers=headers, method='GET')
            with urllib.request.urlopen(req, timeout=timeout) as resp:
              return json.load(resp)

          initial = post({'input': {'action': 'ping'}})
          status = str(initial.get('status') or '').upper()
          final = initial

          if status not in ('COMPLETED', 'FAILED', 'CANCELLED', 'TIMED_OUT'):
            job_id = initial.get('id') or initial.get('jobId')
            if not job_id:
              print('::warning title=RunPod response missing job id::Cannot poll status; drift check skipped.')
              sys.exit(0)
            for _ in range(75):
              time.sleep(4)
              polled = get_status(job_id)
              ps = str(polled.get('status') or '').upper()
              final = polled
              if ps in ('COMPLETED', 'FAILED', 'CANCELLED', 'TIMED_OUT'):
                break

          output = final.get('output') or {}
          deployed_version = output.get('training_memory_version')
          deployed_loaded = bool(output.get('training_memory_loaded'))
          terminal_status = str(final.get('status') or '').upper()

          print(json.dumps({
            'terminal_status': terminal_status,
            'repo_version': repo_version,
            'deployed_version': deployed_version,
            'training_memory_loaded': deployed_loaded,
            'workerId': final.get('workerId')
          }, indent=2))

          if terminal_status != 'COMPLETED':
            print(f'::warning title=RunPod ping not completed::Terminal status: {terminal_status}.')
            sys.exit(0)

          if not deployed_loaded:
            print('::warning title=Training memory not loaded::Deployed worker reports training_memory_loaded=false.')
            sys.exit(0)

          if not repo_version or not deployed_version:
            print('::warning title=Training memory version missing::Unable to compare versions.')
            sys.exit(0)

          if repo_version != deployed_version:
            print(
              f'::warning title=Training memory version drift::'
              f'Repo version {repo_version} != deployed version {deployed_version}. '
              'Update runpod-worker/training_memory.json or redeploy to reconcile.'
            )
          else:
            print('Training memory versions are aligned.')
          PY
