name: Ops – RunPod Update Endpoint GPU Types

# Updates the GPU type preference list on the fieldops-ai-engine serverless endpoint.
#
# Use this when RunPod reports "Supply of your primary GPU choice is currently low"
# and workers cannot spin up.  The job patches the endpoint via the RunPod REST API
# with a broader list that prioritises high-availability 24 GB GPUs (RTX 4090, L4,
# A5000) while keeping the original enterprise preference (RTX 6000 Ada, L40, L40S)
# as a last-resort fallback.
#
# Required secrets:
#   RUNPOD_API_KEY     — RunPod API key (personal key with endpoint admin access)
#   RUNPOD_ENDPOINT_ID — Serverless endpoint ID to update (e.g. n0bp1ifmq01cx2)
#
# Optional:
#   gpu_ids input  — Override the default list with a custom comma-separated string.

on:
  workflow_dispatch:
    inputs:
      gpu_ids:
        description: >
          Optional: comma-separated GPU display names to set.
          Leave blank to apply the built-in high-availability list.
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Dry run — print the payload without calling the API'
        required: false
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-gpus:
    name: Update RunPod Endpoint GPU Types
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check required secrets
        id: check-secrets
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_ENDPOINT_ID: ${{ secrets.RUNPOD_ENDPOINT_ID }}
        run: |
          if [ -z "${RUNPOD_API_KEY:-}" ]; then
            echo "::error::RUNPOD_API_KEY secret is not set"
            exit 1
          fi
          if [ -z "${RUNPOD_ENDPOINT_ID:-}" ]; then
            echo "::error::RUNPOD_ENDPOINT_ID secret is not set"
            exit 1
          fi
          echo "✅ Required secrets present"

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Update GPU types
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_ENDPOINT_ID: ${{ secrets.RUNPOD_ENDPOINT_ID }}
          GPU_IDS_OVERRIDE: ${{ inputs.gpu_ids }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=""
          if [ -n "${GPU_IDS_OVERRIDE:-}" ]; then
            ARGS="$ARGS --gpuIds \"${GPU_IDS_OVERRIDE}\""
          fi
          if [ "${DRY_RUN:-false}" = "true" ]; then
            ARGS="$ARGS --dryRun"
          fi
          eval node scripts/update-runpod-endpoint-gpus.mjs $ARGS | tee gpu-update.log

          {
            echo "## RunPod GPU Type Update"
            echo ""
            echo "- Endpoint: \`${RUNPOD_ENDPOINT_ID}\`"
            echo "- Dry run: ${DRY_RUN:-false}"
            if [ -n "${GPU_IDS_OVERRIDE:-}" ]; then
              echo "- GPU override: \`${GPU_IDS_OVERRIDE}\`"
            else
              echo "- GPU list: built-in high-availability defaults"
            fi
            echo ""
            echo "### Output"
            echo ""
            echo "\`\`\`"
            cat gpu-update.log
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
