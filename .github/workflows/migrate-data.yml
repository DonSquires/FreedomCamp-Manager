name: Migrate Data Between Supabase Projects

# -----------------------------------------------------------------------
# Copies data from the source Supabase project to the target project.
#
# This workflow uses pg_dump (data-only) on the source database and
# psql to restore the data into the target database.  The schema is
# assumed to already be in place on the target (run 'Apply Supabase
# migrations' first).
#
# Source project : xbfnlzmpumthnjmtqufp.supabase.co  (old)
# Target project : kxwjcupuxnnbnzcgmkoi.supabase.co  (new)
#
# ═══════════════════════════════════════════════════════════════════════
# QUICK START
# ═══════════════════════════════════════════════════════════════════════
#
# Step 1 — Add secrets to this GitHub repo (browser → github.com)
#   Repo → Settings → Secrets and variables → Actions → New repository secret
#
#   SUPABASE_DB_PASSWORD_SOURCE
#     Password for the SOURCE (old) project database.
#     Supabase Dashboard (old project) → Settings → Database → Database password
#
#   SUPABASE_DB_PASSWORD_TARGET
#     Password for the TARGET (new) project database.
#     Supabase Dashboard (new project) → Settings → Database → Database password
#
#   SUPABASE_ACCESS_TOKEN
#     Personal access token — https://supabase.com/dashboard/account/tokens
#
# Step 2 — Ensure the target project schema is up-to-date BEFORE running
#   this workflow.  Run the 'Apply Supabase migrations (db push)' workflow
#   against the TARGET project first (fresh_install = true).
#
# Step 3 — Run this workflow:
#   GitHub repo → Actions → "Migrate Data Between Supabase Projects"
#   → Run workflow
#
# ═══════════════════════════════════════════════════════════════════════
# What the migration does
# ═══════════════════════════════════════════════════════════════════════
# 1. Dumps all data (--data-only) from the source project with pg_dump,
#    excluding internal Supabase/Postgres system tables and the
#    supabase_migrations tracking table so the target's migration history
#    is not overwritten.
# 2. Restores the dump into the target project with psql inside a single
#    transaction so any failure rolls back cleanly (all-or-nothing).
#    Note: if the target tables already contain rows that conflict with
#    source rows (duplicate primary keys), the restore will fail and roll
#    back.  Pre-truncate the relevant tables in the target before running
#    this workflow if you need a clean overwrite.
# 3. Prints a row-count summary for key tables.
#
# -----------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — dump source data but do NOT restore to target'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      tables:
        description: |
          Comma-separated list of tables to migrate (leave blank for ALL tables).
          Example: organizations,user_profiles,patrols
        required: false
        default: ''

env:
  SOURCE_REF: xbfnlzmpumthnjmtqufp
  TARGET_REF: kxwjcupuxnnbnzcgmkoi
  # Supabase managed Postgres pooler (transaction mode, port 5432)
  DB_HOST: aws-0-ap-southeast-2.pooler.supabase.com

jobs:
  migrate:
    name: Migrate data (source → target)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # ── Validate required secrets ─────────────────────────────────────
      - name: Check required secrets
        run: |
          missing=""
          [ -z "$SUPABASE_DB_PASSWORD_SOURCE" ] && missing="$missing SUPABASE_DB_PASSWORD_SOURCE"
          [ -z "$SUPABASE_DB_PASSWORD_TARGET" ] && missing="$missing SUPABASE_DB_PASSWORD_TARGET"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing"
            echo ""
            echo "HOW TO ADD SECRETS (browser only):"
            echo "  1. Go to: https://github.com/${{ github.repository }}/settings/secrets/actions"
            echo ""
            echo "  SUPABASE_DB_PASSWORD_SOURCE:"
            echo "    Old Supabase project (${SOURCE_REF}) → Settings → Database → Database password"
            echo ""
            echo "  SUPABASE_DB_PASSWORD_TARGET:"
            echo "    New Supabase project (${TARGET_REF}) → Settings → Database → Database password"
            exit 1
          fi
          echo "✅ All required secrets are present"
        env:
          SUPABASE_DB_PASSWORD_SOURCE: ${{ secrets.SUPABASE_DB_PASSWORD_SOURCE }}
          SUPABASE_DB_PASSWORD_TARGET: ${{ secrets.SUPABASE_DB_PASSWORD_TARGET }}

      # ── Install postgresql-client ─────────────────────────────────────
      - name: Install postgresql-client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      # ── Build connection strings ──────────────────────────────────────
      - name: Set connection strings
        run: |
          echo "SOURCE_DSN=postgresql://postgres.${SOURCE_REF}:${SUPABASE_DB_PASSWORD_SOURCE}@${DB_HOST}:5432/postgres" >> "$GITHUB_ENV"
          echo "TARGET_DSN=postgresql://postgres.${TARGET_REF}:${SUPABASE_DB_PASSWORD_TARGET}@${DB_HOST}:5432/postgres" >> "$GITHUB_ENV"
        env:
          SUPABASE_DB_PASSWORD_SOURCE: ${{ secrets.SUPABASE_DB_PASSWORD_SOURCE }}
          SUPABASE_DB_PASSWORD_TARGET: ${{ secrets.SUPABASE_DB_PASSWORD_TARGET }}

      # ── Verify connectivity to both databases ─────────────────────────
      - name: Verify source connectivity
        run: |
          echo "Testing connection to SOURCE (${SOURCE_REF})…"
          psql "$SOURCE_DSN" -c "SELECT current_database(), current_user, version();" || {
            echo "::error::Cannot connect to source database. Check SUPABASE_DB_PASSWORD_SOURCE."
            exit 1
          }
          echo "✅ Source connection OK"

      - name: Verify target connectivity
        run: |
          echo "Testing connection to TARGET (${TARGET_REF})…"
          psql "$TARGET_DSN" -c "SELECT current_database(), current_user, version();" || {
            echo "::error::Cannot connect to target database. Check SUPABASE_DB_PASSWORD_TARGET."
            exit 1
          }
          echo "✅ Target connection OK"

      # ── Build pg_dump table flags ─────────────────────────────────────
      - name: Build table selection flags
        run: |
          TABLES_INPUT="${{ github.event.inputs.tables }}"
          TABLE_FLAGS=""
          if [ -n "$TABLES_INPUT" ]; then
            # User supplied explicit table list — dump only those tables
            IFS=',' read -ra TLIST <<< "$TABLES_INPUT"
            for t in "${TLIST[@]}"; do
              t="$(echo "$t" | xargs)"   # trim whitespace
              TABLE_FLAGS="$TABLE_FLAGS -t public.${t}"
            done
            echo "Migrating selected tables: $TABLES_INPUT"
          else
            echo "Migrating ALL public tables"
          fi
          echo "TABLE_FLAGS=${TABLE_FLAGS}" >> "$GITHUB_ENV"

      # ── Dump data from source ─────────────────────────────────────────
      - name: Dump data from source
        run: |
          echo "╔══════════════════════════════════════════════════════════════════╗"
          echo "║  Dumping data from SOURCE: ${SOURCE_REF}                        ║"
          echo "╚══════════════════════════════════════════════════════════════════╝"

          pg_dump "$SOURCE_DSN" \
            --data-only \
            --no-owner \
            --no-privileges \
            --no-comments \
            --schema=public \
            $TABLE_FLAGS \
            --exclude-table=public.schema_migrations \
            --exclude-table=public.supabase_migrations \
            --exclude-table-data=public.audit_log_entries \
            --file=/tmp/data_dump.sql
          # Note: audit_log_entries data is excluded (often very large and not
          # required for a functional migration). The table structure is still
          # created by the schema migrations on the target project.

          DUMP_SIZE=$(wc -l < /tmp/data_dump.sql)
          echo ""
          echo "✅ Dump complete: ${DUMP_SIZE} lines written to /tmp/data_dump.sql"

      # ── Show dump summary (always) ────────────────────────────────────
      - name: Show dump summary
        run: |
          echo "=== Tables found in dump ==="
          grep -oP "(?<=COPY public\.)\w+" /tmp/data_dump.sql | sort | uniq -c | sort -rn || true
          echo ""
          echo "=== Dump size ==="
          wc -c /tmp/data_dump.sql
          echo ""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "DRY RUN — restore step will be skipped."
          fi

      # ── Restore data to target ────────────────────────────────────────
      - name: Restore data to target
        if: ${{ github.event.inputs.dry_run == 'false' }}
        run: |
          echo "╔══════════════════════════════════════════════════════════════════╗"
          echo "║  Restoring data to TARGET: ${TARGET_REF}                        ║"
          echo "╚══════════════════════════════════════════════════════════════════╝"

          # Restore inside a single transaction so any failure rolls back cleanly
          # (all-or-nothing).  psql will exit non-zero if the restore fails.
          psql "$TARGET_DSN" \
            --single-transaction \
            --file=/tmp/data_dump.sql

          echo "✅ Restore complete — no errors."

      # ── Row-count summary ─────────────────────────────────────────────
      - name: Row-count summary
        if: ${{ github.event.inputs.dry_run == 'false' }}
        run: |
          echo "=== Row counts on SOURCE ==="
          psql "$SOURCE_DSN" -c "
            SELECT schemaname, tablename,
                   n_live_tup::bigint AS rows
            FROM pg_stat_user_tables
            WHERE schemaname = 'public'
              AND n_live_tup > 0
            ORDER BY n_live_tup DESC
            LIMIT 30;
          " || true

          echo ""
          echo "=== Row counts on TARGET ==="
          psql "$TARGET_DSN" -c "
            SELECT schemaname, tablename,
                   n_live_tup::bigint AS rows
            FROM pg_stat_user_tables
            WHERE schemaname = 'public'
              AND n_live_tup > 0
            ORDER BY n_live_tup DESC
            LIMIT 30;
          " || true

          echo ""
          echo "╔══════════════════════════════════════════════════════════════════╗"
          echo "║  ✅ Data migration complete.                                      ║"
          echo "╚══════════════════════════════════════════════════════════════════╝"
          echo ""
          echo "NEXT STEPS:"
          echo "  1. Verify the row counts above match between source and target."
          echo "  2. Update VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY in your"
          echo "     deployment platform (Vercel / OnSpace AI / GitHub Secrets):"
          echo "       VITE_SUPABASE_URL      = https://${TARGET_REF}.supabase.co"
          echo "       VITE_SUPABASE_ANON_KEY = (from new project Dashboard → Settings → API)"
          echo "  3. Update GitHub secrets:"
          echo "       SUPABASE_PROJECT_REF   = ${TARGET_REF}"
          echo "       SUPABASE_DB_PASSWORD   = (new project DB password)"
          echo "  4. Re-deploy edge functions against the new project:"
          echo "     Actions → 'Deploy Supabase Edge Functions' → Run workflow"
          echo "  5. Migrate Supabase Storage buckets manually if needed:"
          echo "     Old project → Storage → download files"
          echo "     New project → Storage → upload files"
