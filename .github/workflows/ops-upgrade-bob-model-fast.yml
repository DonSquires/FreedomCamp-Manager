name: Upgrade Bob AI Model (Fast Track)

on:
  workflow_dispatch:
    inputs:
      chat_model:
        description: Ollama chat model to pull and activate
        required: true
        default: qwen2.5:32b
      vision_model:
        description: Ollama vision model to activate
        required: true
        default: llava:7b
      writing_model:
        description: Ollama writing model to activate
        required: true
        default: qwen2.5:32b

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fast-upgrade:
    name: Fast-track Bob model upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Pull selected models on RunPod
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.RUNPOD_POD_SSH_HOST }}
          username: ${{ secrets.RUNPOD_POD_SSH_USER }}
          key: ${{ secrets.RUNPOD_POD_SSH_KEY }}
          port: ${{ secrets.RUNPOD_POD_SSH_PORT || 22 }}
          request_pty: true
          command_timeout: 30m
          script: |
            set -e
            OLLAMA_API="http://127.0.0.1:11434"
            CHAT_MODEL='${{ github.event.inputs.chat_model }}'
            VISION_MODEL='${{ github.event.inputs.vision_model }}'
            WRITING_MODEL='${{ github.event.inputs.writing_model }}'

            echo "Fast-track selection:"
            echo "  chat=${CHAT_MODEL}"
            echo "  vision=${VISION_MODEL}"
            echo "  writing=${WRITING_MODEL}"

            pull_model() {
              local model="$1"
              echo "==== pulling ${model} ===="

              if curl -sf "$OLLAMA_API/api/tags" | grep -q "\"${model}\""; then
                echo "${model} already present"
                return 0
              fi

              curl -sf -X POST "$OLLAMA_API/api/pull" \
                -H "Content-Type: application/json" \
                -d "{\"model\":\"${model}\",\"stream\":false}" \
                --max-time 2100 \
                >/tmp/pull_${model//[:\/]/_}.json || true

              if curl -sf "$OLLAMA_API/api/tags" | grep -q "\"${model}\""; then
                echo "✅ ${model} ready"
              else
                echo "::error::Model pull failed: ${model}"
                exit 1
              fi
            }

            if [ "$VISION_MODEL" != "$CHAT_MODEL" ]; then
              pull_model "$VISION_MODEL"
            fi
            pull_model "$CHAT_MODEL"

            echo "$CHAT_MODEL" > /tmp/selected_chat_model
            echo "$VISION_MODEL" > /tmp/selected_vision_model
            echo "$WRITING_MODEL" > /tmp/selected_writing_model

      - name: Update RunPod template env vars
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_TEMPLATE_ID: ${{ secrets.RUNPOD_TEMPLATE_ID }}
        run: |
          set -euo pipefail
          TEMPLATE_ID="${RUNPOD_TEMPLATE_ID:-y53tpqxjt9}"
          CHAT_MODEL='${{ github.event.inputs.chat_model }}'
          VISION_MODEL='${{ github.event.inputs.vision_model }}'
          WRITING_MODEL='${{ github.event.inputs.writing_model }}'

          MUTATION=$(cat <<GRAPHQL
{"query": "mutation { saveTemplate(input: { id: \\"${TEMPLATE_ID}\\", containerDiskInGb: 20, env: [ {key: \\"OLLAMA_MODEL\\", value: \\"${CHAT_MODEL}\\"}, {key: \\"TRANSLATION_MODEL\\", value: \\"${CHAT_MODEL}\\"}, {key: \\"OLLAMA_MODEL_WRITING\\", value: \\"${WRITING_MODEL}\\"}, {key: \\"OLLAMA_VISION_MODEL\\", value: \\"${VISION_MODEL}\\"} ] }) { id } }"}
GRAPHQL
)
          RESP=$(curl -sfL --max-time 30 \
            "https://api.runpod.io/graphql?api_key=${RUNPOD_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$MUTATION") || RESP='{}'
          echo "RunPod API response: $RESP"
          echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print('✅ Template updated: chat=${CHAT_MODEL} vision=${VISION_MODEL}') if d.get('data',{}).get('saveTemplate') else print('::warning::Template update may have failed — check RunPod dashboard')"

      - name: Verify health, model, and chat provider
        env:
          BOB_SERVICE_URL: ${{ secrets.BOB_SERVICE_URL }}
          INFERENCE_API_KEY: ${{ secrets.INFERENCE_API_KEY }}
          BOB_INFERENCE_API_KEY: ${{ secrets.BOB_INFERENCE_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${BOB_SERVICE_URL:-}" ]]; then
            echo "::error::BOB_SERVICE_URL secret is not set — refusing to default to hardcoded production URL"
            exit 1
          fi
          BOB_URL="${BOB_SERVICE_URL}"

          echo "Waiting 90s for rollout..."
          sleep 90

          HEALTH=$(curl -sfL --max-time 20 "$BOB_URL/health")
          CHAT=$(echo "$HEALTH" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('config',{}).get('OLLAMA_MODEL',''))")
          VISION=$(echo "$HEALTH" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('config',{}).get('OLLAMA_VISION_MODEL',''))")
          CB=$(echo "$HEALTH" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('ollama_circuit_breaker',{}).get('state','unknown'))")

          echo "OLLAMA_MODEL=$CHAT"
          echo "OLLAMA_VISION_MODEL=$VISION"
          echo "CB_STATE=$CB"

          [ "$CHAT" = '${{ github.event.inputs.chat_model }}' ] || { echo "::error::Model mismatch after fast-track rollout"; exit 1; }

          API_KEY="${INFERENCE_API_KEY:-${BOB_INFERENCE_API_KEY:-}}"
          if [[ -z "$API_KEY" ]]; then
            echo "::error::Missing INFERENCE_API_KEY/BOB_INFERENCE_API_KEY for strict chat probe"
            exit 1
          fi

          RESP=$(curl -sfL --max-time 60 \
            -X POST "$BOB_URL/chat" \
            -H "Content-Type: application/json" \
            -H "x-inference-api-key: $API_KEY" \
            -H "Authorization: Bearer $API_KEY" \
            -d '{"message":"Respond exactly with FAST_UPGRADE_OK"}') || RESP="{}"
          PROVIDER=$(echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('provider','?'))" 2>/dev/null || echo "?")
          FALLBACK=$(echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('fallback',True))" 2>/dev/null || echo "True")
          MSG=$(echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('message','')[:80])" 2>/dev/null || echo "")
          echo "Chat provider=$PROVIDER fallback=$FALLBACK response=$MSG"
          if [[ "$PROVIDER" != "ollama" || "$FALLBACK" != "False" ]]; then
            echo "::error::Chat probe is not strict Ollama mode (provider=$PROVIDER fallback=$FALLBACK)"
            exit 1
          fi

          echo "✅ Fast-track model upgrade completed"
