name: Ops Auto-Rerun Action Required Runs

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: ops-auto-approve-action-required
  cancel-in-progress: true

jobs:
  rerun-pending-runs:
    runs-on: ubuntu-latest
    steps:
      - name: Validate approver token
        env:
          CI_ML_APPROVER_TOKEN: ${{ secrets.CI_ML_APPROVER_TOKEN }}
        run: |
          if [ -z "$CI_ML_APPROVER_TOKEN" ]; then
            echo "::warning::CI_ML_APPROVER_TOKEN is not configured. Skipping auto-approval pass."
            exit 0
          fi

      - name: Rerun action_required runs
        env:
          CI_ML_APPROVER_TOKEN: ${{ secrets.CI_ML_APPROVER_TOKEN }}
          REPO: ${{ github.repository }}
          COOLDOWN_MINUTES: "15"
          MAX_RERUN_ATTEMPTS: "3"
          ALLOWED_WORKFLOWS: |
            Bob Full Service Self-Test
            policy-bob-openai-research-training
            Build Plan Crossover Gates
            Playwright Monitoring Pulse (Smoke Label)
            Validate RunPod Image Tags
            CI Build High Memory
            Playwright Deep Functional Cross-Browser
            Playwright Monitoring Pulse
            CI Phase E1 Data Access Consolidation Gate
            Governance Release Gate
            CI Admin Officer Endpoints Gate
        run: |
          set -euo pipefail

          : > /tmp/action-required-runs.jsonl
          for page in $(seq 1 10); do
            page_json=$(curl -sS \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $CI_ML_APPROVER_TOKEN" \
              "https://api.github.com/repos/$REPO/actions/runs?status=action_required&per_page=100&page=$page")
            page_count=$(printf '%s' "$page_json" | jq '.workflow_runs | length')
            if [ "$page_count" -eq 0 ]; then
              break
            fi
            printf '%s' "$page_json" | jq -c '.workflow_runs[]' >> /tmp/action-required-runs.jsonl
            if [ "$page_count" -lt 100 ]; then
              break
            fi
          done

          run_count=$(wc -l < /tmp/action-required-runs.jsonl | tr -d ' ')
          echo "Found $run_count action_required run(s)."

          if [ "$run_count" -eq 0 ]; then
            jq -n '{ total_runs: 0, rerun_requested: 0, skipped: 0, escalated: 0, suppressed_duplicates: 0, failed_api_calls: 0, notes: ["No action_required runs found"] }' > /tmp/action-required-self-heal-summary.json
            {
              echo "# Action Required Self-Heal Summary"
              echo
              echo "No action_required runs found."
            } > /tmp/action-required-self-heal-summary.md
            exit 0
          fi

          allowed_json=$(printf '%s\n' "$ALLOWED_WORKFLOWS" | sed '/^[[:space:]]*$/d' | jq -R . | jq -s .)
          now_epoch=$(date +%s)

          rerun=0
          skipped=0
          escalated=0
          suppressed_duplicates=0
          failed_api_calls=0
          ml_rejected=0
          suspicious=0
          rerun_details=""
          skip_details=""
          escalate_details=""
          ml_rejected_details=""
          suspicious_details=""

          declare -A seen_workflow_branch

          while IFS= read -r run; do
            [ -z "$run" ] && continue

            run_id=$(printf '%s' "$run" | jq -r '.id')
            run_name=$(printf '%s' "$run" | jq -r '.name')
            head_branch=$(printf '%s' "$run" | jq -r '.head_branch')
            run_attempt=$(printf '%s' "$run" | jq -r '.run_attempt // 1')
            updated_at=$(printf '%s' "$run" | jq -r '.updated_at')
            html_url=$(printf '%s' "$run" | jq -r '.html_url')
            run_event=$(printf '%s' "$run" | jq -r '.event // "unknown"')
            actor_login=$(printf '%s' "$run" | jq -r '.actor.login // "unknown"')
            workflow_branch_key="${run_name}@@${head_branch}"

            if [ -n "${seen_workflow_branch[$workflow_branch_key]:-}" ]; then
              suppressed_duplicates=$((suppressed_duplicates + 1))
              skip_details+="- run=$run_id workflow='$run_name' branch='$head_branch' reason=duplicate-pending-fix canonical_run=${seen_workflow_branch[$workflow_branch_key]}\n"
              continue
            fi
            seen_workflow_branch[$workflow_branch_key]="$run_id"

            if ! printf '%s' "$head_branch" | grep -Eq '^copilot/' && printf '%s' "$run_event" | grep -Eq '^(pull_request|pull_request_target)$'; then
              suspicious=$((suspicious + 1))
              suspicious_details+="- run=$run_id workflow='$run_name' actor='$actor_login' branch='$head_branch' event='$run_event' reason=suspicious-non-copilot-pr\n"
              continue
            fi

            if ! printf '%s' "$head_branch" | grep -Eq '^copilot/'; then
              skipped=$((skipped + 1))
              skip_details+="- run=$run_id workflow='$run_name' branch='$head_branch' reason=branch-not-copilot-pr\n"
              continue
            fi

            if ! jq -e --arg n "$run_name" 'index($n) != null' >/dev/null <<<"$allowed_json"; then
              skipped=$((skipped + 1))
              skip_details+="- run=$run_id workflow='$run_name' branch='$head_branch' reason=workflow-not-allowlisted\n"
              continue
            fi

            if [ "$run_attempt" -ge "$MAX_RERUN_ATTEMPTS" ]; then
              escalated=$((escalated + 1))
              escalate_details+="- run=$run_id workflow='$run_name' attempt=$run_attempt branch='$head_branch' reason=attempt-cap-reached url=$html_url\n"
              continue
            fi

            updated_epoch=$(date -u -d "$updated_at" +%s 2>/dev/null || echo 0)
            age_minutes=99999
            if [ "$updated_epoch" -gt 0 ]; then
              age_minutes=$(( (now_epoch - updated_epoch) / 60 ))
            fi

            if [ "$age_minutes" -lt "$COOLDOWN_MINUTES" ]; then
              skipped=$((skipped + 1))
              skip_details+="- run=$run_id workflow='$run_name' branch='$head_branch' reason=cooldown age_minutes=$age_minutes\n"
              continue
            fi

            echo "Rerunning run $run_id ($run_name)"
            rerun_code=$(curl -sS -o /tmp/rerun-response.json -w "%{http_code}" \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $CI_ML_APPROVER_TOKEN" \
              "https://api.github.com/repos/$REPO/actions/runs/$run_id/rerun")

            if printf '%s' "$rerun_code" | grep -q '^20[0-9]$'; then
              rerun=$((rerun + 1))
              rerun_details+="- run=$run_id workflow='$run_name' previous_attempt=$run_attempt branch='$head_branch'\n"
            else
              failed_api_calls=$((failed_api_calls + 1))
              err_msg=$(jq -r '.message // "unknown-error"' /tmp/rerun-response.json)
              echo "::warning::Failed to rerun run $run_id ($err_msg)"
              skip_details+="- run=$run_id workflow='$run_name' reason=rerun-api-failed code=$rerun_code message='$err_msg'\n"
              if printf '%s' "$rerun_code $err_msg" | grep -Eqi '403|forbidden|approval|rejected|blocked|unauthorized|policy'; then
                ml_rejected=$((ml_rejected + 1))
                ml_rejected_details+="- run=$run_id workflow='$run_name' branch='$head_branch' code=$rerun_code message='$err_msg'\n"
              fi
            fi
          done < <(jq -s 'sort_by(.created_at)[]' /tmp/action-required-runs.jsonl | jq -c '.')

          if [ "$escalated" -gt 0 ] || [ "$ml_rejected" -gt 0 ] || [ "$suspicious" -gt 0 ]; then
            echo "Dispatching Ops Bob Assess Failed Actions due to escalation items"
            dispatch_code=$(curl -sS -o /tmp/dispatch-response.json -w "%{http_code}" \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $CI_ML_APPROVER_TOKEN" \
              "https://api.github.com/repos/$REPO/actions/workflows/ops-bob-assess-failed-actions.yml/dispatches" \
              -d '{"ref":"main"}')
            if ! printf '%s' "$dispatch_code" | grep -q '^20[0-9]$'; then
              failed_api_calls=$((failed_api_calls + 1))
              echo "::warning::Failed to dispatch Ops Bob escalation workflow"
              cat /tmp/dispatch-response.json || true
            fi
          fi

          if [ "$suspicious" -gt 0 ]; then
            echo "Dispatching Ops - Self-Healing Watchdog for mitigation context"
            mitigation_code=$(curl -sS -o /tmp/mitigation-response.json -w "%{http_code}" \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $CI_ML_APPROVER_TOKEN" \
              "https://api.github.com/repos/$REPO/actions/workflows/ops-self-healing-watchdog.yml/dispatches" \
              -d '{"ref":"main","inputs":{"rerun_failed_workflows":"false"}}')
            if ! printf '%s' "$mitigation_code" | grep -q '^20[0-9]$'; then
              failed_api_calls=$((failed_api_calls + 1))
              echo "::warning::Failed to dispatch self-healing watchdog mitigation workflow"
              cat /tmp/mitigation-response.json || true
            fi

            echo "Opening or updating security incident issue"
            incident_title="ops: suspicious CI run blocked"
            details_block="$(printf '%b' "$suspicious_details")"

            open_issues_code=$(curl -sS -o /tmp/open-security-issues.json -w "%{http_code}" \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $CI_ML_APPROVER_TOKEN" \
              "https://api.github.com/repos/$REPO/issues?state=open&labels=security,self-healing,incident-response&per_page=100")

            if ! printf '%s' "$open_issues_code" | grep -q '^20[0-9]$'; then
              failed_api_calls=$((failed_api_calls + 1))
              echo "::warning::Failed to query open security incidents"
              cat /tmp/open-security-issues.json || true
            else
              existing_issue_number=$(jq -r --arg t "$incident_title" '.[] | select(.title == $t) | .number' /tmp/open-security-issues.json | head -n1)

              incident_body=$(jq -n \
                --arg repo "$REPO" \
                --arg run_url "https://github.com/$REPO/actions/runs/${{ github.run_id }}" \
                --arg suspicious_count "$suspicious" \
                --arg details "$details_block" \
                '{
                  body: (
                    "## Security Incident Triggered by Self-Heal\n\n" +
                    "A suspicious action_required run pattern was detected and blocked.\n\n" +
                    "- Repository: " + $repo + "\n" +
                    "- Self-heal run: " + $run_url + "\n" +
                    "- suspicious_blocked: " + $suspicious_count + "\n\n" +
                    "### Suspicious Runs\n" +
                    (if ($details | length) > 0 then $details else "- none" end) +
                    "\n### Required Mitigation Follow-Up\n" +
                    "1. Validate actor identity and branch provenance.\n" +
                    "2. Review workflow and run logs for abuse indicators.\n" +
                    "3. Confirm containment and close incident when safe.\n"
                  )
                }')

              if [ -n "$existing_issue_number" ]; then
                comment_code=$(curl -sS -o /tmp/security-incident-comment.json -w "%{http_code}" \
                  -X POST \
                  -H "Accept: application/vnd.github+json" \
                  -H "Authorization: Bearer $CI_ML_APPROVER_TOKEN" \
                  "https://api.github.com/repos/$REPO/issues/$existing_issue_number/comments" \
                  -d "$incident_body")

                if ! printf '%s' "$comment_code" | grep -q '^20[0-9]$'; then
                  failed_api_calls=$((failed_api_calls + 1))
                  echo "::warning::Failed to comment on existing security incident issue #$existing_issue_number"
                  cat /tmp/security-incident-comment.json || true
                fi
              else
                create_payload=$(jq -n \
                  --arg title "$incident_title" \
                  --arg body "$(jq -r '.body' <<<"$incident_body")" \
                  '{
                    title: $title,
                    body: $body,
                    labels: ["security", "self-healing", "incident-response", "automation"]
                  }')

                create_code=$(curl -sS -o /tmp/security-incident-create.json -w "%{http_code}" \
                  -X POST \
                  -H "Accept: application/vnd.github+json" \
                  -H "Authorization: Bearer $CI_ML_APPROVER_TOKEN" \
                  "https://api.github.com/repos/$REPO/issues" \
                  -d "$create_payload")

                if ! printf '%s' "$create_code" | grep -q '^20[0-9]$'; then
                  failed_api_calls=$((failed_api_calls + 1))
                  echo "::warning::Failed to create security incident issue"
                  cat /tmp/security-incident-create.json || true
                fi
              fi
            fi
          fi

          jq -n \
            --argjson total "$run_count" \
            --argjson rerun "$rerun" \
            --argjson skipped "$skipped" \
            --argjson escalated "$escalated" \
            --argjson suppressed_duplicates "$suppressed_duplicates" \
            --argjson failed "$failed_api_calls" \
            --argjson ml_rejected "$ml_rejected" \
            --argjson suspicious "$suspicious" \
            --arg rerun_details "$rerun_details" \
            --arg skip_details "$skip_details" \
            --arg escalate_details "$escalate_details" \
            --arg ml_rejected_details "$ml_rejected_details" \
            --arg suspicious_details "$suspicious_details" \
            '{
              total_runs: $total,
              rerun_requested: $rerun,
              skipped: $skipped,
              escalated: $escalated,
              suppressed_duplicates: $suppressed_duplicates,
              failed_api_calls: $failed,
              ml_rejected: $ml_rejected,
              suspicious_blocked: $suspicious,
              rerun_details: $rerun_details,
              skip_details: $skip_details,
              escalate_details: $escalate_details,
              ml_rejected_details: $ml_rejected_details,
              suspicious_details: $suspicious_details
            }' > /tmp/action-required-self-heal-summary.json

          {
            echo "# Action Required Self-Heal Summary"
            echo
            echo "- total_runs: $run_count"
            echo "- rerun_requested: $rerun"
            echo "- skipped: $skipped"
            echo "- escalated: $escalated"
            echo "- suppressed_duplicates: $suppressed_duplicates"
            echo "- failed_api_calls: $failed_api_calls"
            echo "- ml_rejected: $ml_rejected"
            echo "- suspicious_blocked: $suspicious"
            echo
            echo "## Rerun Details"
            if [ -n "$rerun_details" ]; then printf '%b' "$rerun_details"; else echo "- none"; fi
            echo
            echo "## Skip / API Failure Details"
            if [ -n "$skip_details" ]; then printf '%b' "$skip_details"; else echo "- none"; fi
            echo
            echo "## Escalation Details"
            if [ -n "$escalate_details" ]; then printf '%b' "$escalate_details"; else echo "- none"; fi
            echo
            echo "## ML Rejection Details"
            if [ -n "$ml_rejected_details" ]; then printf '%b' "$ml_rejected_details"; else echo "- none"; fi
            echo
            echo "## Suspicious Run Mitigation"
            if [ -n "$suspicious_details" ]; then printf '%b' "$suspicious_details"; else echo "- none"; fi
          } > /tmp/action-required-self-heal-summary.md

          if [ "$failed_api_calls" -gt 0 ]; then
            echo "::warning::Self-healing completed with API call failures."
          fi

      - name: Upload self-heal summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: action-required-self-heal-summary-${{ github.run_id }}
          path: |
            /tmp/action-required-self-heal-summary.md
            /tmp/action-required-self-heal-summary.json
          if-no-files-found: warn
