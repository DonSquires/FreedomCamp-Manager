name: Ops Auto-Ready Draft PRs

on:
  check_suite:
    types:
      - completed
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ops-auto-ready-copilot-drafts-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  mark-ready:
    if: github.event_name != 'check_suite' || github.event.check_suite.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Promote green Copilot drafts to ready
        env:
          GH_TOKEN: ${{ secrets.BOB_WORKER_GITHUB_TOKEN || secrets.DEPLOY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.check_suite.head_sha || '' }}
        run: |
          set -euo pipefail

          owner="${REPO%/*}"
          name="${REPO#*/}"

          if [ "$EVENT_NAME" = "check_suite" ]; then
            pr_number=$(jq -r '.check_suite.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")
            if [ -z "$pr_number" ]; then
              echo "No associated PR on this check_suite event."
              exit 0
            fi

            commit_state=$(gh api "repos/$REPO/commits/$HEAD_SHA/status" --jq '.state')
            if [ "$commit_state" != "success" ]; then
              echo "Commit status is '$commit_state'; draft remains draft."
              exit 0
            fi

            pr_json=$(gh api "repos/$REPO/pulls/$pr_number")
            is_draft=$(printf '%s' "$pr_json" | jq -r '.draft')
            pr_branch=$(printf '%s' "$pr_json" | jq -r '.head.ref')
            pr_base=$(printf '%s' "$pr_json" | jq -r '.base.ref')

            if [ "$is_draft" != "true" ]; then
              echo "PR #$pr_number is not draft."
              exit 0
            fi

            if [ "$pr_base" != "main" ]; then
              echo "PR #$pr_number targets '$pr_base'; only main is eligible."
              exit 0
            fi
            if ! printf '%s' "$pr_branch" | grep -Eq '^(copilot|feat|fix|ops|chore)/'; then
              echo "PR #$pr_number branch '$pr_branch' is not an eligible automated branch pattern."
              exit 0
            fi

            pr_id=$(gh api graphql \
              -f query='query($owner:String!, $name:String!, $number:Int!){ repository(owner:$owner, name:$name){ pullRequest(number:$number){ id } } }' \
              -f owner="$owner" \
              -f name="$name" \
              -F number="$pr_number" \
              --jq '.data.repository.pullRequest.id')

            gh api graphql \
              -f query='mutation($prId:ID!){ markPullRequestReadyForReview(input:{pullRequestId:$prId}){ pullRequest{ number isDraft } } }' \
              -f prId="$pr_id" >/tmp/auto-ready.json

            echo "Marked PR #$pr_number ready for review."
            exit 0
          fi

          pr_json=$(gh api graphql \
            -f query='query($owner:String!, $name:String!){ repository(owner:$owner, name:$name){ pullRequests(first:100, states:OPEN, orderBy:{field:UPDATED_AT,direction:DESC}){ nodes{ id number baseRefName headRefName isDraft commits(last:1){ nodes{ commit{ statusCheckRollup { state } } } } } } } }' \
            -f owner="$owner" \
            -f name="$name")

          candidate_count=$(printf '%s' "$pr_json" | jq '[
            .data.repository.pullRequests.nodes[]
            | select(.baseRefName == "main")
            | select(.isDraft == true)
            | select((.headRefName | test("^(copilot|feat|fix|ops|chore)/")))
            | select((.commits.nodes[0].commit.statusCheckRollup.state // "") == "SUCCESS")
          ] | length')

          echo "Green draft candidates: $candidate_count"
          if [ "$candidate_count" -eq 0 ]; then
            echo "No green draft PRs to promote."
            exit 0
          fi

          while IFS='|' read -r pr_id pr_number; do
            [ -z "$pr_id" ] && continue
            gh api graphql \
              -f query='mutation($prId:ID!){ markPullRequestReadyForReview(input:{pullRequestId:$prId}){ pullRequest{ number isDraft } } }' \
              -f prId="$pr_id" >/tmp/auto-ready-backfill.json
            echo "Marked PR #$pr_number ready for review."
          done < <(
            printf '%s' "$pr_json" | jq -r '
              .data.repository.pullRequests.nodes[]
              | select(.baseRefName == "main")
              | select(.isDraft == true)
              | select((.headRefName | test("^(copilot|feat|fix|ops|chore)/")))
              | select((.commits.nodes[0].commit.statusCheckRollup.state // "") == "SUCCESS")
              | "\(.id)|\(.number)"'
          )