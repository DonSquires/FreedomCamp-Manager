name: Deploy Proxy Server to Railway

# Deploys the NZSCV/MotorWeb proxy service (proxy-server/) to Railway.
#
# Required secrets:
#   RAILWAY_TOKEN            — Railway project token (not a personal token)
#   RAILWAY_PROXY_SERVICE_ID — Railway service ID for proxy-server
#
# Optional secrets:
#   PROXY_SERVICE_URL — deployed Railway URL for post-deploy health check

on:
  push:
    branches: [main]
    paths:
      - 'proxy-server/**'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-proxy:
    name: Deploy Proxy Server to Railway
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Load normalized Railway credential env
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_CORE_TOKEN: ${{ secrets.RAILWAY_CORE_TOKEN }}
          RAILWAY_BOB_TOKEN: ${{ secrets.RAILWAY_BOB_TOKEN }}
          RAILWAY_PROXY_SERVICE_ID: ${{ secrets.RAILWAY_PROXY_SERVICE_ID }}
          RAILWAY_PROXY_PROJECT_ID: ${{ secrets.RAILWAY_PROXY_PROJECT_ID }}
          PROXY_SERVER_URL: ${{ secrets.PROXY_SERVER_URL }}
          PROXY_SERVICE_URL: ${{ secrets.PROXY_SERVICE_URL }}
          NZSCV_PROXY_URL: ${{ secrets.NZSCV_PROXY_URL }}
        run: |
          source ./scripts/load-railway-secrets-from-github-env.sh --quiet

          # Guard against a common secret wiring mistake where
          # RAILWAY_PROXY_SERVICE_ID is accidentally set to a token value.
          if [ -n "${RAILWAY_PROXY_SERVICE_ID:-}" ] && {
            [ "${RAILWAY_PROXY_SERVICE_ID}" = "${RAILWAY_TOKEN:-}" ] ||
            [ "${RAILWAY_PROXY_SERVICE_ID}" = "${RAILWAY_CORE_TOKEN:-}" ] ||
            [ "${RAILWAY_PROXY_SERVICE_ID}" = "${RAILWAY_BOB_TOKEN:-}" ];
          }; then
            echo "::warning::RAILWAY_PROXY_SERVICE_ID matches a token value; using deterministic fallback service id."
            unset RAILWAY_PROXY_SERVICE_ID
          fi

          # Deterministic production fallbacks (user-provided from Railway production settings)
          : "${RAILWAY_PROXY_PROJECT_ID:=c5305775-ecf5-4d67-a59f-b7ae49838561}"
          : "${RAILWAY_PROXY_SERVICE_ID:=902fa49d-6f80-4518-b691-5e9e54f79066}"
          echo "RAILWAY_PROXY_PROJECT_ID=$RAILWAY_PROXY_PROJECT_ID" >> "$GITHUB_ENV"
          echo "RAILWAY_PROXY_SERVICE_ID=$RAILWAY_PROXY_SERVICE_ID" >> "$GITHUB_ENV"

      - name: Check required secrets
        id: check-secrets
        run: |
          missing=""
          [ -z "${RAILWAY_TOKEN:-}" ]            && missing="$missing RAILWAY_TOKEN"
          [ -z "${RAILWAY_PROXY_SERVICE_ID:-}" ] && missing="$missing RAILWAY_PROXY_SERVICE_ID"

          if [ -n "$missing" ]; then
            echo "::error::Required secrets not configured ($missing) — deployment skipped."
            echo ""
            echo "Add these GitHub Actions secrets to this repository:"
            echo "  RAILWAY_TOKEN: Railway project token with deploy access to proxy service"
            echo "  RAILWAY_PROXY_SERVICE_ID: Railway proxy service ID"
            echo ""
            echo "See docs/RAILWAY_SERVICES_AUTHORITY.md for setup instructions."
            exit 1
          fi

          echo "✅ Railway proxy secrets present"
          echo "secrets_present=true" >> "$GITHUB_OUTPUT"

      - name: Install Railway CLI
        if: steps.check-secrets.outputs.secrets_present == 'true'
        run: |
          RAILWAY_CLI_VERSION="4.31.0"
          TARGET="x86_64-unknown-linux-gnu"
          URL="https://github.com/railwayapp/cli/releases/download/v${RAILWAY_CLI_VERSION}/railway-v${RAILWAY_CLI_VERSION}-${TARGET}.tar.gz"
          TMP_DIR=$(mktemp -d)
          cd "$TMP_DIR"
          curl -fsSL -o railway.tar.gz "$URL"
          tar -xzf railway.tar.gz
          mkdir -p "$HOME/.railway/bin"
          install -m 0755 railway "$HOME/.railway/bin/railway"
          echo "$HOME/.railway/bin" >> "$GITHUB_PATH"

      - name: Validate Railway token/service
        id: validate-token
        if: steps.check-secrets.outputs.secrets_present == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROXY_SERVICE_ID: ${{ secrets.RAILWAY_PROXY_SERVICE_ID }}
        run: |
          set -euo pipefail

          railway_graphql() {
            local payload="$1"
            local response=""

            if response=$(curl -fsSL https://backboard.railway.app/graphql/v2 \
              -H "Authorization: Bearer $RAILWAY_TOKEN" \
              -H 'Content-Type: application/json' \
              --data "$payload" 2>/dev/null); then
              echo "$response"
              return 0
            fi

            if response=$(curl -fsSL https://backboard.railway.app/graphql/v2 \
              -H "Project-Access-Token: $RAILWAY_TOKEN" \
              -H 'Content-Type: application/json' \
              --data "$payload" 2>/dev/null); then
              echo "$response"
              return 0
            fi

            return 1
          }

          echo "🔑 Validating Railway token..."
          TOKEN_RESPONSE=$(railway_graphql '{"query":"query Viewer { me { id email name } }"}' || echo '{}')
          if echo "$TOKEN_RESPONSE" | jq -e '.errors | length > 0' >/dev/null 2>&1; then
            echo "::warning::Railway token preflight failed on Viewer query; proceeding to deploy step for authoritative validation."
            echo "::warning::If deploy fails with auth, rotate RAILWAY_TOKEN in repository secrets."
            echo "token_preflight=failed" >> "$GITHUB_OUTPUT"
          else
            echo "✅ Railway token preflight passed"
            echo "token_preflight=passed" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "${RAILWAY_PROXY_SERVICE_ID:-}" ]; then
            echo "ℹ️  Proxy service selector configured: $RAILWAY_PROXY_SERVICE_ID"
          fi

          # Always continue: the deploy step is the source of truth for token validity.
          echo "token_valid=true" >> "$GITHUB_OUTPUT"

      - name: Set NZSCV environment variables on Railway service
        if: >-
          steps.check-secrets.outputs.secrets_present == 'true' &&
          steps.validate-token.outputs.token_valid == 'true'
        env:
          RAILWAY_TOKEN:            ${{ env.RAILWAY_TOKEN }}
          RAILWAY_PROXY_SERVICE_ID: ${{ env.RAILWAY_PROXY_SERVICE_ID }}
          RAILWAY_PROXY_PROJECT_ID: ${{ env.RAILWAY_PROXY_PROJECT_ID }}
          RAILWAY_PROXY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_PROXY_ENVIRONMENT_ID }}
          NZSCV_ID_KEY:             ${{ secrets.NZSCV_ID_KEY }}
          NZSCV_API_KEY:            ${{ secrets.NZSCV_API_KEY }}
          NZSCV_ENDPOINT_URL:       ${{ secrets.NZSCV_ENDPOINT_URL }}
          PROXY_SECRET:             ${{ secrets.PROXY_SECRET }}
          INFERENCE_API_KEY:        ${{ secrets.INFERENCE_API_KEY }}
          BOB_INFERENCE_API_KEY:    ${{ secrets.BOB_INFERENCE_API_KEY }}
          SUPABASE_URL:             ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_URL:        ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail

          : "${RAILWAY_PROXY_PROJECT_ID:=c5305775-ecf5-4d67-a59f-b7ae49838561}"
          : "${RAILWAY_PROXY_ENVIRONMENT_ID:=dd4cf850-e604-458c-869d-da4ad54279db}"

          # Build EnvironmentVariables object — only include vars that are actually set
          VARS_JSON="{}"
          add_var() {
            local name="$1" value="$2"
            [ -z "$value" ] && return
            VARS_JSON=$(echo "$VARS_JSON" | jq --arg n "$name" --arg v "$value" '. + {($n): $v}')
          }

          # Keep ingest auth aligned even if only one of these secrets is configured.
          if [ -z "${PROXY_SECRET:-}" ] && [ -n "${INFERENCE_API_KEY:-}" ]; then
            PROXY_SECRET="${INFERENCE_API_KEY}"
          fi
          if [ -z "${BOB_INFERENCE_API_KEY:-}" ] && [ -n "${INFERENCE_API_KEY:-}" ]; then
            BOB_INFERENCE_API_KEY="${INFERENCE_API_KEY}"
          fi
          if [ -z "${SUPABASE_URL:-}" ] && [ -n "${VITE_SUPABASE_URL:-}" ]; then
            SUPABASE_URL="${VITE_SUPABASE_URL}"
          fi

          add_var "NZSCV_ID_KEY"       "${NZSCV_ID_KEY:-}"
          add_var "NZSCV_API_KEY"      "${NZSCV_API_KEY:-}"
          add_var "NZSCV_ENDPOINT_URL" "${NZSCV_ENDPOINT_URL:-}"
          add_var "PROXY_SECRET"       "${PROXY_SECRET:-}"
          add_var "INFERENCE_API_KEY"  "${INFERENCE_API_KEY:-}"
          add_var "BOB_INFERENCE_API_KEY" "${BOB_INFERENCE_API_KEY:-}"
          add_var "SUPABASE_URL" "${SUPABASE_URL:-}"
          add_var "SUPABASE_SERVICE_ROLE_KEY" "${SUPABASE_SERVICE_ROLE_KEY:-}"

          COUNT=$(echo "$VARS_JSON" | jq 'keys | length')
          if [ "$COUNT" -eq 0 ]; then
            echo "ℹ️  No NZSCV/proxy secrets found in GitHub secrets — skipping Railway variable sync."
            exit 0
          fi

          echo "🔧 Setting $COUNT Railway environment variable(s) on service $RAILWAY_PROXY_SERVICE_ID ..."

          # Railway GraphQL: variableCollectionUpsert mutation
          MUTATION=$(jq -n \
            --arg environmentId "$RAILWAY_PROXY_ENVIRONMENT_ID" \
            --arg projectId "$RAILWAY_PROXY_PROJECT_ID" \
            --arg serviceId "$RAILWAY_PROXY_SERVICE_ID" \
            --argjson variables "$VARS_JSON" \
            '{
              query: "mutation UpsertVariableCollection($input: VariableCollectionUpsertInput!) { variableCollectionUpsert(input: $input) }",
              variables: {
                input: {
                  environmentId: $environmentId,
                  projectId: $projectId,
                  serviceId: $serviceId,
                  skipDeploys: true,
                  variables: $variables
                }
              }
            }')

          railway_graphql_status() {
            local header_name="$1"
            local header_value="$2"
            curl -sS -o /tmp/railway-vars-response.json -w "%{http_code}" https://backboard.railway.app/graphql/v2 \
              -H "$header_name: $header_value" \
              -H "Content-Type: application/json" \
              --data "$MUTATION" || echo "000"
          }

          HTTP_STATUS=$(railway_graphql_status "Authorization" "Bearer $RAILWAY_TOKEN")
          RESPONSE=$(cat /tmp/railway-vars-response.json 2>/dev/null || echo '{}')

          if [ "$HTTP_STATUS" = "401" ] || [ "$HTTP_STATUS" = "403" ] || \
             echo "$RESPONSE" | jq -e '.errors | length > 0 and (.[0].message | test("not authorized|forbidden"; "i"))' >/dev/null 2>&1; then
            HTTP_STATUS=$(railway_graphql_status "Project-Access-Token" "$RAILWAY_TOKEN")
          fi
          RESPONSE=$(cat /tmp/railway-vars-response.json 2>/dev/null || echo '{}')

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Railway variables sync returned HTTP $HTTP_STATUS"
            echo "::error::Railway response: $(echo "$RESPONSE" | jq -c '.')"
            exit 1
          elif echo "$RESPONSE" | jq -e '.errors | length > 0' >/dev/null 2>&1; then
            echo "::error::Railway variables sync failed: $(echo "$RESPONSE" | jq -r '.errors[0].message')"
            exit 1
          else
            echo "✅ Railway environment variables updated."
          fi

      - name: Deploy proxy-server to Railway
        if: >-
          steps.check-secrets.outputs.secrets_present == 'true' &&
          steps.validate-token.outputs.token_valid == 'true'
        env:
          RAILWAY_TOKEN: ${{ env.RAILWAY_TOKEN }}
          RAILWAY_PROXY_SERVICE_ID: ${{ env.RAILWAY_PROXY_SERVICE_ID }}
          RAILWAY_PROXY_PROJECT_ID: ${{ env.RAILWAY_PROXY_PROJECT_ID }}
        run: |
          set -euo pipefail
          echo "🚂 Deploying proxy-server to Railway..."
          railway up --project "$RAILWAY_PROXY_PROJECT_ID" --environment production --service "$RAILWAY_PROXY_SERVICE_ID" --detach
          echo "✅ Deploy triggered. Check Railway dashboard for status."

      - name: Verify proxy health
        if: >-
          steps.check-secrets.outputs.secrets_present == 'true' &&
          steps.validate-token.outputs.token_valid == 'true'
        run: |
          BASE_URL="${PROXY_SERVER_URL:-${PROXY_SERVICE_URL:-}}"
          BASE_URL="${BASE_URL%/}"
          if [ -z "$BASE_URL" ]; then
            echo "ℹ️  PROXY_SERVER_URL/PROXY_SERVICE_URL not set — skipping health check."
            exit 0
          fi

          if [[ "$BASE_URL" != http://* && "$BASE_URL" != https://* ]]; then
            BASE_URL="https://$BASE_URL"
          fi

          echo "⏳ Waiting 45s for Railway to finish deploying..."
          sleep 45

          echo "🏥 Checking health at ${BASE_URL}/health ..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "${BASE_URL}/health" || echo "000")
          BODY=$(curl -s --max-time 30 "${BASE_URL}/health" || true)

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Proxy health check failed with HTTP $HTTP_STATUS"
            exit 1
          fi

          if ! echo "$BODY" | grep -qiE '"status"\s*:\s*"ok"'; then
            echo "::warning::Proxy health response did not include expected status:ok marker. Body preview: ${BODY:0:200}"
          else
            echo "✅ Proxy health check passed"
          fi

          # Route presence check: 401/403 is acceptable (auth), but 404/405 means route missing.
          INGEST_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 -X POST "${BASE_URL}/intel/ingest-bulletin" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer route-probe" \
            --data '{"bulletin":{"title":"deploy-route-probe","summary":"route check"},"organization_id":"00000000-0000-0000-0000-000000000000"}' || echo "000")

          if [ "$INGEST_STATUS" = "404" ] || [ "$INGEST_STATUS" = "405" ]; then
            echo "::error::Proxy deploy is missing /intel/ingest-bulletin (HTTP $INGEST_STATUS)."
            exit 1
          fi
          echo "✅ Ingest route probe completed with HTTP $INGEST_STATUS"

          # Write the confirmed live URL back to Supabase so edge functions use the correct value
          echo "PROXY_LIVE_URL=$BASE_URL" >> "$GITHUB_ENV"

      - name: Update Supabase with confirmed proxy URL
        if: >-
          steps.check-secrets.outputs.secrets_present == 'true' &&
          steps.validate-token.outputs.token_valid == 'true' &&
          env.PROXY_LIVE_URL != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}
          NZSCV_PROXY_SECRET:    ${{ secrets.NZSCV_PROXY_SECRET }}
          PROXY_SECRET:          ${{ secrets.PROXY_SECRET }}
        run: |
          set -euo pipefail
          LIVE_URL="${PROXY_LIVE_URL}"
          # Ensure https:// prefix
          [[ "$LIVE_URL" != http* ]] && LIVE_URL="https://${LIVE_URL}"
          LIVE_URL="${LIVE_URL%/}"
          FINAL_SECRET="${NZSCV_PROXY_SECRET:-${PROXY_SECRET:-}}"

          echo "📝 Updating Supabase NZSCV_PROXY_URL → $LIVE_URL"
          curl -fsSL -X POST "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/secrets" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "[
              {\"name\":\"NZSCV_PROXY_URL\",\"value\":\"$LIVE_URL\"},
              {\"name\":\"PROXY_SERVER_URL\",\"value\":\"$LIVE_URL\"}
            ]"

          if [ -n "$FINAL_SECRET" ]; then
            curl -fsSL -X POST "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/secrets" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "[{\"name\":\"NZSCV_PROXY_SECRET\",\"value\":\"$FINAL_SECRET\"},{\"name\":\"PROXY_SERVER_SECRET\",\"value\":\"$FINAL_SECRET\"}]"
          fi

          echo "✅ Supabase proxy URL updated to $LIVE_URL"
