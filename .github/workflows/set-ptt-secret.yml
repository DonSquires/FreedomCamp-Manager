name: Set Core Edge Service Secrets (one-shot)

on:
  workflow_dispatch:
    inputs:
      proxy_server_url:
        description: 'Override PROXY_SERVER_URL (optional; falls back to repo secret)'
        required: false
        type: string
      inference_service_url:
        description: 'Override INFERENCE_SERVICE_URL (optional; falls back to repo secret)'
        required: false
        type: string
      ptt_server_url:
        description: 'Override PTT_SERVER_URL (optional; falls back to repo secret)'
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  set-secret:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Validate required GitHub secrets
        env:
          PTT_SERVER_URL: ${{ github.event.inputs.ptt_server_url || secrets.PTT_SERVER_URL }}
          PTT_PROXY_SECRET: ${{ secrets.PTT_PROXY_SECRET }}
          PROXY_SERVER_URL: ${{ github.event.inputs.proxy_server_url || secrets.PROXY_SERVER_URL }}
          INFERENCE_SERVICE_URL: ${{ github.event.inputs.inference_service_url || secrets.INFERENCE_SERVICE_URL }}
        run: |
          missing=""
          [ -z "$PTT_SERVER_URL" ] && missing="$missing PTT_SERVER_URL"
          [ -z "$PTT_PROXY_SECRET" ] && missing="$missing PTT_PROXY_SECRET"
          [ -z "$PROXY_SERVER_URL" ] && missing="$missing PROXY_SERVER_URL"
          [ -z "$INFERENCE_SERVICE_URL" ] && missing="$missing INFERENCE_SERVICE_URL"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Add these in GitHub → Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Set PTT edge secrets via Supabase Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          PTT_SERVER_URL: ${{ github.event.inputs.ptt_server_url || secrets.PTT_SERVER_URL }}
          PTT_PROXY_SECRET: ${{ secrets.PTT_PROXY_SECRET }}
          PROXY_SERVER_URL: ${{ github.event.inputs.proxy_server_url || secrets.PROXY_SERVER_URL }}
          INFERENCE_SERVICE_URL: ${{ github.event.inputs.inference_service_url || secrets.INFERENCE_SERVICE_URL }}
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            -X POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/secrets" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "[
              {\"name\":\"PROXY_SERVER_URL\",\"value\":\"${PROXY_SERVER_URL}\"},
              {\"name\":\"NZSCV_PROXY_URL\",\"value\":\"${PROXY_SERVER_URL}\"},
              {\"name\":\"INFERENCE_SERVICE_URL\",\"value\":\"${INFERENCE_SERVICE_URL}\"},
              {\"name\":\"PTT_SERVER_URL\",\"value\":\"${PTT_SERVER_URL}\"},
              {\"name\":\"PTT_PROXY_SECRET\",\"value\":\"${PTT_PROXY_SECRET}\"},
              {\"name\":\"PROXY_SECRET\",\"value\":\"${PTT_PROXY_SECRET}\"},
              {\"name\":\"PROXY_SERVER_SECRET\",\"value\":\"${PTT_PROXY_SECRET}\"},
              {\"name\":\"NZSCV_PROXY_SECRET\",\"value\":\"${PTT_PROXY_SECRET}\"}
            ]")
          cat /tmp/resp.json
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ Core service URLs + PTT/Proxy secret aliases set (HTTP $HTTP_STATUS)"
          else
            echo "::error::Failed to set secret (HTTP $HTTP_STATUS)"
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Redeploy ptt-signaling-token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase functions deploy ptt-signaling-token \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt
          echo "✅ ptt-signaling-token redeployed"
