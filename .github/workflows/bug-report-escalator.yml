name: Escalate Stale Bug Reports

on:
  workflow_dispatch:
    inputs:
      stale_minutes:
        description: 'Minimum age in minutes for submitted/acknowledged reports'
        required: false
        default: '10'
      max_reports:
        description: 'Maximum reports to process per run'
        required: false
        default: '25'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  escalate-submitted:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Validate required secrets
        id: validate-secrets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          missing=""
          [ -z "$VITE_SUPABASE_URL" ] && missing="$missing VITE_SUPABASE_URL"
          [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] && missing="$missing SUPABASE_SERVICE_ROLE_KEY"
          if [ -n "$missing" ]; then
            echo "::warning::Missing secret(s):$missing"
            echo "Skipping stale bug report escalation."
            echo "can_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "can_run=true" >> "$GITHUB_OUTPUT"

      - name: Normalize INFERENCE_SERVICE_URL secret (optional preflight)
        if: steps.validate-secrets.outputs.can_run == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          INFERENCE_SERVICE_URL: ${{ secrets.INFERENCE_SERVICE_URL }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ] || [ -z "${INFERENCE_SERVICE_URL:-}" ]; then
            echo "ℹ️ Skipping inference URL preflight (SUPABASE_ACCESS_TOKEN/SUPABASE_PROJECT_REF/INFERENCE_SERVICE_URL not fully configured)."
            exit 0
          fi

          normalized="$INFERENCE_SERVICE_URL"
          if [[ ! "$normalized" =~ ^https?:// ]]; then
            normalized="https://${normalized}"
          fi
          normalized="${normalized%/}"

          if [ "$normalized" = "$INFERENCE_SERVICE_URL" ]; then
            echo "✅ INFERENCE_SERVICE_URL already normalized (${normalized})"
            exit 0
          fi

          echo "🔧 Normalizing INFERENCE_SERVICE_URL to ${normalized}"

          code=$(curl -sS -o /tmp/inference_secret_update.json -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/secrets" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "[{\"name\":\"INFERENCE_SERVICE_URL\",\"value\":\"${normalized}\"}]")

          if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
            echo "✅ INFERENCE_SERVICE_URL normalized in Supabase secrets"
          else
            echo "::warning::Could not normalize INFERENCE_SERVICE_URL (HTTP ${code})"
            cat /tmp/inference_secret_update.json || true
          fi

      - name: Escalate stale submitted reports
        if: steps.validate-secrets.outputs.can_run == 'true'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INPUT_STALE_MINUTES: ${{ github.event.inputs.stale_minutes }}
          INPUT_MAX_REPORTS: ${{ github.event.inputs.max_reports }}
        run: |
          set -euo pipefail

          stale_minutes="${INPUT_STALE_MINUTES:-10}"
          max_reports="${INPUT_MAX_REPORTS:-25}"

          if ! [[ "$stale_minutes" =~ ^[0-9]+$ ]]; then
            stale_minutes=10
          fi
          if ! [[ "$max_reports" =~ ^[0-9]+$ ]]; then
            max_reports=25
          fi

          cutoff=$(date -u -d "-${stale_minutes} minutes" +"%Y-%m-%dT%H:%M:%SZ")
          url="${VITE_SUPABASE_URL}/rest/v1/bug_reports?select=id,created_at,title,status,ai_analyzed&status=in.(submitted,acknowledged)&created_at=lt.${cutoff}&order=created_at.asc&limit=${max_reports}"

          echo "Looking for submitted/acknowledged reports older than ${stale_minutes} minutes (cutoff: ${cutoff})"

          reports_json=$(curl -sS "$url" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Accept: application/json")

          total=$(echo "$reports_json" | jq 'length')
          if [ "$total" -eq 0 ]; then
            echo "No stale submitted/acknowledged reports found."
            exit 0
          fi

          echo "Found ${total} stale submitted/acknowledged reports. Triggering auto analysis..."

          success=0
          failed=0

          while IFS= read -r report_id; do
            [ -z "$report_id" ] && continue

            code=$(curl -sS -o /tmp/auto_analyse_resp.json -w "%{http_code}" \
              -X POST "${VITE_SUPABASE_URL}/functions/v1/auto-analyse-report" \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Content-Type: application/json" \
              -d "{\"report_id\":\"${report_id}\"}")

            if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
              echo "✅ escalated ${report_id}"
              success=$((success + 1))
            else
              echo "::warning::Failed to escalate ${report_id} (HTTP ${code})"
              cat /tmp/auto_analyse_resp.json || true
              failed=$((failed + 1))
            fi
          done < <(echo "$reports_json" | jq -r '.[].id')

          echo "Escalation summary: ${success} succeeded, ${failed} failed"
          {
            echo "## Stale Bug Report Escalator"
            echo ""
            echo "- Cutoff minutes: ${stale_minutes}"
            echo "- Found stale submitted/acknowledged: ${total}"
            echo "- Escalated successfully: ${success}"
            echo "- Failed: ${failed}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Escalation skipped (not configured)
        if: steps.validate-secrets.outputs.can_run != 'true'
        run: |
          echo "ℹ️ Escalator skipped because required secrets are not configured."