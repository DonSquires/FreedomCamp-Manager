name: Deploy Bob Service to Railway

# Deploys Bob as a dedicated Railway service from inference-service/.
# This is intended for a separate Bob-focused Railway project with its own
# token, service ID, and production URL.

on:
  push:
    branches: [main]
    paths:
      - 'inference-service/**'
      - '.github/workflows/deploy-bob-railway.yml'
  workflow_dispatch:
    inputs:
      railway_token_override:
        description: 'Optional Railway token override for this run only'
        required: false
        type: string
      bob_service_id_override:
        description: 'Optional Bob Railway service ID override for this run only'
        required: false
        type: string
      bob_project_id_override:
        description: 'Optional Bob Railway project ID override for this run only'
        required: false
        type: string
      bob_service_url_override:
        description: 'Optional Bob service URL override for this run only'
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-bob-railway:
    name: Deploy Bob Service to Railway
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Load normalized Railway credential env
        env:
          RAILWAY_BOB_TOKEN: ${{ secrets.RAILWAY_BOB_TOKEN }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_TOKEN_BOB: ${{ secrets.RAILWAY_TOKEN_BOB }}
          RAILWAY_BOB_SERVICE_ID: ${{ secrets.RAILWAY_BOB_SERVICE_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          RAILWAY_BOB_PROJECT_ID: ${{ secrets.RAILWAY_BOB_PROJECT_ID }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          BOB_SERVICE_URL: ${{ secrets.BOB_SERVICE_URL }}
          INFERENCE_SERVICE_URL: ${{ secrets.INFERENCE_SERVICE_URL }}
        run: |
          source ./scripts/load-railway-secrets-from-github-env.sh --quiet

      - name: Apply workflow dispatch overrides
        if: github.event_name == 'workflow_dispatch'
        env:
          TOKEN_OVERRIDE: ${{ github.event.inputs.railway_token_override }}
          SERVICE_ID_OVERRIDE: ${{ github.event.inputs.bob_service_id_override }}
          PROJECT_ID_OVERRIDE: ${{ github.event.inputs.bob_project_id_override }}
          SERVICE_URL_OVERRIDE: ${{ github.event.inputs.bob_service_url_override }}
        run: |
          set -euo pipefail
          if [ -n "${TOKEN_OVERRIDE:-}" ]; then
            echo "::add-mask::${TOKEN_OVERRIDE}"
            {
              echo "RAILWAY_BOB_TOKEN=${TOKEN_OVERRIDE}"
              echo "RAILWAY_TOKEN=${TOKEN_OVERRIDE}"
            } >> "$GITHUB_ENV"
          fi
          if [ -n "${SERVICE_ID_OVERRIDE:-}" ]; then
            echo "RAILWAY_BOB_SERVICE_ID=${SERVICE_ID_OVERRIDE}" >> "$GITHUB_ENV"
          fi
          if [ -n "${PROJECT_ID_OVERRIDE:-}" ]; then
            echo "RAILWAY_BOB_PROJECT_ID=${PROJECT_ID_OVERRIDE}" >> "$GITHUB_ENV"
          fi
          if [ -n "${SERVICE_URL_OVERRIDE:-}" ]; then
            echo "BOB_SERVICE_URL=${SERVICE_URL_OVERRIDE}" >> "$GITHUB_ENV"
          fi

      - name: Check required secrets
        id: check-secrets
        run: |
          missing=""
          [ -z "${RAILWAY_BOB_TOKEN:-${RAILWAY_TOKEN:-}}" ]   && missing="$missing RAILWAY_BOB_TOKEN-or-RAILWAY_TOKEN"

          # Bob deploy requires either explicit service ID OR project ID for auto-resolution
          if [ -z "${RAILWAY_BOB_SERVICE_ID:-}" ] && [ -z "${RAILWAY_BOB_PROJECT_ID:-}" ]; then
            missing="$missing RAILWAY_BOB_SERVICE_ID-or-RAILWAY_BOB_PROJECT_ID"
          fi

          if [ -n "$missing" ]; then
            echo "::error::Required Bob deploy secrets not configured ($missing) — deployment skipped."
            echo ""
            echo "Add these GitHub Actions secrets to this repository:"
            echo "  RAILWAY_BOB_TOKEN       - Railway project token for the Bob project (required)"
            echo "  RAILWAY_BOB_SERVICE_ID  - Railway service ID for Bob inference service (required if no PROJECT_ID)"
            echo "  RAILWAY_BOB_PROJECT_ID  - Railway project ID for Bob (required if no SERVICE_ID)"
            echo ""
            echo "See docs/BOB_PRODUCTION_RAILWAY_SETUP.md for setup instructions."
            exit 1
          fi

          echo "✅ Bob Railway deploy secrets present"
          echo "secrets_present=true" >> "$GITHUB_OUTPUT"
          if [ -n "$RAILWAY_BOB_SERVICE_ID" ]; then
            echo "resolved_candidate_service_id=$RAILWAY_BOB_SERVICE_ID" >> "$GITHUB_OUTPUT"
            echo "✅ Using explicit RAILWAY_BOB_SERVICE_ID"
          else
            echo "ℹ️  Will attempt auto-resolution from RAILWAY_BOB_PROJECT_ID"
          fi

      - name: Install Railway CLI
        if: steps.check-secrets.outputs.secrets_present == 'true'
        run: |
          RAILWAY_CLI_VERSION="4.31.0"
          TARGET="x86_64-unknown-linux-gnu"
          URL="https://github.com/railwayapp/cli/releases/download/v${RAILWAY_CLI_VERSION}/railway-v${RAILWAY_CLI_VERSION}-${TARGET}.tar.gz"
          TMP_DIR=$(mktemp -d)
          cd "$TMP_DIR"
          curl -fsSL -o railway.tar.gz "$URL"
          tar -xzf railway.tar.gz
          mkdir -p "$HOME/.railway/bin"
          install -m 0755 railway "$HOME/.railway/bin/railway"
          echo "$HOME/.railway/bin" >> "$GITHUB_PATH"

      - name: Validate Railway token/service
        id: validate-token
        if: steps.check-secrets.outputs.secrets_present == 'true'
        env:
          PRIMARY_RAILWAY_TOKEN: ${{ env.RAILWAY_BOB_TOKEN }}
          SECONDARY_RAILWAY_TOKEN: ${{ env.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ steps.check-secrets.outputs.resolved_candidate_service_id }}
        run: |
          set -euo pipefail

          select_working_token() {
            local token="$1"
            local source_label="$2"
            [ -z "$token" ] && return 1

            export RAILWAY_TOKEN="$token"
            if railway service list --json > /tmp/railway-services.json 2>/tmp/railway-token-check.err; then
              echo "::add-mask::$token"
              echo "SELECTED_RAILWAY_TOKEN=$token" >> "$GITHUB_ENV"
              echo "selected_token_source=$source_label" >> "$GITHUB_OUTPUT"
              return 0
            fi
            return 1
          }

          echo "🔑 Validating Bob Railway token..."
          if select_working_token "${PRIMARY_RAILWAY_TOKEN:-}" "RAILWAY_BOB_TOKEN"; then
            echo "✅ Using RAILWAY_BOB_TOKEN"
          elif select_working_token "${SECONDARY_RAILWAY_TOKEN:-}" "RAILWAY_TOKEN"; then
            echo "::warning::RAILWAY_BOB_TOKEN validation failed; using RAILWAY_TOKEN fallback for this run."
          else
            echo ""
            echo "::error::No valid Railway token found for Bob deployment."
            echo ""
            echo "Tried:"
            echo "  1. RAILWAY_BOB_TOKEN"
            echo "  2. RAILWAY_TOKEN"
            echo ""
            echo "Fix: Regenerate Bob project token in Railway and update GitHub secrets."
            exit 1
          fi

          if [ -n "${RAILWAY_SERVICE_ID:-}" ] && ! grep -q "$RAILWAY_SERVICE_ID" /tmp/railway-services.json; then
            echo "::warning::Resolved service ID was not found in token-scoped service list."
            echo "Deploy will still be attempted with auto-resolution fallbacks."
          fi

          echo "✅ Bob Railway validation step complete"
          echo "token_valid=true" >> "$GITHUB_OUTPUT"

      - name: Resolve Bob service identity
        id: resolve-service
        if: >-
          steps.check-secrets.outputs.secrets_present == 'true' &&
          steps.validate-token.outputs.token_valid == 'true'
        env:
          RAILWAY_TOKEN: ${{ env.SELECTED_RAILWAY_TOKEN }}
          EXPLICIT_SERVICE_ID: ${{ steps.check-secrets.outputs.resolved_candidate_service_id }}
          EXPLICIT_PROJECT_ID: ${{ env.RAILWAY_BOB_PROJECT_ID || env.RAILWAY_PROJECT_ID }}
        run: |
          set -euo pipefail

          if [ -n "$EXPLICIT_SERVICE_ID" ]; then
            echo "service_id=$EXPLICIT_SERVICE_ID" >> "$GITHUB_OUTPUT"
            echo "project_id=${EXPLICIT_PROJECT_ID}" >> "$GITHUB_OUTPUT"
            echo "✅ Using explicit RAILWAY_BOB_SERVICE_ID"
            exit 0
          fi

          if [ -n "$EXPLICIT_PROJECT_ID" ]; then
            echo "ℹ️ Attempting Bob service auto-discovery from explicit project ID..."
            GRAPHQL_PAYLOAD=$(printf '{"query":"query { project(id:\"%s\") { services { edges { node { id name } } } } }"}' "$EXPLICIT_PROJECT_ID")
            GRAPHQL_RESPONSE=$(curl -fsSL https://backboard.railway.app/graphql/v2 \
              -H "Authorization: Bearer $RAILWAY_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$GRAPHQL_PAYLOAD")

            RESOLVED=$(node -e '
              const data = JSON.parse(process.argv[1] || "{}");
              const services = data?.data?.project?.services?.edges?.map((edge) => edge?.node).filter(Boolean) || [];
              const candidates = [];
              for (const s of services) {
                const name = String(s?.name || "").toLowerCase();
                const score = (
                  (name.includes("bob") ? 10 : 0) +
                  (name.includes("inference") ? 6 : 0) +
                  (name.includes("orc") ? 4 : 0) -
                  (name.includes("ollama") ? 10 : 0)
                );
                if (score > 0) candidates.push({ projectId: process.argv[2], serviceId: s.id, serviceName: s.name, score });
              }
              candidates.sort((a, b) => b.score - a.score);
              const top = candidates[0];
              if (!top) process.exit(2);
              process.stdout.write(JSON.stringify(top));
            ' "$GRAPHQL_RESPONSE" "$EXPLICIT_PROJECT_ID") || true

            if [ -n "${RESOLVED:-}" ]; then
              RESOLVED_SERVICE_ID=$(echo "$RESOLVED" | jq -r '.serviceId')
              RESOLVED_PROJECT_ID=$(echo "$RESOLVED" | jq -r '.projectId')
              RESOLVED_SERVICE_NAME=$(echo "$RESOLVED" | jq -r '.serviceName')
              echo "service_id=$RESOLVED_SERVICE_ID" >> "$GITHUB_OUTPUT"
              echo "project_id=$RESOLVED_PROJECT_ID" >> "$GITHUB_OUTPUT"
              echo "✅ Auto-resolved Bob service from project: $RESOLVED_SERVICE_NAME ($RESOLVED_SERVICE_ID)"
              exit 0
            fi
          fi

          echo "ℹ️ Attempting Bob service auto-discovery from Railway token scope..."

          GRAPHQL_PAYLOAD='{"query":"query { me { projects { edges { node { id name services { edges { node { id name } } } } } } } }"}'
          GRAPHQL_RESPONSE=$(curl -fsSL https://backboard.railway.app/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$GRAPHQL_PAYLOAD")

          RESOLVED=$(node -e '
            const data = JSON.parse(process.argv[1] || "{}");
            const projects = data?.data?.me?.projects?.edges?.map((edge) => edge?.node).filter(Boolean) || [];
            const candidates = [];
            for (const p of projects) {
              const services = p?.services?.edges?.map((edge) => edge?.node).filter(Boolean) || [];
              for (const s of services) {
                const name = String(s?.name || "").toLowerCase();
                const score = (
                  (name.includes("bob") ? 10 : 0) +
                  (name.includes("inference") ? 6 : 0) +
                  (name.includes("orc") ? 4 : 0) -
                  (name.includes("ollama") ? 10 : 0)
                );
                if (score > 0) {
                  candidates.push({ projectId: p.id, serviceId: s.id, serviceName: s.name, score });
                }
              }
            }
            candidates.sort((a, b) => b.score - a.score);
            const top = candidates[0];
            if (!top) process.exit(2);
            process.stdout.write(JSON.stringify(top));
          ' "$GRAPHQL_RESPONSE") || {
            echo "::error::Unable to auto-resolve Bob service ID from Railway token scope."
            echo "::error::Set RAILWAY_BOB_SERVICE_ID or RAILWAY_BOB_PROJECT_ID explicitly."
            exit 1
          }

          RESOLVED_SERVICE_ID=$(echo "$RESOLVED" | jq -r '.serviceId')
          RESOLVED_PROJECT_ID=$(echo "$RESOLVED" | jq -r '.projectId')
          RESOLVED_SERVICE_NAME=$(echo "$RESOLVED" | jq -r '.serviceName')

          echo "service_id=$RESOLVED_SERVICE_ID" >> "$GITHUB_OUTPUT"
          echo "project_id=$RESOLVED_PROJECT_ID" >> "$GITHUB_OUTPUT"
          echo "✅ Auto-resolved Bob service: $RESOLVED_SERVICE_NAME ($RESOLVED_SERVICE_ID)"

      - name: Deploy Bob to Railway
        if: >-
          steps.check-secrets.outputs.secrets_present == 'true' &&
          steps.validate-token.outputs.token_valid == 'true' &&
          steps.resolve-service.outputs.service_id != ''
        env:
          RAILWAY_TOKEN: ${{ env.SELECTED_RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ steps.resolve-service.outputs.service_id }}
          RAILWAY_BOB_PROJECT_ID: ${{ steps.resolve-service.outputs.project_id }}
          RAILWAY_BOB_SERVICE_NAME: ${{ secrets.RAILWAY_BOB_SERVICE_NAME }}
        run: |
          set -euo pipefail

          echo "🚂 Deploying Bob from repository root ..."
          SERVICE_TO_DEPLOY="$RAILWAY_SERVICE_ID"
          PROJECT_TO_QUERY="${RAILWAY_BOB_PROJECT_ID:-}"
          DEPLOY_LOG="$(mktemp)"

          if railway up --service "$SERVICE_TO_DEPLOY" --detach 2>&1 | tee "$DEPLOY_LOG"; then
            exit 0
          fi

          if grep -q "Service not found" "$DEPLOY_LOG"; then
            echo "::warning::Configured RAILWAY_BOB_SERVICE_ID was not found. Attempting project-based service auto-resolution."

            if [ -z "$PROJECT_TO_QUERY" ]; then
              echo "::warning::RAILWAY_BOB_PROJECT_ID not set. Attempting global service auto-resolution from token scope."

              GLOBAL_GRAPHQL='{"query":"query { me { projects { edges { node { id name services { edges { node { id name } } } } } } } }"}'
              GLOBAL_RESPONSE=$(curl -fsSL https://backboard.railway.app/graphql/v2 \
                -H "Authorization: Bearer $RAILWAY_TOKEN" \
                -H "Content-Type: application/json" \
                --data "$GLOBAL_GRAPHQL" || true)

              GLOBAL_RESOLVED_SERVICE_ID=$(node -e '
                const data = JSON.parse(process.argv[1] || "{}");
                const projects = data?.data?.me?.projects?.edges?.map((edge) => edge?.node).filter(Boolean) || [];
                const candidates = [];
                for (const p of projects) {
                  const services = p?.services?.edges?.map((edge) => edge?.node).filter(Boolean) || [];
                  for (const s of services) {
                    const name = String(s?.name || "").toLowerCase();
                    const score = (
                      (name.includes("bob") ? 10 : 0) +
                      (name.includes("inference") ? 6 : 0) +
                      (name.includes("orc") ? 4 : 0) -
                      (name.includes("ollama") ? 10 : 0)
                    );
                    if (score > 0) candidates.push({ id: s.id, score });
                  }
                }
                candidates.sort((a, b) => b.score - a.score);
                process.stdout.write(candidates[0]?.id || "");
              ' "$GLOBAL_RESPONSE")

              if [ -n "$GLOBAL_RESOLVED_SERVICE_ID" ] && [ "$GLOBAL_RESOLVED_SERVICE_ID" != "$RAILWAY_SERVICE_ID" ]; then
                echo "::warning::Global auto-resolution found candidate Bob service ID; retrying deployment."
                if railway up --service "$GLOBAL_RESOLVED_SERVICE_ID" --detach; then
                  exit 0
                fi
              fi

              echo "::warning::Attempting Bob deployment by common service names as final fallback."
              FALLBACK_NAMES="${RAILWAY_BOB_SERVICE_NAME:-} bob bob-inference bob-inference-service inference-service orc-ai-inference-service"
              for NAME in $FALLBACK_NAMES; do
                if [ -z "$NAME" ]; then
                  continue
                fi
                echo "ℹ️ Trying Railway service selector: $NAME"
                if railway up --service "$NAME" --detach; then
                  echo "✅ Bob deploy succeeded using service selector: $NAME"
                  exit 0
                fi
              done

              echo "::error::Could not resolve a deployable Bob service ID from Railway token scope."
              exit 1
            fi

            GRAPHQL_PAYLOAD=$(printf '{"query":"query { project(id:\"%s\") { services { edges { node { id name } } } } }"}' "$PROJECT_TO_QUERY")
            GRAPHQL_RESPONSE=$(curl -fsSL https://backboard.railway.app/graphql/v2 \
              -H "Authorization: Bearer $RAILWAY_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$GRAPHQL_PAYLOAD" || true)

            RESOLVED_SERVICE_ID=$(node -e '
              const data = JSON.parse(process.argv[1] || "{}");
              const edges = data?.data?.project?.services?.edges || [];
              const services = edges.map((edge) => edge.node).filter(Boolean);
              const preferred = services.find((service) => ["bob", "bob inference", "bob-inference", "."].includes(String(service.name || "").toLowerCase()));
              const fallback = services.find((service) => String(service.name || "").toLowerCase() !== "ollama");
              const selected = preferred || fallback;
              process.stdout.write(selected?.id || "");
            ' "$GRAPHQL_RESPONSE")

            if [ -n "$RESOLVED_SERVICE_ID" ] && [ "$RESOLVED_SERVICE_ID" != "$RAILWAY_SERVICE_ID" ]; then
              echo "::warning::Resolved Bob service ID from Railway project. Retry deployment and update RAILWAY_BOB_SERVICE_ID secret to match."
              if railway up --service "$RESOLVED_SERVICE_ID" --detach; then
                exit 0
              fi
            fi

            echo "::warning::Project-based resolution did not deploy. Attempting Bob deployment by common service names."
            FALLBACK_NAMES="${RAILWAY_BOB_SERVICE_NAME:-} bob bob-inference bob-inference-service inference-service orc-ai-inference-service"
            for NAME in $FALLBACK_NAMES; do
              if [ -z "$NAME" ]; then
                continue
              fi
              echo "ℹ️ Trying Railway service selector: $NAME"
              if railway up --service "$NAME" --detach; then
                echo "✅ Bob deploy succeeded using service selector: $NAME"
                exit 0
              fi
            done
          fi

          echo "::error::Railway deploy command failed for RAILWAY_BOB_SERVICE_ID=$RAILWAY_SERVICE_ID"
          echo "Verify RAILWAY_BOB_SERVICE_ID belongs to Bob Inference project and token has deploy access."
          exit 1

      - name: Verify Bob health and chat route
        if: >-
          steps.check-secrets.outputs.secrets_present == 'true' &&
          steps.validate-token.outputs.token_valid == 'true'
        env:
          BOB_SERVICE_URL: ${{ secrets.BOB_SERVICE_URL }}
        run: |
          BASE_URL="${BOB_SERVICE_URL%/}"
          if [ -z "$BASE_URL" ]; then
            echo "ℹ️  BOB_SERVICE_URL not set — skipping HTTP verification."
            exit 0
          fi

          if [[ "$BASE_URL" != http://* && "$BASE_URL" != https://* ]]; then
            BASE_URL="https://$BASE_URL"
          fi

          echo "⏳ Waiting 60s for Bob deployment to become ready..."
          sleep 60

          HEALTH_BODY=$(curl -s --max-time 30 "${BASE_URL}/health" || true)
          HEALTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "${BASE_URL}/health" || echo "000")

          if [ "$HEALTH_STATUS" != "200" ]; then
            echo "::error::Bob /health returned HTTP $HEALTH_STATUS"
            exit 1
          fi

          if ! echo "$HEALTH_BODY" | grep -q '"models"'; then
            echo "::error::Bob /health response does not look like inference-service."
            echo "Body preview: ${HEALTH_BODY:0:200}"
            exit 1
          fi

          DEPLOY_SIGNATURE=$(printf '%s' "$HEALTH_BODY" | jq -r '.config.DEPLOY_SIGNATURE // empty')
          SELF_CONTAINED_MODE=$(printf '%s' "$HEALTH_BODY" | jq -r '.config.SELF_CONTAINED_MODE // empty')
          REQUIRE_SELF_CONTAINED_MODE=$(printf '%s' "$HEALTH_BODY" | jq -r '.config.REQUIRE_SELF_CONTAINED_MODE // empty')
          SELF_CONTAINED_STRICT_EGRESS=$(printf '%s' "$HEALTH_BODY" | jq -r '.config.SELF_CONTAINED_STRICT_EGRESS // empty')

          [ "$DEPLOY_SIGNATURE" = "bob-self-contained-hardlock-v1" ] || {
            echo "::error::Bob deploy drift detected. Expected DEPLOY_SIGNATURE=bob-self-contained-hardlock-v1, got ${DEPLOY_SIGNATURE:-<missing>}"
            exit 1
          }
          [ "$SELF_CONTAINED_MODE" = "true" ] || {
            echo "::error::Bob deploy drift detected. Expected SELF_CONTAINED_MODE=true, got ${SELF_CONTAINED_MODE:-<missing>}"
            exit 1
          }
          [ "$REQUIRE_SELF_CONTAINED_MODE" = "true" ] || {
            echo "::error::Bob deploy drift detected. Expected REQUIRE_SELF_CONTAINED_MODE=true, got ${REQUIRE_SELF_CONTAINED_MODE:-<missing>}"
            exit 1
          }
          [ "$SELF_CONTAINED_STRICT_EGRESS" = "true" ] || {
            echo "::error::Bob deploy drift detected. Expected SELF_CONTAINED_STRICT_EGRESS=true, got ${SELF_CONTAINED_STRICT_EGRESS:-<missing>}"
            exit 1
          }

          CHAT_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            -X POST "${BASE_URL}/chat" \
            -H 'Content-Type: application/json' \
            -d '{"message":"ping"}' || echo "000")

          case "$CHAT_STATUS" in
            200|400|401|403|429)
              echo "✅ Bob /chat route exists (HTTP $CHAT_STATUS)."
              ;;
            *)
              echo "::error::Bob /chat route check failed with HTTP $CHAT_STATUS"
              exit 1
              ;;
          esac

          # ── Ollama connectivity check ─────────────────────────────────────────
          # Verify Bob can reach Ollama via private networking.
          # A false value means OLLAMA_BASE_URL is not set or Ollama is unreachable.
          OLLAMA_ENABLED_FLAG=$(printf '%s' "$HEALTH_BODY" | jq -r '.chat_local_ollama_enabled // .config.OLLAMA_ENABLED // "unknown"')
          if [ "$OLLAMA_ENABLED_FLAG" = "true" ]; then
            echo "✅ Bob reports chat_local_ollama_enabled=true — Ollama private networking is working."
          elif [ "$OLLAMA_ENABLED_FLAG" = "false" ]; then
            echo "::warning::Bob reports chat_local_ollama_enabled=false."
            echo "  This means Ollama is unreachable or OLLAMA_BASE_URL is not set on the Bob Railway service."
            echo "  Action required:"
            echo "    1. Ensure Bob and Ollama are in the SAME Railway project (not just the same account)."
            echo "    2. Set OLLAMA_BASE_URL=http://ollama.railway.internal:11434 on the Bob service."
            echo "    3. Set CHAT_PROVIDER=ollama on the Bob service."
            echo "    4. Verify the Ollama service is running and healthy: GET <ollama-url>/api/tags"
          else
            echo "ℹ️  chat_local_ollama_enabled not found in health response — may be an older Bob build."
          fi