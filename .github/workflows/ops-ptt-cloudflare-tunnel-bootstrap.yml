name: Ops PTT Cloudflare Tunnel Bootstrap

on:
  workflow_dispatch:
    inputs:
      ptt_upstream_host:
        description: "Private upstream host for PTT server on VPS"
        required: false
        default: "127.0.0.1"
        type: string
      ptt_upstream_port:
        description: "Private upstream port for PTT server on VPS"
        required: false
        default: "8080"
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  bootstrap:
    name: Start tunnel and sync PTT secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Validate required secrets
        env:
          VPS_IP: ${{ secrets.VPS_IP }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          : "${VPS_IP:?VPS_IP secret is required}"
          : "${VPS_USERNAME:?VPS_USERNAME secret is required}"
          : "${VPS_SSH_KEY:?VPS_SSH_KEY secret is required}"
          : "${SUPABASE_ACCESS_TOKEN:?SUPABASE_ACCESS_TOKEN secret is required}"
          : "${SUPABASE_PROJECT_REF:?SUPABASE_PROJECT_REF secret is required}"

      - name: Start Cloudflare tunnel on VPS
        id: tunnel
        uses: appleboy/ssh-action@v1.0.3
        env:
          PTT_UPSTREAM_HOST: ${{ inputs.ptt_upstream_host }}
          PTT_UPSTREAM_PORT: ${{ inputs.ptt_upstream_port }}
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: PTT_UPSTREAM_HOST,PTT_UPSTREAM_PORT
          script: |
            set -euo pipefail

            : "${PTT_UPSTREAM_HOST:=127.0.0.1}"
            : "${PTT_UPSTREAM_PORT:=8080}"

            sudo mkdir -p /opt/cloudflared
            if ! command -v cloudflared >/dev/null 2>&1; then
              curl -fsSL --retry 3 https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
              sudo install -m 0755 /tmp/cloudflared /usr/local/bin/cloudflared
            fi

            if pgrep -x cloudflared >/dev/null 2>&1; then
              sudo pkill -x cloudflared || true
            fi

            sudo rm -f /var/log/ptt-cloudflared.log
            sudo nohup cloudflared tunnel --url "http://${PTT_UPSTREAM_HOST}:${PTT_UPSTREAM_PORT}" --no-autoupdate > /var/log/ptt-cloudflared.log 2>&1 &

            for _ in $(seq 1 30); do
              url=$(sudo grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' /var/log/ptt-cloudflared.log | tail -n1 || true)
              if [ -n "$url" ]; then
                echo "PTT_TUNNEL_URL=$url"
                exit 0
              fi
              sleep 2
            done

            echo "Failed to discover Cloudflare tunnel URL"
            sudo cat /var/log/ptt-cloudflared.log || true
            exit 1

      - name: Extract tunnel URL
        id: extract
        env:
          SSH_OUTPUT: ${{ steps.tunnel.outputs.stdout }}
        run: |
          set -euo pipefail
          tunnel_url=$(printf '%s\n' "$SSH_OUTPUT" | grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' | tail -n1 || true)
          if [ -z "$tunnel_url" ]; then
            echo "::error::Tunnel URL not found in SSH output"
            printf '%s\n' "$SSH_OUTPUT"
            exit 1
          fi
          echo "tunnel_url=$tunnel_url" >> "$GITHUB_OUTPUT"
          echo "wss_url=${tunnel_url/https:/wss:}/ws" >> "$GITHUB_OUTPUT"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1

      - name: Sync secure PTT secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          PTT_PUBLIC_HTTPS_URL: ${{ steps.extract.outputs.tunnel_url }}
          PTT_PUBLIC_WSS_URL: ${{ steps.extract.outputs.wss_url }}
        run: |
          set -euo pipefail

          supabase secrets set \
            "PTT_SERVER_URL=${PTT_PUBLIC_HTTPS_URL}" \
            "PTT_WS_URL=${PTT_PUBLIC_WSS_URL}" \
            --project-ref "${SUPABASE_PROJECT_REF}"

      - name: Deploy PTT edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          supabase functions deploy ptt-signaling-token --project-ref "${SUPABASE_PROJECT_REF}"
          supabase functions deploy check-railway-health --project-ref "${SUPABASE_PROJECT_REF}"
          supabase functions deploy check-ptt-health --project-ref "${SUPABASE_PROJECT_REF}"

      - name: Validate secure PTT response
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          : "${SUPABASE_ANON_KEY:?VITE_SUPABASE_ANON_KEY secret is required}"

          curl -sS "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/check-ptt-health" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            | jq '{ptt_url, ptt_ws_url, ptt_ws_url_validation}'