name: Ops PTT Cloudflare Tunnel Bootstrap

on:
  workflow_dispatch:
    inputs:
      ptt_upstream_host:
        description: "Private upstream host for PTT server on VPS"
        required: false
        default: "127.0.0.1"
        type: string
      ptt_upstream_port:
        description: "Private upstream port for PTT server on VPS"
        required: false
        default: "8080"
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  bootstrap:
    name: Deprecated quick tunnel bootstrap
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Block deprecated quick tunnel path
        run: |
          set -euo pipefail
          echo "::error::This workflow is deprecated and intentionally blocked."
          echo "Use 'Ops PTT hPanel TLS Bootstrap' or direct stable-host deployment."
          echo "Quick trycloudflare endpoints are not allowed for production PTT URL policy."
          exit 1
