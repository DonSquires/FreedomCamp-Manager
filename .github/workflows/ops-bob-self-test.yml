name: Bob Full Service Self-Test

on:
  push:
    branches:
      - main
      - production
      - feat/**
      - copilot/**
      - ops/**
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    secrets:
      SIM_SUPABASE_URL:
        required: false
      SIM_SUPABASE_ANON_KEY:
        required: false
      SIM_SUPABASE_SERVICE_ROLE_KEY:
        required: false
      SIM_RAILWAY_BOB_API_URL:
        required: false
      SIM_SUPABASE_EDGE_FUNCTIONS_URL:
        required: false

permissions:
  contents: read
  checks: write
  actions: read

jobs:
  typecheck-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Typecheck preflight
        run: npm run typecheck

  bob-service-matrix:
    needs: [typecheck-preflight]
    runs-on: ubuntu-latest
    env:
      CI: true
      SUPABASE_URL: ${{ secrets.SIM_SUPABASE_URL || secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_URL: ${{ secrets.SIM_SUPABASE_URL || secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SIM_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.SIM_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
      RAILWAY_BOB_API_URL: ${{ secrets.SIM_RAILWAY_BOB_API_URL }}
      SUPABASE_EDGE_FUNCTIONS_URL: ${{ secrets.SIM_SUPABASE_EDGE_FUNCTIONS_URL }}
      PLAYWRIGHT_ADMIN_ORG1_EMAIL: ${{ secrets.PLAYWRIGHT_ADMIN_EMAIL }}
      PLAYWRIGHT_ADMIN_ORG1_PASSWORD: ${{ secrets.PLAYWRIGHT_ADMIN_PASSWORD }}
      PLAYWRIGHT_OFFICER_ORG1_EMAIL: ${{ secrets.PLAYWRIGHT_OFFICER_EMAIL }}
      PLAYWRIGHT_OFFICER_ORG1_PASSWORD: ${{ secrets.PLAYWRIGHT_OFFICER_PASSWORD }}
      PLAYWRIGHT_BOB_EMAIL: ${{ secrets.PLAYWRIGHT_ADMIN_EMAIL }}
      PLAYWRIGHT_BOB_PASSWORD: ${{ secrets.PLAYWRIGHT_ADMIN_PASSWORD }}
      PLAYWRIGHT_ALLOW_SHARED_CREDENTIAL_FALLBACK: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Build app
        run: npm run build

      - name: Lint app
        run: npm run lint

      - name: Resolve Tier 1 web test readiness
        id: web_env
        run: |
          if [[ -n "${VITE_SUPABASE_URL}" && -n "${VITE_SUPABASE_ANON_KEY}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "[bob-self-test] Tier 1 skipped: missing VITE_SUPABASE_URL or VITE_SUPABASE_ANON_KEY"
          fi

      - name: Tier 1 - Bob web service tests
        id: tier1
        if: steps.web_env.outputs.enabled == 'true'
        run: npm run test:bob:web

      - name: Tier 2 - Bob mobile simulation
        id: tier2
        run: npm run test:bob:mobile

      - name: Tier 2.5 - Bob voice escalation mock
        id: tier25
        run: npm run test:bob:voice

      - name: Tier 3 - Bob chaos checks
        id: tier3
        run: npm run test:bob:chaos

      - name: Upload Playwright report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bob-playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14
          if-no-files-found: warn

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Bob Full Service Test Matrix — Run \`${{ github.run_id }}\`"
            echo ""
            echo "| Tier | Suite | Status |"
            echo "|------|-------|--------|"
            echo "| 1    | Bob web service (Playwright) | ${{ steps.tier1.outcome || 'skipped' }} |"
            echo "| 2    | Bob mobile simulation | ${{ steps.tier2.outcome || 'skipped' }} |"
            echo "| 2.5  | Bob voice escalation mock | ${{ steps.tier25.outcome || 'skipped' }} |"
            echo "| 3    | Bob chaos harness | ${{ steps.tier3.outcome || 'skipped' }} |"
            echo ""
            echo "> Playwright HTML report uploaded as artifact \`bob-playwright-report-${{ github.run_id }}\`"
          } >> "$GITHUB_STEP_SUMMARY"