name: Ops — Bob Self-Test (Autonomous)

# Bob runs his own Playwright tests on his RunPod worker and reports results
# back to Supabase bug_reports. If any test fails, the workflow fails and
# creates a bug report that Bob's AI inbox picks up for self-triage.
#
# Required secrets:
#   RUNPOD_ENDPOINT_API_KEY  — RunPod API key for the serverless endpoint
#   RUNPOD_ENDPOINT_ID       — RunPod endpoint ID (e.g. n0bp1ifmq01cx2)
#   VITE_SUPABASE_URL        — Supabase project URL
#   SUPABASE_SERVICE_ROLE_KEY — For writing bug reports
#
# Required secrets for repo clone inside Bob's worker:
#   BOB_WORKER_GITHUB_TOKEN  — Fine-grained PAT with contents:read on this repo
#                              (Bob clones the repo at startup to get test files)
#
# Optional secrets:
#   SYNTHETIC_MONITOR_USER_ID — reporter UUID for auto-filed bug reports

on:
  schedule:
    - cron: '0 */4 * * *'   # every 4 hours — Bob runs his own tests autonomously
  workflow_dispatch:
    inputs:
      scope:
        description: 'Test scope to run'
        required: false
        default: 'quick'
        type: choice
        options: [quick, core, workflows, visual, full]
      quick_specs:
        description: 'Optional comma-separated specs used only when scope=quick'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Dry run (skip Supabase write)'
        required: false
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  bob-self-test:
    name: Bob Autonomous Self-Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate required secrets
        run: |
          missing=""
          [ -z "$RUNPOD_ENDPOINT_API_KEY" ] && missing="$missing RUNPOD_ENDPOINT_API_KEY"
          [ -z "$RUNPOD_ENDPOINT_ID" ]       && missing="$missing RUNPOD_ENDPOINT_ID"
          [ -z "$BOB_WORKER_GITHUB_TOKEN" ]  && missing="$missing BOB_WORKER_GITHUB_TOKEN"
          [ -z "$VITE_SUPABASE_URL" ]        && missing="$missing VITE_SUPABASE_URL"
          [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] && missing="$missing SUPABASE_SERVICE_ROLE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing"
            exit 1
          fi
          echo "✅ All required secrets present"
        env:
          RUNPOD_ENDPOINT_API_KEY:  ${{ secrets.RUNPOD_ENDPOINT_API_KEY }}
          RUNPOD_ENDPOINT_ID:       ${{ secrets.RUNPOD_ENDPOINT_ID }}
          BOB_WORKER_GITHUB_TOKEN:  ${{ secrets.BOB_WORKER_GITHUB_TOKEN }}
          VITE_SUPABASE_URL:        ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Set worker env vars via Supabase secrets (ensure repo clone enabled)
        run: |
          # These are set as Supabase edge function secrets already.
          # Here we just confirm the worker will have GITHUB_REPO_URL so it can
          # clone the repo. The actual injection happens at worker startup via
          # RunPod environment variables set on the endpoint - see docs/AI_SERVICE_CONFIGURATION.md
          echo "GITHUB_REPO_URL=https://github.com/${{ github.repository }}.git" >> "$GITHUB_ENV"
          echo "GITHUB_REPO_BRANCH=${{ github.ref_name }}" >> "$GITHUB_ENV"
          echo "TEST_SCOPE=${{ github.event.inputs.scope || 'quick' }}" >> "$GITHUB_ENV"
          echo "QUICK_SPECS=${{ github.event.inputs.quick_specs || '' }}" >> "$GITHUB_ENV"
          echo "DRY_RUN=${{ github.event.inputs.dry_run || 'false' }}" >> "$GITHUB_ENV"

      - name: Preflight Bob worker repo token access
        run: |
          set -euo pipefail
          repo_api="https://api.github.com/repos/${{ github.repository }}"
          status=$(curl -sS -o /tmp/bob_self_test_repo_probe.json -w "%{http_code}" \
            -H "Authorization: Bearer ${BOB_WORKER_GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "User-Agent: bob-self-test-workflow" \
            "$repo_api" || true)
          if [ "$status" != "200" ]; then
            echo "::error::BOB_WORKER_GITHUB_TOKEN cannot read ${{ github.repository }} (HTTP $status)"
            cat /tmp/bob_self_test_repo_probe.json || true
            exit 1
          fi
          echo "✅ Worker repo token has repo read access"
        env:
          BOB_WORKER_GITHUB_TOKEN: ${{ secrets.BOB_WORKER_GITHUB_TOKEN }}

      - name: Resolve serverless auth key for Bob self-test
        id: serverless-auth
        run: |
          set -euo pipefail

          endpoint="${RUNPOD_ENDPOINT_URL:-}"
          if [ -z "$endpoint" ]; then
            endpoint="https://api.runpod.ai/v2/${RUNPOD_ENDPOINT_ID}/runsync"
          fi

          try_key() {
            local label="$1"
            local key="$2"
            if [ -z "$key" ]; then
              return 1
            fi
            status=$(curl -sS -o /tmp/bob_self_test_auth_probe.json -w "%{http_code}" \
              -X POST "$endpoint" \
              -H "Authorization: Bearer ${key}" \
              -H "Content-Type: application/json" \
              -d '{"input":{"action":"chat","message":"auth probe","history":[]}}' || true)
            if [ "$status" = "401" ]; then
              echo "Serverless Bob self-test auth failed with ${label} (401)"
              return 1
            fi
            echo "Serverless Bob self-test auth accepted ${label} (HTTP ${status})"
            echo "resolved_key=${key}" >> "$GITHUB_OUTPUT"
            return 0
          }

          try_key "RUNPOD_ENDPOINT_API_KEY" "${RUNPOD_ENDPOINT_API_KEY:-}" \
            || try_key "INFERENCE_API_KEY" "${INFERENCE_API_KEY:-}" \
            || try_key "RUNPOD_API_KEY" "${RUNPOD_API_KEY:-}" \
            || { echo "::error::No valid serverless API key resolved for Bob self-test"; exit 1; }
        env:
          RUNPOD_ENDPOINT_ID: ${{ secrets.RUNPOD_ENDPOINT_ID }}
          RUNPOD_ENDPOINT_URL: ${{ secrets.RUNPOD_ENDPOINT_URL }}
          RUNPOD_ENDPOINT_API_KEY: ${{ secrets.RUNPOD_ENDPOINT_API_KEY }}
          INFERENCE_API_KEY: ${{ secrets.INFERENCE_API_KEY }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}

      - name: Validate Bob capability gate (serverless)
        run: node scripts/bob-capability-gate.mjs --mode serverless --required run_playwright --strict
        env:
          INFERENCE_SERVICE_URL:  https://api.runpod.ai/v2/${{ secrets.RUNPOD_ENDPOINT_ID }}
          INFERENCE_API_KEY:      ${{ steps.serverless-auth.outputs.resolved_key }}
          BOB_CAPABILITY_STRICT:  'true'

      - name: Trigger Bob self-test on RunPod
        run: |
          set -euo pipefail
          EXTRA_ARGS=""
          if [ -n "${QUICK_SPECS:-}" ] && [ "$TEST_SCOPE" = "quick" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --quickSpecs=${QUICK_SPECS}"
          fi
          if [ "$DRY_RUN" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --dryRun"
          fi
          # shellcheck disable=SC2086
          node scripts/trigger-bob-self-test.mjs --scope "$TEST_SCOPE" $EXTRA_ARGS
        env:
          INFERENCE_SERVICE_URL:     https://api.runpod.ai/v2/${{ secrets.RUNPOD_ENDPOINT_ID }}
          INFERENCE_API_KEY:         ${{ steps.serverless-auth.outputs.resolved_key }}
          VITE_SUPABASE_URL:         ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY:    ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SYNTHETIC_MONITOR_USER_ID: ${{ secrets.SYNTHETIC_MONITOR_USER_ID }}
          BOB_WORKER_GITHUB_TOKEN:   ${{ secrets.BOB_WORKER_GITHUB_TOKEN }}
          GITHUB_REPO_URL:           https://github.com/${{ github.repository }}.git
          GITHUB_REPO_BRANCH:        ${{ github.ref_name }}
          BOB_SELF_TEST_PREFLIGHT:   'true'
          BOB_SELF_TEST_REQUIRE_REPO_TOKEN: 'true'
          BOB_SELF_TEST_AUTH_MODE:   'repo-token'
          BOB_SELF_TEST_EMBED_REPO_TOKEN_IN_URL: 'false'
          BOB_SELF_TEST_TIMEOUT_MS:  '540000'
          BOB_SELF_TEST_POLL_MS:     '8000'
