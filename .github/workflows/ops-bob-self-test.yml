name: Bob Full Service Self-Test

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    secrets:
      SIM_SUPABASE_URL:
        required: false
      SIM_SUPABASE_ANON_KEY:
        required: false
      SIM_SUPABASE_SERVICE_ROLE_KEY:
        required: false
      SIM_RAILWAY_BOB_API_URL:
        required: false
      SIM_SUPABASE_EDGE_FUNCTIONS_URL:
        required: false

permissions:
  contents: read
  checks: write
  actions: read

jobs:
  bob-service-matrix:
    runs-on: ubuntu-latest
    env:
      CI: true
      SUPABASE_URL: ${{ secrets.SIM_SUPABASE_URL }}
      VITE_SUPABASE_URL: ${{ secrets.SIM_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SIM_SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SIM_SUPABASE_ANON_KEY }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.SIM_SUPABASE_ANON_KEY }}
      RAILWAY_BOB_API_URL: ${{ secrets.SIM_RAILWAY_BOB_API_URL }}
      SUPABASE_EDGE_FUNCTIONS_URL: ${{ secrets.SIM_SUPABASE_EDGE_FUNCTIONS_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps

      - name: Build app
        run: bun run build

      - name: Lint app
        run: bun run lint

      - name: Tier 1 - Bob web service tests
        run: bun run test:bob:web

      - name: Tier 2 - Bob mobile simulation
        run: bun run test:bob:mobile

      - name: Tier 2.5 - Bob voice escalation mock
        run: bun run test:bob:voice

      - name: Tier 3 - Bob chaos checks
        run: bun run test:bob:chaos

      - name: Upload Playwright report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bob-playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14
          if-no-files-found: warn

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Bob Full Service Test Matrix — Run \`${{ github.run_id }}\`"
            echo ""
            echo "| Tier | Suite | Status |"
            echo "|------|-------|--------|"
            echo "| 1    | Bob web service (Playwright) | ${{ steps.tier1.outcome == '' && '✅ ran' || steps.tier1.outcome }} |"
            echo "| 2    | Bob mobile simulation | ✅ ran |"
            echo "| 2.5  | Bob voice escalation mock | ✅ ran |"
            echo "| 3    | Bob chaos harness | ✅ ran |"
            echo ""
            echo "> Playwright HTML report uploaded as artifact \`bob-playwright-report-${{ github.run_id }}\`"
          } >> "$GITHUB_STEP_SUMMARY"