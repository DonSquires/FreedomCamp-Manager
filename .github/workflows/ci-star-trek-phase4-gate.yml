name: CI Star Trek Phase 4 — Admiral's Bridge Gate

# Runs the three Phase 4 E2E checkpoints on a Chromium-capable Ubuntu runner.
# Requires GitHub Actions secrets for Supabase credentials and Playwright roles.
# Mirrors the pattern used by ci-phase-b4-enforcement-gate.yml.

on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/e2e/phase4-admirals-bridge.spec.ts'
      - 'tests/e2e/phase4-operations-map-emergency-banner.spec.ts'
      - 'tests/e2e/phase4-notice-print-signature-gate.spec.ts'
      - 'src/pages/OperationsMap.tsx'
      - 'src/pages/NoticeToVacate.tsx'
      - 'src/lib/phase4Emergency.ts'
      - 'src/lib/enforcementPhase4.ts'
      - 'tests/e2e/auth.ts'
      - 'tests/e2e/setup.ts'
      - '.github/workflows/ci-star-trek-phase4-gate.yml'
  push:
    branches: [main]
    paths:
      - 'tests/e2e/phase4-admirals-bridge.spec.ts'
      - 'tests/e2e/phase4-operations-map-emergency-banner.spec.ts'
      - 'tests/e2e/phase4-notice-print-signature-gate.spec.ts'
      - 'src/pages/OperationsMap.tsx'
      - 'src/pages/NoticeToVacate.tsx'
      - 'src/lib/phase4Emergency.ts'
      - 'src/lib/enforcementPhase4.ts'
      - 'tests/e2e/auth.ts'
      - 'tests/e2e/setup.ts'
      - '.github/workflows/ci-star-trek-phase4-gate.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: star-trek-phase4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase4-admirals-bridge:
    name: Phase 4 — Admiral's Bridge (Welfare + Enforcement)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    env:
      CI: true
      VITE_SUPABASE_URL:              ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY:         ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY:      ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PLAYWRIGHT_ADMIN_ORG1_EMAIL:    ${{ secrets.PLAYWRIGHT_ADMIN_ORG1_EMAIL != '' && secrets.PLAYWRIGHT_ADMIN_ORG1_EMAIL || secrets.PLAYWRIGHT_ADMIN_EMAIL }}
      PLAYWRIGHT_ADMIN_ORG1_PASSWORD: ${{ secrets.PLAYWRIGHT_ADMIN_ORG1_PASSWORD != '' && secrets.PLAYWRIGHT_ADMIN_ORG1_PASSWORD || secrets.PLAYWRIGHT_ADMIN_PASSWORD }}
      PLAYWRIGHT_ADMIN_EMAIL:         ${{ secrets.PLAYWRIGHT_ADMIN_EMAIL != '' && secrets.PLAYWRIGHT_ADMIN_EMAIL || secrets.PLAYWRIGHT_ADMIN_ORG1_EMAIL }}
      PLAYWRIGHT_ADMIN_PASSWORD:      ${{ secrets.PLAYWRIGHT_ADMIN_PASSWORD != '' && secrets.PLAYWRIGHT_ADMIN_PASSWORD || secrets.PLAYWRIGHT_ADMIN_ORG1_PASSWORD }}
      PLAYWRIGHT_BOB_EMAIL:           ${{ secrets.PLAYWRIGHT_BOB_EMAIL }}
      PLAYWRIGHT_BOB_PASSWORD:        ${{ secrets.PLAYWRIGHT_BOB_PASSWORD }}
      PLAYWRIGHT_ALLOW_SHARED_CREDENTIAL_FALLBACK: '1'
      PLAYWRIGHT_REUSE_EXISTING_SERVER: '1'
      PLAYWRIGHT_BASE_URL:            'http://127.0.0.1:4173'
      DEFAULT_PLAYWRIGHT_BASE_URL:    ${{ secrets.FRONTEND_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium (with system deps)
        run: npx playwright install --with-deps chromium

      - name: Build app for local preview
        run: npm run build

      - name: Start preview server
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 &
          echo $! > /tmp/preview.pid
          # Wait for server to be ready
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:4173 > /dev/null && break
            sleep 2
          done

      - name: Run Phase 4 unit tests first
        run: npx vitest run src/lib/__tests__/enforcementPhase4.test.ts src/lib/__tests__/phase4Emergency.test.ts

      - name: Run Phase 4 Admiral's Bridge E2E
        id: admirals_bridge
        continue-on-error: true
        run: |
          npx playwright test \
            tests/e2e/phase4-admirals-bridge.spec.ts \
            --project=chromium \
            --reporter=list

      - name: Run Phase 4 emergency banner E2E
        id: emergency_banner
        continue-on-error: true
        run: |
          npx playwright test \
            tests/e2e/phase4-operations-map-emergency-banner.spec.ts \
            --project=chromium \
            --reporter=list

      - name: Run Phase 4 print signature gate E2E
        id: signature_gate
        continue-on-error: true
        run: |
          npx playwright test \
            tests/e2e/phase4-notice-print-signature-gate.spec.ts \
            --project=chromium \
            --reporter=list

      - name: Enforce strict gate (if PHASE_GATES_STRICT=true)
        if: >
          (steps.admirals_bridge.outcome == 'failure' ||
           steps.emergency_banner.outcome == 'failure' ||
           steps.signature_gate.outcome == 'failure') &&
          vars.PHASE_GATES_STRICT == 'true'
        run: |
          echo "::error::One or more Phase 4 E2E gates failed and PHASE_GATES_STRICT=true."
          exit 1

      - name: Warn on failure (non-strict)
        if: >
          (steps.admirals_bridge.outcome == 'failure' ||
           steps.emergency_banner.outcome == 'failure' ||
           steps.signature_gate.outcome == 'failure') &&
          vars.PHASE_GATES_STRICT != 'true'
        run: |
          echo "::warning::One or more Phase 4 E2E gates failed but strict mode is disabled."

      - name: Stop preview server
        if: always()
        run: |
          if [ -f /tmp/preview.pid ]; then
            kill $(cat /tmp/preview.pid) || true
          fi

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-playwright-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
