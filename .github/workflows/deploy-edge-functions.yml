name: Deploy Supabase Edge Functions

# Deploys Supabase Edge Functions and (optionally) verifies them are live.
#
# Modes (controlled by the 'mode' input on workflow_dispatch):
#   deploy         — deploy only (default auto-trigger behaviour)
#   deploy+verify  — deploy then probe each function for expected HTTP response
#   verify-only    — probe without deploying (useful for post-deploy smoke tests)
#
# Auto-triggers on any push to main that touches supabase/functions/ files.
# A post-deploy step also pushes the Supabase auth config (site_url + redirect URLs).
#
# Required secrets:
#   SUPABASE_ACCESS_TOKEN — Supabase personal access token (sbp_…)
#   SUPABASE_PROJECT_REF  — Supabase project reference ID

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:
    inputs:
      function_name:
        description: 'Function name to deploy (blank = all changed/all)'
        required: false
        default: ''
      mode:
        description: 'Execution mode'
        required: false
        default: 'deploy'
        type: choice
        options: [deploy, deploy+verify, verify-only]
      no_verify_jwt:
        description: 'JWT verification override'
        required: false
        default: 'auto'
        type: choice
        options: [auto, yes, no]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Space-separated list of functions that do NOT require a JWT (public-facing).
  # These are deployed with --no-verify-jwt and expected to return non-5xx without auth.
  PUBLIC_FUNCTIONS: >-
    admin-incident-ops alpr-process alpr-retry analyze-vehicle-photo
    auto-analyse-report
    bob-learning-feedback-sync
    check-almost-breaches check-data-integrity check-nzscv-status
    check-railway-health check-zone-corrections cleanup-and-recalculate
    correct-zone-assignments create-user create_auth_and_profiles
    daily-photo-reconciler duplicate-detection enrich-from-motorweb
    generate-dashboard-report generate-incident-pdf generate-infringement
    generate-leadership-pack generate-noise-notice generate-notice-to-vacate
    generate-seizure-receipt generate-vehicle-report generate-warning-notice
    get-compliance-statistics get-weather hotspot-data import-data
    import-historical-data link-evidence-photos monitor-officer-welfare
    nightly-privacy-cleanup observations-export observations-in-bounds
    observations-list onspace-ai-chat parkpow-photo-sync
    parkpow-sync photo-recovery plate-scanner-photo-first
    process-credential-document process-face-scan process-homeless-data
    process-investigation-document process-officer-scan public-case-lookup
    recalculate-compliance-v3
    reingest-photos render-infringement-notice scan-breaches
    scrape-vehicle-photos select-best-vehicle-photo send-invite-email
    send-push-notification send-report-email set-user-password stream-webhook
    submit-dispute-intake suggest-new-zone sync-scv-list sync-spatial-layers
    test-compliance-matrix update-compliance-policy update-user-password
    upload-file vehicle-ingest zone-correction

jobs:
  deploy-edge-functions:
    name: Deploy Supabase Edge Functions
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check required secrets
        id: check-secrets
        run: |
          missing=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$SUPABASE_PROJECT_REF"  ] && missing="$missing SUPABASE_PROJECT_REF"
          if [ -n "$missing" ]; then
            echo "::warning::Missing secrets:$missing — edge function deploy skipped."
            echo "Add these at: GitHub repo → Settings → Secrets and variables → Actions → New repository secret"
            echo "  SUPABASE_ACCESS_TOKEN: get from https://supabase.com/dashboard/account/tokens"
            echo "  SUPABASE_PROJECT_REF:  get from Supabase → Project Settings → General → Reference ID"
            echo "secrets_present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "✅ Secrets present"
          echo "secrets_present=true" >> "$GITHUB_OUTPUT"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Checkout repository
        if: steps.check-secrets.outputs.secrets_present == 'true'
        uses: actions/checkout@v5

      - name: Setup Supabase CLI
        if: >-
          steps.check-secrets.outputs.secrets_present == 'true' &&
          github.event.inputs.mode != 'verify-only'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate Supabase deploy auth
        id: validate-supabase-auth
        if: >-
          steps.check-secrets.outputs.secrets_present == 'true' &&
          github.event.inputs.mode != 'verify-only'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail

          AUTH_LOG="$(mktemp)"
          echo "🔑 Validating Supabase deploy auth ..."

          if supabase functions list --project-ref "$SUPABASE_PROJECT_REF" > /dev/null 2>"$AUTH_LOG"; then
            echo "✅ Supabase deploy auth is valid"
            echo "auth_valid=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if grep -q '401' "$AUTH_LOG" || grep -qi 'unauthorized' "$AUTH_LOG"; then
            echo "::error::SUPABASE_ACCESS_TOKEN is invalid, expired, or not authorized for project $SUPABASE_PROJECT_REF."
            echo "Generate a new personal access token at https://supabase.com/dashboard/account/tokens"
            echo "and update GitHub secret SUPABASE_ACCESS_TOKEN."
          else
            echo "::error::Supabase deploy auth preflight failed."
            cat "$AUTH_LOG"
          fi

          exit 1

      # ── Deploy ────────────────────────────────────────────────────────
      - name: Resolve functions to deploy
        if: >-
          steps.check-secrets.outputs.secrets_present == 'true' &&
          steps.validate-supabase-auth.outputs.auth_valid == 'true' &&
          github.event.inputs.mode != 'verify-only' &&
          github.event.inputs.function_name == ''
        id: resolve-functions
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            FUNCTIONS=$(git diff --name-only HEAD~1 HEAD \
              | grep '^supabase/functions/' \
              | awk -F/ '{print $3}' \
              | grep -v '^_shared$' \
              | sort -u || true)
          else
            FUNCTIONS=$(find supabase/functions -mindepth 1 -maxdepth 1 -type d \
              | sed 's#supabase/functions/##' \
              | grep -v '^_shared$' \
              | sort -u)
          fi

          COUNT=$(printf '%s\n' "$FUNCTIONS" | grep -c . || true)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          {
            echo 'functions<<EOF'
            printf '%s\n' "$FUNCTIONS"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

          echo "Resolved $COUNT function(s) to deploy:"
          printf '%s\n' "$FUNCTIONS"

      - name: Deploy — single function
        if: >-
          steps.check-secrets.outputs.secrets_present == 'true' &&
          steps.validate-supabase-auth.outputs.auth_valid == 'true' &&
          github.event.inputs.mode != 'verify-only' &&
          github.event.inputs.function_name != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          fn="${{ github.event.inputs.function_name }}"
          override="${{ github.event.inputs.no_verify_jwt }}"

          JWT_FLAG=""
          if [ "$override" = "yes" ]; then
            JWT_FLAG="--no-verify-jwt"
          elif [ "$override" = "auto" ]; then
            for pub in $PUBLIC_FUNCTIONS; do
              [ "$fn" = "$pub" ] && JWT_FLAG="--no-verify-jwt" && break
            done
          fi

          echo "→ Deploying $fn $JWT_FLAG …"
          supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF" $JWT_FLAG
          echo "✅ Deployed: $fn"

      - name: Deploy — selected/all functions
        if: >-
          steps.check-secrets.outputs.secrets_present == 'true' &&
          steps.validate-supabase-auth.outputs.auth_valid == 'true' &&
          github.event.inputs.mode != 'verify-only' &&
          github.event.inputs.function_name == ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          success=0
          failed=0
          failed_functions=""
          FUNCTIONS_TO_DEPLOY='${{ steps.resolve-functions.outputs.functions }}'

          if [ -z "$FUNCTIONS_TO_DEPLOY" ]; then
            echo "No functions selected for deployment."
            exit 0
          fi

          while IFS= read -r fn; do
            [ -z "$fn" ] && continue

            JWT_FLAG=""
            for pub in $PUBLIC_FUNCTIONS; do
              [ "$fn" = "$pub" ] && JWT_FLAG="--no-verify-jwt" && break
            done

            echo "→ Deploying $fn $JWT_FLAG …"
            if supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF" $JWT_FLAG; then
              echo "  ✅ $fn deployed"
              success=$((success + 1))
            else
              echo "::warning::  ⚠️  $fn failed – continuing with remaining functions"
              failed_functions="$failed_functions $fn"
              failed=$((failed + 1))
            fi
          done <<'FUNCLIST'
          ${{ steps.resolve-functions.outputs.functions }}
          FUNCLIST

          echo ""
          echo "========================================="
          echo "Deploy complete: $success succeeded, $failed failed"
          if [ "$failed" -gt 0 ]; then
            failed_functions=$(echo "$failed_functions" | xargs)
            echo "Failed functions: $failed_functions"
            echo "::error::Edge Function deploy failures: $failed_functions"
            {
              echo "## Edge Function Deploy Summary"
              echo ""
              echo "- Succeeded: $success"
              echo "- Failed: $failed"
              echo "- Failed functions: $failed_functions"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Edge Function Deploy Summary"
              echo ""
              echo "- Succeeded: $success"
              echo "- Failed: 0"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "========================================="
          [ "$failed" -gt 0 ] && exit 1 || exit 0

      - name: Push Supabase auth config (CORS origins)
        if: >-
          steps.check-secrets.outputs.secrets_present == 'true' &&
          steps.validate-supabase-auth.outputs.auth_valid == 'true' &&
          github.event.inputs.mode != 'verify-only'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if supabase config push --project-ref "$SUPABASE_PROJECT_REF"; then
            echo "✅ Supabase auth config pushed (site_url + redirect URLs updated)"
          else
            echo "::warning::⚠️  Supabase config push failed – CORS allowed origins may be stale."
            echo "::warning::   Run the ops-push-supabase-config workflow manually to retry."
          fi

      # ── Verify ────────────────────────────────────────────────────────
      - name: Verify — all functions
        if: >-
          steps.check-secrets.outputs.secrets_present == 'true' &&
          (github.event.inputs.mode == 'deploy+verify' || github.event.inputs.mode == 'verify-only') &&
          github.event.inputs.function_name == ''
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          BASE_URL="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1"

          passed=0
          failed=0
          warnings=0

          {
            echo "## Edge Function Verification Results"
            echo ""
            echo "| Function | JWT Protected | HTTP Status | Result |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          for fn_dir in supabase/functions/*/; do
            fn=$(basename "$fn_dir")
            [ "$fn" = "_shared" ] && continue

            is_public=false
            for pub in $PUBLIC_FUNCTIONS; do
              [ "$fn" = "$pub" ] && is_public=true && break
            done

            PROTECTED_LABEL="✅ Yes"
            $is_public && PROTECTED_LABEL="🔓 No"

            echo "Probing: $fn  (public=$is_public) …"
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST "${BASE_URL}/${fn}" \
              -H "Content-Type: application/json" \
              --max-time 15 \
              --retry 2 \
              --retry-delay 5 \
              --data '{}' || echo "000")

            echo "  HTTP $HTTP_CODE"

            if $is_public; then
              if echo "$HTTP_CODE" | grep -qE '^5'; then
                echo "::warning::$fn returned HTTP $HTTP_CODE (server error)"
                echo "| \`$fn\` | $PROTECTED_LABEL | $HTTP_CODE | ❌ Server error |" >> "$GITHUB_STEP_SUMMARY"
                failed=$((failed + 1))
              elif [ "$HTTP_CODE" = "000" ]; then
                echo "::warning::$fn — no response (timeout or DNS failure)"
                echo "| \`$fn\` | $PROTECTED_LABEL | timeout | ⚠️ No response |" >> "$GITHUB_STEP_SUMMARY"
                warnings=$((warnings + 1))
              else
                echo "| \`$fn\` | $PROTECTED_LABEL | $HTTP_CODE | ✅ Live |" >> "$GITHUB_STEP_SUMMARY"
                passed=$((passed + 1))
              fi
            else
              if echo "$HTTP_CODE" | grep -qE '^5'; then
                echo "::warning::$fn returned HTTP $HTTP_CODE (server error)"
                echo "| \`$fn\` | $PROTECTED_LABEL | $HTTP_CODE | ❌ Server error |" >> "$GITHUB_STEP_SUMMARY"
                failed=$((failed + 1))
              elif [ "$HTTP_CODE" = "200" ]; then
                echo "::warning::$fn returned HTTP 200 without JWT — possible misconfiguration"
                echo "| \`$fn\` | $PROTECTED_LABEL | $HTTP_CODE | ⚠️ JWT bypass? |" >> "$GITHUB_STEP_SUMMARY"
                warnings=$((warnings + 1))
              elif [ "$HTTP_CODE" = "000" ]; then
                echo "::warning::$fn — no response (timeout or DNS failure)"
                echo "| \`$fn\` | $PROTECTED_LABEL | timeout | ⚠️ No response |" >> "$GITHUB_STEP_SUMMARY"
                warnings=$((warnings + 1))
              elif [ "$HTTP_CODE" = "401" ]; then
                echo "| \`$fn\` | $PROTECTED_LABEL | $HTTP_CODE | ✅ Live (JWT enforced) |" >> "$GITHUB_STEP_SUMMARY"
                passed=$((passed + 1))
              else
                echo "::warning::$fn returned unexpected HTTP $HTTP_CODE"
                echo "| \`$fn\` | $PROTECTED_LABEL | $HTTP_CODE | ⚠️ Unexpected status |" >> "$GITHUB_STEP_SUMMARY"
                warnings=$((warnings + 1))
              fi
            fi
          done

          total=$((passed + failed + warnings))
          {
            echo ""
            echo "**Total: $total functions probed — ✅ $passed passed · ⚠️ $warnings warnings · ❌ $failed failed**"
            echo ""
            echo "> - ✅ **Live** — function responded as expected"
            echo "> - ✅ **Live (JWT enforced)** — protected function correctly returned 401"
            echo "> - ⚠️ **Unexpected status** — function reachable but unexpected HTTP code"
            echo "> - ⚠️ **JWT bypass?** — protected function returned 200 without a token"
            echo "> - ⚠️ **No response** — curl timed out; project ref may be wrong"
            echo "> - ❌ **Server error** — function returned 5xx; check Supabase Edge Function logs"
          } >> "$GITHUB_STEP_SUMMARY"

          echo ""
          echo "========================================="
          echo "Verification: $passed passed, $warnings warnings, $failed failed (of $total)"
          echo "========================================="
          [ "$failed" -gt 0 ] && exit 1 || exit 0

      - name: Verify — single function
        if: >-
          steps.check-secrets.outputs.secrets_present == 'true' &&
          (github.event.inputs.mode == 'deploy+verify' || github.event.inputs.mode == 'verify-only') &&
          github.event.inputs.function_name != ''
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          BASE_URL="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1"
          fn="${{ github.event.inputs.function_name }}"

          is_public=false
          for pub in $PUBLIC_FUNCTIONS; do
            [ "$fn" = "$pub" ] && is_public=true && break
          done

          echo "Verifying: $fn  (public=$is_public)"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${BASE_URL}/${fn}" \
            -H "Content-Type: application/json" \
            --max-time 15 \
            --retry 2 \
            --retry-delay 5 \
            --data '{}')

          echo "  HTTP $HTTP_CODE"

          PROTECTED_LABEL="✅ Yes"
          $is_public && PROTECTED_LABEL="🔓 No"

          if $is_public; then
            if echo "$HTTP_CODE" | grep -qE '^5'; then
              echo "::error::$fn returned HTTP $HTTP_CODE (server error — function may have crashed)"
              exit 1
            else
              echo "  ✅ $fn is live (HTTP $HTTP_CODE)"
            fi
          else
            if echo "$HTTP_CODE" | grep -qE '^5'; then
              echo "::error::$fn returned HTTP $HTTP_CODE (server error — function may have crashed)"
              exit 1
            elif [ "$HTTP_CODE" = "200" ]; then
              echo "::error::$fn returned HTTP 200 without a JWT — JWT verification may be misconfigured"
              exit 1
            elif [ "$HTTP_CODE" = "401" ]; then
              echo "  ✅ $fn is live and correctly requires JWT (HTTP 401)"
            else
              echo "  ⚠️  $fn returned unexpected HTTP $HTTP_CODE"
              echo "::warning::$fn returned unexpected HTTP $HTTP_CODE"
            fi
          fi
