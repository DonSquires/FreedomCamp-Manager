name: Deploy Supabase Edge Functions

# -----------------------------------------------------------------------
# Deploys all (or a single) Supabase edge function(s) from the GitHub
# web UI. No local install required.
#
# Required repository secrets (Settings → Secrets → Actions):
#   SUPABASE_ACCESS_TOKEN   – from https://supabase.com/dashboard/account/tokens
#                             (click "Generate new token", copy the value)
#   SUPABASE_PROJECT_REF    – your project ref
#                             (Supabase dashboard → Project Settings → General
#                              → "Reference ID", e.g. abcdefghijklmnop)
#
# How to run:
#   GitHub repo → Actions → "Deploy Supabase Edge Functions" → Run workflow
#
# Public functions (called directly from browser without a user token)
# are automatically deployed with --no-verify-jwt:
#   orc-ingest, vehicle-ingest, alpr-process, alpr-retry,
#   plate-scanner-photo-first, stream-webhook, get-weather,
#   send-push-notification
# -----------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      function_name:
        description: 'Edge function to deploy (leave blank to deploy ALL)'
        required: false
        default: ''
      no_verify_jwt:
        description: 'Disable JWT verification for single-function deploy? (auto-set for known public functions)'
        required: false
        default: 'auto'
        type: choice
        options:
          - 'auto'
          - 'yes'
          - 'no'

jobs:
  deploy:
    name: Deploy edge functions
    runs-on: ubuntu-latest

    steps:
      - name: Check required secrets
        run: |
          missing=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$SUPABASE_PROJECT_REF"  ] && missing="$missing SUPABASE_PROJECT_REF"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing"
            echo "Add these at: GitHub repo → Settings → Secrets and variables → Actions → New repository secret"
            echo "  SUPABASE_ACCESS_TOKEN: get from https://supabase.com/dashboard/account/tokens"
            echo "  SUPABASE_PROJECT_REF:  get from Supabase → Project Settings → General → Reference ID"
            exit 1
          fi
          echo "✅ Secrets present"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy — single function
        if: ${{ github.event.inputs.function_name != '' }}
        run: |
          # Functions that must be publicly accessible (no JWT required)
          PUBLIC_FUNCTIONS="orc-ingest vehicle-ingest alpr-process alpr-retry plate-scanner-photo-first stream-webhook get-weather send-push-notification"

          fn="${{ github.event.inputs.function_name }}"
          mode="${{ github.event.inputs.no_verify_jwt }}"

          JWT_FLAG=""
          if [ "$mode" = "yes" ]; then
            JWT_FLAG="--no-verify-jwt"
          elif [ "$mode" = "auto" ]; then
            for pub in $PUBLIC_FUNCTIONS; do
              [ "$fn" = "$pub" ] && JWT_FLAG="--no-verify-jwt" && break
            done
          fi

          echo "→ Deploying $fn $JWT_FLAG …"
          supabase functions deploy "$fn" \
            --project-ref "$SUPABASE_PROJECT_REF" \
            $JWT_FLAG
          echo "✅ Deployed: $fn"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Deploy — all functions
        if: ${{ github.event.inputs.function_name == '' }}
        run: |
          # Functions that must be publicly accessible (no JWT required)
          PUBLIC_FUNCTIONS="orc-ingest vehicle-ingest alpr-process alpr-retry plate-scanner-photo-first stream-webhook get-weather send-push-notification"

          cd supabase/functions
          success=0
          failed=0

          for fn in */; do
            fn="${fn%/}"
            # Skip shared helpers — not deployable standalone
            [ "$fn" = "_shared" ] && continue

            # Determine JWT flag
            JWT_FLAG=""
            for pub in $PUBLIC_FUNCTIONS; do
              [ "$fn" = "$pub" ] && JWT_FLAG="--no-verify-jwt" && break
            done

            echo "→ Deploying $fn $JWT_FLAG …"
            if supabase functions deploy "$fn" \
                --project-ref "$SUPABASE_PROJECT_REF" \
                $JWT_FLAG; then
              echo "  ✅ $fn deployed"
              success=$((success + 1))
            else
              echo "::warning::  ⚠️  $fn failed – continuing with remaining functions"
              failed=$((failed + 1))
            fi
          done

          echo ""
          echo "========================================="
          echo "Deploy complete: $success succeeded, $failed failed"
          echo "========================================="
          [ "$failed" -gt 0 ] && exit 1 || exit 0
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}
