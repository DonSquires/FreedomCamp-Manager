name: Deploy Supabase Edge Functions

# -----------------------------------------------------------------------
# Deploys all (or a single) Supabase edge function(s) from the GitHub
# web UI. No local install required.
#
# Required repository secrets:
#   SUPABASE_ACCESS_TOKEN   – from https://supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF    – your project ref (e.g. abcdefghijklmnop)
#
# How to run:
#   GitHub repo → Actions → "Deploy Supabase Edge Functions" → Run workflow
# -----------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      function_name:
        description: 'Edge function to deploy (leave blank to deploy ALL)'
        required: false
        default: ''
      no_verify_jwt:
        description: 'Disable JWT verification? (yes for public endpoints)'
        required: false
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'yes'

jobs:
  deploy:
    name: Deploy edge functions
    runs-on: ubuntu-latest

    steps:
      - name: Check required secrets
        id: check
        run: |
          missing=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$SUPABASE_PROJECT_REF"  ] && missing="$missing SUPABASE_PROJECT_REF"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing"
            echo "::notice::Add these at: GitHub repo → Settings → Secrets → Actions"
            exit 1
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy — single function
        if: ${{ github.event.inputs.function_name != '' }}
        run: |
          JWT_FLAG=""
          [ "${{ github.event.inputs.no_verify_jwt }}" = "yes" ] && JWT_FLAG="--no-verify-jwt"
          supabase functions deploy "${{ github.event.inputs.function_name }}" \
            --project-ref "$SUPABASE_PROJECT_REF" \
            $JWT_FLAG
          echo "✅ Deployed: ${{ github.event.inputs.function_name }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Deploy — all functions
        if: ${{ github.event.inputs.function_name == '' }}
        run: |
          cd supabase/functions
          for fn in */; do
            fn="${fn%/}"
            # Skip shared helpers (they are not deployable standalone)
            [ "$fn" = "_shared" ] && continue
            echo "→ Deploying $fn …"
            supabase functions deploy "$fn" \
              --project-ref "$SUPABASE_PROJECT_REF" || {
              echo "::warning::Failed to deploy $fn – continuing"
            }
          done
          echo "✅ All functions processed."
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}
