name: Database — Apply Migrations (db push)

# ⚠️ SCHEMA GOVERNANCE
# This workflow pushes SQL migrations directly to the production database.
# It is triggered manually (workflow_dispatch) only.
#
# REQUIRED BEFORE RUNNING:
# 1. The PR containing the migration must have been reviewed and approved by @DonSquires
# 2. docs/LIVE_SCHEMA.md must have been updated in that same PR
# 3. src/types/database.ts and src/types/index.ts must pass `npx tsc -b --noEmit`
#
# The workflow runs in the "production-schema" environment which requires
# a manual approval from @DonSquires before the push step executes.
# Configure the environment at: Settings → Environments → production-schema
#
# Required secrets:
#   SUPABASE_DB_PASSWORD    — Database password for the linked project
#   SUPABASE_PROJECT_REF    — Supabase project reference ID
#
# Optional secret:
#   SUPABASE_ACCESS_TOKEN   — Supabase personal access token (sbp_…)
#                             Used for linked mode (supabase link + migration repair/list).
#                             If omitted/invalid, workflow falls back to direct DB URL mode.
#   SUPABASE_DB_URL         — Full Postgres connection string from Supabase Dashboard.
#                             Recommended for direct mode to avoid host/user guesswork.
#   SUPABASE_DB_POOLER_HOST — Optional pooler host override (if SUPABASE_DB_URL is not set).
#   SUPABASE_DB_USER        — Optional DB username override (if SUPABASE_DB_URL is not set).

on:
  workflow_dispatch:
    inputs:
      confirmed:
        description: "I have reviewed and approved the migration PR and updated docs/LIVE_SCHEMA.md"
        required: true
        type: boolean
        default: false

env:
  # supabase/setup-cli@v1 still bundles Node.js 20; force the runner to use
  # Node.js 24 so the action keeps working after the June 2026 cut-over.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Gate: abort immediately if the operator did not explicitly confirm
  confirm_approval:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require explicit confirmation
        if: ${{ !inputs.confirmed }}
        run: |
          echo "::error::You must tick the 'confirmed' checkbox to acknowledge schema governance requirements."
          exit 1

  db_push:
    needs: confirm_approval
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: production-schema   # requires manual approval from @DonSquires in GitHub UI
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate required secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          missing=0
          for var in SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Missing required secret: $var"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN is not set; workflow will use direct DB URL mode."
          fi

          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] && [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::warning::SUPABASE_DB_URL is not set; workflow will build a fallback pooler URL from other secrets."
          fi

      - name: Link project
        id: link-project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          supabase --version
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "ℹ️  Skipping supabase link (no SUPABASE_ACCESS_TOKEN)."
            echo "linked_mode=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"; then
            echo "::warning::supabase link failed (likely Unauthorized token). Falling back to direct DB URL mode."
            echo "linked_mode=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "linked_mode=true" >> "$GITHUB_OUTPUT"

      - name: Repair legacy migration history drift
        if: steps.link-project.outputs.linked_mode == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          # Known legacy migration versions that exist on remote as short-form entries
          # (date-only, no timestamp) but map to full timestamped local files.
          # Repair is safe and idempotent; each call is a no-op if the version is absent.
          # Keep this list aligned with scripts/migration-utils.sh and
          # docs/MIGRATION_TROUBLESHOOTING.md.
          for version in 20250127 20260309 20260312 20260313 20260315 20260316 20260317 20260318 20260319 20260320 20260321 20260323 20260326; do
            supabase migration repair --status reverted "$version" || true
          done

      - name: Apply migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_POOLER_HOST: ${{ secrets.SUPABASE_DB_POOLER_HOST }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
        run: |
          set -euo pipefail

          LOG_FILE="$(mktemp)"

          if [ "${{ steps.link-project.outputs.linked_mode }}" != "true" ]; then
            echo "ℹ️  Running db push in direct DB URL mode (no Supabase API token)."

            CANDIDATE_URLS=()
            CANDIDATE_LABELS=()

            if [ -n "${SUPABASE_DB_URL:-}" ]; then
              CANDIDATE_URLS+=("$SUPABASE_DB_URL")
              CANDIDATE_LABELS+=("secret:SUPABASE_DB_URL")
            else
              ENCODED_DB_PASSWORD="$(node -e 'console.log(encodeURIComponent(process.argv[1]))' "$SUPABASE_DB_PASSWORD")"

              CANDIDATE_HOSTS=()
              if [ -n "${SUPABASE_DB_POOLER_HOST:-}" ]; then
                CANDIDATE_HOSTS+=("$SUPABASE_DB_POOLER_HOST")
              else
                CANDIDATE_HOSTS+=(
                  "aws-0-ap-southeast-2.pooler.supabase.com"
                  "aws-1-ap-southeast-2.pooler.supabase.com"
                )
              fi

              EFFECTIVE_PROJECT_REF="$SUPABASE_PROJECT_REF"
              if [[ "${SUPABASE_URL:-}" =~ ^https?://([^.]+)\.supabase\.co/?$ ]]; then
                URL_REF="${BASH_REMATCH[1]}"
                if [ "$URL_REF" != "$SUPABASE_PROJECT_REF" ]; then
                  echo "::warning::SUPABASE_PROJECT_REF differs from SUPABASE_URL project ref; trying URL-derived project ref first."
                  EFFECTIVE_PROJECT_REF="$URL_REF"
                fi
              fi

              CANDIDATE_USERS=()
              if [ -n "${SUPABASE_DB_USER:-}" ]; then
                CANDIDATE_USERS+=("$SUPABASE_DB_USER")
              fi
              CANDIDATE_USERS+=("postgres.${EFFECTIVE_PROJECT_REF}" "postgres.${SUPABASE_PROJECT_REF}" "postgres")

              for db_host in "${CANDIDATE_HOSTS[@]}"; do
                for db_user in "${CANDIDATE_USERS[@]}"; do
                  for db_port in 5432 6543; do
                    CANDIDATE_URLS+=("postgresql://${db_user}:${ENCODED_DB_PASSWORD}@${db_host}:${db_port}/postgres?sslmode=require")
                    CANDIDATE_LABELS+=("host=${db_host},user=${db_user},port=${db_port},mode=default")

                    CANDIDATE_URLS+=("postgresql://${db_user}:${ENCODED_DB_PASSWORD}@${db_host}:${db_port}/postgres?sslmode=require&default_query_exec_mode=simple_protocol")
                    CANDIDATE_LABELS+=("host=${db_host},user=${db_user},port=${db_port},mode=simple-protocol")
                  done
                done
              done
            fi

            candidate_count="${#CANDIDATE_URLS[@]}"
            for i in "${!CANDIDATE_URLS[@]}"; do
              DB_URL="${CANDIDATE_URLS[$i]}"
              DB_LABEL="${CANDIDATE_LABELS[$i]}"
              echo "Trying direct DB candidate $((i + 1))/${candidate_count} (${DB_LABEL})"

              for attempt in 1 2 3; do
                if [ "$attempt" -eq 1 ]; then
                  echo "supabase db push --db-url <candidate> --yes attempt $attempt..."
                  if supabase db push --db-url "$DB_URL" --yes 2>&1 | tee "$LOG_FILE"; then
                    echo "Migration push succeeded in direct mode on attempt $attempt"
                    echo "EFFECTIVE_SUPABASE_DB_URL=$DB_URL" >> "$GITHUB_ENV"
                    exit 0
                  fi
                else
                  echo "supabase db push --db-url <candidate> --include-all --yes attempt $attempt..."
                  if supabase db push --db-url "$DB_URL" --include-all --yes 2>&1 | tee "$LOG_FILE"; then
                    echo "Migration push succeeded in direct mode on attempt $attempt"
                    echo "EFFECTIVE_SUPABASE_DB_URL=$DB_URL" >> "$GITHUB_ENV"
                    exit 0
                  fi
                fi

                if grep -q "Tenant or user not found" "$LOG_FILE"; then
                  echo "ℹ️  Candidate rejected by tenant/user routing; trying next candidate."
                  break
                fi

                if grep -Eaq 'prepared statement ".*" already exists|SQLSTATE 42P05' "$LOG_FILE"; then
                  echo "ℹ️  Candidate hit prepared-statement pooler conflict; trying next candidate."
                  break
                fi

                if grep -q "Remote migration versions not found in local migrations directory" "$LOG_FILE"; then
                  echo "⚠️  Candidate connected, but remote migration history drift was detected."

                  REVERT_VERSIONS=$(grep -oE 'supabase migration repair --status reverted [0-9 ]+' "$LOG_FILE" | sed -E 's/^supabase migration repair --status reverted //' | head -n1)
                  if [ -n "${REVERT_VERSIONS:-}" ]; then
                    echo "Attempting drift repair in direct mode: $REVERT_VERSIONS"
                    repair_ok=false

                    # Prefer direct DB URL repair when available.
                    # shellcheck disable=SC2086
                    if supabase migration repair --db-url "$DB_URL" --status reverted $REVERT_VERSIONS; then
                      repair_ok=true
                    else
                      echo "ℹ️  --db-url migration repair failed; trying linked repair fallback."
                    fi

                    if [ "$repair_ok" = false ]; then
                      # shellcheck disable=SC2086
                      if supabase migration repair --linked -p "$SUPABASE_DB_PASSWORD" --status reverted $REVERT_VERSIONS; then
                        repair_ok=true
                      else
                        echo "ℹ️  Linked migration repair unavailable; trying SQL fallback."
                      fi
                    fi

                    if [ "$repair_ok" = false ] && command -v psql >/dev/null 2>&1; then
                      versions_quoted=$(echo "$REVERT_VERSIONS" | awk '{for (i=1; i<=NF; i++) printf "%s\047%s\047", (i==1?"":","), $i}')
                      if [ -n "${versions_quoted:-}" ]; then
                        if psql "$DB_URL" -v ON_ERROR_STOP=1 -c "DELETE FROM supabase_migrations.schema_migrations WHERE version::text IN (${versions_quoted});"; then
                          repair_ok=true
                        fi
                      fi
                    fi

                    if [ "$repair_ok" = false ]; then
                      echo "::error::Could not execute migration repair in direct mode."
                      echo "Set SUPABASE_ACCESS_TOKEN for linked-mode repair or provide a valid SUPABASE_DB_URL with migration repair support."
                      exit 1
                    fi

                    echo "Retrying include-all push after drift repair..."
                    if supabase db push --db-url "$DB_URL" --include-all --yes 2>&1 | tee "$LOG_FILE"; then
                      echo "Migration push succeeded in direct mode after drift repair"
                      echo "EFFECTIVE_SUPABASE_DB_URL=$DB_URL" >> "$GITHUB_ENV"
                      exit 0
                    fi

                    if grep -q "Remote migration versions not found in local migrations directory" "$LOG_FILE"; then
                      echo "::error::Remote migration drift is still present after attempted repair."
                      echo "Set SUPABASE_ACCESS_TOKEN so linked-mode migration repair can run automatically,"
                      echo "or run the suggested 'supabase migration repair --status reverted ...' command manually."
                      exit 1
                    fi

                    echo "::error::db push failed after drift repair, but not because of migration history drift."
                    cat "$LOG_FILE"
                    exit 1
                  fi

                  echo "::error::Remote migration drift detected while using direct DB mode."
                  echo "Set SUPABASE_ACCESS_TOKEN so linked-mode migration repair can run automatically,"
                  echo "or run the suggested 'supabase migration repair --status reverted ...' command manually."
                  exit 1
                fi
              done
            done

            if grep -Eaq 'prepared statement ".*" already exists|SQLSTATE 42P05' "$LOG_FILE"; then
              echo "::error::Supabase direct DB connection hit prepared-statement pooler conflicts for all candidates."
              echo "Set SUPABASE_DB_URL to the exact Session pooler URI from Supabase Dashboard, or include default_query_exec_mode=simple_protocol in the URI."
            elif grep -q "Remote migration versions not found in local migrations directory" "$LOG_FILE"; then
              echo "::error::Remote migration history drift detected in direct mode."
              echo "Set SUPABASE_ACCESS_TOKEN so linked-mode repair can run automatically, or repair manually as suggested in logs."
            elif grep -q "Tenant or user not found" "$LOG_FILE"; then
              echo "::error::Supabase direct DB connection rejected for all generated candidates."
              echo "Set SUPABASE_DB_URL to the exact connection string from Supabase Dashboard -> Connect -> Transaction pooler."
              echo "Alternatively set SUPABASE_DB_POOLER_HOST and SUPABASE_DB_USER to the exact values for this project."
            fi

            echo "supabase db push failed in direct DB URL mode after retries"
            cat "$LOG_FILE"
            exit 1
          fi

          # First try a normal push to avoid include-all replay behavior on some
          # remote histories. Fall back to --include-all on later attempts when
          # reconciliation is needed.
          for attempt in 1 2 3 4 5; do
            if [ "$attempt" -eq 1 ]; then
              PUSH_CMD="supabase db push --yes"
            else
              PUSH_CMD="supabase db push --include-all --yes"
            fi

            echo "$PUSH_CMD attempt $attempt..."
            if $PUSH_CMD 2>&1 | tee "$LOG_FILE"; then
              echo "Migration push succeeded on attempt $attempt"
              supabase migration list || true
              exit 0
            fi

            handled=false

            # Case 1: remote-only versions absent from local migration folder.
            if grep -q "Remote migration versions not found in local migrations directory" "$LOG_FILE"; then
              REVERT_VERSIONS=$(grep -oE 'supabase migration repair --status reverted [0-9 ]+' "$LOG_FILE" | sed -E 's/^supabase migration repair --status reverted //' | head -n1)
              if [ -n "${REVERT_VERSIONS:-}" ]; then
                echo "Reverting remote-only migration versions: $REVERT_VERSIONS"
                # shellcheck disable=SC2086
                supabase migration repair --status reverted $REVERT_VERSIONS || true
                handled=true
              fi
            fi

            # Case 2: out-of-order local files detected by CLI.
            if grep -q "Found local migration files to be inserted before the last migration on remote database" "$LOG_FILE"; then
              echo "Detected out-of-order local migrations. Marking listed versions as applied..."
              grep -oE 'supabase/migrations/[0-9][^[:space:]]*\.sql' "$LOG_FILE" \
                | sed 's#supabase/migrations/##; s#\.sql$##' \
                | awk -F'_' '{print $1}' \
                | sort -u \
                | while read -r version; do
                    if [ -n "$version" ]; then
                      echo "Marking migration as applied: $version"
                      supabase migration repair --status applied "$version" || true
                    fi
                  done
              handled=true
            fi

            # Case 3: duplicate insert in migration history table.
            # Some CLI versions format this differently; match broadly and
            # recover using either the explicit key or the currently applying
            # migration filename.
            if grep -Eaq 'schema_migrations_pkey|Key \(version\)=\([0-9]+\) already exists|SQLSTATE 23505' "$LOG_FILE"; then
              DUP_VERSION=$(grep -Eo 'Key \(version\)=\([0-9]+\)' "$LOG_FILE" | sed -E 's/.*\(([0-9]+)\).*/\1/' | head -n1)

              if [ -z "${DUP_VERSION:-}" ]; then
                DUP_VERSION=$(grep -Eo 'Applying migration [0-9]{8,14}_[^[:space:]]+\.sql' "$LOG_FILE" \
                  | sed -E 's/.* ([0-9]{8,14})_.*/\1/' \
                  | tail -n1)
              fi

              if [ -n "${DUP_VERSION:-}" ]; then
                echo "Detected duplicate schema_migrations version: $DUP_VERSION"
                echo "Repairing duplicate by marking version applied, then retrying..."
                supabase migration repair --status applied "$DUP_VERSION" || true
                handled=true
              fi
            fi

            if [ "$handled" = false ]; then
              echo "supabase db push failed for a non-reconciliation reason"
              cat "$LOG_FILE"
              exit 1
            fi
          done

          echo "supabase db push failed after reconciliation attempts"
          cat "$LOG_FILE"
          exit 1

      - name: Verify breach timestamp alignment
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          EFFECTIVE_SUPABASE_DB_URL: ${{ env.EFFECTIVE_SUPABASE_DB_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_POOLER_HOST: ${{ secrets.SUPABASE_DB_POOLER_HOST }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
        run: |
          set -euo pipefail

          if ! command -v psql >/dev/null 2>&1; then
            echo "::warning::psql is not available on this runner; skipping breach timestamp verification"
            exit 0
          fi

          if [ -n "${EFFECTIVE_SUPABASE_DB_URL:-}" ]; then
            DB_URI="$EFFECTIVE_SUPABASE_DB_URL"
          elif [ -n "${SUPABASE_DB_URL:-}" ]; then
            DB_URI="$SUPABASE_DB_URL"
          else
            DB_HOST="${SUPABASE_DB_POOLER_HOST:-aws-0-ap-southeast-2.pooler.supabase.com}"
            DB_USER="${SUPABASE_DB_USER:-postgres.${SUPABASE_PROJECT_REF}}"
            DB_URI="postgresql://${DB_USER}@${DB_HOST}:5432/postgres?sslmode=require"
          fi

          echo "Running post-migration breach timestamp alignment check..."
          if ! PGPASSWORD="$SUPABASE_DB_PASSWORD" psql "$DB_URI" -v ON_ERROR_STOP=1 <<'SQL'
          WITH direct_links AS (
            SELECT ba.id, ba.created_at, o.recorded_at AS expected_at
            FROM public.breach_alerts ba
            JOIN public.observations o ON o.observation_id = ba.observation_id
          ),
          detail_links AS (
            SELECT ba.id, ba.created_at, o.recorded_at AS expected_at
            FROM public.breach_alerts ba
            JOIN public.observations o
              ON o.observation_id::text = (ba.breach_details ->> 'observation_id')
            WHERE ba.observation_id IS NULL
          ),
          combined AS (SELECT * FROM direct_links UNION ALL SELECT * FROM detail_links),
          summary AS (
            SELECT
              COUNT(*)::bigint AS linked_rows,
              COUNT(*) FILTER (
                WHERE expected_at IS NOT NULL AND created_at IS NOT NULL
                  AND ABS(EXTRACT(EPOCH FROM (created_at - expected_at))) <= 300
              )::bigint AS aligned_rows,
              COUNT(*) FILTER (
                WHERE expected_at IS NOT NULL AND created_at IS NOT NULL
                  AND ABS(EXTRACT(EPOCH FROM (created_at - expected_at))) > 300
              )::bigint AS misaligned_rows
            FROM combined
          )
          SELECT
            linked_rows, aligned_rows, misaligned_rows,
            CASE WHEN linked_rows = 0 THEN 0
                 ELSE ROUND((aligned_rows::numeric * 100.0) / linked_rows, 2)
            END AS aligned_percent
          FROM summary;
          SQL
          then
            echo "::warning::Breach timestamp verification query could not run from this runner; skipping (db push already applied)"
            exit 0
          fi

          echo "Breach timestamp alignment check complete."
