name: Monthly Governance Checkpoint

on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

jobs:
  monthly-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Lint warning budget gate
        id: lint_warning_budget
        continue-on-error: true
        run: bun run lint:warning-budget

      - name: Enforce lint warning budget gate (strict mode)
        if: steps.lint_warning_budget.outcome == 'failure' && vars.LINT_WARNING_BUDGET_STRICT == 'true'
        run: |
          echo "::error::Lint warning budget gate failed and strict mode is enabled (LINT_WARNING_BUDGET_STRICT=true)."
          exit 1

      - name: Report lint warning budget gate (non-strict)
        if: steps.lint_warning_budget.outcome == 'failure' && vars.LINT_WARNING_BUDGET_STRICT != 'true'
        run: |
          echo "::warning::Lint warning budget gate failed but strict mode is disabled; continuing."

      - name: Staging doc presence and freshness gate
        env:
          STAGING_MAX_AGE_DAYS: '14'
        run: bun run lint:staging-doc

      - name: Bob governance drift gate
        env:
          BOB_GOVERNANCE_DRIFT_STRICT: 'true'
        run: bun run lint:bob-governance-drift

      - name: Resolve required P0 workflow IDs
        id: required-workflows
        run: |
          echo "ids=$(node scripts/get-workflow-ids.mjs --criticality P0)" >> "$GITHUB_OUTPUT"

      - name: Build gate
        run: bun run build

      - name: Generate route-role matrix artifact
        run: |
          bun run roadmap:route-matrix -- --out tools/route-role-matrix/monthly/${{ github.run_id }}/route-role-matrix.json

      - name: Roadmap grounding strict gate
        run: |
          node scripts/validate-roadmap-grounding.mjs --strict --matrix tools/route-role-matrix/monthly/${{ github.run_id }}/route-role-matrix.json

      - name: Roadmap role-gate strict validation
        run: |
          node scripts/validate-roadmap-role-gates.mjs --strict --matrix tools/route-role-matrix/monthly/${{ github.run_id }}/route-role-matrix.json

      - name: Generate module grounding artifact
        run: |
          bun run roadmap:module-grounding -- --out tools/module-grounding/monthly/${{ github.run_id }}/module-grounding-report.json

      - name: Module grounding strict validation
        run: |
          node scripts/validate-module-grounding.mjs --strict --report tools/module-grounding/monthly/${{ github.run_id }}/module-grounding-report.json

      - name: Collect monthly governance evidence
        run: |
          bun run evidence:workflow --workflow "${{ steps.required-workflows.outputs.ids }}" --status monthly-checkpoint --notes "monthly-governance-checkpoint:${{ github.run_id }}" --out-dir tools/workflow-evidence/monthly/${{ github.run_id }}

      - name: Validate monthly governance evidence
        run: |
          bun run evidence:workflow:validate -- --dir tools/workflow-evidence/monthly/${{ github.run_id }} --required "${{ steps.required-workflows.outputs.ids }}"

      - name: Generate monthly governance run summary JSON
        run: |
          bun run governance:summary -- --gate monthly-governance --requiredIds "${{ steps.required-workflows.outputs.ids }}" --evidenceDir tools/workflow-evidence/monthly/${{ github.run_id }} --matrixDir tools/route-role-matrix/monthly/${{ github.run_id }} --out tools/governance-run-summaries/monthly/${{ github.run_id }}/run-summary.json --strict-route-roadmap --strict-roadmap-grounding

      - name: Upload monthly governance artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: monthly-governance-evidence-${{ github.run_id }}
          path: tools/workflow-evidence/monthly/${{ github.run_id }}
          if-no-files-found: error

      - name: Upload monthly route-role matrix artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: monthly-route-role-matrix-${{ github.run_id }}
          path: tools/route-role-matrix/monthly/${{ github.run_id }}
          if-no-files-found: error

      - name: Upload monthly module grounding artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: monthly-module-grounding-${{ github.run_id }}
          path: tools/module-grounding/monthly/${{ github.run_id }}
          if-no-files-found: error

      - name: Upload monthly governance run summary artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: monthly-governance-run-summary-${{ github.run_id }}
          path: tools/governance-run-summaries/monthly/${{ github.run_id }}
          if-no-files-found: error

      - name: Publish checkpoint summary
        if: always()
        run: |
          echo "## Monthly Governance Checkpoint" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build gate: completed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Lint warning budget gate: completed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Staging doc presence/freshness gate: completed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Evidence IDs validated: ${{ steps.required-workflows.outputs.ids }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Canonical record: docs/ENTERPRISE_PAIR_REVIEW_CANONICAL.md" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact path: tools/workflow-evidence/monthly/${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Route-role matrix path: tools/route-role-matrix/monthly/${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Module grounding path: tools/module-grounding/monthly/${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Governance summary path: tools/governance-run-summaries/monthly/${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
