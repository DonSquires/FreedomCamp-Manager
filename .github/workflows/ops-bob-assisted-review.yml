name: Ops - Bob Assisted Review

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ops-bob-assisted-review.yml
      - .github/workflows/deploy-bob-railway.yml
      - inference-service/server.js
  workflow_dispatch:
    inputs:
      prompt:
        description: Review prompt to send to Bob
        required: true
        default: "Review recent RunPod and Ollama workflow changes for security and regression risks."

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  bob-review:
    name: Bob Assisted Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Validate auth secret
        env:
          INFERENCE_API_KEY: ${{ secrets.INFERENCE_API_KEY }}
          BOB_INFERENCE_API_KEY: ${{ secrets.BOB_INFERENCE_API_KEY }}
        run: |
          set -e
          if [ -z "$INFERENCE_API_KEY" ] && [ -z "$BOB_INFERENCE_API_KEY" ]; then
            echo "::error::Missing secret: set INFERENCE_API_KEY or BOB_INFERENCE_API_KEY"
            exit 1
          fi

      - name: Run Bob review query
        env:
          INFERENCE_SERVICE_URL: ${{ secrets.INFERENCE_SERVICE_URL }}
          INFERENCE_API_KEY: ${{ secrets.INFERENCE_API_KEY }}
          BOB_INFERENCE_API_KEY: ${{ secrets.BOB_INFERENCE_API_KEY }}
          REVIEW_PROMPT: ${{ inputs.prompt }}
        run: |
          set -euo pipefail
          URL_RAW="${INFERENCE_SERVICE_URL:-https://focused-courage-production-ccee.up.railway.app}"
          REVIEW_PROMPT_EFFECTIVE="${REVIEW_PROMPT:-Review recent RunPod and Ollama workflow changes for security and regression risks.}"
          echo "Using inference URL (raw): $URL_RAW"
          AUTH_KEY="${INFERENCE_API_KEY:-${BOB_INFERENCE_API_KEY:-}}"

          URL_RAW="$URL_RAW" AUTH_KEY="$AUTH_KEY" REVIEW_PROMPT="$REVIEW_PROMPT_EFFECTIVE" node - <<'NODE' | tee bob-assisted-review.log
          const https = require('https');

          const defaultUrl = 'https://focused-courage-production-ccee.up.railway.app';
          const rawUrl = String(process.env.URL_RAW || '').trim();
          const apiKey = process.env.AUTH_KEY;
          const prompt = process.env.REVIEW_PROMPT;

          let normalizedUrl = rawUrl || defaultUrl;
          if (!/^https?:\/\//i.test(normalizedUrl)) {
            normalizedUrl = `https://${normalizedUrl}`;
          }

          let endpoint;
          try {
            endpoint = new URL(normalizedUrl);
          } catch {
            console.warn(`[Warn] Invalid INFERENCE_SERVICE_URL, falling back to default: ${defaultUrl}`);
            normalizedUrl = defaultUrl;
            endpoint = new URL(normalizedUrl);
          }

          console.log(`[Agent] Calling Bob at ${normalizedUrl}`);

          const body = JSON.stringify({ message: prompt });

          const options = {
            hostname: endpoint.hostname,
            port: endpoint.port || 443,
            path: '/chat',
            method: 'POST',
            timeout: 30000,
            headers: {
              'Content-Type': 'application/json',
              'Content-Length': Buffer.byteLength(body),
              'x-inference-api-key': apiKey,
              Authorization: `Bearer ${apiKey}`,
            },
          };

          const req = https.request(options, (res) => {
            let data = '';
            res.on('data', (chunk) => {
              data += chunk;
            });
            res.on('end', () => {
              let parsed = null;
              try {
                parsed = JSON.parse(data || '{}');
              } catch {
                parsed = null;
              }

              if (res.statusCode < 200 || res.statusCode >= 300) {
                const detail = parsed ? JSON.stringify(parsed) : data;
                console.error(`[Error] HTTP ${res.statusCode}: ${detail.slice(0, 1000)}`);
                process.exit(1);
              }

              const message = parsed?.message || parsed?.response || parsed?.data?.message || data;
              console.log(`[Bob] ${String(message || '').trim()}`);
            });
          });

          req.on('timeout', () => {
            req.destroy(new Error('Request timeout'));
          });

          req.on('error', (err) => {
            console.error(`[Error] ${err.message}`);
            process.exit(1);
          });

          req.write(body);
          req.end();
          NODE

      - name: Publish summary
        run: |
          {
            echo "## Bob Assisted Review"
            echo ""
            echo "- Prompt: ${{ inputs.prompt }}"
            echo ""
            echo "### Output"
            echo '```text'
            cat bob-assisted-review.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
