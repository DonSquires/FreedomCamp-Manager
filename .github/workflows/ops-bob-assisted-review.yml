name: Ops - Bob Assisted Review

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ops-bob-assisted-review.yml
      - .github/workflows/deploy-bob-railway.yml
      - inference-service/server.js
  workflow_dispatch:
    inputs:
      prompt:
        description: Review prompt to send to Bob
        required: true
        default: "Review .github/workflows/deploy-bob-railway.yml changes for direct RunPod 11434 routing and fallback logic. Return exactly 3 concrete regression/security risks and one test per risk."

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  bob-review:
    name: Bob Assisted Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Validate auth secret
        env:
          INFERENCE_API_KEY: ${{ secrets.INFERENCE_API_KEY }}
          BOB_INFERENCE_API_KEY: ${{ secrets.BOB_INFERENCE_API_KEY }}
        run: |
          set -e
          if [ -z "$INFERENCE_API_KEY" ] && [ -z "$BOB_INFERENCE_API_KEY" ]; then
            echo "::error::Missing secret: set INFERENCE_API_KEY or BOB_INFERENCE_API_KEY"
            exit 1
          fi

      - name: Run Bob review query
        env:
          INFERENCE_SERVICE_URL: ${{ secrets.INFERENCE_SERVICE_URL }}
          BOB_SERVICE_URL: ${{ secrets.BOB_SERVICE_URL }}
          INFERENCE_API_KEY: ${{ secrets.INFERENCE_API_KEY }}
          BOB_INFERENCE_API_KEY: ${{ secrets.BOB_INFERENCE_API_KEY }}
          REVIEW_PROMPT: ${{ inputs.prompt }}
        run: |
          set -euo pipefail
          URL_RAW="${INFERENCE_SERVICE_URL:-https://focused-courage-production-ccee.up.railway.app}"
          BOB_URL_RAW="${BOB_SERVICE_URL:-}"
          REVIEW_PROMPT_EFFECTIVE="${REVIEW_PROMPT:-Review .github/workflows/deploy-bob-railway.yml changes for direct RunPod 11434 routing and fallback logic. Return exactly 3 concrete regression/security risks and one test per risk.}"
          echo "Using inference URL (raw): $URL_RAW"
          AUTH_KEY="${INFERENCE_API_KEY:-${BOB_INFERENCE_API_KEY:-}}"

          URL_RAW="$URL_RAW" BOB_URL_RAW="$BOB_URL_RAW" AUTH_KEY="$AUTH_KEY" REVIEW_PROMPT="$REVIEW_PROMPT_EFFECTIVE" node - <<'NODE' | tee bob-assisted-review.log
          const https = require('https');

          const defaultUrl = 'https://focused-courage-production-ccee.up.railway.app';
          const rawUrl = String(process.env.URL_RAW || '').trim();
          const bobRawUrl = String(process.env.BOB_URL_RAW || '').trim();
          const apiKey = process.env.AUTH_KEY;
          const prompt = process.env.REVIEW_PROMPT;

          function normalizeUrl(input) {
            const value = String(input || '').trim();
            if (!value) return null;
            const withScheme = /^https?:\/\//i.test(value) ? value : `https://${value}`;
            try {
              return new URL(withScheme).toString().replace(/\/$/, '');
            } catch {
              return null;
            }
          }

          function callBob(endpointBase) {
            return new Promise((resolve, reject) => {
              const endpoint = new URL(endpointBase);
              const body = JSON.stringify({ message: prompt });
              const options = {
                hostname: endpoint.hostname,
                port: endpoint.port || 443,
                path: '/chat',
                method: 'POST',
                timeout: 45000,
                headers: {
                  'Content-Type': 'application/json',
                  'Content-Length': Buffer.byteLength(body),
                  'x-inference-api-key': apiKey,
                  Authorization: `Bearer ${apiKey}`,
                },
              };

              const req = https.request(options, (res) => {
                let data = '';
                res.on('data', (chunk) => {
                  data += chunk;
                });
                res.on('end', () => {
                  let parsed = null;
                  try {
                    parsed = JSON.parse(data || '{}');
                  } catch {
                    parsed = null;
                  }

                  if (res.statusCode < 200 || res.statusCode >= 300) {
                    const detail = parsed ? JSON.stringify(parsed) : data;
                    return reject(new Error(`HTTP ${res.statusCode}: ${detail.slice(0, 1000)}`));
                  }

                  const message = parsed?.message || parsed?.response || parsed?.data?.message || data;
                  return resolve(String(message || '').trim());
                });
              });

              req.on('timeout', () => {
                req.destroy(new Error('Request timeout'));
              });

              req.on('error', (err) => {
                reject(err);
              });

              req.write(body);
              req.end();
            });
          }

          const candidates = [normalizeUrl(rawUrl), normalizeUrl(bobRawUrl), defaultUrl]
            .filter(Boolean)
            .filter((value, index, arr) => arr.indexOf(value) === index);

          let lastError = null;
          (async () => {
            for (const endpointBase of candidates) {
              for (let attempt = 1; attempt <= 3; attempt += 1) {
                try {
                  console.log(`[Agent] Calling Bob at ${endpointBase} (attempt ${attempt}/3)`);
                  const result = await callBob(endpointBase);
                  console.log(`[Bob] ${result}`);
                  process.exit(0);
                } catch (error) {
                  lastError = error;
                  console.error(`[Warn] Bob call failed at ${endpointBase} (attempt ${attempt}/3): ${error.message}`);
                }
              }
            }

            console.error(`[Error] All Bob endpoints failed: ${lastError ? lastError.message : 'unknown error'}`);
            process.exit(1);
          })();
          NODE

      - name: Publish summary
        run: |
          {
            echo "## Bob Assisted Review"
            echo ""
            echo "- Prompt: ${{ inputs.prompt }}"
            echo ""
            echo "### Output"
            echo '```text'
            cat bob-assisted-review.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
