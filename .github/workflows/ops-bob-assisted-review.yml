name: Ops - Bob Assisted Review

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ops-bob-assisted-review.yml
      - .github/workflows/deploy-bob-railway.yml
      - inference-service/server.js
  workflow_dispatch:
    inputs:
      prompt:
        description: Review prompt to send to Bob
        required: true
        default: "Review .github/workflows/deploy-bob-railway.yml changes for direct RunPod 11434 routing and fallback logic. Return exactly 3 concrete regression/security risks and one test per risk."

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  bob-review:
    name: Bob Assisted Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Validate auth secret
        env:
          INFERENCE_API_KEY: ${{ secrets.INFERENCE_API_KEY }}
          BOB_INFERENCE_API_KEY: ${{ secrets.BOB_INFERENCE_API_KEY }}
          INFERENCE_SERVICE_URL: ${{ secrets.INFERENCE_SERVICE_URL }}
          BOB_SERVICE_URL: ${{ secrets.BOB_SERVICE_URL }}
        run: |
          set -e
          if [ -z "$INFERENCE_API_KEY" ] && [ -z "$BOB_INFERENCE_API_KEY" ]; then
            echo "::error::Missing secret: set INFERENCE_API_KEY or BOB_INFERENCE_API_KEY"
            exit 1
          fi
          if [ -z "$INFERENCE_SERVICE_URL" ] && [ -z "$BOB_SERVICE_URL" ]; then
            echo "::error::Missing secret: set INFERENCE_SERVICE_URL or BOB_SERVICE_URL — refusing to default to hardcoded production URL"
            exit 1
          fi

      - name: Run Bob review query
        env:
          INFERENCE_SERVICE_URL: ${{ secrets.INFERENCE_SERVICE_URL }}
          BOB_SERVICE_URL: ${{ secrets.BOB_SERVICE_URL }}
          INFERENCE_API_KEY: ${{ secrets.INFERENCE_API_KEY }}
          BOB_INFERENCE_API_KEY: ${{ secrets.BOB_INFERENCE_API_KEY }}
          REVIEW_PROMPT: ${{ inputs.prompt }}
        run: |
          set -euo pipefail
          URL_RAW="${INFERENCE_SERVICE_URL:-${BOB_SERVICE_URL:-}}"
          BOB_URL_RAW="${BOB_SERVICE_URL:-}"
          if [[ -z "$URL_RAW" ]]; then
            echo "::error::INFERENCE_SERVICE_URL / BOB_SERVICE_URL not set — refusing to default to hardcoded production URL"
            exit 1
          fi
          REVIEW_PROMPT_EFFECTIVE="${REVIEW_PROMPT:-}"
          if [[ -z "${REVIEW_PROMPT_EFFECTIVE// }" ]]; then
            REVIEW_PROMPT_EFFECTIVE="Review .github/workflows/deploy-bob-railway.yml changes for direct RunPod 11434 routing and fallback logic. Return exactly 3 concrete regression/security risks and one test per risk."
          fi
          REVIEW_CONTEXT="$(sed -n '270,390p' .github/workflows/deploy-bob-railway.yml | tr '\n' ' ' | cut -c1-6000)"
          echo "Using inference URL (raw): $URL_RAW"
          AUTH_KEY="${INFERENCE_API_KEY:-${BOB_INFERENCE_API_KEY:-}}"

          URL_RAW="$URL_RAW" BOB_URL_RAW="$BOB_URL_RAW" AUTH_KEY="$AUTH_KEY" REVIEW_PROMPT="$REVIEW_PROMPT_EFFECTIVE" REVIEW_CONTEXT="$REVIEW_CONTEXT" node - <<'NODE' | tee bob-assisted-review.log
          const https = require('https');

          const rawUrl = String(process.env.URL_RAW || '').trim();
          const bobRawUrl = String(process.env.BOB_URL_RAW || '').trim();
          const apiKey = process.env.AUTH_KEY;
          const prompt = process.env.REVIEW_PROMPT;
          const context = String(process.env.REVIEW_CONTEXT || '').trim();
          if (!rawUrl && !bobRawUrl) {
            console.error('[Fatal] No Bob endpoint provided — INFERENCE_SERVICE_URL and BOB_SERVICE_URL are both empty');
            process.exit(1);
          }

          function normalizeUrl(input) {
            const value = String(input || '').trim();
            if (!value) return null;
            const withScheme = /^https?:\/\//i.test(value) ? value : `https://${value}`;
            try {
              return new URL(withScheme).toString().replace(/\/$/, '');
            } catch {
              return null;
            }
          }

          function callBob(endpointBase, promptMessage) {
            return new Promise((resolve, reject) => {
              const endpoint = new URL(endpointBase);
              const basePrompt = String(promptMessage || '').trim();
              const message = context ? `${basePrompt}\n\nRelevant snippet from deploy-bob-railway.yml:\n${context}` : basePrompt;
              const body = JSON.stringify({
                message,
                // Force model-generated review output instead of /chat training-intel shortcut.
                system_prompt: 'You are a strict CI code review assistant. Return concrete, testable findings only.',
              });
              const options = {
                hostname: endpoint.hostname,
                port: endpoint.port || 443,
                path: '/chat',
                method: 'POST',
                timeout: 45000,
                headers: {
                  'Content-Type': 'application/json',
                  'Content-Length': Buffer.byteLength(body),
                  'x-inference-api-key': apiKey,
                  Authorization: `Bearer ${apiKey}`,
                },
              };

              const req = https.request(options, (res) => {
                let data = '';
                res.on('data', (chunk) => {
                  data += chunk;
                });
                res.on('end', () => {
                  let parsed = null;
                  try {
                    parsed = JSON.parse(data || '{}');
                  } catch {
                    parsed = null;
                  }

                  if (res.statusCode < 200 || res.statusCode >= 300) {
                    const detail = parsed ? JSON.stringify(parsed) : data;
                    return reject(new Error(`HTTP ${res.statusCode}: ${detail.slice(0, 1000)}`));
                  }

                  const text = parsed?.message || parsed?.response || parsed?.data?.message || data;
                  return resolve({
                    message: String(text || '').trim(),
                    provider: String(parsed?.provider || ''),
                    fallback: parsed?.fallback === true,
                  });
                });
              });

              req.on('timeout', () => {
                req.destroy(new Error('Request timeout'));
              });

              req.on('error', (err) => {
                reject(err);
              });

              req.write(body);
              req.end();
            });
          }

          function callSelfHeal(endpointBase) {
            return new Promise((resolve, reject) => {
              const endpoint = new URL(endpointBase);
              const payload = {
                report: {
                  summary: 'Review deploy-bob-railway.yml RunPod direct routing + fallback changes for regressions and security risks',
                  severity: 'high',
                  service: 'inference-service',
                  stack_trace: 'Workflow-level infrastructure change; no runtime stack trace',
                  notes: context,
                },
              };
              const body = JSON.stringify(payload);

              const options = {
                hostname: endpoint.hostname,
                port: endpoint.port || 443,
                path: '/self-heal/bug-report',
                method: 'POST',
                timeout: 45000,
                headers: {
                  'Content-Type': 'application/json',
                  'Content-Length': Buffer.byteLength(body),
                  'x-inference-api-key': apiKey,
                  Authorization: `Bearer ${apiKey}`,
                },
              };

              const req = https.request(options, (res) => {
                let data = '';
                res.on('data', (chunk) => {
                  data += chunk;
                });
                res.on('end', () => {
                  let parsed = null;
                  try {
                    parsed = JSON.parse(data || '{}');
                  } catch {
                    parsed = null;
                  }

                  if (res.statusCode < 200 || res.statusCode >= 300) {
                    const detail = parsed ? JSON.stringify(parsed) : data;
                    return reject(new Error(`HTTP ${res.statusCode}: ${detail.slice(0, 1000)}`));
                  }

                  return resolve(parsed || data);
                });
              });

              req.on('timeout', () => {
                req.destroy(new Error('Request timeout'));
              });

              req.on('error', (err) => {
                reject(err);
              });

              req.write(body);
              req.end();
            });
          }

          function isGenericResponse(text) {
            const value = String(text || '').toLowerCase();
            if (!value) return true;
            return (
              value.includes('i can help with this') ||
              value.includes('share the exact symptom') ||
              value.includes('queued this question') ||
              value.includes('service is running in build-training mode')
            );
          }

          const prompts = [
            prompt,
            `${prompt}\nReturn strict JSON with keys: risks (array of 3 items), tests (array of 3 items). No preamble.`,
            `Code review task: identify exactly 3 concrete regressions or security risks introduced by recent edits in deploy-bob-railway.yml direct RunPod routing logic. For each, provide one deterministic validation test. Output as bullet list only.`,
          ];

          const candidates = [normalizeUrl(rawUrl), normalizeUrl(bobRawUrl)]
            .filter(Boolean)
            .filter((value, index, arr) => arr.indexOf(value) === index);

          let lastError = null;
          (async () => {
            for (const endpointBase of candidates) {
              for (const promptVariant of prompts) {
                for (let attempt = 1; attempt <= 3; attempt += 1) {
                  try {
                    console.log(`[Agent] Calling Bob at ${endpointBase} (attempt ${attempt}/3)`);
                    const result = await callBob(endpointBase, promptVariant || prompt);
                    const provider = String(result.provider || '').toLowerCase();
                    if (provider !== 'ollama' || result.fallback === true) {
                      lastError = new Error(`Non-strict Bob response: provider=${provider || 'unknown'} fallback=${String(result.fallback)}`);
                      console.error(`[Warn] Bob returned provider=${provider || 'unknown'} fallback=${String(result.fallback)} at ${endpointBase} (attempt ${attempt}/3); retrying`);
                      continue;
                    }
                    if (isGenericResponse(result.message)) {
                      lastError = new Error('Generic/non-actionable response');
                      console.error(`[Warn] Bob returned generic response at ${endpointBase} (attempt ${attempt}/3); retrying with stricter prompt`);
                      continue;
                    }
                    console.log(`[Bob] provider=${provider} fallback=${String(result.fallback)}`);
                    console.log(`[Bob] ${result.message}`);
                    process.exit(0);
                  } catch (error) {
                    lastError = error;
                    console.error(`[Warn] Bob call failed at ${endpointBase} (attempt ${attempt}/3): ${error.message}`);
                  }
                }
              }
            }

            for (const endpointBase of candidates) {
              try {
                console.log(`[Agent] Falling back to self-heal review at ${endpointBase}`);
                const selfHeal = await callSelfHeal(endpointBase);
                console.log(`[Bob] Self-heal review fallback: ${JSON.stringify(selfHeal).slice(0, 3000)}`);
                process.exit(0);
              } catch (error) {
                lastError = error;
                console.error(`[Warn] Self-heal fallback failed at ${endpointBase}: ${error.message}`);
              }
            }

            console.error(`[Error] All Bob endpoints failed: ${lastError ? lastError.message : 'unknown error'}`);
            process.exit(1);
          })();
          NODE

      - name: Publish summary
        run: |
          {
            echo "## Bob Assisted Review"
            echo ""
            echo "- Prompt: ${{ inputs.prompt }}"
            echo ""
            echo "### Output"
            echo '```text'
            cat bob-assisted-review.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
