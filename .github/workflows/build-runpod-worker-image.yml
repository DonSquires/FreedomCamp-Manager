name: Build RunPod Worker Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/proxy-auth-env-fallback-20260524
    paths:
      - runpod-worker/**
      - .github/workflows/build-runpod-worker-image.yml

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image owner
        id: owner
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=$OWNER_LOWER" >> "$GITHUB_OUTPUT"

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: ./runpod-worker
          file: ./runpod-worker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/freedomcamp-manager-ai:${{ github.sha }}
            ghcr.io/${{ steps.owner.outputs.owner }}/freedomcamp-manager-ai:latest
          provenance: false
          sbom: false
