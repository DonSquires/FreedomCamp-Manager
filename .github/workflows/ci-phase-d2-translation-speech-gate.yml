name: CI Phase D2 Translation/Speech Gate

# Path-filtered gate for D2 translation/speech runtime boundaries and degraded-mode controls.

on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/e2e/phase-d2-translation-speech-boundaries.spec.ts'
      - 'supabase/functions/translate-message/index.ts'
      - 'supabase/functions/synthesize-speech/index.ts'
      - 'supabase/functions/transcribe-audio/index.ts'
      - 'supabase/functions/speech-to-intent/index.ts'
      - 'tests/e2e/setup.ts'
      - 'playwright.api.config.ts'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/ci-phase-d2-translation-speech-gate.yml'
  push:
    branches: [main]
    paths:
      - 'tests/e2e/phase-d2-translation-speech-boundaries.spec.ts'
      - 'supabase/functions/translate-message/index.ts'
      - 'supabase/functions/synthesize-speech/index.ts'
      - 'supabase/functions/transcribe-audio/index.ts'
      - 'supabase/functions/speech-to-intent/index.ts'
      - 'tests/e2e/setup.ts'
      - 'playwright.api.config.ts'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/ci-phase-d2-translation-speech-gate.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  phase-d2-translation-speech-gate:
    name: Phase D2 Translation/Speech Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Phase D2 translation/speech gate suite
        run: |
          bunx playwright test \
            tests/e2e/phase-d2-translation-speech-boundaries.spec.ts \
            --config=playwright.api.config.ts \
            --reporter=list

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase-d2-translation-speech-gate-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
