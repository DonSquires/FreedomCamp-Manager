name: Ops PTT Professional Audit

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ptt-audit:
    name: PTT Interop + Transport Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          PTT_SERVER_URL: ${{ secrets.PTT_SERVER_URL }}
          PTT_WS_URL: ${{ secrets.PTT_WS_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          : "${PTT_SERVER_URL:?PTT_SERVER_URL secret is required}"
          : "${PTT_WS_URL:?PTT_WS_URL secret is required}"
          : "${SUPABASE_URL:?SUPABASE_URL secret is required}"
          : "${SUPABASE_ANON_KEY:?SUPABASE_ANON_KEY secret is required}"

      - name: Enforce stable PTT URL policy
        env:
          PTT_SERVER_URL: ${{ secrets.PTT_SERVER_URL }}
          PTT_WS_URL: ${{ secrets.PTT_WS_URL }}
          PTT_ALLOWED_HOST_REGEX: '^(srv1601189\.hstgr\.cloud|ptt\.onspace\.build)$'
        run: |
          set -euo pipefail
          bash scripts/ptt-url-policy-check.sh

      - name: Run strict Phase 0 audit
        env:
          PTT_SERVER_URL: ${{ secrets.PTT_SERVER_URL }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          PTT_AUDIT_FAIL_ON_WARN: "true"
          PTT_AUDIT_REQUIRE_STRICT_RELAY: "true"
          PTT_AUDIT_REQUIRE_HTTPS: "true"
          PTT_AUDIT_REQUIRE_SUPABASE_CHECK: "true"
        run: |
          set -euo pipefail
          bash scripts/ptt-phase0-runtime-audit.sh
