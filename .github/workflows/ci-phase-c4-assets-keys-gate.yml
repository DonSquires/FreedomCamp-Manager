name: CI Phase C4 Assets Keys Client Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/e2e/phase-c4-assets-keys-client.spec.ts'
      - 'supabase/migrations/20260710000003_phase_c4_assets_keys_client_case_bridge.sql'
      - 'src/hooks/useAssetsKeysC4.ts'
      - 'tests/e2e/setup.ts'
      - 'playwright.api.config.ts'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/ci-phase-c4-assets-keys-gate.yml'
  push:
    branches: [main]
    paths:
      - 'tests/e2e/phase-c4-assets-keys-client.spec.ts'
      - 'supabase/migrations/20260710000003_phase_c4_assets_keys_client_case_bridge.sql'
      - 'src/hooks/useAssetsKeysC4.ts'
      - 'tests/e2e/setup.ts'
      - 'playwright.api.config.ts'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/ci-phase-c4-assets-keys-gate.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  phase-c4-assets-keys-gate:
    name: Phase C4 Assets Keys Client Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    env:
      VITE_SUPABASE_URL:         ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY:    ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Phase C4 Assets/Keys/Client gate suite
        run: |
          bunx playwright test \
            tests/e2e/phase-c4-assets-keys-client.spec.ts \
            --config=playwright.api.config.ts \
            --reporter=list

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase-c4-assets-keys-gate-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
