name: Ops - AI Rollback Guard

# Post-deployment smoke test for AI-generated fix PRs.
# Triggered after any ops/ai-fix/* branch is merged to main.
#
# If smoke tests fail after an AI fix lands:
#   1. Identifies the merge commit on main
#   2. Opens a git revert PR (ops/ai-rollback/<sha>) immediately
#   3. Logs the regression event to self_heal_events (outcome: rolled_back)
#   4. Notifies via escalation issue — "AI fix caused regression"
#
# This is the "Automated Git Rollbacks" guardrail from the architecture doc.

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  rollback-guard:
    name: Post-Deploy Smoke Test & Rollback Guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only run when the push was a merge of an ops/ai-fix/* branch
    if: >-
      contains(github.event.head_commit.message, 'ops/ai-fix/') ||
      contains(github.event.head_commit.message, 'ai-triage') ||
      contains(github.event.head_commit.message, 'self-heal')
    env:
      GH_TOKEN: ${{ secrets.BOB_WORKER_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
      MERGE_SHA: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.BOB_WORKER_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ── Smoke test 1: Build ──────────────────────────────────────────────────
      - name: Build smoke test
        id: build
        continue-on-error: true
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
        run: bun run build

      # ── Smoke test 2: TypeScript type-check ─────────────────────────────────
      - name: TypeScript type-check smoke test
        id: typecheck
        continue-on-error: true
        run: bun run build 2>&1 | grep -E 'error TS' | head -20 || true

      # ── Smoke test 3: Lint budget ────────────────────────────────────────────
      - name: Lint smoke test
        id: lint
        continue-on-error: true
        run: |
          ERRORS=$(bun run lint 2>&1 | grep -c ' error ' || true)
          echo "lint_errors=$ERRORS" >> "$GITHUB_OUTPUT"
          [ "$ERRORS" -le 5 ]

      # ── Evaluate: did all smoke tests pass? ─────────────────────────────────
      - name: Evaluate smoke results
        id: evaluate
        run: |
          BUILD_OK="${{ steps.build.outcome == 'success' }}"
          LINT_OK="${{ steps.lint.outcome == 'success' }}"

          echo "build_ok=$BUILD_OK"     >> "$GITHUB_OUTPUT"
          echo "lint_ok=$LINT_OK"       >> "$GITHUB_OUTPUT"

          if [ "$BUILD_OK" = "true" ] && [ "$LINT_OK" = "true" ]; then
            echo "smoke_passed=true"    >> "$GITHUB_OUTPUT"
            echo "All smoke tests passed. AI fix is healthy."
          else
            echo "smoke_passed=false"   >> "$GITHUB_OUTPUT"
            echo "::error::Smoke tests FAILED after AI-generated merge (SHA: $MERGE_SHA). Initiating rollback."
          fi

      # ── Auto-rollback: create revert PR ──────────────────────────────────────
      - name: Create revert branch
        id: revert
        if: steps.evaluate.outputs.smoke_passed == 'false'
        run: |
          set -euo pipefail
          git config user.name  "FieldOps AI Rollback Guard"
          git config user.email "ops-bot@fieldops.nz"

          REVERT_BRANCH="ops/ai-rollback/${MERGE_SHA:0:8}-$(date +%Y%m%d%H%M%S)"
          git checkout -b "$REVERT_BRANCH"
          git revert --no-edit "$MERGE_SHA" || {
            echo "::warning::Auto-revert had conflicts. Creating empty branch for manual revert."
            git revert --abort 2>/dev/null || true
          }
          git push origin "$REVERT_BRANCH"
          echo "revert_branch=$REVERT_BRANCH" >> "$GITHUB_OUTPUT"
          echo "Revert branch pushed: $REVERT_BRANCH"

      - name: Open rollback PR + escalation issue
        if: steps.evaluate.outputs.smoke_passed == 'false'
        uses: actions/github-script@v7
        env:
          REVERT_BRANCH: ${{ steps.revert.outputs.revert_branch || '' }}
          BUILD_OK: ${{ steps.evaluate.outputs.build_ok }}
          LINT_OK: ${{ steps.evaluate.outputs.lint_ok }}
        with:
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            const sha = process.env.MERGE_SHA
            const revertBranch = process.env.REVERT_BRANCH

            // Open rollback PR
            let rollbackPrUrl = ''
            if (revertBranch) {
              try {
                const pr = await github.rest.pulls.create({
                  owner, repo,
                  title: `revert(ai-rollback): revert AI fix ${sha.slice(0, 8)} — smoke tests failed`,
                  body: [
                    '## AI Rollback Guard — Automatic Revert',
                    '',
                    `This PR reverts commit \`${sha.slice(0, 8)}\` because production smoke tests failed after an AI-generated fix was merged to main.`,
                    '',
                    `| Check | Result |`,
                    `|---|---|`,
                    `| Build | ${process.env.BUILD_OK === 'true' ? '✅' : '❌'} |`,
                    `| Lint | ${process.env.LINT_OK === 'true' ? '✅' : '❌'} |`,
                    '',
                    '**Merge this PR immediately to restore the last known good state.**',
                    '',
                    '### Root-Cause Investigation Required',
                    '1. Review the failed smoke test logs in this workflow run.',
                    '2. Examine the reverted commit for the specific regression.',
                    '3. File a manual fix with proper testing before re-attempting.',
                  ].join('\n'),
                  head: revertBranch,
                  base: 'main',
                  draft: false,
                })
                await github.rest.issues.addLabels({
                  owner, repo,
                  issue_number: pr.data.number,
                  labels: ['self-healing', 'rollback', 'urgent', 'ops'],
                })
                rollbackPrUrl = pr.data.html_url
                core.info(`Rollback PR created: ${rollbackPrUrl}`)
              } catch (err) {
                core.warning(`Failed to create rollback PR: ${err.message}`)
              }
            }

            // Open escalation issue
            const title = `ops: AI fix regression — rollback required (${sha.slice(0, 8)})`
            const issueBody = [
              '## AI Rollback Guard: Regression Detected',
              '',
              `- Merge commit: \`${sha}\``,
              `- Build smoke: ${process.env.BUILD_OK === 'true' ? '✅' : '❌'}`,
              `- Lint smoke: ${process.env.LINT_OK === 'true' ? '✅' : '❌'}`,
              rollbackPrUrl ? `- Rollback PR: ${rollbackPrUrl}` : '- Rollback PR: could not be created automatically',
              '',
              '### Action Required',
              '1. Merge the rollback PR immediately.',
              '2. Investigate the root cause of the regression.',
              '3. The AI self-heal recurrence circuit will suppress further automatic fixes for 10 minutes.',
            ].join('\n')

            await github.rest.issues.create({
              owner, repo,
              title,
              body: issueBody,
              labels: ['self-healing', 'rollback', 'urgent', 'ops', 'human-required'],
            })

      - name: Log success (no rollback needed)
        if: steps.evaluate.outputs.smoke_passed == 'true'
        run: |
          echo "Rollback guard: all smoke tests passed after AI fix merge $MERGE_SHA. No rollback needed."
