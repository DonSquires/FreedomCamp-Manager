name: CI Phase B Canary Gate

# Path-filtered gate that validates the feature flag canary rollout
# infrastructure whenever the canary progression test, feature flag migration,
# or canary scripts change.

on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/e2e/feature-flag-canary-progression.test.ts'
      - 'supabase/migrations/202605_feature_flags.sql'
      - 'scripts/advance-canary-stage.sh'
      - 'scripts/rollback-feature-flag.sh'
      - 'tests/e2e/setup.ts'
      - 'playwright.api.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci-phase-b-canary-gate.yml'
  push:
    branches: [main]
    paths:
      - 'tests/e2e/feature-flag-canary-progression.test.ts'
      - 'supabase/migrations/202605_feature_flags.sql'
      - 'scripts/advance-canary-stage.sh'
      - 'scripts/rollback-feature-flag.sh'
      - 'tests/e2e/setup.ts'
      - 'playwright.api.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci-phase-b-canary-gate.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  phase-b-canary-gate:
    name: Phase B Canary Progression Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    env:
      VITE_SUPABASE_URL:         ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY:    ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Validate canary scripts are executable
        run: |
          [ -x scripts/advance-canary-stage.sh ] || chmod +x scripts/advance-canary-stage.sh
          [ -x scripts/rollback-feature-flag.sh ] || chmod +x scripts/rollback-feature-flag.sh
          echo "✓ Canary scripts are executable"

      - name: Run feature flag canary progression test suite
        id: canary_gate_suite
        continue-on-error: true
        run: |
          npx playwright test \
            tests/e2e/feature-flag-canary-progression.test.ts \
            --config=playwright.api.config.ts \
            --reporter=list

      - name: Enforce Phase B canary gate (strict mode)
        if: steps.canary_gate_suite.outcome == 'failure' && vars.PHASE_CANARY_STRICT == 'true'
        run: exit 1

      - name: Report Phase B canary gate (non-strict)
        if: steps.canary_gate_suite.outcome == 'failure' && vars.PHASE_CANARY_STRICT != 'true'
        run: echo "::warning::Phase B canary gate test suite failed but continuing (non-strict mode). Set PHASE_CANARY_STRICT=true to enforce."

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase-b-canary-gate-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
