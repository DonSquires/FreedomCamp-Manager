name: Build and Publish AI Worker

on:
  push:
    branches:
      - main
    paths:
      - 'runpod-worker/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: donsquires/freedomcamp-manager-ai

concurrency:
  group: build-ai-worker-main
  cancel-in-progress: true

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free disk space on runner
        run: |
          # Removes pre-installed toolchains that are not needed for Docker builds
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build_push
        uses: docker/build-push-action@v5
        with:
          context: ./runpod-worker
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Print immutable image references
        run: |
          set -e
          echo "Immutable tag: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "Image digest:  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build_push.outputs.digest }}"

          {
            echo "## AI Worker Image Published"
            echo ""
            echo "- Immutable tag: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}\`"
            echo "- Immutable digest: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build_push.outputs.digest }}\`"
            echo ""
            echo "Use one of these in RunPod endpoint image settings (do not use `:latest`)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update RunPod serverless endpoint image
        env:
          RUNPOD_API_KEY:      ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_ENDPOINT_ID:  ${{ secrets.RUNPOD_ENDPOINT_ID }}
        run: |
          set -euo pipefail

          IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          DIGEST="${{ steps.build_push.outputs.digest }}"
          IMAGE_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"

          if [ -z "${RUNPOD_API_KEY:-}" ] || [ -z "${RUNPOD_ENDPOINT_ID:-}" ]; then
            echo "⚠️  RUNPOD_API_KEY or RUNPOD_ENDPOINT_ID not set — skipping endpoint update."
            echo "   New image: $IMAGE_TAG"
            exit 0
          fi

          gql() {
            curl -fsSL "https://api.runpod.io/graphql?api_key=$RUNPOD_API_KEY" \
              -H "Content-Type: application/json" --data-raw "$1"
          }

          echo "🐳 Creating RunPod template with new image: $IMAGE_REF ..."
          TMPL=$(gql "{\"query\":\"mutation { saveTemplate(input: { name: \\\"fieldops-ai-worker\\\", imageName: \\\"$IMAGE_REF\\\", containerDiskInGb: 50, dockerArgs: \\\"\\\", env: [], volumeInGb: 0 }) { id name imageName } }\"}")
          TMPL_ID=$(echo "$TMPL" | python3 -c "import sys,json; print(json.load(sys.stdin)['data']['saveTemplate']['id'])")
          echo "✅ Template created: $TMPL_ID"

          echo "🔗 Updating endpoint $RUNPOD_ENDPOINT_ID → template $TMPL_ID ..."
          EP=$(gql "{\"query\":\"mutation { saveEndpoint(input: { id: \\\"$RUNPOD_ENDPOINT_ID\\\", name: \\\"fieldops-ai-engine\\\", templateId: \\\"$TMPL_ID\\\", workersMin: 1, workersMax: 6, gpuIds: \\\"ADA_24\\\" }) { id name templateId } }\"}")
          echo "$EP" | python3 -c "import sys,json; d=json.load(sys.stdin); e=d.get('data',{}).get('saveEndpoint',{}); print('Endpoint:', e.get('id'), '| template:', e.get('templateId'))"

          if echo "$EP" | python3 -c "import sys,json; d=json.load(sys.stdin); exit(0 if d.get('data',{}).get('saveEndpoint') else 1)"; then
            echo "✅ RunPod endpoint updated to image: $IMAGE_REF"
          else
            echo "::warning::RunPod endpoint update may have failed. Update manually: $IMAGE_TAG"
            echo "Errors: $(echo "$EP" | python3 -c "import sys,json; print(json.load(sys.stdin).get('errors','?'))")"
          fi
