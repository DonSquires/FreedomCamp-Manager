name: Build and Publish AI Worker

on:
  push:
    branches:
      - main
    paths:
      - 'runpod-worker/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: donsquires/freedomcamp-manager-ai

concurrency:
  group: build-ai-worker-main
  cancel-in-progress: true

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free disk space on runner
        run: |
          # Removes pre-installed toolchains that are not needed for Docker builds
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build_push
        uses: docker/build-push-action@v5
        with:
          context: ./runpod-worker
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Print immutable image references
        run: |
          set -e
          echo "Immutable tag: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "Image digest:  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build_push.outputs.digest }}"

          {
            echo "## AI Worker Image Published"
            echo ""
            echo "- Immutable tag: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}\`"
            echo "- Immutable digest: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build_push.outputs.digest }}\`"
            echo ""
            echo "Use one of these in RunPod endpoint image settings (do not use `:latest`)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update RunPod serverless endpoint image
        env:
          RUNPOD_API_KEY:      ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_ENDPOINT_ID:  ${{ secrets.RUNPOD_ENDPOINT_ID }}
          RUNPOD_TEMPLATE_ID:  ${{ secrets.RUNPOD_TEMPLATE_ID }}
        run: |
          set -euo pipefail

          IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          DIGEST="${{ steps.build_push.outputs.digest }}"
          IMAGE_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"

          if [ -z "${RUNPOD_API_KEY:-}" ] || [ -z "${RUNPOD_TEMPLATE_ID:-}" ]; then
            echo "⚠️  RUNPOD_API_KEY or RUNPOD_TEMPLATE_ID not set — skipping endpoint update."
            echo "   New image: $IMAGE_TAG"
            exit 0
          fi

          rest() {
            local method="$1" path="$2" body="${3:-}"
            if [ -n "$body" ]; then
              curl -fsSL -X "$method" "https://rest.runpod.io/v1/${path}" \
                -H "Authorization: Bearer $RUNPOD_API_KEY" \
                -H "Content-Type: application/json" -d "$body"
            else
              curl -fsSL -X "$method" "https://rest.runpod.io/v1/${path}" \
                -H "Authorization: Bearer $RUNPOD_API_KEY"
            fi
          }

          echo "� Updating RunPod serverless template $RUNPOD_TEMPLATE_ID with new image ..."
          TMPL_RESP=$(rest PATCH "templates/$RUNPOD_TEMPLATE_ID" "{\"imageName\":\"$IMAGE_REF\"}")
          GOT_IMG=$(echo "$TMPL_RESP" | python3 -c "import sys,json; print(json.load(sys.stdin).get('imageName','?'))" 2>/dev/null || echo "?")
          echo "Template imageName: $GOT_IMG"

          if echo "$GOT_IMG" | grep -q "$DIGEST\|$IMAGE_TAG"; then
            echo "✅ RunPod serverless template updated to: $IMAGE_REF"
          else
            echo "::warning::Template update may have failed (got imageName=$GOT_IMG). Update manually: $IMAGE_TAG"
          fi

