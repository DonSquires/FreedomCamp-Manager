name: Build and Publish AI Worker

on:
  push:
    branches:
      - main
    paths:
      - 'runpod-worker/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: donsquires/freedomcamp-manager-ai

concurrency:
  group: build-ai-worker-main
  cancel-in-progress: true

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free disk space on runner
        run: |
          # Removes pre-installed toolchains that are not needed for Docker builds
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build_push
        uses: docker/build-push-action@v5
        with:
          context: ./runpod-worker
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Print immutable image references
        run: |
          set -e
          echo "Immutable tag: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "Image digest:  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build_push.outputs.digest }}"

          {
            echo "## AI Worker Image Published"
            echo ""
            echo "- Immutable tag: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}\`"
            echo "- Immutable digest: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build_push.outputs.digest }}\`"
            echo ""
            echo "Use one of these in RunPod endpoint image settings (do not use `:latest`)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update RunPod serverless endpoint image
        env:
          RUNPOD_API_KEY:      ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_ENDPOINT_ID:  ${{ secrets.RUNPOD_ENDPOINT_ID }}
        run: |
          set -euo pipefail

          IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          DIGEST="${{ steps.build_push.outputs.digest }}"
          # Prefer digest (immutable) over tag
          IMAGE_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"

          if [ -z "${RUNPOD_API_KEY:-}" ] || [ -z "${RUNPOD_ENDPOINT_ID:-}" ]; then
            echo "⚠️  RUNPOD_API_KEY or RUNPOD_ENDPOINT_ID not set — skipping endpoint update."
            echo "   Add them to GitHub Actions secrets to enable automatic endpoint updates."
            echo "   New image to deploy manually: $IMAGE_TAG"
            exit 0
          fi

          echo "🚀 Updating RunPod endpoint $RUNPOD_ENDPOINT_ID → $IMAGE_REF ..."

          MUTATION=$(jq -n \
            --arg endpointId "$RUNPOD_ENDPOINT_ID" \
            --arg imageName "$IMAGE_REF" \
            '{
              query: "mutation UpdateEndpoint($endpointId: String!, $input: EndpointInput!) { saveEndpoint(endpointId: $endpointId, input: $input) { id name workersMax workersMin } }",
              variables: {
                endpointId: $endpointId,
                input: { imageName: $imageName }
              }
            }')

          RESPONSE=$(curl -fsSL https://api.runpod.io/graphql \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $RUNPOD_API_KEY" \
            --data "$MUTATION")

          if echo "$RESPONSE" | jq -e '.errors | length > 0' >/dev/null 2>&1; then
            echo "::warning::RunPod endpoint update failed: $(echo "$RESPONSE" | jq -r '.errors[0].message')"
            echo "   Update manually: $IMAGE_TAG"
          else
            echo "✅ RunPod endpoint updated to: $IMAGE_REF"
            echo "$RESPONSE" | jq -r '.data.saveEndpoint // empty'
          fi
