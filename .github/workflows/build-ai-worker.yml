name: Build and Publish AI Worker

on:
  push:
    branches:
      - main
    paths:
      - 'runpod-worker/**'
      - 'inference-service/**'
      - 'docs/BOB_AUTONOMOUS_LEARNING.md'
      - 'docs/BOB_TRAINING_ADVANCED_ARCHITECT_2026.md'
      - 'docs/DECISIONS.md'
      - 'docs/LESSONS_LEARNED.md'
      - 'docs/BOB_FAILURE_SUMMARY.md'
      - 'docs/BOB_BRAIN_DUMP.md'
      - 'inference-service/data/intel-state.json'
      - 'data/bob-failure-summary.json'
      - 'data/dr-bob-reviews/**'
      - 'scripts/generate-runpod-training-memory.mjs'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: donsquires/freedomcamp-manager-ai

concurrency:
  group: build-ai-worker-main
  cancel-in-progress: true

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free disk space on runner
        run: |
          # Removes pre-installed toolchains that are not needed for Docker builds
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Generate RunPod training memory bundle
        run: |
          set -euo pipefail
          node scripts/generate-runpod-training-memory.mjs
          test -s runpod-worker/training_memory.json

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build_push
        uses: docker/build-push-action@v5
        with:
          context: ./runpod-worker
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Print immutable image references
        run: |
          set -e
          echo "Immutable tag: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "Image digest:  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build_push.outputs.digest }}"

          {
            echo "## AI Worker Image Published"
            echo ""
            echo "- Immutable tag: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}\`"
            echo "- Immutable digest: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build_push.outputs.digest }}\`"
            echo ""
            echo 'Use one of these in RunPod endpoint image settings (do not use :latest).'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update RunPod serverless endpoint image
        continue-on-error: true
        env:
          RUNPOD_API_KEY:      ${{ secrets.RUNPOD_ENDPOINT_API_KEY || secrets.RUNPOD_API_KEY }}
          RUNPOD_ENDPOINT_ID:  ${{ secrets.RUNPOD_ENDPOINT_ID }}
          RUNPOD_TEMPLATE_ID:  ${{ secrets.RUNPOD_TEMPLATE_ID }}
        run: |
          set -euo pipefail

          IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          DIGEST="${{ steps.build_push.outputs.digest }}"
          IMAGE_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"

          if [ -z "${RUNPOD_API_KEY:-}" ] || [ -z "${RUNPOD_TEMPLATE_ID:-}" ]; then
            echo "WARNING: RUNPOD_API_KEY or RUNPOD_TEMPLATE_ID not set - skipping endpoint update."
            echo "   New image: $IMAGE_TAG"
            exit 0
          fi

          rest() {
            local method="$1" path="$2" body="${3:-}"
            if [ -n "$body" ]; then
              curl -fsSL -X "$method" "https://rest.runpod.io/v1/${path}" \
                -H "Authorization: Bearer $RUNPOD_API_KEY" \
                -H "Content-Type: application/json" -d "$body"
            else
              curl -fsSL -X "$method" "https://rest.runpod.io/v1/${path}" \
                -H "Authorization: Bearer $RUNPOD_API_KEY"
            fi
          }

          echo "Updating RunPod serverless template $RUNPOD_TEMPLATE_ID with new image ..."
          set +e
          TMPL_RESP=$(rest PATCH "templates/$RUNPOD_TEMPLATE_ID" "{\"imageName\":\"$IMAGE_REF\"}" 2>/tmp/runpod_template_err.log)
          TMPL_RC=$?
          set -e
          if [ "$TMPL_RC" -ne 0 ]; then
            echo "::warning::RunPod template update call failed (likely auth/permission issue). Skipping endpoint refresh."
            sed -n '1,5p' /tmp/runpod_template_err.log || true
            exit 0
          fi
          GOT_IMG=$(echo "$TMPL_RESP" | python3 -c "import sys,json; print(json.load(sys.stdin).get('imageName','?'))" 2>/dev/null || echo "?")
          echo "Template imageName: $GOT_IMG"

          if echo "$GOT_IMG" | grep -q "$DIGEST\|$IMAGE_TAG"; then
            echo "RunPod serverless template updated to: $IMAGE_REF"
          else
            echo "::warning::Template update may have failed (got imageName=$GOT_IMG). Update manually: $IMAGE_TAG"
          fi

          # Best-effort endpoint refresh: some RunPod serverless endpoints keep warm workers
          # on the previous image until the endpoint config is touched.
          if [ -n "${RUNPOD_ENDPOINT_ID:-}" ]; then
            echo "Refreshing RunPod endpoint $RUNPOD_ENDPOINT_ID to pick up template/image changes ..."

            EP_STATUS=$(curl -sS -o /tmp/runpod_endpoint_before.json -w "%{http_code}" \
              -X GET "https://rest.runpod.io/v1/endpoints/${RUNPOD_ENDPOINT_ID}" \
              -H "Authorization: Bearer $RUNPOD_API_KEY" || true)
            if [ "$EP_STATUS" = "200" ]; then
              EP_TMPL_BEFORE=$(python3 -c "import json; d=json.load(open('/tmp/runpod_endpoint_before.json')); print(d.get('templateId',''))" 2>/dev/null || echo "")
              EP_IMG_BEFORE=$(python3 -c "import json; d=json.load(open('/tmp/runpod_endpoint_before.json')); print(d.get('imageName',''))" 2>/dev/null || echo "")
              EP_WORKERS_MIN_BEFORE=$(python3 -c "import json; d=json.load(open('/tmp/runpod_endpoint_before.json')); print(d.get('workersMin',''))" 2>/dev/null || echo "")
              echo "Endpoint before refresh: templateId=${EP_TMPL_BEFORE:-?} imageName=${EP_IMG_BEFORE:-?}"

              if printf '%s' "$EP_WORKERS_MIN_BEFORE" | grep -Eq '^[0-9]+$'; then
                EP_WORKERS_MIN_BUMPED=$((EP_WORKERS_MIN_BEFORE + 1))
                echo "ORIGINAL_RUNPOD_WORKERS_MIN=$EP_WORKERS_MIN_BEFORE" >> "$GITHUB_ENV"
                echo "DEPLOY_RUNPOD_BUMPED_MIN=$EP_WORKERS_MIN_BUMPED" >> "$GITHUB_ENV"
              else
                EP_WORKERS_MIN_BUMPED=2
                echo "DEPLOY_RUNPOD_BUMPED_MIN=$EP_WORKERS_MIN_BUMPED" >> "$GITHUB_ENV"
              fi
            else
              echo "::warning::Unable to fetch endpoint details (HTTP $EP_STATUS)."
              EP_WORKERS_MIN_BUMPED=2
              echo "DEPLOY_RUNPOD_BUMPED_MIN=$EP_WORKERS_MIN_BUMPED" >> "$GITHUB_ENV"
            fi

            EP_PATCH_BODY=$(printf '{"templateId":"%s","workersMin":%s}' "$RUNPOD_TEMPLATE_ID" "$EP_WORKERS_MIN_BUMPED")
            EP_PATCH_STATUS=$(curl -sS -o /tmp/runpod_endpoint_patch.json -w "%{http_code}" \
              -X PATCH "https://rest.runpod.io/v1/endpoints/${RUNPOD_ENDPOINT_ID}" \
              -H "Authorization: Bearer $RUNPOD_API_KEY" \
              -H "Content-Type: application/json" \
              -d "$EP_PATCH_BODY" || true)
            if [ "$EP_PATCH_STATUS" = "200" ] || [ "$EP_PATCH_STATUS" = "202" ]; then
              EP_TMPL_AFTER=$(python3 -c "import json; d=json.load(open('/tmp/runpod_endpoint_patch.json')); print(d.get('templateId',''))" 2>/dev/null || echo "")
              EP_IMG_AFTER=$(python3 -c "import json; d=json.load(open('/tmp/runpod_endpoint_patch.json')); print(d.get('imageName',''))" 2>/dev/null || echo "")
              EP_WORKERS_MIN_AFTER=$(python3 -c "import json; d=json.load(open('/tmp/runpod_endpoint_patch.json')); print(d.get('workersMin',''))" 2>/dev/null || echo "")
              echo "Endpoint refresh accepted: templateId=${EP_TMPL_AFTER:-?} imageName=${EP_IMG_AFTER:-?} workersMin=${EP_WORKERS_MIN_AFTER:-?}"
            else
              echo "::warning::Endpoint refresh PATCH failed (HTTP $EP_PATCH_STATUS)."
            fi
          else
            echo "RUNPOD_ENDPOINT_ID not set - skipping endpoint refresh attempt."
          fi

      - name: Post-deploy training smoke
        continue-on-error: true
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_ENDPOINT_API_KEY || secrets.RUNPOD_API_KEY }}
          RUNPOD_ENDPOINT_ID: ${{ secrets.RUNPOD_ENDPOINT_ID }}
        run: |
          set -euo pipefail

          restore_workers_min() {
            if [ -z "${RUNPOD_API_KEY:-}" ] || [ -z "${RUNPOD_ENDPOINT_ID:-}" ] || [ -z "${ORIGINAL_RUNPOD_WORKERS_MIN:-}" ]; then
              return 0
            fi

            curl -fsSL -X PATCH "https://rest.runpod.io/v1/endpoints/${RUNPOD_ENDPOINT_ID}" \
              -H "Authorization: Bearer $RUNPOD_API_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"workersMin\":${ORIGINAL_RUNPOD_WORKERS_MIN}}" >/dev/null || true
          }

          trap restore_workers_min EXIT

          if [ -z "${RUNPOD_API_KEY:-}" ] || [ -z "${RUNPOD_ENDPOINT_ID:-}" ]; then
            echo "::warning::RUNPOD_API_KEY or RUNPOD_ENDPOINT_ID not set - skipping post-deploy training smoke."
            exit 0
          fi

          RUNSYNC_URL="https://api.runpod.ai/v2/${RUNPOD_ENDPOINT_ID}/runsync"
          EXPECTED_VERSION=$(python3 -c "import json; print(json.load(open('runpod-worker/training_memory.json', 'r', encoding='utf-8'))['version'])")

          AUTH_CHECK_STATUS=$(curl -sS -o /tmp/runpod_runsync_auth.json -w "%{http_code}" \
            -X POST "$RUNSYNC_URL" \
            -H "Authorization: Bearer $RUNPOD_API_KEY" \
            -H 'Content-Type: application/json' \
            -d '{"input":{"action":"ping"}}' || true)
          if [ "$AUTH_CHECK_STATUS" = "401" ] || [ "$AUTH_CHECK_STATUS" = "403" ]; then
            echo "::warning::RunPod post-deploy smoke unauthorized (HTTP $AUTH_CHECK_STATUS). Skipping smoke checks."
            exit 0
          fi

          call_runsync() {
            local payload="$1"
            curl -fsSL -X POST "$RUNSYNC_URL" \
              -H "Authorization: Bearer $RUNPOD_API_KEY" \
              -H 'Content-Type: application/json' \
              -d "$payload"
          }

          echo "Waiting for live worker to report training_memory_version=$EXPECTED_VERSION"
          for attempt in $(seq 1 45); do
            PING_RESP=$(call_runsync '{"input":{"action":"ping"}}')
            echo "$PING_RESP"
            LIVE_STATUS=$(printf '%s' "$PING_RESP" | python3 -c "import json, sys; payload = json.load(sys.stdin); output = payload.get('output', {}); print('ok' if output.get('training_memory_loaded') and output.get('training_memory_version') else 'missing'); print(output.get('training_memory_version', ''))")
            LIVE_OK=$(printf '%s' "$LIVE_STATUS" | sed -n '1p')
            LIVE_VERSION=$(printf '%s' "$LIVE_STATUS" | sed -n '2p')

            if [ "$LIVE_OK" = "ok" ] && [ "$LIVE_VERSION" = "$EXPECTED_VERSION" ]; then
              echo "Live worker is serving the expected training bundle version."
              break
            fi

            if [ "$attempt" -eq 45 ]; then
              echo "::error::Live worker did not report the expected training bundle version after deploy. expected=$EXPECTED_VERSION actual=$LIVE_VERSION"
              exit 1
            fi

            echo "Attempt $attempt/45: live version is '$LIVE_VERSION' - retrying in 10s"
            sleep 10
          done

          QUESTION="What are the exact go-live acceptance criteria for Bob's internal build-review training loop, including any score thresholds, lint requirements, and repetition requirements?"
          CHAT_RESP=$(call_runsync "{\"input\":{\"action\":\"chat\",\"message\":\"$QUESTION\",\"temperature\":0.1}}")
          echo "$CHAT_RESP"

          printf '%s' "$CHAT_RESP" | python3 -c "import json, sys; payload = json.load(sys.stdin); message = (payload.get('output') or {}).get('message', ''); required_phrases = ['zero lint errors before release', 'successful builds', 'chunk strategy for large routes', 'review scores of at least 9 across 3 consecutive runs', 'no outbound dependency in the training loop']; missing = [phrase for phrase in required_phrases if phrase not in message]; sys.exit('Missing required phrases:\n- ' + '\n- '.join(missing)) if missing else print('Live Bob training smoke passed.')"

