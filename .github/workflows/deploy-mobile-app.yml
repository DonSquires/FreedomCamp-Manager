name: Deploy Mobile App to OnSpace AI

# -----------------------------------------------------------------------
# Builds and publishes the FreedomCamp Manager Expo app via EAS.
#
# Linked to: https://expo.dev/accounts/iron-eagle-security/projects/freedomcamp-manager
#
# Triggers:
#   • Automatically on every push to main that touches mobile-app/
#   • Manually from the GitHub Actions tab (workflow_dispatch)
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   EXPO_TOKEN              – from https://expo.dev/accounts/iron-eagle-security/settings/access-tokens
#                             (create a personal access token with "Build" scope)
#   EXPO_PROJECT_ID         – UUID of the Expo project (xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx)
#                             found at: https://expo.dev/accounts/iron-eagle-security/projects/freedomcamp-manager
#                             → Project Settings → copy the Project ID
#   EXPO_PUBLIC_SUPABASE_URL      – https://YOUR_REF.supabase.co
#   EXPO_PUBLIC_SUPABASE_ANON_KEY – your Supabase anon/public key
#
#   Android signing secrets (required for any build that targets Android):
#   ANDROID_KEYSTORE_BASE64     – base64-encoded .jks / .keystore file
#                                 Generate (one-time, run locally):
#                                   keytool -genkey -v -keystore freedomcamp.keystore \
#                                     -alias freedomcamp -keyalg RSA -keysize 2048 -validity 10000
#                                 Then base64-encode it:
#                                   base64 freedomcamp.keystore | tr -d '\n'
#   ANDROID_KEYSTORE_PASSWORD   – password used when generating the keystore
#   ANDROID_KEY_ALIAS           – key alias (e.g. "freedomcamp")
#   ANDROID_KEY_PASSWORD        – key password (can be same as keystore password)
#
# First-time setup:
#   1. Login to the Expo iron-eagle-security account:
#        npm install -g eas-cli
#        eas login
#   2. Get the project UUID from:
#        https://expo.dev/accounts/iron-eagle-security/projects/freedomcamp-manager
#        → Project Settings → copy the Project ID (UUID format: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx)
#   3. Generate an Android signing keystore (if you don't already have one):
#        keytool -genkey -v -keystore freedomcamp.keystore \
#          -alias freedomcamp -keyalg RSA -keysize 2048 -validity 10000
#        base64 freedomcamp.keystore | tr -d '\n'   # → value for ANDROID_KEYSTORE_BASE64
#   4. Add the following repository secrets at:
#        GitHub repo → Settings → Secrets and variables → Actions
#        - EXPO_TOKEN
#        - EXPO_PROJECT_ID             (the UUID copied in step 2)
#        - EXPO_PUBLIC_SUPABASE_URL
#        - EXPO_PUBLIC_SUPABASE_ANON_KEY
#        - ANDROID_KEYSTORE_BASE64     (base64 keystore from step 3)
#        - ANDROID_KEYSTORE_PASSWORD   (password chosen in step 3)
#        - ANDROID_KEY_ALIAS           (alias chosen in step 3, e.g. freedomcamp)
#        - ANDROID_KEY_PASSWORD        (key password chosen in step 3)
#   5. Push to main or manually trigger this workflow.
#      The workflow injects EXPO_PROJECT_ID into app.json at build time —
#      no need to edit app.json manually.
# -----------------------------------------------------------------------

on:
  push:
    branches: [main]
    paths:
      - 'mobile-app/**'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform'
        required: false
        default: 'android'
        type: choice
        options: [android, ios, all]
      profile:
        description: 'EAS build profile'
        required: false
        default: 'production'
        type: choice
        options: [production, preview, development]

jobs:
  build-and-publish:
    name: Build & Publish to OnSpace AI (EAS)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check required secrets
        id: check-secrets
        run: |
          # Determine the effective build platform early so we only require
          # Android signing secrets when the build actually targets Android.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PLATFORM="${{ github.event.inputs.platform }}"
          else
            PLATFORM="android"
          fi

          missing=""
          [ -z "$EXPO_TOKEN" ]                    && missing="$missing EXPO_TOKEN"
          [ -z "$EXPO_PROJECT_ID" ]               && missing="$missing EXPO_PROJECT_ID"
          [ -z "$EXPO_PUBLIC_SUPABASE_URL" ]      && missing="$missing EXPO_PUBLIC_SUPABASE_URL"
          [ -z "$EXPO_PUBLIC_SUPABASE_ANON_KEY" ] && missing="$missing EXPO_PUBLIC_SUPABASE_ANON_KEY"

          # Android keystore secrets are only required when building for Android.
          NEEDS_ANDROID=false
          if [ "$PLATFORM" = "android" ] || [ "$PLATFORM" = "all" ]; then
            NEEDS_ANDROID=true
            [ -z "$ANDROID_KEYSTORE_BASE64" ]       && missing="$missing ANDROID_KEYSTORE_BASE64"
            [ -z "$ANDROID_KEYSTORE_PASSWORD" ]     && missing="$missing ANDROID_KEYSTORE_PASSWORD"
            [ -z "$ANDROID_KEY_ALIAS" ]             && missing="$missing ANDROID_KEY_ALIAS"
            [ -z "$ANDROID_KEY_PASSWORD" ]          && missing="$missing ANDROID_KEY_PASSWORD"
          fi

          if [ -n "$missing" ]; then
            echo "::warning::Required secrets not configured ($missing) — deployment skipped."
            echo ""
            echo "This workflow builds and publishes the Expo mobile app via EAS."
            echo ""
            echo "To enable this workflow, add the following repository secrets at:"
            echo "  GitHub repo → Settings → Secrets and variables → Actions"
            echo ""
            echo "  EXPO_TOKEN:                    Create at https://expo.dev/accounts/[account]/settings/access-tokens"
            echo "  EXPO_PROJECT_ID:               UUID from https://expo.dev/accounts/iron-eagle-security/projects/freedomcamp-manager → Project Settings"
            echo "  EXPO_PUBLIC_SUPABASE_URL:      Your Supabase project URL"
            echo "  EXPO_PUBLIC_SUPABASE_ANON_KEY: Your Supabase anon/public key"
            echo ""
            echo "  Android signing (required when platform is 'android' or 'all'):"
            echo "  ANDROID_KEYSTORE_BASE64:       base64 freedomcamp.keystore | tr -d '\\n'"
            echo "  ANDROID_KEYSTORE_PASSWORD:     Keystore password"
            echo "  ANDROID_KEY_ALIAS:             Key alias (e.g. freedomcamp)"
            echo "  ANDROID_KEY_PASSWORD:          Key password"
            echo "secrets_present=false" >> "$GITHUB_OUTPUT"
          else
            echo "✅ Required secrets present"
            echo "secrets_present=true" >> "$GITHUB_OUTPUT"
          fi
          echo "needs_android=$NEEDS_ANDROID" >> "$GITHUB_OUTPUT"
        env:
          EXPO_TOKEN:                    ${{ secrets.EXPO_TOKEN }}
          EXPO_PROJECT_ID:               ${{ secrets.EXPO_PROJECT_ID }}
          EXPO_PUBLIC_SUPABASE_URL:      ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          ANDROID_KEYSTORE_BASE64:       ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD:     ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS:             ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD:          ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Checkout repository
        if: steps.check-secrets.outputs.secrets_present == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.check-secrets.outputs.secrets_present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile-app/package-lock.json

      - name: Install dependencies
        if: steps.check-secrets.outputs.secrets_present == 'true'
        run: |
          cd mobile-app
          npm install

      - name: Inject Expo project ID into app.json
        if: steps.check-secrets.outputs.secrets_present == 'true'
        env:
          EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID }}
        run: |
          cd mobile-app
          PLACEHOLDER="REPLACE_WITH_YOUR_EXPO_PROJECT_UUID"
          # Replace the placeholder UUID with the real project ID from the secret.
          # Note: sed -i (in-place, no backup) is standard on Linux (GNU sed) and safe on
          # GitHub Actions ubuntu runners. It replaces all occurrences in one pass
          # (extra.eas.projectId and updates.url both use the same placeholder).
          # Using | as the delimiter avoids issues if the replacement value contains /.
          sed -i "s|$PLACEHOLDER|$EXPO_PROJECT_ID|g" app.json
          echo "✅ Injected EXPO_PROJECT_ID into app.json"
          # Verify no placeholder remains and surface exactly which lines still need fixing.
          if grep -q "$PLACEHOLDER" app.json; then
            echo "::error::Placeholder UUID still found in app.json after injection:"
            grep -n "$PLACEHOLDER" app.json
            exit 1
          fi

      - name: Install EAS CLI
        if: steps.check-secrets.outputs.secrets_present == 'true'
        run: npm install -g eas-cli@latest

      - name: Inject EAS project ID into app.json
        if: steps.check-secrets.outputs.secrets_present == 'true'
        env:
          EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID }}
        run: |
          cd mobile-app
          # https://u.expo.dev/ is the fixed Expo OTA updates base URL required by expo-updates.
          # See: https://docs.expo.dev/eas-update/getting-started/
          jq --arg id "$EXPO_PROJECT_ID" \
            '.expo.extra.eas.projectId = $id | .expo.updates.url = ("https://u.expo.dev/" + $id)' \
            app.json > app.json.tmp && mv app.json.tmp app.json
          echo "✅ app.json patched with project ID: $EXPO_PROJECT_ID"

      - name: Set up Android signing credentials
        if: >-
          steps.check-secrets.outputs.secrets_present == 'true' &&
          steps.check-secrets.outputs.needs_android == 'true'
        env:
          ANDROID_KEYSTORE_BASE64:   ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS:         ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD:      ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd mobile-app
          # Decode the base64-encoded keystore into a file
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode --ignore-garbage > android.keystore
          # Write credentials.json — EAS reads this when credentialsSource is "local"
          jq -n \
            --arg keystorePath  "android.keystore" \
            --arg keystorePass  "$ANDROID_KEYSTORE_PASSWORD" \
            --arg keyAlias      "$ANDROID_KEY_ALIAS" \
            --arg keyPassword   "$ANDROID_KEY_PASSWORD" \
            '{
              android: {
                keystore: {
                  keystorePath:      $keystorePath,
                  keystorePassword:  $keystorePass,
                  keyAlias:          $keyAlias,
                  keyPassword:       $keyPassword
                }
              }
            }' > credentials.json
          echo "✅ Android credentials written from GitHub secrets."

      - name: Resolve build platform
        if: steps.check-secrets.outputs.secrets_present == 'true'
        id: resolve-platform
        run: |
          # On an automatic push, default to android (no iOS signing required).
          # On workflow_dispatch, use the selected platform.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "platform=${{ github.event.inputs.platform }}" >> "$GITHUB_OUTPUT"
            echo "profile=${{ github.event.inputs.profile }}"   >> "$GITHUB_OUTPUT"
          else
            echo "platform=android" >> "$GITHUB_OUTPUT"
            echo "profile=production" >> "$GITHUB_OUTPUT"
          fi

      - name: Build mobile app (EAS)
        if: steps.check-secrets.outputs.secrets_present == 'true'
        env:
          EXPO_TOKEN:                    ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL:      ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          cd mobile-app
          # Write .env so EAS cloud build picks up the Supabase variables
          # (eas build zips the source tree; local shell env vars are not forwarded)
          printf 'EXPO_PUBLIC_SUPABASE_URL=%s\nEXPO_PUBLIC_SUPABASE_ANON_KEY=%s\n' \
            "$EXPO_PUBLIC_SUPABASE_URL" "$EXPO_PUBLIC_SUPABASE_ANON_KEY" > .env
          PLATFORM="${{ steps.resolve-platform.outputs.platform }}"
          PROFILE="${{ steps.resolve-platform.outputs.profile }}"
          echo "🏗️  Building for platform: $PLATFORM (profile: $PROFILE)"
          eas build \
            --platform "$PLATFORM" \
            --profile  "$PROFILE" \
            --non-interactive \
            --no-wait
          echo ""
          echo "✅ EAS build triggered successfully."
          echo "📱 Monitor build progress at: https://expo.dev/accounts/iron-eagle-security/projects/freedomcamp-manager/builds"

      - name: Publish OTA update (EAS Update)
        if: steps.check-secrets.outputs.secrets_present == 'true'
        env:
          EXPO_TOKEN:                    ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL:      ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          cd mobile-app
          # Write .env so EAS Update bundles the Supabase variables into the OTA payload
          printf 'EXPO_PUBLIC_SUPABASE_URL=%s\nEXPO_PUBLIC_SUPABASE_ANON_KEY=%s\n' \
            "$EXPO_PUBLIC_SUPABASE_URL" "$EXPO_PUBLIC_SUPABASE_ANON_KEY" > .env
          PROFILE="${{ steps.resolve-platform.outputs.profile }}"
          BRANCH="$PROFILE"
          echo "📡 Publishing OTA update to branch: $BRANCH"
          eas update \
            --branch  "$BRANCH" \
            --message "Deploy from GitHub Actions — ${{ github.sha }}" \
            --non-interactive
          echo ""
          echo "✅ OTA update published to OnSpace AI (branch: $BRANCH)."
          echo "📡 Verify at: https://expo.dev/accounts/iron-eagle-security/projects/freedomcamp-manager/updates"
