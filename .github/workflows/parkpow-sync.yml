name: ParkPow Sync

# -----------------------------------------------------------------------
# Triggers ParkPow sync operations (zone lots, watchlist, violations)
# from the GitHub web UI. No local install required.
#
# Required repository secrets:
#   SUPABASE_URL              – your Supabase project URL
#   SUPABASE_SERVICE_ROLE_KEY – service role key (Supabase → Settings → API)
#
# How to run:
#   GitHub repo → Actions → "ParkPow Sync" → Run workflow
# -----------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'What to sync'
        required: true
        default: 'sync-watchlist'
        type: choice
        options:
          - sync-lots        # Sync Supabase zones → ParkPow lots
          - sync-watchlist   # Push flagged/exempt vehicles to ParkPow watchlist
          - push-violations  # Push unsynced breach observations to ParkPow
          - all              # Run all three in sequence

  # Also run automatically every night at 2 AM UTC to keep ParkPow in sync
  schedule:
    - cron: '0 2 * * *'

jobs:
  parkpow-sync:
    name: ParkPow sync (${{ github.event.inputs.action || 'all' }})
    runs-on: ubuntu-latest

    steps:
      - name: Check required secrets
        run: |
          missing=""
          [ -z "$SUPABASE_URL"              ] && missing="$missing SUPABASE_URL"
          [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] && missing="$missing SUPABASE_SERVICE_ROLE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing"
            echo "::notice::Add these at: GitHub repo → Settings → Secrets → Actions"
            exit 1
          fi
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Determine actions to run
        id: actions
        run: |
          INPUT="${{ github.event.inputs.action || 'all' }}"
          if [ "$INPUT" = "all" ]; then
            echo "actions=sync-lots sync-watchlist push-violations" >> "$GITHUB_OUTPUT"
          else
            echo "actions=$INPUT" >> "$GITHUB_OUTPUT"
          fi

      - name: Run ParkPow sync action(s)
        run: |
          for action in ${{ steps.actions.outputs.actions }}; do
            echo "→ Running ParkPow action: $action …"
            RESPONSE=$(curl -s -w "\n%{http_code}" \
              -X POST \
              "${SUPABASE_URL}/functions/v1/parkpow-sync" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Content-Type: application/json" \
              -d "{\"action\": \"$action\"}")

            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | head -n-1)

            echo "  HTTP $HTTP_CODE"
            echo "  $BODY"

            if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
              echo "::error::ParkPow sync action '$action' failed (HTTP $HTTP_CODE)"
              exit 1
            fi
            echo "  ✅ $action complete"
          done
          echo ""
          echo "✅ All ParkPow sync actions complete."
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
