name: One-off Fix Inference Service Railway Variables

on:
  workflow_dispatch:
    inputs:
      intel_hmac_key:
        description: 'INTEL_HMAC_KEY value to set'
        required: true
        type: string

jobs:
  fix-vars:
    name: Set INTEL_HMAC_KEY and OLLAMA_BASE_URL on inference service
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli@latest --silent

      - name: Set INTEL_HMAC_KEY
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_BOB_TOKEN || secrets.RAILWAY_TOKEN }}
        run: |
          railway variable set \
            --service "${{ secrets.RAILWAY_INFERENCE_SERVICE_ID }}" \
            --environment production \
            --skip-deploys \
            "INTEL_HMAC_KEY=${{ inputs.intel_hmac_key }}"
          echo "✅ INTEL_HMAC_KEY set"

      - name: Set OLLAMA_BASE_URL
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_BOB_TOKEN || secrets.RAILWAY_TOKEN }}
        run: |
          railway variable set \
            --service "${{ secrets.RAILWAY_INFERENCE_SERVICE_ID }}" \
            --environment production \
            --skip-deploys \
            "OLLAMA_BASE_URL=http://ollama.railway.internal:11434"
          echo "✅ OLLAMA_BASE_URL set"

      - name: Verify
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_BOB_TOKEN || secrets.RAILWAY_TOKEN }}
        run: |
          echo "Current variables:"
          railway variable list \
            --service "${{ secrets.RAILWAY_INFERENCE_SERVICE_ID }}" \
            --environment production \
            --kv 2>&1 | grep -E "INTEL_HMAC_KEY|OLLAMA_BASE_URL" || true
