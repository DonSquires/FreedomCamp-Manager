name: Ops - Set Supabase Edge Function Secrets

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (print what would be set, do not set)'
        required: false
        default: 'false'
        type: choice
        options: [false, true]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  set-secrets:
    name: Set Supabase Edge Function Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Set inference secrets
        env:
          SUPABASE_ACCESS_TOKEN:    ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF:     ${{ secrets.SUPABASE_PROJECT_REF }}
          INFERENCE_SERVICE_URL:    ${{ secrets.INFERENCE_SERVICE_URL }}
          INFERENCE_API_KEY:        ${{ secrets.INFERENCE_API_KEY }}
          RUNPOD_ENDPOINT_API_KEY:  ${{ secrets.RUNPOD_ENDPOINT_API_KEY }}
          # Proxy / NZSCV secrets — Railway proxy holds the whitelisted static IP
          PROXY_SERVER_URL:         ${{ secrets.PROXY_SERVER_URL }}
          NZSCV_PROXY_URL:          ${{ secrets.NZSCV_PROXY_URL }}
          PROXY_SERVICE_URL:        ${{ secrets.PROXY_SERVICE_URL }}
          NZSCV_PROXY_SECRET:       ${{ secrets.NZSCV_PROXY_SECRET }}
          PROXY_SECRET:             ${{ secrets.PROXY_SECRET }}
          DRY_RUN:                  ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          echo "Project: $SUPABASE_PROJECT_REF"
          echo "INFERENCE_SERVICE_URL: ${INFERENCE_SERVICE_URL:0:40}..."
          echo "INFERENCE_API_KEY set: $( [[ -n "$INFERENCE_API_KEY" ]] && echo yes || echo NO )"
          echo "RUNPOD_ENDPOINT_API_KEY set: $( [[ -n "$RUNPOD_ENDPOINT_API_KEY" ]] && echo yes || echo NO )"

          # Resolve proxy URL — try all aliases
          FINAL_PROXY_URL="${PROXY_SERVER_URL:-${NZSCV_PROXY_URL:-${PROXY_SERVICE_URL:-}}}"
          FINAL_PROXY_SECRET="${NZSCV_PROXY_SECRET:-${PROXY_SECRET:-}}"

          echo "PROXY URL set: $( [[ -n "$FINAL_PROXY_URL" ]] && echo "yes (${FINAL_PROXY_URL:0:40}...)" || echo NO )"
          echo "PROXY SECRET set: $( [[ -n "$FINAL_PROXY_SECRET" ]] && echo yes || echo NO )"

          if [ "$DRY_RUN" = "true" ]; then
            echo "DRY RUN — not setting secrets."
            exit 0
          fi

          # Use RUNPOD_ENDPOINT_API_KEY (the known-working RunPod API key)
          FINAL_API_KEY="${RUNPOD_ENDPOINT_API_KEY}"

          RUNPOD_URL="https://api.runpod.ai/v2/n0bp1ifmq01cx2"

          echo "Setting INFERENCE_SERVICE_URL to RunPod endpoint ..."
          supabase secrets set "INFERENCE_SERVICE_URL=$RUNPOD_URL" --project-ref "$SUPABASE_PROJECT_REF"

          echo "Setting INFERENCE_API_KEY ..."
          supabase secrets set "INFERENCE_API_KEY=$FINAL_API_KEY" --project-ref "$SUPABASE_PROJECT_REF"

          echo "Setting RUNPOD_ENDPOINT_API_KEY ..."
          supabase secrets set "RUNPOD_ENDPOINT_API_KEY=$FINAL_API_KEY" --project-ref "$SUPABASE_PROJECT_REF"

          echo "Setting OLLAMA_VISION_MODEL ..."
          supabase secrets set "OLLAMA_VISION_MODEL=llama3.2-vision:11b" --project-ref "$SUPABASE_PROJECT_REF"

          # Push proxy secrets to Supabase so edge functions can reach the Railway proxy
          if [ -n "$FINAL_PROXY_URL" ]; then
            echo "Setting NZSCV_PROXY_URL ..."
            supabase secrets set "NZSCV_PROXY_URL=$FINAL_PROXY_URL" --project-ref "$SUPABASE_PROJECT_REF"
            supabase secrets set "PROXY_SERVER_URL=$FINAL_PROXY_URL" --project-ref "$SUPABASE_PROJECT_REF"
          else
            echo "⚠️  PROXY_SERVER_URL/NZSCV_PROXY_URL not set — NZSCV lookups will be unavailable."
            echo "   Add PROXY_SERVER_URL to GitHub Actions repository secrets (Settings → Secrets)."
          fi

          if [ -n "$FINAL_PROXY_SECRET" ]; then
            echo "Setting NZSCV_PROXY_SECRET ..."
            supabase secrets set "NZSCV_PROXY_SECRET=$FINAL_PROXY_SECRET" --project-ref "$SUPABASE_PROJECT_REF"
            supabase secrets set "PROXY_SERVER_SECRET=$FINAL_PROXY_SECRET" --project-ref "$SUPABASE_PROJECT_REF"
          fi

          echo "✅ Supabase secrets updated."
          echo "Listing current secret names:"
          supabase secrets list --project-ref "$SUPABASE_PROJECT_REF" | grep -E "INFERENCE|RUNPOD|OLLAMA|PROXY|NZSCV" || true
