name: Triage Production Bug Reports

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUPABASE_BASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL || format('https://{0}.supabase.co', secrets.SUPABASE_PROJECT_REF) }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Validate secrets
        run: |
          set -euo pipefail
          [ -n "${SUPABASE_BASE_URL:-}" ] || { echo "❌ Missing VITE_SUPABASE_URL/SUPABASE_URL"; exit 1; }
          [ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ] || { echo "❌ Missing SUPABASE_SERVICE_ROLE_KEY"; exit 1; }
          echo "✅ Secrets present"

      - name: Fetch unresolved bug reports
        id: fetch_bugs
        continue-on-error: true
        run: |
          set -euo pipefail
          URL="${SUPABASE_BASE_URL%/}/rest/v1/bug_reports?select=id,title,severity,status,issue_type,current_page,created_at,description,console_errors,screenshot_metadata,app_version&status=neq.resolved&order=created_at.desc&limit=120"
          
          code=$(curl -sS -o /tmp/bugs.json -w "%{http_code}" "$URL" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json")
          
          response=$(cat /tmp/bugs.json 2>/dev/null || echo "{}")
          echo "api_response=$response" >> "$GITHUB_ENV"
          echo "http_code=$code"
          
          # Handle different HTTP codes
          case "$code" in
            200)
              # Success - continue with analysis
              echo "✅ Successfully fetched bug reports"
              ;;
            404)
              # Table not found - create empty result set
              echo "⚠️  bug_reports table not found (404) - this is expected on first deployment"
              echo '[]' > /tmp/bugs.json
              ;;
            401|403)
              # Unauthorized/Forbidden - likely RLS issue, continue gracefully
              echo "⚠️  Access denied (HTTP $code) - check RLS policies, continuing with empty set"
              echo '[]' > /tmp/bugs.json
              ;;
            *)
              # Other errors - fail but show the response
              echo "❌ Failed to fetch bug reports (HTTP $code)"
              echo "$response"
              exit 1
              ;;
          esac
          python - << 'PY'
import json, collections
from pathlib import Path
rows = json.loads(Path('/tmp/bugs.json').read_text() or '[]')
print(f"open_reports={len(rows)}")
if not rows:
    raise SystemExit(0)

sev = collections.Counter((r.get('severity') or 'unknown') for r in rows)
page = collections.Counter((r.get('current_page') or 'unknown') for r in rows)
issue = collections.Counter((r.get('issue_type') or 'unknown') for r in rows)
print('\nTop severities:')
for k,v in sev.most_common(8):
    print(f"- {k}: {v}")
print('\nTop pages:')
for k,v in page.most_common(12):
    print(f"- {k}: {v}")
print('\nTop issue types:')
for k,v in issue.most_common(12):
    print(f"- {k}: {v}")

print('\nLatest 20 reports:')
for r in rows[:20]:
    print(f"- [{r.get('severity')}] [{r.get('status')}] {r.get('id')} page={r.get('current_page')} type={r.get('issue_type')} title={r.get('title')}")

# Lightweight signature extraction from console errors / metadata
sig = collections.Counter()
for r in rows:
    ce = r.get('console_errors')
    if isinstance(ce, list):
      for e in ce[:5]:
        if isinstance(e, dict):
          msg = str(e.get('message') or '')
          if msg:
            sig[msg[:140]] += 1
    meta = r.get('screenshot_metadata') or {}
    lsd = meta.get('live_session_diagnostics') if isinstance(meta, dict) else None
    events = (lsd or {}).get('recent_events') if isinstance(lsd, dict) else None
    if isinstance(events, list):
      for ev in events[:8]:
        if isinstance(ev, dict):
          et = str(ev.get('event_type') or '').strip()
          if et:
            sig[f"event:{et}"] += 1

print('\nTop error/event signatures:')
for k,v in sig.most_common(15):
    print(f"- {v}x {k}")
PY

      - name: Enforce bug triage (strict mode)
        if: steps.fetch_bugs.outcome == 'failure' && vars.TRIAGE_STRICT == 'true'
        run: exit 1

      - name: Report bug triage (non-strict)
        if: steps.fetch_bugs.outcome == 'failure' && vars.TRIAGE_STRICT != 'true'
        run: echo "::warning::Bug report triage failed but continuing (non-strict mode). Set TRIAGE_STRICT=true to enforce."
