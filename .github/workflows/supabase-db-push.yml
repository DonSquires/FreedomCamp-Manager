name: Apply Supabase migrations (db push)

# ⚠️ SCHEMA GOVERNANCE
# This workflow pushes SQL migrations to the chosen environment (staging or production).
# It is triggered manually (workflow_dispatch) only.
#
# REQUIRED BEFORE RUNNING:
# 1. The PR containing the migration must have been reviewed and approved by @DonSquires
# 2. docs/LIVE_SCHEMA.md must have been updated in that same PR
# 3. src/types/database.ts and src/types/index.ts must pass `npx tsc -b --noEmit`
#
# The production path runs in the "production-schema" environment which requires
# a manual approval from @DonSquires before the push step executes.
# Configure environments at: Settings → Environments
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN    — personal access token (sbp_…) from
#                              https://supabase.com/dashboard/account/tokens
#
# Production (preferred names):
#   PRODUCTION_PROJECT_ID    — Supabase project reference ID for production
#   PRODUCTION_DB_PASSWORD   — Database password for the production project
#
# Staging (optional):
#   STAGING_PROJECT_ID       — Supabase project reference ID for staging
#   STAGING_DB_PASSWORD      — Database password for the staging project
#
# Legacy fallback names (accepted when PRODUCTION_* are absent):
#   SUPABASE_PROJECT_REF     — Alias for PRODUCTION_PROJECT_ID
#   SUPABASE_DB_PASSWORD     — Alias for PRODUCTION_DB_PASSWORD
#
# See docs/SUPABASE_GITHUB_SETUP.md for full setup instructions.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      confirmed:
        description: "I have reviewed and approved the migration PR and updated docs/LIVE_SCHEMA.md"
        required: true
        type: boolean
        default: false

env:
  # supabase/setup-cli@v1 still bundles Node.js 20; force the runner to use
  # Node.js 24 so the action keeps working after the June 2026 cut-over.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Gate: abort immediately if the operator did not explicitly confirm
  confirm_approval:
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit confirmation
        if: ${{ !inputs.confirmed }}
        run: |
          echo "::error::You must tick the 'confirmed' checkbox to acknowledge schema governance requirements."
          exit 1

  db_push:
    needs: confirm_approval
    runs-on: ubuntu-latest
    # Production pushes require a manual approval gate; staging does not.
    environment: ${{ inputs.environment == 'production' && 'production-schema' || 'staging-schema' }}
    env:
      SUPABASE_ACCESS_TOKEN:   ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # Preferred secret names
      PRODUCTION_PROJECT_ID:   ${{ secrets.PRODUCTION_PROJECT_ID }}
      PRODUCTION_DB_PASSWORD:  ${{ secrets.PRODUCTION_DB_PASSWORD }}
      STAGING_PROJECT_ID:      ${{ secrets.STAGING_PROJECT_ID }}
      STAGING_DB_PASSWORD:     ${{ secrets.STAGING_DB_PASSWORD }}
      # Legacy fallback names
      SUPABASE_PROJECT_REF:    ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD_LEGACY: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Resolve project credentials
        id: creds
        run: |
          set -euo pipefail
          TARGET="${{ inputs.environment }}"

          if [ "$TARGET" = "staging" ]; then
            PROJECT_ID="${STAGING_PROJECT_ID:-}"
            DB_PASSWORD="${STAGING_DB_PASSWORD:-}"
          else
            # Prefer new PRODUCTION_* names; fall back to legacy SUPABASE_* names.
            PROJECT_ID="${PRODUCTION_PROJECT_ID:-${SUPABASE_PROJECT_REF:-}}"
            DB_PASSWORD="${PRODUCTION_DB_PASSWORD:-${SUPABASE_DB_PASSWORD_LEGACY:-}}"
          fi

          missing=0
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing required secret: SUPABASE_ACCESS_TOKEN"
            missing=1
          fi
          if [ -z "$PROJECT_ID" ]; then
            if [ "$TARGET" = "staging" ]; then
              echo "::error::Missing required secret for staging: STAGING_PROJECT_ID"
            else
              echo "::error::Missing required secret for production: PRODUCTION_PROJECT_ID (or legacy SUPABASE_PROJECT_REF)"
            fi
            missing=1
          fi
          if [ -z "$DB_PASSWORD" ]; then
            if [ "$TARGET" = "staging" ]; then
              echo "::error::Missing required secret for staging: STAGING_DB_PASSWORD"
            else
              echo "::error::Missing required secret for production: PRODUCTION_DB_PASSWORD (or legacy SUPABASE_DB_PASSWORD)"
            fi
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "  See docs/SUPABASE_GITHUB_SETUP.md for instructions on setting repository secrets."
            exit 1
          fi

          echo "project_id=${PROJECT_ID}"   >> "$GITHUB_OUTPUT"
          echo "db_password=${DB_PASSWORD}" >> "$GITHUB_OUTPUT"
          echo "Credentials resolved for target: $TARGET"

      - name: Link project
        run: |
          set -euo pipefail
          supabase --version
          supabase link \
            --project-ref "${{ steps.creds.outputs.project_id }}" \
            --password    "${{ steps.creds.outputs.db_password }}"

      - name: Repair legacy migration history drift
        run: |
          set -euo pipefail
          # Known legacy migration versions that exist on remote as short-form entries
          # (date-only, no timestamp) but map to full timestamped local files.
          # Repair is safe and idempotent; each call is a no-op if the version is absent.
          for version in 20250127 20260309 20260312 20260313 20260316 20260320; do
            supabase migration repair --status reverted "$version" || true
          done

      - name: Apply migrations
        run: |
          set -euo pipefail

          LOG_FILE="$(mktemp)"

          for attempt in 1 2 3; do
            echo "supabase db push attempt $attempt..."
            if supabase db push 2>&1 | tee "$LOG_FILE"; then
              exit 0
            fi

            handled=false

            # Case 1: local migrations appear before remote tail.
            if grep -q "Found local migration files to be inserted before the last migration on remote database" "$LOG_FILE"; then
              echo "Detected out-of-order local migrations. Reconciling as applied..."
              grep -oE 'supabase/migrations/[0-9][^[:space:]]*\.sql' "$LOG_FILE" \
                | sed 's#supabase/migrations/##; s#\.sql$##' \
                | awk -F'_' '{print $1}' \
                | sort -u \
                | while read -r version; do
                    if [ -n "$version" ]; then
                      echo "Marking migration as applied: $version"
                      supabase migration repair --status applied "$version" || true
                    fi
                  done
              handled=true
            fi

            # Case 2: remote history contains versions absent locally.
            if grep -q "Remote migration versions not found in local migrations directory" "$LOG_FILE"; then
              REVERT_VERSIONS=$(grep -oE 'supabase migration repair --status reverted [0-9 ]+' "$LOG_FILE" | sed -E 's/^supabase migration repair --status reverted //' | head -n1)
              if [ -n "${REVERT_VERSIONS:-}" ]; then
                echo "Reverting remote-only migration versions: $REVERT_VERSIONS"
                # shellcheck disable=SC2086
                supabase migration repair --status reverted $REVERT_VERSIONS || true
                handled=true
              fi
            fi

            if [ "$handled" = false ]; then
              echo "supabase db push failed for a non-reconciliation reason"
              cat "$LOG_FILE"
              exit 1
            fi
          done

          echo "supabase db push failed after reconciliation attempts"
          cat "$LOG_FILE"

          # Final attempt: force-apply all local migrations with --include-all.
          # This executes the SQL of any local files that appear before the remote
          # head (idempotent migrations: CREATE OR REPLACE, DROP … IF EXISTS, etc.).
          echo "Final attempt: supabase db push --include-all..."
          if supabase db push --include-all 2>&1 | tee "$LOG_FILE"; then
            exit 0
          fi

          # If --include-all still reports remote-only versions, repair and retry once.
          if grep -q "Remote migration versions not found in local migrations directory" "$LOG_FILE"; then
            REVERT_VERSIONS=$(grep -oE 'supabase migration repair --status reverted [0-9 ]+' "$LOG_FILE" | sed -E 's/^supabase migration repair --status reverted //' | head -n1)
            if [ -n "${REVERT_VERSIONS:-}" ]; then
              echo "Post-include-all repair: reverting remote-only versions: $REVERT_VERSIONS"
              # shellcheck disable=SC2086
              supabase migration repair --status reverted $REVERT_VERSIONS || true
              echo "Retrying supabase db push --include-all after post-repair..."
              if supabase db push --include-all 2>&1 | tee "$LOG_FILE"; then
                exit 0
              fi
            fi
          fi

          cat "$LOG_FILE"
          exit 1