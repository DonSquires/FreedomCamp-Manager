name: Apply Supabase migrations (db push)

# -----------------------------------------------------------------------
# Applies all pending Supabase migrations from the GitHub web UI using
# `supabase db push`.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_PROJECT_REF    – Reference ID shown in Supabase → Settings → General
#   SUPABASE_DB_PASSWORD    – Database password (Supabase → Settings → Database)
#   SUPABASE_ACCESS_TOKEN   – Personal access token from
#                             https://supabase.com/dashboard/account/tokens
#                             (required for supabase db push to authenticate)
#
# How to run:
#   GitHub repo → Actions → "Apply Supabase migrations (db push)" → Run workflow
# -----------------------------------------------------------------------

on:
  workflow_dispatch: {}

jobs:
  db-push:
    name: Apply all pending migrations
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check required secrets
        run: |
          missing=""
          [ -z "$SUPABASE_PROJECT_REF"  ] && missing="$missing SUPABASE_PROJECT_REF"
          [ -z "$SUPABASE_DB_PASSWORD"  ] && missing="$missing SUPABASE_DB_PASSWORD"
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing"
            echo "Add them at: GitHub repo → Settings → Secrets and variables → Actions → New repository secret"
            echo "  SUPABASE_PROJECT_REF:  your project Reference ID (Supabase → Settings → General)"
            echo "  SUPABASE_DB_PASSWORD:  your database password   (Supabase → Settings → Database)"
            echo "  SUPABASE_ACCESS_TOKEN: personal token from https://supabase.com/dashboard/account/tokens"
            exit 1
          fi
          echo "✅ All required secrets are present"
        env:
          SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push all pending migrations
        run: |
          echo "Pushing pending migrations to project $SUPABASE_PROJECT_REF …"
          supabase db push
          echo ""
          echo "✅ All pending migrations applied successfully."
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
