name: Apply Supabase migrations (db push)

# ⚠️ SCHEMA GOVERNANCE
# This workflow pushes SQL migrations directly to the production database.
# It is triggered manually (workflow_dispatch) only.
#
# REQUIRED BEFORE RUNNING:
# 1. The PR containing the migration must have been reviewed and approved by @DonSquires
# 2. docs/LIVE_SCHEMA.md must have been updated in that same PR
# 3. src/types/database.ts and src/types/index.ts must pass `npx tsc -b --noEmit`
#
# The workflow runs in the "production-schema" environment which requires
# a manual approval from @DonSquires before the push step executes.
# Configure the environment at: Settings → Environments → production-schema

on:
  workflow_dispatch:
    inputs:
      confirmed:
        description: "I have reviewed and approved the migration PR and updated docs/LIVE_SCHEMA.md"
        required: true
        type: boolean
        default: false

jobs:
  # Gate: abort immediately if the operator did not explicitly confirm
  confirm_approval:
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit confirmation
        if: ${{ !inputs.confirmed }}
        run: |
          echo "::error::You must tick the 'confirmed' checkbox to acknowledge schema governance requirements."
          exit 1

  db_push:
    needs: confirm_approval
    runs-on: ubuntu-latest
    environment: production-schema   # requires manual approval from @DonSquires in GitHub UI
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate required secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          missing=0
          for var in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Missing required secret: $var"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          supabase --version
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Repair legacy migration history drift
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          # Some older projects contain legacy migration versions (e.g. 20250127)
          # that do not map cleanly to current timestamped migration history.
          # Repair is safe and idempotent; ignore if version is absent.
          supabase migration repair --status reverted 20250127 || true

      - name: Apply migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail

          LOG_FILE="$(mktemp)"

          for attempt in 1 2 3; do
            echo "supabase db push attempt $attempt..."
            if supabase db push 2>&1 | tee "$LOG_FILE"; then
              exit 0
            fi

            handled=false

            # Case 1: local migrations appear before remote tail.
            if grep -q "Found local migration files to be inserted before the last migration on remote database" "$LOG_FILE"; then
              echo "Detected out-of-order local migrations. Reconciling as applied..."
              grep -oE 'supabase/migrations/[0-9][^[:space:]]*\.sql' "$LOG_FILE" \
                | sed 's#supabase/migrations/##; s#\.sql$##' \
                | awk -F'_' '{print $1}' \
                | sort -u \
                | while read -r version; do
                    if [ -n "$version" ]; then
                      echo "Marking migration as applied: $version"
                      supabase migration repair --status applied "$version" || true
                    fi
                  done
              handled=true
            fi

            # Case 2: remote history contains versions absent locally.
            if grep -q "Remote migration versions not found in local migrations directory" "$LOG_FILE"; then
              REVERT_VERSIONS=$(grep -oE 'supabase migration repair --status reverted [0-9 ]+' "$LOG_FILE" | sed -E 's/^supabase migration repair --status reverted //' | head -n1)
              if [ -n "${REVERT_VERSIONS:-}" ]; then
                echo "Reverting remote-only migration versions: $REVERT_VERSIONS"
                # shellcheck disable=SC2086
                supabase migration repair --status reverted $REVERT_VERSIONS || true
                handled=true
              fi
            fi

            if [ "$handled" = false ]; then
              echo "supabase db push failed for a non-reconciliation reason"
              cat "$LOG_FILE"
              exit 1
            fi
          done

          echo "supabase db push failed after reconciliation attempts"
          cat "$LOG_FILE"

          # Final attempt: force-apply all local migrations with --include-all.
          # This executes the SQL of any local files that appear before the remote
          # head (idempotent migrations: CREATE OR REPLACE, DROP … IF EXISTS, etc.).
          echo "Final attempt: supabase db push --include-all..."
          if supabase db push --include-all 2>&1 | tee "$LOG_FILE"; then
            exit 0
          fi
          cat "$LOG_FILE"
          exit 1