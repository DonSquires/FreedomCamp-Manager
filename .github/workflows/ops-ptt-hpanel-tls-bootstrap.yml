name: Ops PTT hPanel TLS Bootstrap

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ops-ptt-hpanel-tls-bootstrap.yml'
      - 'ops/ptt-tls-bootstrap.trigger'
  workflow_dispatch:
    inputs:
      ptt_domain:
        description: "Public DNS host for PTT (example: ptt.example.com)"
        required: true
        type: string
      certbot_email:
        description: "Email for Let's Encrypt registration"
        required: true
        type: string
      ptt_upstream_host:
        description: "Private upstream host for PTT server on VPS"
        required: false
        default: "127.0.0.1"
        type: string
      ptt_upstream_port:
        description: "Private upstream port for PTT server on VPS"
        required: false
        default: "8080"
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  bootstrap:
    name: Configure TLS and Sync PTT Secrets
    runs-on: ubuntu-latest
    env:
      PTT_DOMAIN_RESOLVED: ${{ github.event.inputs.ptt_domain || vars.PTT_DOMAIN || 'ptt.fcmanager.co.nz' }}
      CERTBOT_EMAIL_RESOLVED: ${{ github.event.inputs.certbot_email || vars.CERTBOT_EMAIL || 'squires.don@gmail.com' }}
      PTT_UPSTREAM_HOST_RESOLVED: ${{ github.event.inputs.ptt_upstream_host || vars.PTT_UPSTREAM_HOST || '127.0.0.1' }}
      PTT_UPSTREAM_PORT_RESOLVED: ${{ github.event.inputs.ptt_upstream_port || vars.PTT_UPSTREAM_PORT || '8080' }}
    permissions:
      contents: read

    steps:
      - name: Validate required secrets
        env:
          VPS_IP: ${{ secrets.VPS_IP }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          : "${VPS_IP:?VPS_IP secret is required}"
          : "${VPS_USERNAME:?VPS_USERNAME secret is required}"
          : "${VPS_SSH_KEY:?VPS_SSH_KEY secret is required}"
          : "${SUPABASE_ACCESS_TOKEN:?SUPABASE_ACCESS_TOKEN secret is required}"
          : "${SUPABASE_PROJECT_REF:?SUPABASE_PROJECT_REF secret is required}"

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure nginx and certbot on VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          PTT_DOMAIN: ${{ env.PTT_DOMAIN_RESOLVED }}
          CERTBOT_EMAIL: ${{ env.CERTBOT_EMAIL_RESOLVED }}
          PTT_UPSTREAM_HOST: ${{ env.PTT_UPSTREAM_HOST_RESOLVED }}
          PTT_UPSTREAM_PORT: ${{ env.PTT_UPSTREAM_PORT_RESOLVED }}
        with:
          host: ${{ secrets.VPS_IP }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: PTT_DOMAIN,CERTBOT_EMAIL,PTT_UPSTREAM_HOST,PTT_UPSTREAM_PORT
          timeout: 90s
          command_timeout: 30m
          script: |
            set -euo pipefail

            : "${PTT_DOMAIN:?PTT_DOMAIN is required}"
            : "${CERTBOT_EMAIL:?CERTBOT_EMAIL is required}"
            : "${PTT_UPSTREAM_HOST:=127.0.0.1}"
            : "${PTT_UPSTREAM_PORT:=8080}"

            sudo apt-get update -y
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y nginx certbot python3-certbot-nginx

            # Ensure inbound ACME challenge and TLS traffic are permitted.
            sudo ufw allow 80/tcp || true
            sudo ufw allow 443/tcp || true
            sudo ufw reload || true

            sudo tee "/etc/nginx/sites-available/ptt-${PTT_DOMAIN}.conf" >/dev/null <<EOF
            server {
              listen 80;
              server_name ${PTT_DOMAIN};

              location / {
                proxy_pass http://${PTT_UPSTREAM_HOST}:${PTT_UPSTREAM_PORT};
                proxy_http_version 1.1;
                proxy_set_header Upgrade \$http_upgrade;
                proxy_set_header Connection "Upgrade";
                proxy_set_header Host \$host;
                proxy_set_header X-Real-IP \$remote_addr;
                proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto \$scheme;
                proxy_read_timeout 3600;
                proxy_send_timeout 3600;
              }

              location /ws {
                proxy_pass http://${PTT_UPSTREAM_HOST}:${PTT_UPSTREAM_PORT}/ws;
                proxy_http_version 1.1;
                proxy_set_header Upgrade \$http_upgrade;
                proxy_set_header Connection "Upgrade";
                proxy_set_header Host \$host;
                proxy_read_timeout 3600;
                proxy_send_timeout 3600;
              }

              location /health {
                proxy_pass http://${PTT_UPSTREAM_HOST}:${PTT_UPSTREAM_PORT}/health;
              }
            }
            EOF

            sudo ln -sf "/etc/nginx/sites-available/ptt-${PTT_DOMAIN}.conf" "/etc/nginx/sites-enabled/ptt-${PTT_DOMAIN}.conf"
            sudo rm -f /etc/nginx/sites-enabled/default
            sudo nginx -t
            sudo systemctl reload nginx

            sudo certbot --nginx -d "${PTT_DOMAIN}" --non-interactive --agree-tos -m "${CERTBOT_EMAIL}" --redirect

            sudo nginx -t
            sudo systemctl reload nginx

            curl -sSf --max-time 20 "https://${PTT_DOMAIN}/health" >/tmp/ptt_tls_health.json
            cat /tmp/ptt_tls_health.json || true

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check optional validation secret
        id: check-validation-secrets
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -n "$SUPABASE_ANON_KEY" ]; then
            echo "anon_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "anon_ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SUPABASE_ANON_KEY missing; secure PTT response validation will be skipped."
          fi

      - name: Sync secure PTT secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          PTT_DOMAIN: ${{ env.PTT_DOMAIN_RESOLVED }}
        run: |
          set -euo pipefail

          PTT_PUBLIC_HTTPS_URL="https://${PTT_DOMAIN}"
          PTT_PUBLIC_WSS_URL="wss://${PTT_DOMAIN}/ws"

          supabase secrets set \
            "PTT_SERVER_URL=${PTT_PUBLIC_HTTPS_URL}" \
            "PTT_WS_URL=${PTT_PUBLIC_WSS_URL}" \
            --project-ref "${SUPABASE_PROJECT_REF}"

      - name: Deploy PTT edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          supabase functions deploy ptt-signaling-token --project-ref "${SUPABASE_PROJECT_REF}"
          supabase functions deploy check-railway-health --project-ref "${SUPABASE_PROJECT_REF}"
          supabase functions deploy check-ptt-health --project-ref "${SUPABASE_PROJECT_REF}"

      - name: Validate secure PTT response
        if: steps.check-validation-secrets.outputs.anon_ready == 'true'
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          curl -sS "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/check-ptt-health" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            | jq '{ptt_url, ptt_ws_url, ptt_ws_url_validation}'
