name: Push Supabase Auth Config

# -----------------------------------------------------------------------
# Pushes auth settings from supabase/config.toml to the hosted Supabase
# project.  This syncs:
#   - site_url        → primary CORS allowed origin for Supabase REST API
#   - additional_redirect_urls → all other allowed origins / redirect targets
#
# Run this workflow whenever:
#   • A new Onspace preview or production domain needs to be added
#   • CORS errors appear with a new deploy URL
#   • After manually editing [auth] in supabase/config.toml
#
# Required repository secrets (Settings → Secrets → Actions):
#   SUPABASE_ACCESS_TOKEN   – from https://supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF    – your project ref (Settings → General → Reference ID)
# -----------------------------------------------------------------------

on:
  workflow_dispatch:

jobs:
  push-config:
    name: Push Supabase auth config
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check required secrets
        run: |
          missing=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$SUPABASE_PROJECT_REF"  ] && missing="$missing SUPABASE_PROJECT_REF"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing"
            echo "Add these at: GitHub repo → Settings → Secrets and variables → Actions → New repository secret"
            echo "  SUPABASE_ACCESS_TOKEN: get from https://supabase.com/dashboard/account/tokens"
            echo "  SUPABASE_PROJECT_REF:  get from Supabase → Project Settings → General → Reference ID"
            exit 1
          fi
          echo "✅ Secrets present"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push auth config to Supabase project
        run: |
          echo "Pushing supabase/config.toml [auth] settings to project $SUPABASE_PROJECT_REF …"
          supabase config push --project-ref "$SUPABASE_PROJECT_REF" --include-all
          echo ""
          echo "✅ Auth config pushed successfully."
          echo "   site_url and additional_redirect_urls are now live in the project."
          echo "   Supabase REST API CORS will reflect the updated allowed origins."
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}
