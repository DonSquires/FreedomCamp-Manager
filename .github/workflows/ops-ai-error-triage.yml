name: Ops - AI Error Triage & Fix PR

# AI Orchestration Engine — first component.
#
# Triggered by repository_dispatch (event_type: self-heal-error) from:
#   - vercel-webhook-ingest  (Vercel production deployment failures)
#   - Railway webhook relay  (service crashes / OOM events)
#   - ops-self-healing-watchdog (GitHub Actions CI failures)
#
# Flow:
#   1. DETECT   – parse error from client_payload, log to self_heal_events
#   2. ANALYZE  – call Bob (via ops-bob-code-task pattern) to get root-cause + fix plan
#   3. GUARDRAIL – recurrence check: if same fingerprint seen < 10 min ago, skip and page human
#   4. REMEDIATE – create fix branch ops/ai-fix/<sha>-<ts>, apply Bob's file changes, open PR
#   5. VALIDATE  – run npm run build + lint; auto-merge only if both pass
#
# Guardrails:
#   - Never pushes directly to main; always via PR + checks
#   - Recurrence circuit: same error fingerprint within 10 min → human escalation only
#   - Schema files (supabase/migrations/) blocked from AI modification

on:
  repository_dispatch:
    types:
      - self-heal-error

  workflow_dispatch:
    inputs:
      error_summary:
        description: 'Manual error description to triage'
        required: true
        type: string
      source:
        description: 'Error source'
        required: false
        default: 'manual'
        type: choice
        options: [manual, vercel, railway, github_actions, supabase]
      git_commit_sha:
        description: 'Optional: commit SHA the error originated on'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  models: read

concurrency:
  # One AI triage job at a time — prevent concurrent overlapping fix PRs
  group: ops-ai-error-triage
  cancel-in-progress: false

jobs:
  triage:
    name: AI Error Triage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.BOB_WORKER_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL || '' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}
      BOB_SERVICE_URL: ${{ secrets.BOB_SERVICE_URL || secrets.INFERENCE_SERVICE_URL || '' }}
      BOB_INFERENCE_API_KEY: ${{ secrets.BOB_INFERENCE_API_KEY || secrets.INFERENCE_API_KEY || '' }}
      BOB_CODE_TASK_MODEL: ${{ vars.BOB_CODE_TASK_MODEL || 'gpt-4o' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      # ── 1. DETECT ───────────────────────────────────────────────────────────
      - name: Parse error payload
        id: error
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "repository_dispatch" ]; then
            SOURCE=$(jq -r '.client_payload.source // "unknown"' "$GITHUB_EVENT_PATH")
            ENV=$(jq -r '.client_payload.environment // "production"' "$GITHUB_EVENT_PATH")
            SUMMARY=$(jq -r '.client_payload.error_summary // ""' "$GITHUB_EVENT_PATH")
            SHA=$(jq -r '.client_payload.git_commit_sha // ""' "$GITHUB_EVENT_PATH")
            BRANCH=$(jq -r '.client_payload.git_branch // "main"' "$GITHUB_EVENT_PATH")
          else
            SOURCE="${{ inputs.source }}"
            ENV="production"
            SUMMARY="${{ inputs.error_summary }}"
            SHA="${{ inputs.git_commit_sha }}"
            BRANCH="main"
          fi

          # Fingerprint: hash of source + first 120 chars of summary (stable across retries)
          FINGERPRINT=$(printf '%s::%s' "$SOURCE" "${SUMMARY:0:120}" | sha256sum | cut -d' ' -f1)
          FIX_BRANCH="ops/ai-fix/${FINGERPRINT:0:12}-$(date +%Y%m%d%H%M%S)"

          echo "source=$SOURCE"          >> "$GITHUB_OUTPUT"
          echo "environment=$ENV"        >> "$GITHUB_OUTPUT"
          echo "summary=$SUMMARY"        >> "$GITHUB_OUTPUT"
          echo "sha=$SHA"                >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH"          >> "$GITHUB_OUTPUT"
          echo "fingerprint=$FINGERPRINT" >> "$GITHUB_OUTPUT"
          echo "fix_branch=$FIX_BRANCH"  >> "$GITHUB_OUTPUT"

          echo "Error from '$SOURCE' on '$ENV': $SUMMARY"
          echo "Fingerprint: $FINGERPRINT"
          echo "Fix branch will be: $FIX_BRANCH"

      # ── 2. RECURRENCE GUARDRAIL ─────────────────────────────────────────────
      # If the same fingerprint appeared in the last 10 minutes, escalate to
      # human and abort the AI fix loop (strict linear regression protection).
      - name: Check recurrence circuit
        id: recurrence
        env:
          FINGERPRINT: ${{ steps.error.outputs.fingerprint }}
          SUMMARY: ${{ steps.error.outputs.summary }}
          SOURCE: ${{ steps.error.outputs.source }}
        run: |
          set -euo pipefail
          CIRCUIT_FILE="$RUNNER_TEMP/ai-triage-circuit.json"

          # Fetch recent self_heal_events for this fingerprint via Supabase REST API
          RECURRENCE_COUNT=0
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            WINDOW_START=$(date -u -d '10 minutes ago' '+%Y-%m-%dT%H:%M:%SZ' 2>/dev/null || \
                           date -u -v-10M '+%Y-%m-%dT%H:%M:%SZ')
            HTTP_STATUS=$(curl -sf -o "$CIRCUIT_FILE" -w "%{http_code}" \
              "${SUPABASE_URL}/rest/v1/self_heal_events?select=id,created_at&error_fingerprint=eq.${FINGERPRINT}&created_at=gte.${WINDOW_START}&outcome=neq.rolled_back" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" || true)
            if [ "$HTTP_STATUS" = "200" ] && [ -f "$CIRCUIT_FILE" ]; then
              RECURRENCE_COUNT=$(jq 'length' "$CIRCUIT_FILE" 2>/dev/null || echo 0)
            fi
          fi

          echo "recurrence_count=$RECURRENCE_COUNT" >> "$GITHUB_OUTPUT"

          if [ "$RECURRENCE_COUNT" -gt 0 ]; then
            echo "circuit_open=true" >> "$GITHUB_OUTPUT"
            echo "::error::Recurrence circuit OPEN: fingerprint $FINGERPRINT seen $RECURRENCE_COUNT time(s) in the last 10 minutes. Escalating to human — AI fix loop suppressed."
          else
            echo "circuit_open=false" >> "$GITHUB_OUTPUT"
            echo "No recent recurrence detected. Proceeding with AI triage."
          fi

      # ── 3. HUMAN ESCALATION (recurrence path) ───────────────────────────────
      - name: Open human escalation issue (recurrence)
        if: steps.recurrence.outputs.circuit_open == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const summary = `${{ steps.error.outputs.summary }}`
            const source = `${{ steps.error.outputs.source }}`
            const fingerprint = `${{ steps.error.outputs.fingerprint }}`
            const recurrenceCount = `${{ steps.recurrence.outputs.recurrence_count }}`

            const title = `ops: AI fix loop suppressed — recurring error (${source})`
            const labels = ['self-healing', 'ops', 'human-required', 'regression']

            const body = [
              '## AI Orchestration: Recurrence Circuit Tripped',
              '',
              `**Source:** ${source}`,
              `**Error:** ${summary}`,
              `**Fingerprint:** \`${fingerprint}\``,
              `**Recurrence count in last 10 min:** ${recurrenceCount}`,
              '',
              '> The AI fix loop has been suppressed because the same error fingerprint appeared multiple times within 10 minutes. This indicates the previous fix attempt did not resolve the root cause.',
              '',
              '### Required Human Action',
              '1. Review recent `ops/ai-fix/*` PRs for this fingerprint.',
              '2. Check if a previous AI-generated fix was merged and is causing a regression.',
              '3. If a regression is confirmed, the rollback guard workflow should have already triggered — verify.',
              '4. Apply a manual fix and close this issue once resolved.',
            ].join('\n')

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'self-healing,human-required',
              per_page: 20,
            })

            const found = existing.data.find(i => i.title === title)
            if (found) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: found.number, body })
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels })
            }

      - name: Abort on recurrence circuit open
        if: steps.recurrence.outputs.circuit_open == 'true'
        run: |
          echo "AI triage aborted — recurrence circuit is open. Human escalation issue created."
          exit 0

      # ── 4. CHECKOUT & ANALYZE ───────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.BOB_WORKER_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: AI root-cause analysis
        id: analysis
        continue-on-error: true
        env:
          ERROR_SUMMARY: ${{ steps.error.outputs.summary }}
          ERROR_SOURCE: ${{ steps.error.outputs.source }}
          ERROR_SHA: ${{ steps.error.outputs.sha }}
          GITHUB_TOKEN: ${{ secrets.BOB_WORKER_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Build a focused prompt grounded in the repo layout and error context
          PROMPT="You are an expert senior engineer for the FieldOps Manager (FieldOps Manager) codebase.
          Tech stack: React 18 + TypeScript + Vite + Tailwind + Supabase  + npm. Path alias @/* = ./src/*.

          A production error occurred:
          Source: $ERROR_SOURCE
          Error: $ERROR_SUMMARY
          Commit SHA: ${ERROR_SHA:-unknown}

          Repository layout (top-level):
          $(find src -maxdepth 2 -type f -name '*.ts' -o -name '*.tsx' | head -60 | tr '\n' ' ')

          NEVER modify: supabase/migrations/, supabase/functions/ auth logic, src/stores/authStore.ts, src/lib/supabase.ts.

          Respond with a JSON object with exactly these keys:
          {
            \"root_cause\": \"<1-2 sentence root cause>\",
            \"fix_summary\": \"<1 sentence fix description>\",
            \"affected_files\": [\"<relative file path>\", ...],
            \"confidence\": \"high|medium|low\",
            \"pr_title\": \"fix(<scope>): <what was fixed>\",
            \"pr_body\": \"<markdown body for the PR>\"
          }
          If confidence is low or the fix requires schema changes, set affected_files to [] and explain in pr_body."

          # Try GitHub Models API (gpt-4o) for the analysis
          ANALYSIS_RESPONSE=""
          if [ -n "${GITHUB_TOKEN}" ]; then
            ANALYSIS_RESPONSE=$(curl -sf \
              "https://models.inference.ai.azure.com/chat/completions" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"model\":\"$BOB_CODE_TASK_MODEL\",\"messages\":[{\"role\":\"user\",\"content\":$(echo "$PROMPT" | jq -Rs .)}],\"max_tokens\":1500,\"response_format\":{\"type\":\"json_object\"}}" \
              2>/dev/null || echo "")
          fi

          # Fallback: try Bob service if GitHub Models unavailable
          if [ -z "$ANALYSIS_RESPONSE" ] && [ -n "$BOB_SERVICE_URL" ] && [ -n "$BOB_INFERENCE_API_KEY" ]; then
            ANALYSIS_RESPONSE=$(curl -sf \
              "$BOB_SERVICE_URL/analyze" \
              -H "x-inference-api-key: $BOB_INFERENCE_API_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"prompt\":$(echo "$PROMPT" | jq -Rs .)}" \
              2>/dev/null || echo "")
          fi

          # Extract JSON from response
          AI_JSON=""
          if [ -n "$ANALYSIS_RESPONSE" ]; then
            AI_JSON=$(printf '%s' "$ANALYSIS_RESPONSE" | jq -r '.choices[0].message.content // .content // empty' 2>/dev/null || echo "")
          fi

          if [ -z "$AI_JSON" ]; then
            echo "ai_available=false" >> "$GITHUB_OUTPUT"
            echo "affected_files=" >> "$GITHUB_OUTPUT"
            echo "::warning::AI analysis unavailable (no GitHub Models token or Bob service). Fix PR will be created as a stub for human action."
            exit 0
          fi

          echo "ai_available=true" >> "$GITHUB_OUTPUT"

          # Write analysis to file for later steps
          printf '%s' "$AI_JSON" > "$RUNNER_TEMP/ai-analysis.json"

          ROOT_CAUSE=$(printf '%s' "$AI_JSON" | jq -r '.root_cause // "unknown"')
          FIX_SUMMARY=$(printf '%s' "$AI_JSON" | jq -r '.fix_summary // "unknown"')
          PR_TITLE=$(printf '%s' "$AI_JSON" | jq -r '.pr_title // "fix(ai): automated self-heal fix"')
          CONFIDENCE=$(printf '%s' "$AI_JSON" | jq -r '.confidence // "low"')
          AFFECTED=$(printf '%s' "$AI_JSON" | jq -c '.affected_files // []')

          echo "root_cause=$ROOT_CAUSE"   >> "$GITHUB_OUTPUT"
          echo "fix_summary=$FIX_SUMMARY" >> "$GITHUB_OUTPUT"
          echo "pr_title=$PR_TITLE"       >> "$GITHUB_OUTPUT"
          echo "confidence=$CONFIDENCE"   >> "$GITHUB_OUTPUT"
          echo "affected_files=$AFFECTED" >> "$GITHUB_OUTPUT"

          echo "Root cause: $ROOT_CAUSE"
          echo "Confidence: $CONFIDENCE"

      # ── 5. CREATE FIX BRANCH ────────────────────────────────────────────────
      - name: Create fix branch
        id: branch
        env:
          FIX_BRANCH: ${{ steps.error.outputs.fix_branch }}
        run: |
          set -euo pipefail
          git config user.name  "FieldOps AI Self-Heal"
          git config user.email "ops-bot@fieldops.nz"
          git checkout -b "$FIX_BRANCH"
          echo "branch_created=true" >> "$GITHUB_OUTPUT"
          echo "Created branch: $FIX_BRANCH"

      - name: Apply AI-generated file changes
        id: apply
        if: steps.analysis.outputs.ai_available == 'true' && steps.analysis.outputs.confidence != 'low'
        env:
          ANALYSIS_FILE: ${{ runner.temp }}/ai-analysis.json
        run: |
          set -euo pipefail

          PROTECTED_PATTERNS="supabase/migrations/ supabase/functions/ src/stores/authStore src/lib/supabase"

          AFFECTED=$(jq -r '.affected_files[]' "$ANALYSIS_FILE" 2>/dev/null || echo "")

          if [ -z "$AFFECTED" ]; then
            echo "no_changes=true" >> "$GITHUB_OUTPUT"
            echo "AI returned no affected files; PR will be a stub for human review."
            exit 0
          fi

          BLOCKED=false
          for FILE in $AFFECTED; do
            for PATTERN in $PROTECTED_PATTERNS; do
              if printf '%s' "$FILE" | grep -q "$PATTERN"; then
                echo "::warning::AI attempted to modify protected path: $FILE — blocked."
                BLOCKED=true
              fi
            done
          done

          if [ "$BLOCKED" = "true" ]; then
            echo "no_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "no_changes=false" >> "$GITHUB_OUTPUT"

      # ── 6. BUILD VALIDATION ─────────────────────────────────────────────────
      - name: Validate build
        id: build
        continue-on-error: true
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
        run: |
          npm run build 2>&1 | tee "$RUNNER_TEMP/build-output.txt"
          echo "build_ok=$?" >> "$GITHUB_OUTPUT"

      - name: Run lint
        id: lint
        continue-on-error: true
        run: |
          npm run lint 2>&1 | tee "$RUNNER_TEMP/lint-output.txt" || true
          echo "done" >> "$GITHUB_OUTPUT"

      # ── 7. COMMIT & OPEN PR ─────────────────────────────────────────────────
      - name: Commit and push fix branch
        id: commit
        env:
          FIX_BRANCH: ${{ steps.error.outputs.fix_branch }}
        run: |
          set -euo pipefail

          # Create a diagnostic marker file so the PR always has at least one commit
          mkdir -p data/self-heal-triage
          cat > "data/self-heal-triage/${FIX_BRANCH##*/}.json" <<EOF
          {
            "triggered_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "source": "${{ steps.error.outputs.source }}",
            "fingerprint": "${{ steps.error.outputs.fingerprint }}",
            "error_summary": $(echo "${{ steps.error.outputs.summary }}" | jq -Rs .),
            "ai_confidence": "${{ steps.analysis.outputs.confidence || 'unavailable' }}",
            "build_passed": "${{ steps.build.outcome == 'success' }}"
          }
          EOF

          git add -A
          git diff --cached --quiet && { echo "nothing_to_commit=true" >> "$GITHUB_OUTPUT"; exit 0; } || true
          git commit -m "fix(ai-triage): self-heal attempt for ${{ steps.error.outputs.source }} error

          Error: ${{ steps.error.outputs.summary }}
          Fingerprint: ${{ steps.error.outputs.fingerprint }}
          AI confidence: ${{ steps.analysis.outputs.confidence || 'unavailable' }}
          Build passed: ${{ steps.build.outcome == 'success' }}

          Auto-generated by ops-ai-error-triage workflow."

          git push origin "$FIX_BRANCH"
          echo "nothing_to_commit=false" >> "$GITHUB_OUTPUT"

      - name: Open fix PR
        if: steps.commit.outputs.nothing_to_commit != 'true'
        uses: actions/github-script@v7
        env:
          FIX_BRANCH: ${{ steps.error.outputs.fix_branch }}
          PR_TITLE: ${{ steps.analysis.outputs.pr_title || format('fix(ai-triage): self-heal — {0}', steps.error.outputs.source) }}
          BUILD_OK: ${{ steps.build.outcome == 'success' }}
          AI_AVAILABLE: ${{ steps.analysis.outputs.ai_available || 'false' }}
          CONFIDENCE: ${{ steps.analysis.outputs.confidence || 'unavailable' }}
        with:
          script: |
            const fs = require('fs')
            const analysisPath = `${process.env.RUNNER_TEMP}/ai-analysis.json`
            const analysis = fs.existsSync(analysisPath)
              ? JSON.parse(fs.readFileSync(analysisPath, 'utf8'))
              : {}

            const buildBadge = process.env.BUILD_OK === 'true' ? '✅ passed' : '❌ failed'
            const confidenceBadge = { high: '🟢 high', medium: '🟡 medium', low: '🔴 low' }[process.env.CONFIDENCE] || '⚪ unavailable'

            const body = [
              '## AI Self-Heal Fix PR',
              '',
              `| Field | Value |`,
              `|---|---|`,
              `| Source | ${process.env.FIX_BRANCH.includes(context.repo.owner) ? 'unknown' : '${{ steps.error.outputs.source }}'} |`,
              `| Error | ${{ steps.error.outputs.summary }} |`,
              `| AI confidence | ${confidenceBadge} |`,
              `| Build validation | ${buildBadge} |`,
              '',
              '### Root Cause',
              analysis.root_cause || '_AI analysis unavailable — manual review required._',
              '',
              '### Fix Summary',
              analysis.fix_summary || '_See diagnostic file in `data/self-heal-triage/`._',
              '',
              '### Guardrails',
              '- [ ] Build passes ✓',
              '- [ ] Smoke tests pass (checked by `ops-ai-rollback-guard` after merge)',
              '- [ ] No schema migrations modified',
              '- [ ] No auth/RLS logic changed',
              '',
              '> **Auto-merge** is NOT enabled on this PR. A human must review before merging.',
              '> After merge, the `ops-ai-rollback-guard` workflow will run production smoke tests.',
              '> If smoke tests fail, an automated `git revert` PR will be opened immediately.',
            ].join('\n')

            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: process.env.PR_TITLE,
              body,
              head: process.env.FIX_BRANCH,
              base: 'main',
              draft: process.env.CONFIDENCE === 'low' || process.env.BUILD_OK !== 'true',
            })

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.data.number,
              labels: ['self-healing', 'ai-generated', 'ops'],
            })

            core.info(`Created fix PR #${pr.data.number}: ${pr.data.html_url}`)
