name: CI Phase E2 Enterprise Hardening Tenancy Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/e2e/phase-e2-enterprise-hardening-tenancy.spec.ts'
      - 'src/hooks/useOrganization.ts'
      - 'src/hooks/useOperationalOrganization.ts'
      - 'src/hooks/useClientOrgIds.ts'
      - 'src/hooks/useOrganizationBoundary.ts'
      - 'src/lib/orgUtils.ts'
      - 'src/pages/DataIntegrityDashboard.tsx'
      - 'docs/BUILD_REALIGNMENT_PLAN_2026-05-04.md'
      - 'docs/MODULE_ROADMAP.md'
      - 'docs/STAGING.md'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/ci-phase-e2-enterprise-hardening-tenancy-gate.yml'
  push:
    branches: [main]
    paths:
      - 'tests/e2e/phase-e2-enterprise-hardening-tenancy.spec.ts'
      - 'src/hooks/useOrganization.ts'
      - 'src/hooks/useOperationalOrganization.ts'
      - 'src/hooks/useClientOrgIds.ts'
      - 'src/hooks/useOrganizationBoundary.ts'
      - 'src/lib/orgUtils.ts'
      - 'src/pages/DataIntegrityDashboard.tsx'
      - 'docs/BUILD_REALIGNMENT_PLAN_2026-05-04.md'
      - 'docs/MODULE_ROADMAP.md'
      - 'docs/STAGING.md'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/ci-phase-e2-enterprise-hardening-tenancy-gate.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  phase-e2-enterprise-hardening-tenancy-gate:
    name: Phase E2 Enterprise Hardening Tenancy Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Phase E2 enterprise hardening tenancy gate suite
        id: phase_gate_suite
        continue-on-error: true
        run: |
          bunx playwright test \
            tests/e2e/phase-e2-enterprise-hardening-tenancy.spec.ts \
            --reporter=list

      - name: Enforce Phase gate suite (strict mode)
        if: steps.phase_gate_suite.outcome == 'failure' && vars.PHASE_GATES_STRICT == 'true'
        run: |
          echo "::error::Phase gate suite failed and strict mode is enabled (PHASE_GATES_STRICT=true)."
          exit 1

      - name: Report Phase gate suite (non-strict)
        if: steps.phase_gate_suite.outcome == 'failure' && vars.PHASE_GATES_STRICT != 'true'
        run: |
          echo "::warning::Phase gate suite failed but strict mode is disabled; continuing."
