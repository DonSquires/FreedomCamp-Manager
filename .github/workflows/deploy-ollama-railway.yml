name: Deploy Ollama to Railway

# Deploys the Ollama LLM service (ollama/) to the Bob Railway project.
# Ollama runs as a separate service in the same project so Bob can reach it
# via Railway private networking (http://ollama.railway.internal:11434).
#
# Trigger: manual only — Ollama image updates are deliberate, not tied to
# source code changes.
#
# Required secrets:
#   RAILWAY_BOB_TOKEN          — Railway project token (shared with Bob service)
#   RAILWAY_OLLAMA_SERVICE_ID  — Railway service ID for the Ollama service
#
# Optional secrets:
#   OLLAMA_SERVICE_URL — public Railway URL for post-deploy health check

on:
  push:
    branches: [main]
    paths:
      - 'ollama/**'
      - '.github/workflows/deploy-ollama-railway.yml'
  workflow_dispatch:
    inputs:
      pull_model:
        description: 'Pull model after deploy (e.g. llama3.1:8b). Leave empty to skip.'
        required: false
        type: string
      railway_token_override:
        description: 'Optional Railway token override for this run only'
        required: false
        type: string
      ollama_service_id_override:
        description: 'Optional Ollama Railway service ID override for this run only'
        required: false
        type: string
      bob_project_id_override:
        description: 'Optional Bob Railway project ID override for this run only'
        required: false
        type: string
      ollama_service_url_override:
        description: 'Optional Ollama service URL override for this run only'
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-ollama:
    name: Deploy Ollama to Railway
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Load normalized Railway credential env
        env:
          RAILWAY_BOB_TOKEN: ${{ secrets.RAILWAY_BOB_TOKEN }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_TOKEN_BOB: ${{ secrets.RAILWAY_TOKEN_BOB }}
          RAILWAY_OLLAMA_SERVICE_ID: ${{ secrets.RAILWAY_OLLAMA_SERVICE_ID }}
          RAILWAY_BOB_PROJECT_ID: ${{ secrets.RAILWAY_BOB_PROJECT_ID }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          OLLAMA_SERVICE_URL: ${{ secrets.OLLAMA_SERVICE_URL }}
        run: |
          source ./scripts/load-railway-secrets-from-github-env.sh --quiet

      - name: Apply workflow dispatch overrides
        if: github.event_name == 'workflow_dispatch'
        env:
          TOKEN_OVERRIDE: ${{ github.event.inputs.railway_token_override }}
          SERVICE_ID_OVERRIDE: ${{ github.event.inputs.ollama_service_id_override }}
          PROJECT_ID_OVERRIDE: ${{ github.event.inputs.bob_project_id_override }}
          SERVICE_URL_OVERRIDE: ${{ github.event.inputs.ollama_service_url_override }}
        run: |
          set -euo pipefail
          if [ -n "${TOKEN_OVERRIDE:-}" ]; then
            echo "::add-mask::${TOKEN_OVERRIDE}"
            {
              echo "RAILWAY_BOB_TOKEN=${TOKEN_OVERRIDE}"
              echo "RAILWAY_TOKEN=${TOKEN_OVERRIDE}"
            } >> "$GITHUB_ENV"
          fi
          if [ -n "${SERVICE_ID_OVERRIDE:-}" ]; then
            echo "RAILWAY_OLLAMA_SERVICE_ID=${SERVICE_ID_OVERRIDE}" >> "$GITHUB_ENV"
          fi
          if [ -n "${PROJECT_ID_OVERRIDE:-}" ]; then
            echo "RAILWAY_BOB_PROJECT_ID=${PROJECT_ID_OVERRIDE}" >> "$GITHUB_ENV"
          fi
          if [ -n "${SERVICE_URL_OVERRIDE:-}" ]; then
            echo "OLLAMA_SERVICE_URL=${SERVICE_URL_OVERRIDE}" >> "$GITHUB_ENV"
          fi

      - name: Check required secrets
        id: check-secrets
        run: |
          missing=""
          [ -z "${RAILWAY_BOB_TOKEN:-${RAILWAY_TOKEN:-}}" ]   && missing="$missing RAILWAY_BOB_TOKEN-or-RAILWAY_TOKEN"

          if [ -z "${RAILWAY_OLLAMA_SERVICE_ID:-}" ] && [ -z "${RAILWAY_BOB_PROJECT_ID:-}" ]; then
            missing="$missing RAILWAY_OLLAMA_SERVICE_ID-or-RAILWAY_BOB_PROJECT_ID"
          fi

          if [ -n "$missing" ]; then
            echo "::error::Required Ollama deploy secrets not configured ($missing) — deployment skipped."
            echo ""
            echo "Add these GitHub Actions secrets to this repository:"
            echo "  RAILWAY_BOB_TOKEN          - Railway project token for the Bob project (required)"
            echo "  RAILWAY_OLLAMA_SERVICE_ID  - Railway service ID for Ollama service (required if no PROJECT_ID)"
            echo "  RAILWAY_BOB_PROJECT_ID     - Railway project ID for Bob (required if no SERVICE_ID)"
            echo "  OLLAMA_SERVICE_URL         - Optional public Ollama URL for post-deploy health check"
            echo ""
            echo "See docs/RAILWAY_SERVICES_AUTHORITY.md for setup instructions."
            exit 1
          fi

          echo "✅ Ollama Railway deploy secrets present"
          echo "secrets_present=true" >> "$GITHUB_OUTPUT"
          if [ -n "$RAILWAY_OLLAMA_SERVICE_ID" ]; then
            echo "resolved_candidate_service_id=$RAILWAY_OLLAMA_SERVICE_ID" >> "$GITHUB_OUTPUT"
            echo "✅ Using explicit RAILWAY_OLLAMA_SERVICE_ID"
          else
            echo "ℹ️  Will attempt auto-resolution from RAILWAY_BOB_PROJECT_ID"
          fi

      - name: Install Railway CLI
        if: steps.check-secrets.outputs.secrets_present == 'true'
        run: |
          RAILWAY_CLI_VERSION="4.31.0"
          TARGET="x86_64-unknown-linux-gnu"
          URL="https://github.com/railwayapp/cli/releases/download/v${RAILWAY_CLI_VERSION}/railway-v${RAILWAY_CLI_VERSION}-${TARGET}.tar.gz"
          TMP_DIR=$(mktemp -d)
          cd "$TMP_DIR"
          curl -fsSL -o railway.tar.gz "$URL"
          tar -xzf railway.tar.gz
          mkdir -p "$HOME/.railway/bin"
          install -m 0755 railway "$HOME/.railway/bin/railway"
          echo "$HOME/.railway/bin" >> "$GITHUB_PATH"

      - name: Validate Railway token
        if: steps.check-secrets.outputs.secrets_present == 'true'
        env:
          RAILWAY_TOKEN: ${{ env.RAILWAY_BOB_TOKEN || env.RAILWAY_TOKEN }}
        run: |
          echo "🔑 Validating Railway token..."
          if ! railway service list --json > /dev/null 2>&1; then
            echo "::warning::Could not confirm RAILWAY_BOB_TOKEN via 'railway service list'."
            echo "Project-scoped tokens can fail this precheck; deployment will still be attempted."
          fi
          echo "✅ Railway validation step complete"

      - name: Resolve Ollama service identity
        id: resolve-service
        if: steps.check-secrets.outputs.secrets_present == 'true'
        env:
          RAILWAY_TOKEN: ${{ env.RAILWAY_BOB_TOKEN || env.RAILWAY_TOKEN }}
          EXPLICIT_SERVICE_ID: ${{ steps.check-secrets.outputs.resolved_candidate_service_id }}
          EXPLICIT_PROJECT_ID: ${{ env.RAILWAY_BOB_PROJECT_ID || env.RAILWAY_PROJECT_ID }}
        run: |
          set -euo pipefail

          if [ -n "$EXPLICIT_SERVICE_ID" ]; then
            echo "service_id=$EXPLICIT_SERVICE_ID" >> "$GITHUB_OUTPUT"
            echo "project_id=${EXPLICIT_PROJECT_ID}" >> "$GITHUB_OUTPUT"
            echo "✅ Using explicit Ollama service ID"
            exit 0
          fi

          if [ -n "$EXPLICIT_PROJECT_ID" ]; then
            echo "ℹ️ Attempting Ollama service auto-discovery from explicit project ID..."
            GRAPHQL_PAYLOAD=$(printf '{"query":"query { project(id:\"%s\") { services { edges { node { id name } } } } }"}' "$EXPLICIT_PROJECT_ID")
            GRAPHQL_RESPONSE=$(curl -fsSL https://backboard.railway.app/graphql/v2 \
              -H "Authorization: Bearer $RAILWAY_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$GRAPHQL_PAYLOAD")

            RESOLVED=$(node -e '
              const data = JSON.parse(process.argv[1] || "{}");
              const services = data?.data?.project?.services?.edges?.map((edge) => edge?.node).filter(Boolean) || [];
              const chosen = services.find((s) => String(s?.name || "").toLowerCase().includes("ollama"));
              if (!chosen) process.exit(2);
              process.stdout.write(JSON.stringify({ projectId: process.argv[2], serviceId: chosen.id, serviceName: chosen.name }));
            ' "$GRAPHQL_RESPONSE" "$EXPLICIT_PROJECT_ID") || true

            if [ -n "${RESOLVED:-}" ]; then
              RESOLVED_SERVICE_ID=$(echo "$RESOLVED" | jq -r '.serviceId')
              RESOLVED_PROJECT_ID=$(echo "$RESOLVED" | jq -r '.projectId')
              RESOLVED_SERVICE_NAME=$(echo "$RESOLVED" | jq -r '.serviceName')
              echo "service_id=$RESOLVED_SERVICE_ID" >> "$GITHUB_OUTPUT"
              echo "project_id=$RESOLVED_PROJECT_ID" >> "$GITHUB_OUTPUT"
              echo "✅ Auto-resolved Ollama service from project: $RESOLVED_SERVICE_NAME ($RESOLVED_SERVICE_ID)"
              exit 0
            fi
          fi

          echo "ℹ️ Attempting Ollama service auto-discovery from token scope..."
          GRAPHQL_PAYLOAD='{"query":"query { me { projects { edges { node { id name services { edges { node { id name } } } } } } } }"}'
          GRAPHQL_RESPONSE=$(curl -fsSL https://backboard.railway.app/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$GRAPHQL_PAYLOAD")

          RESOLVED=$(node -e '
            const data = JSON.parse(process.argv[1] || "{}");
            const projects = data?.data?.me?.projects?.edges?.map((edge) => edge?.node).filter(Boolean) || [];
            const matches = [];
            for (const p of projects) {
              const services = p?.services?.edges?.map((edge) => edge?.node).filter(Boolean) || [];
              for (const s of services) {
                const name = String(s?.name || "").toLowerCase();
                if (name.includes("ollama")) {
                  matches.push({ projectId: p.id, serviceId: s.id, serviceName: s.name });
                }
              }
            }
            const top = matches[0];
            if (!top) process.exit(2);
            process.stdout.write(JSON.stringify(top));
          ' "$GRAPHQL_RESPONSE") || {
            echo "::error::Could not resolve a deployable Ollama service ID from Railway token scope."
            echo "::error::Set one of: RAILWAY_OLLAMA_SERVICE_ID, RAILWAY_SERVICE_ID, or RAILWAY_BOB_PROJECT_ID."
            exit 1
          }

          RESOLVED_SERVICE_ID=$(echo "$RESOLVED" | jq -r '.serviceId')
          RESOLVED_PROJECT_ID=$(echo "$RESOLVED" | jq -r '.projectId')
          RESOLVED_SERVICE_NAME=$(echo "$RESOLVED" | jq -r '.serviceName')

          echo "service_id=$RESOLVED_SERVICE_ID" >> "$GITHUB_OUTPUT"
          echo "project_id=$RESOLVED_PROJECT_ID" >> "$GITHUB_OUTPUT"
          echo "✅ Auto-resolved Ollama service: $RESOLVED_SERVICE_NAME ($RESOLVED_SERVICE_ID)"

      - name: Deploy Ollama to Railway
        if: steps.check-secrets.outputs.secrets_present == 'true'
        env:
          RAILWAY_TOKEN: ${{ env.RAILWAY_BOB_TOKEN || env.RAILWAY_TOKEN }}
          RAILWAY_OLLAMA_SERVICE_ID: ${{ steps.resolve-service.outputs.service_id }}
          RAILWAY_OLLAMA_PROJECT_ID: ${{ steps.resolve-service.outputs.project_id || env.RAILWAY_BOB_PROJECT_ID || env.RAILWAY_PROJECT_ID }}
        run: |
          set -euo pipefail

          cd ollama
          echo "🚂 Deploying Ollama to Railway..."
          DEPLOY_LOG="$(mktemp)"

          if railway up --service "$RAILWAY_OLLAMA_SERVICE_ID" --detach 2>&1 | tee "$DEPLOY_LOG"; then
            echo "✅ Ollama deploy triggered. Check Railway dashboard for status."
            exit 0
          fi

          if grep -q "Service not found" "$DEPLOY_LOG"; then
            echo "::warning::Configured Ollama service ID was not found. Attempting automatic re-discovery and retry."

            if [ -n "${RAILWAY_OLLAMA_PROJECT_ID:-}" ]; then
              GRAPHQL_PAYLOAD=$(printf '{"query":"query { project(id:\"%s\") { services { edges { node { id name } } } } }"}' "$RAILWAY_OLLAMA_PROJECT_ID")
              GRAPHQL_RESPONSE=$(curl -fsSL https://backboard.railway.app/graphql/v2 \
                -H "Authorization: Bearer $RAILWAY_TOKEN" \
                -H "Content-Type: application/json" \
                --data "$GRAPHQL_PAYLOAD" || true)
            else
              GRAPHQL_PAYLOAD='{"query":"query { me { projects { edges { node { id name services { edges { node { id name } } } } } } } }"}'
              GRAPHQL_RESPONSE=$(curl -fsSL https://backboard.railway.app/graphql/v2 \
                -H "Authorization: Bearer $RAILWAY_TOKEN" \
                -H "Content-Type: application/json" \
                --data "$GRAPHQL_PAYLOAD" || true)
            fi

            RESOLVED_SERVICE_ID=$(node -e '
              const data = JSON.parse(process.argv[1] || "{}");
              const fromProject = (data?.data?.project?.services?.edges || []).map((e) => e.node).filter(Boolean);
              const fromTokenScope = (data?.data?.me?.projects?.edges || [])
                .flatMap((p) => ((p?.node?.services?.edges || []).map((e) => e?.node).filter(Boolean)));
              const services = [...fromProject, ...fromTokenScope];
              const chosen = services.find((s) => String(s?.name || "").toLowerCase().includes("ollama"));
              process.stdout.write(chosen?.id || "");
            ' "$GRAPHQL_RESPONSE")

            if [ -n "$RESOLVED_SERVICE_ID" ] && [ "$RESOLVED_SERVICE_ID" != "$RAILWAY_OLLAMA_SERVICE_ID" ]; then
              echo "::warning::Retrying deploy with resolved Ollama service ID: $RESOLVED_SERVICE_ID"
              railway up --service "$RESOLVED_SERVICE_ID" --detach
              echo "✅ Ollama deploy triggered with auto-resolved service ID."
              exit 0
            fi

            echo "::error::Service not found and auto-retry could not resolve a different Ollama service ID."
            echo "::error::Set RAILWAY_OLLAMA_SERVICE_ID and/or RAILWAY_BOB_PROJECT_ID explicitly."
            exit 1
          fi

          echo "::error::Railway deploy command failed for Ollama service ID=$RAILWAY_OLLAMA_SERVICE_ID"
          exit 1

      - name: Verify Ollama health
        if: steps.check-secrets.outputs.secrets_present == 'true'
        env:
          OLLAMA_SERVICE_URL: ${{ secrets.OLLAMA_SERVICE_URL }}
        run: |
          BASE_URL="${OLLAMA_SERVICE_URL%/}"
          if [ -z "$BASE_URL" ]; then
            echo "ℹ️  OLLAMA_SERVICE_URL not set — skipping HTTP health check."
            echo "   Railway built-in health check will use /api/tags."
            exit 0
          fi

          if [[ "$BASE_URL" != http://* && "$BASE_URL" != https://* ]]; then
            BASE_URL="https://$BASE_URL"
          fi

          echo "⏳ Waiting 45s for Ollama deployment to become ready..."
          sleep 45

          echo "🏥 Checking health at ${BASE_URL}/api/tags ..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "${BASE_URL}/api/tags" || echo "000")

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Ollama health check passed"
          else
            echo "::warning::Ollama health check returned HTTP $HTTP_STATUS. Service may still be starting."
          fi

      - name: Pull model (optional)
        if: >-
          steps.check-secrets.outputs.secrets_present == 'true' &&
          github.event.inputs.pull_model != ''
        env:
          OLLAMA_SERVICE_URL: ${{ secrets.OLLAMA_SERVICE_URL }}
          MODEL_NAME: ${{ github.event.inputs.pull_model }}
        run: |
          if [ -z "$OLLAMA_SERVICE_URL" ]; then
            echo "::error::OLLAMA_SERVICE_URL secret must be set to pull models remotely."
            exit 1
          fi

          # Validate model name format (alphanumeric, colons, dots, hyphens, slashes)
          if ! echo "$MODEL_NAME" | grep -qE '^[a-zA-Z0-9._:/-]+$'; then
            echo "::error::Invalid model name format: $MODEL_NAME"
            exit 1
          fi

          echo "📦 Requesting model pull: $MODEL_NAME (this may take several minutes)..."
          PAYLOAD=$(jq -n --arg model "$MODEL_NAME" '{"name": $model}')
          HTTP_STATUS=$(curl -s -o /tmp/pull-output.txt -w "%{http_code}" \
            --max-time 600 \
            -X POST "${OLLAMA_SERVICE_URL}/api/pull" \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD" || echo "000")

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Model pull completed: $MODEL_NAME"
          else
            echo "::warning::Model pull returned HTTP $HTTP_STATUS. Check Ollama logs in Railway dashboard."
            tail -c 500 /tmp/pull-output.txt 2>/dev/null || true
          fi
