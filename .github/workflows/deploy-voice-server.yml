name: Deploy Voice & PTT Server

on:
  push:
    branches:
      - main
    paths:
      - 'ptt-server/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy PTT Server files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "ptt-server/*"
          target: "/opt/fieldops-voice/ptt-server/"

      - name: Build and Start PTT Server on VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          TURN_SERVER_URL: ${{ secrets.TURN_SERVER_URL }}
          TURN_SECRET: ${{ secrets.TURN_SECRET }}
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: TURN_SERVER_URL,TURN_SECRET
          script: |
            cd /opt/fieldops-voice
            : "${TURN_SERVER_URL:?TURN_SERVER_URL secret is required}"
            : "${TURN_SECRET:?TURN_SECRET secret is required}"
            [ -f docker-compose.yml ] || printf "services:\n" > docker-compose.yml
            
            # Inject the PTT server config into docker-compose if it's not there yet
            if ! grep -Eq "^[[:space:]]*ptt-server:[[:space:]]*$" docker-compose.yml; then
            cat << EOF >> docker-compose.yml

              ptt-server:
                build: ./ptt-server
                container_name: fieldops-ptt
                ports:
                  - "8080:8080"
                environment:
                  - NODE_ENV=production
                  - TURN_SERVER_URL=${TURN_SERVER_URL}
                  - TURN_SECRET=${TURN_SECRET}
                restart: unless-stopped
            EOF
            fi

            # Build the new image and spin up the container
            docker compose up -d --build ptt-server
            
            # Clean up old unused images to save disk space
            docker image prune -f
