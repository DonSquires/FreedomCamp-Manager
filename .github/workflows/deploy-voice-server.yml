name: Deploy Voice & PTT Server

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
    paths:
      - 'ptt-server/**'
      - '.github/workflows/deploy-voice-server.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check optional Supabase secrets
        id: check-secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          PTT_PUBLIC_WSS_URL: ${{ secrets.PTT_PUBLIC_WSS_URL }}
          PTT_PUBLIC_HTTPS_URL: ${{ secrets.PTT_PUBLIC_HTTPS_URL }}
        run: |
          set -euo pipefail

          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_PROJECT_REF" ]; then
            echo "supabase_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "supabase_ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Supabase deploy secrets missing; secret sync steps will be skipped."
          fi

          if [ -n "$PTT_PUBLIC_WSS_URL" ] && [ -n "$PTT_PUBLIC_HTTPS_URL" ]; then
            echo "ptt_urls_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ptt_urls_ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::PTT_PUBLIC_WSS_URL / PTT_PUBLIC_HTTPS_URL missing; PTT secret sync will be skipped."
          fi

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy PTT Server files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_IP }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "ptt-server/*"
          target: "/opt/fieldops-voice/"
          timeout: 90s
          command_timeout: 20m

      - name: Build and Start PTT Server on VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          TURN_SERVER_URL: ${{ secrets.TURN_SERVER_URL }}
          TURN_SECRET: ${{ secrets.TURN_SECRET }}
          PTT_TURN_PUBLIC_HOST: ${{ secrets.PTT_TURN_PUBLIC_HOST }}
          # ptt-server/server.js reads TURN_USERNAME + TURN_CREDENTIAL (not TURN_SECRET).
          # TURN_USERNAME defaults to the shared HMAC username; TURN_CREDENTIAL is the secret.
          TURN_USERNAME: ${{ secrets.TURN_USERNAME }}
          TURN_CREDENTIAL: ${{ secrets.TURN_CREDENTIAL }}
          PTT_JWT_SECRET: ${{ secrets.PTT_JWT_SECRET }}
          PTT_PROXY_SECRET: ${{ secrets.PTT_PROXY_SECRET }}
        with:
          host: ${{ secrets.VPS_IP }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: TURN_SERVER_URL,TURN_SECRET,PTT_TURN_PUBLIC_HOST,TURN_USERNAME,TURN_CREDENTIAL,PTT_JWT_SECRET,PTT_PROXY_SECRET
          timeout: 90s
          command_timeout: 20m
          script: |
            cd /opt/fieldops-voice

            existing_env=""
            docker_env_dump=""
            coturn_config=""
            if docker ps -a --format '{{.Names}}' | grep -qx 'fieldops-ptt'; then
              existing_env="$(docker inspect fieldops-ptt --format '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null || true)"
            fi
            docker_env_dump="$({ docker ps -a --format '{{.Names}}' 2>/dev/null || true; } | while IFS= read -r container_name; do
              [ -n "$container_name" ] || continue
              docker inspect "$container_name" --format '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null || true
            done)"
            if [ -f /etc/coturn/turnserver.conf ]; then
              coturn_config="$(cat /etc/coturn/turnserver.conf 2>/dev/null || true)"
            fi

            turn_public_host="${PTT_TURN_PUBLIC_HOST:-srv1601189.hstgr.cloud}"

            coturn_user_line="$(printf '%s\n' "$coturn_config" | sed -n 's/^user=//p' | tail -n1)"
            coturn_username="${coturn_user_line%%:*}"
            coturn_password="${coturn_user_line#*:}"
            [ "$coturn_username" = "$coturn_user_line" ] && coturn_username=""
            [ "$coturn_password" = "$coturn_user_line" ] && coturn_password=""

            coturn_port="$(printf '%s\n' "$coturn_config" | sed -n 's/^listening-port=//p' | tail -n1)"
            coturn_tls_port="$(printf '%s\n' "$coturn_config" | sed -n 's/^tls-listening-port=//p' | tail -n1)"
            coturn_static_secret="$(printf '%s\n' "$coturn_config" | sed -n 's/^static-auth-secret=//p' | tail -n1)"

            # Reuse the currently running container's TURN settings when GitHub
            # Actions secrets are incomplete. This keeps deploys reproducible even
            # while repo secrets are being normalized.
            if [ -z "${TURN_SERVER_URL:-}" ]; then
              TURN_SERVER_URL="$(printf '%s\n' "$existing_env" | sed -n 's/^TURN_URL=//p' | tail -n1)"
            fi
            if [ -z "${TURN_SERVER_URL:-}" ]; then
              TURN_SERVER_URL="$(printf '%s\n' "$docker_env_dump" | sed -n 's/^TURN_URL=//p' | tail -n1)"
            fi
            if [ -z "${TURN_SERVER_URL:-}" ]; then
              if [ -n "$coturn_tls_port" ]; then
                TURN_SERVER_URL="turns:${turn_public_host}:${coturn_tls_port}?transport=tcp"
              elif [ -n "$coturn_port" ]; then
                TURN_SERVER_URL="turn:${turn_public_host}:${coturn_port}"
              fi
            fi
            if [ -z "${TURN_SERVER_URL:-}" ]; then
              docker_turn_port="$(printf '%s\n' "$docker_env_dump" | sed -n 's/^TURN_PORT=//p' | tail -n1)"
              if [ -n "$docker_turn_port" ]; then
                TURN_SERVER_URL="turn:${turn_public_host}:${docker_turn_port}"
              fi
            fi

            # Backward compatibility: allow old TURN_SECRET to satisfy TURN_CREDENTIAL
            # while repos are migrated to TURN_CREDENTIAL secret naming.
            TURN_CREDENTIAL="${TURN_CREDENTIAL:-${TURN_SECRET:-}}"
            if [ -z "${TURN_CREDENTIAL:-}" ]; then
              TURN_CREDENTIAL="$(printf '%s\n' "$existing_env" | sed -n 's/^TURN_CREDENTIAL=//p' | tail -n1)"
            fi
            if [ -z "${TURN_CREDENTIAL:-}" ]; then
              TURN_CREDENTIAL="$(printf '%s\n' "$docker_env_dump" | sed -n 's/^TURN_CREDENTIAL=//p' | tail -n1)"
            fi
            if [ -z "${TURN_CREDENTIAL:-}" ]; then
              TURN_CREDENTIAL="$(printf '%s\n' "$existing_env" | sed -n 's/^TURN_SECRET=//p' | tail -n1)"
            fi
            if [ -z "${TURN_CREDENTIAL:-}" ]; then
              TURN_CREDENTIAL="$(printf '%s\n' "$docker_env_dump" | sed -n 's/^TURN_SECRET=//p' | tail -n1)"
            fi
            if [ -z "${TURN_CREDENTIAL:-}" ]; then
              TURN_CREDENTIAL="$coturn_password"
            fi
            if [ -z "${TURN_CREDENTIAL:-}" ]; then
              TURN_CREDENTIAL="$coturn_static_secret"
            fi
            if [ -z "${TURN_CREDENTIAL:-}" ]; then
              TURN_CREDENTIAL="$(printf '%s\n' "$docker_env_dump" | sed -n 's/^TURN_PASSWORD=//p' | tail -n1)"
            fi
            TURN_USERNAME="${TURN_USERNAME:-fieldops}"
            if [ "${TURN_USERNAME}" = "fieldops" ]; then
              TURN_USERNAME="$(printf '%s\n' "$existing_env" | sed -n 's/^TURN_USERNAME=//p' | tail -n1 || true)"
              TURN_USERNAME="${TURN_USERNAME:-fieldops}"
            fi
            if [ "${TURN_USERNAME}" = "fieldops" ]; then
              TURN_USERNAME="$(printf '%s\n' "$docker_env_dump" | sed -n 's/^TURN_USERNAME=//p' | tail -n1 || true)"
              TURN_USERNAME="${TURN_USERNAME:-fieldops}"
            fi
            if [ "${TURN_USERNAME}" = "fieldops" ] && [ -n "$coturn_username" ]; then
              TURN_USERNAME="$coturn_username"
            fi

            : "${TURN_SERVER_URL:?TURN_SERVER_URL secret is required or must exist on current fieldops-ptt container}"
            : "${TURN_CREDENTIAL:?TURN_CREDENTIAL (or TURN_SECRET) secret is required or must exist on current fieldops-ptt container}"
            : "${PTT_JWT_SECRET:?PTT_JWT_SECRET secret is required}"
            : "${PTT_PROXY_SECRET:?PTT_PROXY_SECRET secret is required}"
            # Always write the authoritative docker-compose.yml so env changes take effect
            cat > docker-compose.yml << 'EOF'
            services:
              ptt-server:
                build: ./ptt-server
                container_name: fieldops-ptt
                ports:
                  - "8080:8080"
                environment:
                  - NODE_ENV=production
                  - PORT=8080
                  - PTT_JWT_SECRET=${PTT_JWT_SECRET}
                  - PTT_PROXY_SECRET=${PTT_PROXY_SECRET}
                  - TURN_URL=${TURN_SERVER_URL}
                  - TURN_USERNAME=${TURN_USERNAME}
                  - TURN_CREDENTIAL=${TURN_CREDENTIAL}
                  - FORCE_TURN_RELAY=true
                  - PTT_DISABLE_PUBLIC_STUN=true
                restart: unless-stopped
            EOF

            # Build the new image and spin up the container
            docker compose up -d --build ptt-server

            # Clean up old unused images to save disk space
            docker image prune -f

      - name: Post-deploy health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 90s
          command_timeout: 10m
          script: |
            echo "Waiting 10s for container to be ready..."
            sleep 10
            STATUS=$(curl -sf --max-time 15 http://127.0.0.1:8080/health -o /tmp/ptt-health.json -w "%{http_code}" || echo "000")
            cat /tmp/ptt-health.json 2>/dev/null || true
            if [ "$STATUS" != "200" ]; then
              echo "::error::PTT server health check failed (HTTP $STATUS)"
              docker compose -f /opt/fieldops-voice/docker-compose.yml logs ptt-server --tail=50
              exit 1
            fi
            echo "✅ PTT server is healthy on port 8080"

      - name: Setup Supabase CLI
        if: steps.check-secrets.outputs.supabase_ready == 'true'
        uses: supabase/setup-cli@v1

      - name: Sync PTT secrets and deploy edge functions
        if: steps.check-secrets.outputs.supabase_ready == 'true' && steps.check-secrets.outputs.ptt_urls_ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          PTT_PUBLIC_WSS_URL: ${{ secrets.PTT_PUBLIC_WSS_URL }}
          PTT_PUBLIC_HTTPS_URL: ${{ secrets.PTT_PUBLIC_HTTPS_URL }}
        run: |
          set -euo pipefail

          bash scripts/ptt-url-policy-check.sh

          supabase secrets set \
            "PTT_WS_URL=${PTT_PUBLIC_WSS_URL}" \
            "PTT_SERVER_URL=${PTT_PUBLIC_HTTPS_URL}" \
            --project-ref "${SUPABASE_PROJECT_REF}"

          supabase functions deploy ptt-signaling-token --project-ref "${SUPABASE_PROJECT_REF}"
          supabase functions deploy check-railway-health --project-ref "${SUPABASE_PROJECT_REF}"
          supabase functions deploy check-ptt-health --project-ref "${SUPABASE_PROJECT_REF}"
