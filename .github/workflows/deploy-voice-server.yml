name: Deploy Voice & PTT Server

on:
  push:
    branches:
      - main
    paths:
      - 'ptt-server/**'
      - '.github/workflows/deploy-voice-server.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy PTT Server files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "ptt-server/*"
          target: "/opt/fieldops-voice/"

      - name: Build and Start PTT Server on VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          TURN_SERVER_URL: ${{ secrets.TURN_SERVER_URL }}
          TURN_SECRET: ${{ secrets.TURN_SECRET }}
          # ptt-server/server.js reads TURN_USERNAME + TURN_CREDENTIAL (not TURN_SECRET).
          # TURN_USERNAME defaults to the shared HMAC username; TURN_CREDENTIAL is the secret.
          TURN_USERNAME: ${{ secrets.TURN_USERNAME }}
          TURN_CREDENTIAL: ${{ secrets.TURN_CREDENTIAL }}
          PTT_JWT_SECRET: ${{ secrets.PTT_JWT_SECRET }}
          PTT_PROXY_SECRET: ${{ secrets.PTT_PROXY_SECRET }}
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: TURN_SERVER_URL,TURN_SECRET,TURN_USERNAME,TURN_CREDENTIAL,PTT_JWT_SECRET,PTT_PROXY_SECRET
          script: |
            cd /opt/fieldops-voice
            : "${TURN_SERVER_URL:?TURN_SERVER_URL secret is required}"

            # Backward compatibility: allow old TURN_SECRET to satisfy TURN_CREDENTIAL
            # while repos are migrated to TURN_CREDENTIAL secret naming.
            TURN_CREDENTIAL="${TURN_CREDENTIAL:-${TURN_SECRET:-}}"
            TURN_USERNAME="${TURN_USERNAME:-fieldops}"
            : "${TURN_CREDENTIAL:?TURN_CREDENTIAL (or TURN_SECRET) secret is required}"
            : "${PTT_JWT_SECRET:?PTT_JWT_SECRET secret is required}"
            : "${PTT_PROXY_SECRET:?PTT_PROXY_SECRET secret is required}"
            # Always write the authoritative docker-compose.yml so env changes take effect
            cat > docker-compose.yml << 'EOF'
            services:
              ptt-server:
                build: ./ptt-server
                container_name: fieldops-ptt
                ports:
                  - "8080:8080"
                environment:
                  - NODE_ENV=production
                  - PORT=8080
                  - PTT_JWT_SECRET=${PTT_JWT_SECRET}
                  - PTT_PROXY_SECRET=${PTT_PROXY_SECRET}
                  - TURN_URL=${TURN_SERVER_URL}
                  - TURN_USERNAME=${TURN_USERNAME}
                  - TURN_CREDENTIAL=${TURN_CREDENTIAL}
                  - FORCE_TURN_RELAY=true
                  - PTT_DISABLE_PUBLIC_STUN=true
                restart: unless-stopped
            EOF

            # Build the new image and spin up the container
            docker compose up -d --build ptt-server

            # Clean up old unused images to save disk space
            docker image prune -f

      - name: Post-deploy health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "Waiting 10s for container to be ready..."
            sleep 10
            STATUS=$(curl -sf --max-time 15 http://127.0.0.1:8080/health -o /tmp/ptt-health.json -w "%{http_code}" || echo "000")
            cat /tmp/ptt-health.json 2>/dev/null || true
            if [ "$STATUS" != "200" ]; then
              echo "::error::PTT server health check failed (HTTP $STATUS)"
              docker compose -f /opt/fieldops-voice/docker-compose.yml logs ptt-server --tail=50
              exit 1
            fi
            echo "✅ PTT server is healthy on port 8080"

      - name: Setup Supabase CLI
        if: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' && secrets.SUPABASE_PROJECT_REF != '' }}
        uses: supabase/setup-cli@v1

      - name: Sync PTT secrets and deploy edge functions
        if: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' && secrets.SUPABASE_PROJECT_REF != '' && secrets.PTT_PUBLIC_WSS_URL != '' && secrets.PTT_PUBLIC_HTTPS_URL != '' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          PTT_PUBLIC_WSS_URL: ${{ secrets.PTT_PUBLIC_WSS_URL }}
          PTT_PUBLIC_HTTPS_URL: ${{ secrets.PTT_PUBLIC_HTTPS_URL }}
        run: |
          set -euo pipefail

          bash scripts/ptt-url-policy-check.sh

          supabase secrets set \
            "PTT_WS_URL=${PTT_PUBLIC_WSS_URL}" \
            "PTT_SERVER_URL=${PTT_PUBLIC_HTTPS_URL}" \
            --project-ref "${SUPABASE_PROJECT_REF}"

          supabase functions deploy ptt-signaling-token --project-ref "${SUPABASE_PROJECT_REF}"
          supabase functions deploy check-railway-health --project-ref "${SUPABASE_PROJECT_REF}"
          supabase functions deploy check-ptt-health --project-ref "${SUPABASE_PROJECT_REF}"
