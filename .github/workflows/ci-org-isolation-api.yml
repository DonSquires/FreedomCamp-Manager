name: CI Org Isolation API

on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/e2e/org-isolation-api.spec.ts'
      - 'tests/e2e/api-response.spec.ts'
      - 'tests/e2e/auth.ts'
      - 'playwright.api.config.ts'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/ci-org-isolation-api.yml'
  push:
    branches: [main]
    paths:
      - 'tests/e2e/org-isolation-api.spec.ts'
      - 'tests/e2e/api-response.spec.ts'
      - 'tests/e2e/auth.ts'
      - 'playwright.api.config.ts'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/ci-org-isolation-api.yml'

jobs:
  org-isolation-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      API_TEST_BEARER_TOKEN: ${{ secrets.API_TEST_BEARER_TOKEN }}
      API_TEST_EMAIL: ${{ secrets.API_TEST_EMAIL }}
      API_TEST_PASSWORD: ${{ secrets.API_TEST_PASSWORD }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run API org isolation suite
        run: bunx playwright test -c playwright.api.config.ts
