name: CI Org Isolation API

on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/e2e/org-isolation-api.spec.ts'
      - 'tests/integration/org-isolation.test.ts'
      - 'tests/e2e/api-response.spec.ts'
      - 'tests/e2e/auth.ts'
      - 'playwright.api.config.ts'
      - 'supabase/migrations/20260504000005_phase_b1_bridge_to_case_model.sql'
      - 'supabase/migrations/20260506000009_phase_b2_dispatch_case_bridge.sql'
      - 'supabase/migrations/20260506000010_phase_b4_enforcement_case_bridge.sql'
      - 'supabase/migrations/20260506000004_phase_b3_radio_comms_case_bridge.sql'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/ci-org-isolation-api.yml'
  push:
    branches: [main]
    paths:
      - 'tests/e2e/org-isolation-api.spec.ts'
      - 'tests/integration/org-isolation.test.ts'
      - 'tests/e2e/api-response.spec.ts'
      - 'tests/e2e/auth.ts'
      - 'playwright.api.config.ts'
      - 'supabase/migrations/20260504000005_phase_b1_bridge_to_case_model.sql'
      - 'supabase/migrations/20260506000009_phase_b2_dispatch_case_bridge.sql'
      - 'supabase/migrations/20260506000010_phase_b4_enforcement_case_bridge.sql'
      - 'supabase/migrations/20260506000004_phase_b3_radio_comms_case_bridge.sql'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/ci-org-isolation-api.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  org-isolation-api:
    name: Phase A Org Isolation Gate (5 scenarios)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      API_TEST_BEARER_TOKEN: ${{ secrets.API_TEST_BEARER_TOKEN }}
      API_TEST_EMAIL: ${{ secrets.API_TEST_EMAIL }}
      API_TEST_PASSWORD: ${{ secrets.API_TEST_PASSWORD }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run five-scenario org isolation gate suite
        id: org_isolation_suite
        continue-on-error: true
        run: bunx vitest run tests/integration/org-isolation.test.ts

      - name: Run API org isolation suite
        id: api_isolation_suite
        continue-on-error: true
        run: bunx playwright test -c playwright.api.config.ts

      - name: Enforce org isolation gates (strict mode)
        if: (steps.org_isolation_suite.outcome == 'failure' || steps.api_isolation_suite.outcome == 'failure') && vars.ORG_ISOLATION_STRICT == 'true'
        run: exit 1

      - name: Report org isolation gates (non-strict)
        if: (steps.org_isolation_suite.outcome == 'failure' || steps.api_isolation_suite.outcome == 'failure') && vars.ORG_ISOLATION_STRICT != 'true'
        run: echo "::warning::Org isolation tests failed but continuing (non-strict mode). Set ORG_ISOLATION_STRICT=true to enforce."

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: org-isolation-gate-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
