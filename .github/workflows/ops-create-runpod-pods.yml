name: Ops - Create RunPod Pods

on:
  workflow_dispatch:
    inputs:
      template_id:
        description: RunPod template id
        required: true
        default: matkgtica1
      gpu_type_id:
        description: RunPod gpuTypeId value
        required: true
        default: NVIDIA_GEFORCE_RTX_5090
      workloads:
        description: Comma list for deterministic names (chat,ptt,tabular)
        required: false
        default: chat,ptt
      name_prefix:
        description: Pod name prefix
        required: true
        default: bob_ollama
      volume_gb:
        description: Attached volume size (GB)
        required: true
        default: '500'
      container_disk_gb:
        description: Container disk size (GB)
        required: true
        default: '80'
      cloud_type:
        description: Cloud type
        type: choice
        options:
          - SECURE
          - COMMUNITY
        default: SECURE
      dry_run:
        description: Validate input without creating pods
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  create-runpod-pods:
    name: Create RunPod Pods
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate required secret
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          set -e
          if [ -z "${RUNPOD_API_KEY}" ]; then
            echo "RUNPOD_API_KEY secret is missing."
            exit 1
          fi

      - name: Create pods from workflow inputs
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          set -e
          node scripts/create-runpod-pods.mjs \
            --templateId "${{ inputs.template_id }}" \
            --gpuTypeId "${{ inputs.gpu_type_id }}" \
            --workloads "${{ inputs.workloads }}" \
            --namePrefix "${{ inputs.name_prefix }}" \
            --volumeInGb "${{ inputs.volume_gb }}" \
            --containerDiskInGb "${{ inputs.container_disk_gb }}" \
            --cloudType "${{ inputs.cloud_type }}" \
            --dryRun "${{ inputs.dry_run }}"
