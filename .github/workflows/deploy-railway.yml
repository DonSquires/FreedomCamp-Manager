name: Deploy Inference Service to Railway

# Auto-deploys when inference-service/ changes on main, or manually triggered
on:
  push:
    branches: [main]
    paths:
      - 'inference-service/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: false
        default: 'production'
        type: choice
        options: [production, staging]

jobs:
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest

    steps:
      - name: Check required secrets
        run: |
          if [ -z "${{ secrets.RAILWAY_TOKEN }}" ]; then
            echo "❌ RAILWAY_TOKEN secret is not set."
            echo ""
            echo "To fix this, create a PROJECT TOKEN (not a personal token):"
            echo "  1. Go to your Railway project dashboard"
            echo "  2. Click Settings → Tokens → New Token"
            echo "  3. Name it 'GitHub Actions', click Generate"
            echo "  4. Copy the token (starts with a long alphanumeric string)"
            echo "  5. Go to https://github.com/${{ github.repository }}/settings/secrets/actions"
            echo "  6. Click 'New repository secret'"
            echo "  7. Name: RAILWAY_TOKEN, Value: <paste token>"
            echo ""
            echo "⚠️  IMPORTANT: Use a PROJECT token (Project → Settings → Tokens),"
            echo "   NOT a personal account token (Account → Tokens)."
            echo "   Personal tokens are rejected by Railway CLI in CI/CD environments."
            echo ""
            echo "⚠️  If you haven't created the Railway project yet:"
            echo "  Follow: inference-service/RAILWAY_DEPLOY.md (Steps 1-4 only)"
            echo "  Then add RAILWAY_TOKEN secret and re-run this workflow."
            exit 1
          fi

          if [ -z "${{ secrets.RAILWAY_SERVICE_ID }}" ]; then
            echo "❌ RAILWAY_SERVICE_ID secret is not set."
            echo ""
            echo "To find your Service ID:"
            echo "  1. Go to your Railway project"
            echo "  2. Click on the service (inference-service)"
            echo "  3. Go to Settings tab"
            echo "  4. Copy 'Service ID' (looks like: srv_xxxxxxxxxx)"
            echo "  5. Add as GitHub secret: RAILWAY_SERVICE_ID"
            exit 1
          fi
          echo "✅ All required secrets present"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: |
          curl -fsSL https://railway.app/install.sh | sh
          echo "$HOME/.railway/bin" >> $GITHUB_PATH

      - name: Validate Railway token
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "🔑 Validating Railway token..."
          if ! railway whoami > /dev/null 2>&1; then
            echo ""
            echo "❌ RAILWAY_TOKEN is set but invalid."
            echo ""
            echo "Common causes:"
            echo "  1. You used a personal account token instead of a project token."
            echo "     → Go to your Railway PROJECT → Settings → Tokens → New Token"
            echo "     → Do NOT use Account → Tokens (those are personal tokens)"
            echo ""
            echo "  2. The token was revoked or expired."
            echo "     → Regenerate a new project token in Railway"
            echo ""
            echo "  3. The token doesn't have access to this service."
            echo "     → Make sure the token is created inside the correct Railway project"
            echo ""
            echo "Fix: Update the RAILWAY_TOKEN secret at:"
            echo "  https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi
          echo "✅ Railway token is valid"

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          cd inference-service
          echo "🚂 Deploying inference-service to Railway..."
          railway up --service "${{ secrets.RAILWAY_SERVICE_ID }}" --detach
          echo "✅ Deploy triggered. Check Railway dashboard for status."
          echo ""
          echo "Railway Dashboard: https://railway.app/dashboard"

      - name: Wait for deployment and verify health
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "${{ secrets.INFERENCE_SERVICE_URL }}" ]; then
            echo "ℹ️  INFERENCE_SERVICE_URL not set — skipping health check."
            echo "   Once deployed, get your URL from Railway → Settings → Networking"
            echo "   Then add it as GitHub secret AND Supabase secret."
            exit 0
          fi

          echo "⏳ Waiting 60s for Railway to finish deploying..."
          sleep 60

          echo "🏥 Checking health at ${{ secrets.INFERENCE_SERVICE_URL }}/health ..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            "${{ secrets.INFERENCE_SERVICE_URL }}/health" || echo "000")

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Health check passed! Inference service is live."
          else
            echo "⚠️  Health check returned HTTP $HTTP_STATUS"
            echo "   Railway may still be starting. Check dashboard in 1-2 minutes."
          fi
