name: Deploy Inference Service to Railway

# Deploys the ONNX inference service (inference-service/) to Railway.
#
# Auto-triggers on any push to main that touches inference-service/ files.
# Can also be triggered manually via workflow_dispatch.
#
# Required secrets:
#   RAILWAY_TOKEN or RAILWAY_BOB_TOKEN — Railway project token for the inference service project
#   RAILWAY_INFERENCE_SERVICE_ID — Railway project → Service → Settings → Service ID
#
# Optional secrets:
#   INFERENCE_SERVICE_URL — deployed Railway URL; enables health check after deploy

on:
  push:
    branches: [main]
    paths:
      - 'inference-service/**'
  workflow_dispatch:
    inputs:
      railway_token_override:
        description: 'Optional Railway token override for this run only'
        required: false
        type: string
      inference_service_id_override:
        description: 'Optional inference service ID override for this run only'
        required: false
        type: string
      inference_service_url_override:
        description: 'Optional inference service URL override for this run only'
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-railway:
    name: Deploy Inference Service to Railway
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Load normalized Railway credential env
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_BOB_TOKEN: ${{ secrets.RAILWAY_BOB_TOKEN }}
          RAILWAY_CORE_TOKEN: ${{ secrets.RAILWAY_CORE_TOKEN }}
          RAILWAY_INFERENCE_SERVICE_ID: ${{ secrets.RAILWAY_INFERENCE_SERVICE_ID }}
          INFERENCE_SERVICE_URL: ${{ secrets.INFERENCE_SERVICE_URL }}
          BOB_SERVICE_URL: ${{ secrets.BOB_SERVICE_URL }}
          INFERENCE_API_KEY: ${{ secrets.INFERENCE_API_KEY }}
        run: |
          source ./scripts/load-railway-secrets-from-github-env.sh --quiet

      - name: Apply workflow dispatch overrides
        if: github.event_name == 'workflow_dispatch'
        env:
          TOKEN_OVERRIDE: ${{ github.event.inputs.railway_token_override }}
          SERVICE_ID_OVERRIDE: ${{ github.event.inputs.inference_service_id_override }}
          SERVICE_URL_OVERRIDE: ${{ github.event.inputs.inference_service_url_override }}
        run: |
          set -euo pipefail
          if [ -n "${TOKEN_OVERRIDE:-}" ]; then
            echo "::add-mask::${TOKEN_OVERRIDE}"
            echo "RAILWAY_TOKEN=${TOKEN_OVERRIDE}" >> "$GITHUB_ENV"
          fi
          if [ -n "${SERVICE_ID_OVERRIDE:-}" ]; then
            echo "RAILWAY_INFERENCE_SERVICE_ID=${SERVICE_ID_OVERRIDE}" >> "$GITHUB_ENV"
          fi
          if [ -n "${SERVICE_URL_OVERRIDE:-}" ]; then
            echo "INFERENCE_SERVICE_URL=${SERVICE_URL_OVERRIDE}" >> "$GITHUB_ENV"
          fi

      - name: Check required secrets
        id: check-secrets
        run: |
          missing=""
          [ -z "${RAILWAY_TOKEN:-${RAILWAY_BOB_TOKEN:-}}" ] && missing="$missing RAILWAY_TOKEN-or-RAILWAY_BOB_TOKEN"
          [ -z "${RAILWAY_INFERENCE_SERVICE_ID:-}" ] && missing="$missing RAILWAY_INFERENCE_SERVICE_ID"
          if [ -n "$missing" ]; then
            echo "::error::Required secrets not configured ($missing) — deployment skipped."
            echo ""
            echo "Add these GitHub Actions secrets to this repository:"
            echo "  RAILWAY_TOKEN or RAILWAY_BOB_TOKEN: Railway project token (required)"
            echo "  RAILWAY_INFERENCE_SERVICE_ID: Railway service ID for inference service (required)"
            echo ""
            echo "See docs/RAILWAY_SERVICES_AUTHORITY.md for setup instructions."
            exit 1
          else
            echo "✅ Railway secrets present"
            echo "service_id=$RAILWAY_INFERENCE_SERVICE_ID" >> "$GITHUB_OUTPUT"
            echo "secrets_present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Railway CLI
        if: steps.check-secrets.outputs.secrets_present == 'true'
        run: |
          # Pin a known release to avoid GitHub API rate limits in install.sh.
          RAILWAY_CLI_VERSION="4.31.0"
          TARGET="x86_64-unknown-linux-gnu"
          URL="https://github.com/railwayapp/cli/releases/download/v${RAILWAY_CLI_VERSION}/railway-v${RAILWAY_CLI_VERSION}-${TARGET}.tar.gz"
          TMP_DIR=$(mktemp -d)
          cd "$TMP_DIR"
          curl -fsSL -o railway.tar.gz "$URL"
          tar -xzf railway.tar.gz
          mkdir -p "$HOME/.railway/bin"
          install -m 0755 railway "$HOME/.railway/bin/railway"
          echo "$HOME/.railway/bin" >> "$GITHUB_PATH"

      - name: Select Railway token for deploy
        id: select-token
        if: steps.check-secrets.outputs.secrets_present == 'true'
        run: |
          set -euo pipefail
          if [ -n "${RAILWAY_BOB_TOKEN:-}" ]; then
            echo "::add-mask::${RAILWAY_BOB_TOKEN}"
            echo "SELECTED_RAILWAY_TOKEN=${RAILWAY_BOB_TOKEN}" >> "$GITHUB_ENV"
            echo "selected_token_source=RAILWAY_BOB_TOKEN" >> "$GITHUB_OUTPUT"
          elif [ -n "${RAILWAY_TOKEN:-}" ]; then
            echo "::add-mask::${RAILWAY_TOKEN}"
            echo "SELECTED_RAILWAY_TOKEN=${RAILWAY_TOKEN}" >> "$GITHUB_ENV"
            echo "selected_token_source=RAILWAY_TOKEN" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No Railway token available."
            exit 1
          fi
          echo "✅ Railway token selected for deploy"

      - name: Validate Railway token
        id: validate-token
        if: steps.check-secrets.outputs.secrets_present == 'true'
        env:
          RAILWAY_TOKEN: ${{ env.SELECTED_RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          echo "🔑 Validating Railway token..."
          if ! railway service list --json > /dev/null 2>&1; then
            echo ""
            echo "::error::RAILWAY_TOKEN is invalid or expired — inference deploy cannot proceed."
            echo ""
            echo "Common causes:"
            echo "  1. Token is revoked/expired."
            echo "  2. Token was not generated as a project token for this Railway project."
            echo ""
            echo "Fix: Generate a new project token in Railway (Project → Settings → Tokens)"
            echo "and update RAILWAY_TOKEN at:"
            echo "  https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi
          echo "✅ Railway token is valid"
          echo "token_valid=true" >> "$GITHUB_OUTPUT"

      - name: Deploy to Railway
        if: >-
          steps.check-secrets.outputs.secrets_present == 'true' &&
          steps.validate-token.outputs.token_valid == 'true'
        env:
          RAILWAY_TOKEN: ${{ env.SELECTED_RAILWAY_TOKEN }}
        run: |
          cd inference-service
          echo "🚂 Deploying inference-service to Railway..."
          railway up --service "$RAILWAY_INFERENCE_SERVICE_ID" --detach
          echo "✅ Deploy triggered. Check Railway dashboard for status."
          echo ""
          echo "Railway Dashboard: https://railway.app/dashboard"

      - name: Wait for deployment and verify health
        if: >-
          steps.check-secrets.outputs.secrets_present == 'true' &&
          steps.validate-token.outputs.token_valid == 'true'
        run: |
          BASE_URL="${INFERENCE_SERVICE_URL%/}"
          if [ -z "$BASE_URL" ]; then
            echo "ℹ️  INFERENCE_SERVICE_URL not set — skipping health check."
            echo "   Once deployed, get your URL from Railway → Settings → Networking"
            echo "   Then add it as GitHub secret AND Supabase secret."
            exit 0
          fi

          if [[ "$BASE_URL" != http://* && "$BASE_URL" != https://* ]]; then
            BASE_URL="https://$BASE_URL"
          fi

          echo "⏳ Waiting 60s for Railway to finish deploying..."
          sleep 60

          echo "🏥 Checking health at ${BASE_URL}/health ..."
          HEALTH_BODY=$(curl -s \
            --max-time 30 \
            "${BASE_URL}/health" || true)
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            "${BASE_URL}/health" || echo "000")

          if [ "$HTTP_STATUS" = "200" ]; then
            if echo "$HEALTH_BODY" | grep -q '"models"'; then
              echo "✅ Health check passed! Inference service is live."
            else
              echo "::error::Health endpoint does not look like inference-service (missing \"models\")."
              echo "Body preview: ${HEALTH_BODY:0:200}"
              exit 1
            fi
          else
            echo "⚠️  Health check returned HTTP $HTTP_STATUS"
            echo "   Railway may still be starting. Check dashboard in 1-2 minutes."
            exit 1
          fi

          echo "🧠 Checking /chat route shape ..."
          CHAT_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            -X POST "${BASE_URL}/chat" \
            -H 'Content-Type: application/json' \
            -d '{"message":"ping"}' || echo "000")

          case "$CHAT_STATUS" in
            200|400|401|403|429)
              echo "✅ /chat route exists (HTTP $CHAT_STATUS)."
              ;;
            *)
              echo "::error::/chat route check failed with HTTP $CHAT_STATUS (expected non-404 on inference service)."
              exit 1
              ;;
          esac
