name: Ops Intel Feed Sync

on:
  schedule:
    - cron: '0 0 * * *'   # once a day at midnight UTC
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  intel-feed-sync:
    name: Ingest External Intel Feeds
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Validate required secrets
        id: check-secrets
        run: |
          missing=""
          auth_missing=""

          BASE_URL="${BOB_SERVICE_URL:-${INFERENCE_SERVICE_URL:-}}"
          NORMALIZED_INGEST_URL="${INTEL_INGEST_URL:-}"
          NORMALIZED_API_KEY="${INFERENCE_API_KEY:-${BOB_INFERENCE_API_KEY:-}}"

          if [ -z "$NORMALIZED_INGEST_URL" ] && [ -n "$BASE_URL" ]; then
            BASE_URL="${BASE_URL%/}"
            if [[ "$BASE_URL" != http://* && "$BASE_URL" != https://* ]]; then
              BASE_URL="https://$BASE_URL"
            fi
            NORMALIZED_INGEST_URL="${BASE_URL}/intel/ingest-bulletin"
          fi

          echo "INTEL_INGEST_URL=$NORMALIZED_INGEST_URL" >> "$GITHUB_ENV"
          echo "INFERENCE_API_KEY=$NORMALIZED_API_KEY" >> "$GITHUB_ENV"

          [ -z "$INTEL_FEED_URLS" ] && missing="$missing INTEL_FEED_URLS"
          [ -z "$NORMALIZED_INGEST_URL" ] && missing="$missing INTEL_INGEST_URL-or-BOB_SERVICE_URL-or-INFERENCE_SERVICE_URL"
          if [ -z "$NORMALIZED_API_KEY" ] && [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            auth_missing=" INFERENCE_API_KEY|SUPABASE_SERVICE_ROLE_KEY"
          fi

          [ -z "$INTEL_REGION_ORG_MAP" ] && echo "::warning::INTEL_REGION_ORG_MAP not set; regional alerts may not target neighboring organizations."

          if [ -n "$missing$auth_missing" ]; then
            echo "::warning::Intel feed sync skipped — missing secrets:$missing$auth_missing"
            echo "Configure these in GitHub -> Settings -> Secrets and variables -> Actions:"
            echo "  INTEL_FEED_URLS            (comma/newline feed URLs)"
            echo "  INTEL_INGEST_URL           (Bob endpoint, e.g. https://.../intel/ingest-bulletin)"
            echo "  INFERENCE_API_KEY          (or use SUPABASE_SERVICE_ROLE_KEY instead)"
            echo "  SUPABASE_SERVICE_ROLE_KEY  (optional alternative auth key for ingest endpoint)"
            echo "secrets_present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "secrets_present=true" >> "$GITHUB_OUTPUT"
        env:
          INTEL_FEED_URLS: ${{ secrets.INTEL_FEED_URLS }}
          INTEL_INGEST_URL: ${{ secrets.INTEL_INGEST_URL }}
          INFERENCE_API_KEY: ${{ secrets.INFERENCE_API_KEY }}
          BOB_INFERENCE_API_KEY: ${{ secrets.BOB_INFERENCE_API_KEY }}
          BOB_SERVICE_URL: ${{ secrets.BOB_SERVICE_URL }}
          INFERENCE_SERVICE_URL: ${{ secrets.INFERENCE_SERVICE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INTEL_REGION_ORG_MAP: ${{ secrets.INTEL_REGION_ORG_MAP }}

      - name: Harvest and ingest intelligence feeds
        if: steps.check-secrets.outputs.secrets_present == 'true'
        working-directory: inference-service
        env:
          INTEL_FEED_URLS: ${{ secrets.INTEL_FEED_URLS }}
          INTEL_ALLOWED_HOSTS: ${{ secrets.INTEL_ALLOWED_HOSTS }}
          INTEL_INGEST_URL: ${{ env.INTEL_INGEST_URL }}
          INFERENCE_API_KEY: ${{ env.INFERENCE_API_KEY }}
          INTEL_HMAC_KEY: ${{ secrets.INTEL_HMAC_KEY }}
          INTEL_ENABLE_DB_SYNC: ${{ secrets.INTEL_ENABLE_DB_SYNC }}
          INTEL_ORGANIZATION_ID: ${{ secrets.INTEL_ORGANIZATION_ID }}
          INTEL_DB_TABLE: ${{ secrets.INTEL_DB_TABLE }}
          INTEL_REGION_ORG_MAP: ${{ secrets.INTEL_REGION_ORG_MAP }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INTEL_DRY_RUN: ${{ secrets.INTEL_DRY_RUN }}
          INTEL_FETCH_TIMEOUT_MS: ${{ vars.INTEL_FETCH_TIMEOUT_MS }}
          INTEL_MAX_ITEMS_PER_FEED: ${{ vars.INTEL_MAX_ITEMS_PER_FEED }}
          INTEL_MAX_SUMMARY_LENGTH: ${{ vars.INTEL_MAX_SUMMARY_LENGTH }}
        run: node scripts/harvest-intel-feeds.mjs
