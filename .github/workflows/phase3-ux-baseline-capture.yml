name: Phase 3 UX Baseline Capture

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'
  push:
    branches: [main]
    paths:
      - 'tests/e2e/phase3-ux-baseline-capture.spec.ts'
      - '.github/workflows/phase3-ux-baseline-capture.yml'

concurrency:
  group: phase3-ux-baseline-capture-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  phase3-ux-baseline-capture:
    name: Phase 3 UX Baseline Capture (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      CI: true
      PLAYWRIGHT_ALLOW_SHARED_CREDENTIAL_FALLBACK: '1'
      PLAYWRIGHT_REQUIRED_TEST_USERS: adminOrg1

      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      PLAYWRIGHT_ADMIN_ORG1_EMAIL: ${{ secrets.PLAYWRIGHT_ADMIN_ORG1_EMAIL != '' && secrets.PLAYWRIGHT_ADMIN_ORG1_EMAIL || secrets.PLAYWRIGHT_ADMIN_EMAIL }}
      PLAYWRIGHT_ADMIN_ORG1_PASSWORD: ${{ secrets.PLAYWRIGHT_ADMIN_ORG1_PASSWORD != '' && secrets.PLAYWRIGHT_ADMIN_ORG1_PASSWORD || secrets.PLAYWRIGHT_ADMIN_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate required env vars
        run: |
          set -euo pipefail
          missing=0
          required_vars=(
            VITE_SUPABASE_URL
            VITE_SUPABASE_ANON_KEY
            PLAYWRIGHT_ADMIN_ORG1_EMAIL
            PLAYWRIGHT_ADMIN_ORG1_PASSWORD
          )

          for name in "${required_vars[@]}"; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              echo "::error::Missing required secret/env: $name"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "::error::One or more required secrets are missing."
            exit 1
          fi

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Run baseline capture spec
        run: |
          bunx playwright test tests/e2e/phase3-ux-baseline-capture.spec.ts \
            --project=chromium \
            --reporter=list \
            --timeout=60000

      - name: Upload baseline artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase3-ux-baseline-capture-${{ github.run_id }}
          path: |
            test-results/phase3-ux-baseline.json
            playwright-report/
            test-results/
          if-no-files-found: ignore
