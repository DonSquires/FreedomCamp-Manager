name: CI PTT Server Native Gate

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ptt-server/**'
      - '.github/workflows/ci-ptt-server-native-gate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ptt-server/**'
      - '.github/workflows/ci-ptt-server-native-gate.yml'

jobs:
  ptt-server-native-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip build-essential pkg-config

      - name: Install ptt-server dependencies
        id: install
        run: npm --prefix ptt-server install --no-audit --no-fund

      - name: Run ptt-server tests
        id: test
        run: npm --prefix ptt-server test

      - name: Capture mediasoup build diagnostics
        if: failure()
        run: |
          mkdir -p tools/ptt-server-native-gate/${{ github.run_id }}
          if [ -d ptt-server/node_modules/mediasoup/worker/out/Release/build/meson-logs ]; then
            cp -R ptt-server/node_modules/mediasoup/worker/out/Release/build/meson-logs tools/ptt-server-native-gate/${{ github.run_id }}/meson-logs
          fi
          if [ -f /home/runner/.npm/_logs/*-debug-0.log ]; then
            cp /home/runner/.npm/_logs/*-debug-0.log tools/ptt-server-native-gate/${{ github.run_id }}/ 2>/dev/null || true
          fi
          printf '{"run_id":"%s","gate":"ptt-server-native","generated_at":"%s"}\n' "${{ github.run_id }}" "$(date -u +%FT%TZ)" > tools/ptt-server-native-gate/${{ github.run_id }}/_artifact-marker.json

      - name: Upload native build diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ptt-server-native-diagnostics-${{ github.run_id }}
          path: tools/ptt-server-native-gate/${{ github.run_id }}
          if-no-files-found: warn

      - name: Publish summary
        if: always()
        run: |
          echo "## CI PTT Server Native Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "- Native dependency install: ${{ steps.install.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- PTT server tests: ${{ steps.test.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ steps.install.outcome }}" == "failure" ]]; then
            echo "- Failure focus: mediasoup native worker install or prebuilt runtime compatibility." >> "$GITHUB_STEP_SUMMARY"
          fi
