name: Sync Bob Repo

# Mirrors inference-service/ → DonSquires/Bob repository.
#
# Runs on every push to main that touches inference-service/ files, and on
# manual dispatch.  When triggered, it checks out this repo, then copies the
# contents of inference-service/ (including its nested .github/workflows/) to
# the root of DonSquires/Bob, commits the diff, and pushes.
#
# Required secret (set in DonSquires/FreedomCamp-Manager → Settings → Secrets):
#   BOB_SYNC_PAT — a GitHub Personal Access Token (classic or fine-grained)
#                  with Contents: Read & Write on DonSquires/Bob.
#
# If BOB_SYNC_PAT is not set the job emits a warning and exits cleanly so it
# does not block other CI work.

on:
  push:
    branches: [main]
    paths:
      - 'inference-service/**'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BOB_REPO: DonSquires/Bob

jobs:
  sync-bob:
    name: Sync inference-service to DonSquires/Bob
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check required secret
        id: check-secret
        run: |
          if [ -z "$BOB_SYNC_PAT" ]; then
            echo "::warning::BOB_SYNC_PAT secret is not set — sync skipped."
            echo ""
            echo "To enable automatic sync to DonSquires/Bob, add a secret:"
            echo "  https://github.com/${{ github.repository }}/settings/secrets/actions"
            echo ""
            echo "  BOB_SYNC_PAT: GitHub PAT with Contents read+write on DonSquires/Bob"
            echo "secret_present=false" >> "$GITHUB_OUTPUT"
          else
            echo "✅ BOB_SYNC_PAT present"
            echo "secret_present=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          BOB_SYNC_PAT: ${{ secrets.BOB_SYNC_PAT }}

      - name: Checkout FreedomCamp-Manager
        if: steps.check-secret.outputs.secret_present == 'true'
        uses: actions/checkout@v5
        with:
          path: source

      - name: Clone Bob repo
        if: steps.check-secret.outputs.secret_present == 'true'
        env:
          BOB_SYNC_PAT: ${{ secrets.BOB_SYNC_PAT }}
        run: |
          git clone \
            "https://x-access-token:${BOB_SYNC_PAT}@github.com/${BOB_REPO}.git" \
            bob

      - name: Sync inference-service contents to Bob
        if: steps.check-secret.outputs.secret_present == 'true'
        run: |
          # Copy everything from inference-service/ into Bob's root, preserving
          # nested .github/workflows/ so Bob gets its own deploy pipeline.
          rsync -av \
            --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='models/*.onnx' \
            --exclude='models/*.pt' \
            --exclude='models/*.pth' \
            --exclude='data/' \
            source/inference-service/ \
            bob/

      - name: Commit and push to Bob
        if: steps.check-secret.outputs.secret_present == 'true'
        env:
          BOB_SYNC_PAT: ${{ secrets.BOB_SYNC_PAT }}
          SOURCE_SHA:   ${{ github.sha }}
        run: |
          cd bob
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"

          git add -A

          # Only commit if there are actual changes
          if git diff --staged --quiet; then
            echo "ℹ️  No changes to sync — Bob repo is already up to date."
            exit 0
          fi

          SHORT_SHA="${SOURCE_SHA:0:7}"
          git commit -m "sync: update from FreedomCamp-Manager@${SHORT_SHA}"

          git push \
            "https://x-access-token:${BOB_SYNC_PAT}@github.com/${BOB_REPO}.git" \
            HEAD:main

          echo "✅ Bob repo updated from FreedomCamp-Manager@${SHORT_SHA}"
