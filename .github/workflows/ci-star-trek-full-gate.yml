name: CI Star Trek — Full Phase Gate (1–4)

# Runs all four Star Trek phase E2E checkpoints on a Chromium-capable Ubuntu runner.
# Phase 1: Director (Roster + Access Gate)
# Phase 2: Universal Translator (Voice + Audio Logic)
# Phase 3: Sentient XO (Memory + Admin Actuation)
# Phase 4: Admiral's Bridge (Welfare + Enforcement)
#
# ADR 014: docs/adr/014-star-trek-phased-rollout.md
# Rollout plan: docs/STAR_TREK_PHASED_ROLLOUT_PLAN.md
# Staging control: docs/STAGING.md

on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/e2e/phase1-director-roster-gate.spec.ts'
      - 'tests/e2e/phase2-universal-translator.spec.ts'
      - 'tests/e2e/phase3-sentient-xo.spec.ts'
      - 'tests/e2e/phase4-admirals-bridge.spec.ts'
      - 'src/middleware.ts'
      - 'src/pages/PTTRadio.tsx'
      - 'src/pages/BobAssistantStudio.tsx'
      - 'src/lib/phase4Emergency.ts'
      - 'src/lib/enforcementPhase4.ts'
      - 'tests/e2e/auth.ts'
      - 'tests/e2e/setup.ts'
      - '.github/workflows/ci-star-trek-full-gate.yml'
  push:
    branches: [main]
    paths:
      - 'tests/e2e/phase1-director-roster-gate.spec.ts'
      - 'tests/e2e/phase2-universal-translator.spec.ts'
      - 'tests/e2e/phase3-sentient-xo.spec.ts'
      - 'tests/e2e/phase4-admirals-bridge.spec.ts'
      - 'src/middleware.ts'
      - 'src/pages/PTTRadio.tsx'
      - 'src/pages/BobAssistantStudio.tsx'
      - 'src/lib/phase4Emergency.ts'
      - 'src/lib/enforcementPhase4.ts'
      - 'tests/e2e/auth.ts'
      - 'tests/e2e/setup.ts'
      - '.github/workflows/ci-star-trek-full-gate.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: star-trek-full-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Phase 1 — The Director (Roster and Access Gate)
  # ─────────────────────────────────────────────────────────────────────────────
  phase1-director:
    name: Phase 1 — Director (Roster Gate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    env:
      CI: true
      VITE_SUPABASE_URL:              ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY:         ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      PLAYWRIGHT_ADMIN_ORG1_EMAIL:    ${{ secrets.PLAYWRIGHT_ADMIN_EMAIL }}
      PLAYWRIGHT_ADMIN_ORG1_PASSWORD: ${{ secrets.PLAYWRIGHT_ADMIN_PASSWORD }}
      PLAYWRIGHT_OFFICER_ORG1_EMAIL:  ${{ secrets.PLAYWRIGHT_OFFICER_EMAIL }}
      PLAYWRIGHT_OFFICER_ORG1_PASSWORD: ${{ secrets.PLAYWRIGHT_OFFICER_PASSWORD }}
      PLAYWRIGHT_BOB_EMAIL:           ${{ secrets.PLAYWRIGHT_ADMIN_EMAIL }}
      PLAYWRIGHT_BOB_PASSWORD:        ${{ secrets.PLAYWRIGHT_ADMIN_PASSWORD }}
      PLAYWRIGHT_ALLOW_SHARED_CREDENTIAL_FALLBACK: '1'
      PLAYWRIGHT_REUSE_EXISTING_SERVER: '1'
      PLAYWRIGHT_BASE_URL:            'http://127.0.0.1:4173'

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build app
        run: npm run build

      - name: Start preview server
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/preview-phase1.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173 > /dev/null && echo "Server ready" && break
            [ "$i" -eq 30 ] && { echo "::error::Server did not start"; tail -40 /tmp/preview-phase1.log; exit 1; }
            sleep 2
          done

      - name: Phase 1 E2E — Director Roster Gate
        run: |
          npx playwright test tests/e2e/phase1-director-roster-gate.spec.ts \
            --project=chromium \
            --workers=1 \
            --reporter=list \
            --timeout=60000

      - name: Upload Phase 1 artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: star-trek-phase1-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────────────────────
  # Phase 2 — The Universal Translator (Voice and Audio Logic)
  # ─────────────────────────────────────────────────────────────────────────────
  phase2-translator:
    name: Phase 2 — Universal Translator (Voice + Audio)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    env:
      CI: true
      VITE_SUPABASE_URL:              ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY:         ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      PLAYWRIGHT_ADMIN_ORG1_EMAIL:    ${{ secrets.PLAYWRIGHT_ADMIN_EMAIL }}
      PLAYWRIGHT_ADMIN_ORG1_PASSWORD: ${{ secrets.PLAYWRIGHT_ADMIN_PASSWORD }}
      PLAYWRIGHT_BOB_EMAIL:           ${{ secrets.PLAYWRIGHT_ADMIN_EMAIL }}
      PLAYWRIGHT_BOB_PASSWORD:        ${{ secrets.PLAYWRIGHT_ADMIN_PASSWORD }}
      PLAYWRIGHT_ALLOW_SHARED_CREDENTIAL_FALLBACK: '1'
      PLAYWRIGHT_REUSE_EXISTING_SERVER: '1'
      PLAYWRIGHT_BASE_URL:            'http://127.0.0.1:4173'

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build app
        run: npm run build

      - name: Start preview server
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/preview-phase2.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173 > /dev/null && echo "Server ready" && break
            [ "$i" -eq 30 ] && { echo "::error::Server did not start"; tail -40 /tmp/preview-phase2.log; exit 1; }
            sleep 2
          done

      - name: Phase 2 E2E — Universal Translator
        run: |
          npx playwright test tests/e2e/phase2-universal-translator.spec.ts \
            --project=chromium \
            --workers=1 \
            --reporter=list \
            --timeout=60000

      - name: Upload Phase 2 artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: star-trek-phase2-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────────────────────
  # Phase 3 — The Sentient XO (Memory and Administrative Actuation)
  # ─────────────────────────────────────────────────────────────────────────────
  phase3-sentient-xo:
    name: Phase 3 — Sentient XO (Memory + Actuation)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    env:
      CI: true
      VITE_SUPABASE_URL:              ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY:         ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      PLAYWRIGHT_ADMIN_ORG1_EMAIL:    ${{ secrets.PLAYWRIGHT_ADMIN_EMAIL }}
      PLAYWRIGHT_ADMIN_ORG1_PASSWORD: ${{ secrets.PLAYWRIGHT_ADMIN_PASSWORD }}
      PLAYWRIGHT_BOB_EMAIL:           ${{ secrets.PLAYWRIGHT_ADMIN_EMAIL }}
      PLAYWRIGHT_BOB_PASSWORD:        ${{ secrets.PLAYWRIGHT_ADMIN_PASSWORD }}
      PLAYWRIGHT_ALLOW_SHARED_CREDENTIAL_FALLBACK: '1'
      PLAYWRIGHT_REUSE_EXISTING_SERVER: '1'
      PLAYWRIGHT_BASE_URL:            'http://127.0.0.1:4173'

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build app
        run: npm run build

      - name: Start preview server
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/preview-phase3.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173 > /dev/null && echo "Server ready" && break
            [ "$i" -eq 30 ] && { echo "::error::Server did not start"; tail -40 /tmp/preview-phase3.log; exit 1; }
            sleep 2
          done

      - name: Phase 3 E2E — Sentient XO
        run: |
          npx playwright test tests/e2e/phase3-sentient-xo.spec.ts \
            --project=chromium \
            --workers=1 \
            --reporter=list \
            --timeout=60000

      - name: Upload Phase 3 artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: star-trek-phase3-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────────────────────
  # Phase 4 — The Admiral's Bridge (Welfare and Enforcement)
  # ─────────────────────────────────────────────────────────────────────────────
  phase4-admirals-bridge:
    name: Phase 4 — Admiral's Bridge (Welfare + Enforcement)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    env:
      CI: true
      VITE_SUPABASE_URL:              ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY:         ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY:      ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PLAYWRIGHT_ADMIN_ORG1_EMAIL:    ${{ secrets.PLAYWRIGHT_ADMIN_EMAIL }}
      PLAYWRIGHT_ADMIN_ORG1_PASSWORD: ${{ secrets.PLAYWRIGHT_ADMIN_PASSWORD }}
      PLAYWRIGHT_ADMIN_EMAIL:         ${{ secrets.PLAYWRIGHT_ADMIN_EMAIL }}
      PLAYWRIGHT_ADMIN_PASSWORD:      ${{ secrets.PLAYWRIGHT_ADMIN_PASSWORD }}
      PLAYWRIGHT_BOB_EMAIL:           ${{ secrets.PLAYWRIGHT_ADMIN_EMAIL }}
      PLAYWRIGHT_BOB_PASSWORD:        ${{ secrets.PLAYWRIGHT_ADMIN_PASSWORD }}
      PLAYWRIGHT_ALLOW_SHARED_CREDENTIAL_FALLBACK: '1'
      PLAYWRIGHT_REUSE_EXISTING_SERVER: '1'
      PLAYWRIGHT_BASE_URL:            'http://127.0.0.1:4173'

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build app
        run: npm run build

      - name: Start preview server
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/preview-phase4.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173 > /dev/null && echo "Server ready" && break
            [ "$i" -eq 30 ] && { echo "::error::Server did not start"; tail -40 /tmp/preview-phase4.log; exit 1; }
            sleep 2
          done

      - name: Phase 4 unit tests (fast pre-check)
        run: |
          npx vitest run \
            src/lib/__tests__/enforcementPhase4.test.ts \
            src/lib/__tests__/phase4Emergency.test.ts

      - name: Phase 4 E2E — Admiral's Bridge
        run: |
          npx playwright test tests/e2e/phase4-admirals-bridge.spec.ts \
            --project=chromium \
            --workers=1 \
            --reporter=list \
            --timeout=60000

      - name: Upload Phase 4 artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: star-trek-phase4-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────────────────────
  # Final gate summary — all four phases must pass
  # ─────────────────────────────────────────────────────────────────────────────
  star-trek-gate:
    name: Star Trek Gate — All Phases Green
    runs-on: ubuntu-latest
    needs:
      - phase1-director
      - phase2-translator
      - phase3-sentient-xo
      - phase4-admirals-bridge
    if: always()

    steps:
      - name: Evaluate gate result
        run: |
          PHASE1="${{ needs.phase1-director.result }}"
          PHASE2="${{ needs.phase2-translator.result }}"
          PHASE3="${{ needs.phase3-sentient-xo.result }}"
          PHASE4="${{ needs.phase4-admirals-bridge.result }}"

          echo "Phase 1 (Director):          $PHASE1"
          echo "Phase 2 (Universal Translator): $PHASE2"
          echo "Phase 3 (Sentient XO):        $PHASE3"
          echo "Phase 4 (Admiral's Bridge):   $PHASE4"

          if [ "$PHASE1" = "success" ] && \
             [ "$PHASE2" = "success" ] && \
             [ "$PHASE3" = "success" ] && \
             [ "$PHASE4" = "success" ]; then
            echo "✅ Star Trek Gate PASSED — all 4 phases green"
            exit 0
          else
            echo "❌ Star Trek Gate FAILED — one or more phases did not pass"
            exit 1
          fi
