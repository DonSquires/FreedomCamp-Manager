name: CI Phase D1 Bob Approval Gate

# Path-filtered gate for the D1 Bob approval / proposal / audit contract.

on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/e2e/phase-d1-bob-approval-contracts.spec.ts'
      - 'supabase/migrations/20260710000004_phase_d1_bob_approval_contracts.sql'
      - 'src/hooks/useBobApprovalD1.ts'
      - 'src/hooks/useBobActionApproval.ts'
      - 'src/components/features/BobActionApprovalDialog.tsx'
      - 'src/pages/BobAssistantStudio.tsx'
      - 'src/types/database.ts'
      - 'tests/e2e/setup.ts'
      - 'playwright.api.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci-phase-d1-bob-approval-gate.yml'
  push:
    branches: [main]
    paths:
      - 'tests/e2e/phase-d1-bob-approval-contracts.spec.ts'
      - 'supabase/migrations/20260710000004_phase_d1_bob_approval_contracts.sql'
      - 'src/hooks/useBobApprovalD1.ts'
      - 'src/hooks/useBobActionApproval.ts'
      - 'src/components/features/BobActionApprovalDialog.tsx'
      - 'src/pages/BobAssistantStudio.tsx'
      - 'src/types/database.ts'
      - 'tests/e2e/setup.ts'
      - 'playwright.api.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci-phase-d1-bob-approval-gate.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  phase-d1-bob-approval-gate:
    name: Phase D1 Bob Approval Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: npm ci

      - name: Run Phase D1 Bob approval gate suite
        id: phase_gate_suite
        continue-on-error: true
        run: |
          npx playwright test \
            tests/e2e/phase-d1-bob-approval-contracts.spec.ts \
            --config=playwright.api.config.ts \
            --reporter=list

      - name: Enforce Phase gate suite (strict mode)
        if: steps.phase_gate_suite.outcome == 'failure' && vars.PHASE_GATES_STRICT == 'true'
        run: |
          echo "::error::Phase gate suite failed and strict mode is enabled (PHASE_GATES_STRICT=true)."
          exit 1

      - name: Report Phase gate suite (non-strict)
        if: steps.phase_gate_suite.outcome == 'failure' && vars.PHASE_GATES_STRICT != 'true'
        run: |
          echo "::warning::Phase gate suite failed but strict mode is disabled; continuing."

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase-d1-bob-approval-gate-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
