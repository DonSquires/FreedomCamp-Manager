name: CI Build High Memory

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'docs/MODULE_ROADMAP.md'
      - 'docs/ENTERPRISE_PAIR_REVIEW_CANONICAL.md'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'
      - 'tsconfig.app.json'
      - 'tsconfig.node.json'
      - 'vite.config.ts'
      - '.github/workflows/ci-build-high-memory.yml'
      - 'scripts/build-diagnostics.sh'
      - 'scripts/doc-authority-check.mjs'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'docs/MODULE_ROADMAP.md'
      - 'docs/ENTERPRISE_PAIR_REVIEW_CANONICAL.md'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'
      - 'tsconfig.app.json'
      - 'tsconfig.node.json'
      - 'vite.config.ts'
      - '.github/workflows/ci-build-high-memory.yml'
      - 'scripts/build-diagnostics.sh'
      - 'scripts/doc-authority-check.mjs'

jobs:
  build-high-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=8192

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch for pull request diffs
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --prune --depth=1 origin "${{ github.base_ref }}"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Doc authority lint (warning mode)
        env:
          DOC_AUTHORITY_DIFF_RANGE: ${{ github.event_name == 'pull_request' && format('origin/{0}...{1}', github.base_ref, github.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: bun run lint:doc-authority

      - name: Doc authority lint (strict policy)
        if: github.event_name != 'pull_request' && vars.DOC_AUTHORITY_STRICT_POLICY == 'true'
        env:
          DOC_AUTHORITY_STRICT: 'true'
          DOC_AUTHORITY_DIFF_RANGE: ${{ github.event_name == 'pull_request' && format('origin/{0}...{1}', github.base_ref, github.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: bun run lint:doc-authority

      - name: Navigation parity tests
        run: bun run test:nav-parity

      - name: Build
        run: bun run build

      - name: Run build diagnostics on failure
        if: failure()
        run: sh scripts/build-diagnostics.sh

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: tools/build-diagnostics
          if-no-files-found: ignore
