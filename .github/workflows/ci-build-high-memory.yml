name: CI Build High Memory

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'docs/INSTRUCTION_MANUAL.md'
      - 'docs/MODULE_ROADMAP.md'
      - 'docs/ENTERPRISE_PAIR_REVIEW_CANONICAL.md'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'tsconfig.app.json'
      - 'tsconfig.node.json'
      - 'vite.config.ts'
      - '.github/workflows/ci-build-high-memory.yml'
      - 'scripts/build-diagnostics.sh'
      - 'scripts/check-eslint-warning-budget.mjs'
      - 'scripts/check-build-budgets.mjs'
      - 'scripts/check-bob-governance-drift.mjs'
      - 'scripts/doc-authority-check.mjs'
      - 'scripts/collect-workflow-evidence.mjs'
      - 'tools/budgets/eslint-warning-budget.json'
      - 'docs/PHASE1_WORKFLOW_MATRIX_2026-05-02.json'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'docs/INSTRUCTION_MANUAL.md'
      - 'docs/MODULE_ROADMAP.md'
      - 'docs/ENTERPRISE_PAIR_REVIEW_CANONICAL.md'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'tsconfig.app.json'
      - 'tsconfig.node.json'
      - 'vite.config.ts'
      - '.github/workflows/ci-build-high-memory.yml'
      - 'scripts/build-diagnostics.sh'
      - 'scripts/check-eslint-warning-budget.mjs'
      - 'scripts/check-build-budgets.mjs'
      - 'scripts/check-bob-governance-drift.mjs'
      - 'scripts/doc-authority-check.mjs'
      - 'scripts/collect-workflow-evidence.mjs'
      - 'tools/budgets/eslint-warning-budget.json'
      - 'docs/PHASE1_WORKFLOW_MATRIX_2026-05-02.json'

jobs:
  typecheck-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Typecheck preflight
        run: npm run typecheck

  build-high-memory:
    needs: [typecheck-preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=8192

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Fetch base branch for pull request diffs
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --prune --depth=1 origin "${{ github.base_ref }}"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Lint warning budget gate
        id: lint_warning_budget
        continue-on-error: true
        run: npm run lint:warning-budget

      - name: Enforce lint warning budget gate (strict mode)
        if: steps.lint_warning_budget.outcome == 'failure' && vars.LINT_WARNING_BUDGET_STRICT == 'true' && (github.event_name != 'pull_request' || vars.GOVERNANCE_STRICT_ON_PR == 'true')
        run: |
          echo "::error::Lint warning budget gate failed and strict mode is enabled (LINT_WARNING_BUDGET_STRICT=true)."
          exit 1

      - name: Report lint warning budget gate (non-strict)
        if: steps.lint_warning_budget.outcome == 'failure' && (vars.LINT_WARNING_BUDGET_STRICT != 'true' || (github.event_name == 'pull_request' && vars.GOVERNANCE_STRICT_ON_PR != 'true'))
        run: |
          echo "::warning::Lint warning budget gate failed but strict mode is disabled; continuing."

      - name: Doc authority lint (mandatory)
        id: doc_authority
        continue-on-error: ${{ github.event_name == 'pull_request' && vars.GOVERNANCE_STRICT_ON_PR != 'true' }}
        env:
          DOC_AUTHORITY_STRICT: 'true'
          DOC_AUTHORITY_DIFF_RANGE: ${{ github.event_name == 'pull_request' && format('origin/{0}...{1}', github.base_ref, github.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: npm run lint:doc-authority

      - name: Enforce doc authority lint (strict contexts)
        if: steps.doc_authority.outcome == 'failure' && (github.event_name != 'pull_request' || vars.GOVERNANCE_STRICT_ON_PR == 'true')
        run: |
          echo "::error::Doc authority lint failed in strict context."
          exit 1

      - name: Report doc authority lint (advisory PR mode)
        if: steps.doc_authority.outcome == 'failure' && github.event_name == 'pull_request' && vars.GOVERNANCE_STRICT_ON_PR != 'true'
        run: |
          echo "::warning::Doc authority lint failed in advisory PR mode; continuing."

      - name: Bob governance drift lint (mandatory)
        id: bob_governance_drift
        continue-on-error: true
        env:
          BOB_GOVERNANCE_DRIFT_STRICT: 'true'
        run: npm run lint:bob-governance-drift

      - name: Enforce Bob governance drift lint
        if: steps.bob_governance_drift.outcome == 'failure' && (github.event_name != 'pull_request' || vars.GOVERNANCE_STRICT_ON_PR == 'true')
        run: |
          echo "::error::Bob governance drift lint failed. Check docs/INSTRUCTION_MANUAL.md and the Bob governance runtime surfaces before retrying this build."
          exit 1

      - name: Report Bob governance drift lint (advisory PR mode)
        if: steps.bob_governance_drift.outcome == 'failure' && github.event_name == 'pull_request' && vars.GOVERNANCE_STRICT_ON_PR != 'true'
        run: |
          echo "::warning::Bob governance drift lint failed in advisory PR mode; continuing."

      - name: Navigation parity tests
        id: nav_parity
        run: npm run test:nav-parity

      - name: Build
        id: build
        run: npm run build

      - name: Build budget gate
        run: npm run build:budget

      - name: Collect workflow evidence snapshot
        run: |
          npm run evidence:workflow -- --workflow WF-01,WF-07,WF-11 --status ci-snapshot --notes "ci-build-high-memory:${{ github.run_id }}" --out-dir tools/workflow-evidence/ci/${{ github.run_id }}

      - name: Upload workflow evidence artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: workflow-evidence-${{ github.run_id }}
          path: tools/workflow-evidence/ci/${{ github.run_id }}
          if-no-files-found: warn

      - name: Run build diagnostics on failure
        if: failure()
        run: sh scripts/build-diagnostics.sh

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-diagnostics
          path: tools/build-diagnostics
          if-no-files-found: ignore

      - name: Publish CI summary
        if: always()
        run: |
          echo "## CI Build High Memory" >> "$GITHUB_STEP_SUMMARY"
          echo "- Doc authority gate: ${{ steps.doc_authority.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Bob governance drift gate: ${{ steps.bob_governance_drift.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Navigation parity tests: ${{ steps.nav_parity.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build: ${{ steps.build.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ steps.bob_governance_drift.outcome }}" == "failure" ]]; then
            echo "- Bob governance drift failure focus: align docs/INSTRUCTION_MANUAL.md with edgeFunctions, bobMutationCatalog, bob-brain, and BobAssistantStudio." >> "$GITHUB_STEP_SUMMARY"
          fi
