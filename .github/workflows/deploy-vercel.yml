name: Deploy to Vercel

# -----------------------------------------------------------------------
# Deploys the web admin portal (Vite/React SPA) to Vercel.
#
# Triggers:
#   • Automatically on every push to main
#   • Manually from the GitHub Actions tab (workflow_dispatch)
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN       – from https://vercel.com/account/tokens
#                        (create a personal access token)
#   VERCEL_ORG_ID      – from .vercel/project.json after first `vercel` link,
#                        or Vercel Dashboard → Settings → General → "Team ID"
#   VERCEL_PROJECT_ID  – from .vercel/project.json after first `vercel` link,
#                        or Vercel Dashboard → Project → Settings → General → "Project ID"
#
# Required environment secrets (same location, or Vercel Dashboard → Project
#   → Settings → Environment Variables):
#   VITE_SUPABASE_URL      – https://YOUR_REF.supabase.co
#   VITE_SUPABASE_ANON_KEY – your Supabase anon/public key
#
# First-time setup:
#   1. Install Vercel CLI locally: npm install -g vercel
#   2. Run: vercel login && vercel link
#      When prompted:
#        Build command:    node_modules/.bin/vite build
#        Output directory: dist
#   3. Copy VERCEL_ORG_ID and VERCEL_PROJECT_ID from .vercel/project.json
#   4. Add all secrets above to this repository
#   5. Push to main or manually trigger this workflow
# -----------------------------------------------------------------------

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'supabase/**'
      - 'proxy-server/**'
      - 'inference-service/**'
      - 'mobile-app/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment target'
        required: false
        default: 'production'
        type: choice
        options: [production, preview]

jobs:
  deploy:
    name: Build & Deploy to Vercel
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check required secrets
        id: check-secrets
        run: |
          missing=""
          [ -z "$VERCEL_TOKEN" ]      && missing="$missing VERCEL_TOKEN"
          [ -z "$VERCEL_ORG_ID" ]     && missing="$missing VERCEL_ORG_ID"
          [ -z "$VERCEL_PROJECT_ID" ] && missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::warning::Vercel secrets not configured ($missing) — deployment skipped."
            echo ""
            echo "This workflow deploys via the Vercel CLI.  If you are using Vercel's"
            echo "native GitHub integration instead, you can ignore this message."
            echo ""
            echo "To enable this workflow, add the following repository secrets at:"
            echo "  GitHub repo → Settings → Secrets and variables → Actions"
            echo ""
            echo "  VERCEL_TOKEN:      Create at https://vercel.com/account/tokens"
            echo "  VERCEL_ORG_ID:     Vercel Dashboard → Settings → General → Team ID"
            echo "  VERCEL_PROJECT_ID: Vercel Dashboard → Project → Settings → General → Project ID"
            echo "secrets_present=false" >> "$GITHUB_OUTPUT"
          else
            echo "✅ Vercel secrets present"
            echo "secrets_present=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          VERCEL_TOKEN:      ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Checkout repository
        if: steps.check-secrets.outputs.secrets_present == 'true'
        uses: actions/checkout@v4

      - name: Setup Bun
        if: steps.check-secrets.outputs.secrets_present == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        if: steps.check-secrets.outputs.secrets_present == 'true'
        run: bun install

      - name: Build
        if: steps.check-secrets.outputs.secrets_present == 'true'
        run: bun run build
        env:
          VITE_SUPABASE_URL:      ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Install Vercel CLI
        if: steps.check-secrets.outputs.secrets_present == 'true'
        run: npm install -g vercel@latest

      - name: Pull Vercel project settings
        if: steps.check-secrets.outputs.secrets_present == 'true'
        run: vercel pull --yes --environment=production
        env:
          VERCEL_TOKEN:      ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel (production)
        if: steps.check-secrets.outputs.secrets_present == 'true' && (github.event_name == 'push' || github.event.inputs.environment == 'production')
        run: |
          vercel deploy --prebuilt --prod | tee /tmp/deploy-url.txt
          echo ""
          echo "✅ Production deployment complete!"
          echo "🌐 URL: $(cat /tmp/deploy-url.txt | tail -1)"
        env:
          VERCEL_TOKEN:      ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel (preview)
        if: steps.check-secrets.outputs.secrets_present == 'true' && github.event.inputs.environment == 'preview'
        run: |
          vercel deploy --prebuilt | tee /tmp/deploy-url.txt
          echo ""
          echo "✅ Preview deployment complete!"
          echo "🌐 URL: $(cat /tmp/deploy-url.txt | tail -1)"
        env:
          VERCEL_TOKEN:      ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
