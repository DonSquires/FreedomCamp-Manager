name: Ops Strict Uptime Gate

on:
  workflow_dispatch:

concurrency:
  group: ops-strict-uptime-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  strict-uptime-gate:
    name: Strict Uptime Gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      API_TEST_EMAIL: ${{ secrets.API_TEST_EMAIL }}
      API_TEST_PASSWORD: ${{ secrets.API_TEST_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install runtime dependencies
        run: npm install --no-audit --no-fund dotenv

      - name: Validate required secrets
        run: |
          set -euo pipefail
          missing=""
          [ -z "${VITE_SUPABASE_URL}" ] && missing="$missing VITE_SUPABASE_URL"
          [ -z "${VITE_SUPABASE_ANON_KEY}" ] && missing="$missing VITE_SUPABASE_ANON_KEY"
          [ -z "${API_TEST_EMAIL}" ] && missing="$missing API_TEST_EMAIL"
          [ -z "${API_TEST_PASSWORD}" ] && missing="$missing API_TEST_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing"
            exit 1
          fi

      - name: Run strict uptime gate
        id: uptime_gate
        continue-on-error: true
        run: node scripts/strict-uptime-gate.mjs

      - name: Enforce strict uptime gate
        if: steps.uptime_gate.outcome == 'failure' && vars.STRICT_UPTIME_GATE_STRICT == 'true'
        run: |
          echo "::error::Strict uptime gate failed and STRICT_UPTIME_GATE_STRICT=true."
          exit 1

      - name: Report strict uptime gate (non-strict)
        if: steps.uptime_gate.outcome == 'failure' && vars.STRICT_UPTIME_GATE_STRICT != 'true'
        run: |
          echo "::warning::Strict uptime gate failed but strict mode is disabled; continuing."
