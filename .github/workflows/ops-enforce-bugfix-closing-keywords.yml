name: Ops Enforce Bugfix Closing Keywords

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  issues: write
  pull-requests: write

jobs:
  enforce-closing-keywords:
    if: startsWith(github.head_ref, 'copilot/')
    runs-on: ubuntu-latest
    steps:
      - name: Validate bugfix closing keywords
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            const pr = context.payload.pull_request
            const issueNumber = pr.number
            const body = String(pr.body || '')

            // If the PR references issues at all, require at least one closing keyword.
            const hasIssueReference = /#\d+/i.test(body)
            const hasClosingKeyword = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#\d+/i.test(body)

            const marker = '<!-- ops-closing-keywords-required -->'
            const message = [
              marker,
              'This PR references one or more issues but is missing a closing keyword.',
              '',
              'Please update the PR body and resubmit with one of:',
              '- Closes #123',
              '- Fixes #123',
              '- Resolves #123',
              '',
              'This is required so bug report closure automation can complete end-to-end.'
            ].join('\n')

            if (!hasIssueReference || hasClosingKeyword) {
              core.info('Closing keyword policy passed.')
              return
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issueNumber,
              per_page: 100,
            })

            const existing = comments.find((c) => (c.body || '').includes(marker))
            if (!existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: message,
              })
            }

            core.setFailed('Missing closing keyword for referenced issue(s). Update PR body and resubmit.')
