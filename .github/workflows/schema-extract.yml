name: Schema Extract

# Extracts the database schema without needing a direct PostgreSQL connection.
#
# Two strategies (both avoid the IPv6 / pooler issues with direct DB access):
#
#   1. Supabase Management API  — uses `supabase gen types` + `supabase inspect db`
#      Needs: SUPABASE_ACCESS_TOKEN + SUPABASE_PROJECT_REF (+ SUPABASE_DB_PASSWORD for inspect)
#      Gets the LIVE schema from the hosted database.
#
#   2. Local migration replay   — spins up PostgreSQL in Docker, applies every
#      committed migration, then runs pg_dump + SQL queries.
#      Needs: nothing (Docker is pre-installed on GHA runners).
#      Shows what the schema SHOULD be based on committed migrations.
#
# Both strategies run when secrets are available; migration-replay always runs.

on:
  workflow_dispatch:
    inputs:
      push_results:
        description: "Push generated output to a new branch"
        required: false
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ── Strategy 1: Supabase Management API ─────────────────────────
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check Supabase secrets
        id: check_secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_PROJECT_REF" ]; then
            echo "has_api_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_api_secrets=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Supabase API secrets not configured — skipping Management API extraction."
            echo "  Set SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF in repository secrets."
          fi
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_PROJECT_REF" ] && [ -n "$SUPABASE_DB_PASSWORD" ]; then
            echo "has_full_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_full_secrets=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate TypeScript types from live schema
        if: steps.check_secrets.outputs.has_api_secrets == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          mkdir -p tools/schema-extract/output/live

          echo "Generating TypeScript types via Supabase Management API …"
          supabase gen types typescript \
            --project-id "$SUPABASE_PROJECT_REF" \
            --schema public \
            > tools/schema-extract/output/live/database.ts

          echo "✅ Live types written to tools/schema-extract/output/live/database.ts"

          # Check for drift against committed types
          if [ -f src/types/database.ts ]; then
            if diff -u src/types/database.ts tools/schema-extract/output/live/database.ts \
                 > tools/schema-extract/output/live/type_drift.diff 2>/dev/null; then
              echo "✅ src/types/database.ts matches the live schema — no drift."
              rm -f tools/schema-extract/output/live/type_drift.diff
            else
              echo "::warning::src/types/database.ts is out of date with the live Supabase schema."
              echo "Diff saved to tools/schema-extract/output/live/type_drift.diff"
              echo ""
              echo "--- Drift preview (first 100 lines) ---"
              head -100 tools/schema-extract/output/live/type_drift.diff
            fi
          fi

      - name: Inspect live schema details
        if: steps.check_secrets.outputs.has_full_secrets == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          OUT="tools/schema-extract/output/live"

          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

          echo "Inspecting live schema via Supabase CLI …"

          supabase inspect db table-sizes --linked  > "$OUT/table_sizes.txt"  2>/dev/null || true
          supabase inspect db index-sizes --linked  > "$OUT/index_sizes.txt"  2>/dev/null || true
          supabase inspect db bloat --linked         > "$OUT/bloat.txt"        2>/dev/null || true

          echo "✅ Live schema inspection complete"

      # ── Strategy 2: Local migration replay ──────────────────────────
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Run migration-replay extraction
        run: |
          set -euo pipefail
          chmod +x tools/schema-extract/extract_via_migrations.sh
          ./tools/schema-extract/extract_via_migrations.sh

      - name: Identify output directories
        id: dirs
        run: |
          set -euo pipefail
          # Migration-replay output (timestamped directory)
          REPLAY_DIR="$(ls -1dt tools/schema-extract/output/*/tables.txt 2>/dev/null | head -1 | xargs dirname 2>/dev/null || true)"
          echo "replay_dir=${REPLAY_DIR}" >> "$GITHUB_OUTPUT"

          # All output for artifact upload
          echo "output_dir=tools/schema-extract/output" >> "$GITHUB_OUTPUT"

      - name: Upload extraction artifact
        uses: actions/upload-artifact@v5
        with:
          name: schema-extract-${{ github.run_id }}
          path: ${{ steps.dirs.outputs.output_dir }}
          if-no-files-found: warn

      - name: Push output branch (optional)
        if: inputs.push_results
        run: |
          set -euo pipefail
          branch="schema-extract/${{ github.run_id }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$branch"
          git add -f tools/schema-extract/output

          if git diff --cached --quiet; then
            echo "No output changes to commit."
            exit 0
          fi

          git commit -m "chore: add schema extract output (${{ github.run_id }})"
          git push --set-upstream origin "$branch"
