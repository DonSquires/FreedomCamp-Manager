name: Schema Extract

# Reads the live schema and can push output to a branch for review.
# After running, update docs/LIVE_SCHEMA.md with any new columns and open a PR
# for review by @DonSquires before merging the changes into main.

on:
  workflow_dispatch:
    inputs:
      push_results:
        description: "Push generated output to a new branch"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Check required secrets
        id: check_secrets
        env:
          PGHOST:     ${{ secrets.PGHOST }}
          PGPORT:     ${{ secrets.PGPORT }}
          PGUSER:     ${{ secrets.PGUSER }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
          PGDATABASE: ${{ secrets.PGDATABASE }}
        run: |
          missing=""
          for var in PGHOST PGPORT PGUSER PGPASSWORD PGDATABASE; do
            eval "val=\${${var}:-}"
            if [ -z "$val" ]; then
              missing="$missing $var"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::notice::Required secrets not configured:$missing – skipping extraction."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.check_secrets.outputs.skip == 'false'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install PostgreSQL client
        if: steps.check_secrets.outputs.skip == 'false'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Run schema extraction
        if: steps.check_secrets.outputs.skip == 'false'
        env:
          PGHOST: ${{ secrets.PGHOST }}
          PGPORT: ${{ secrets.PGPORT }}
          PGUSER: ${{ secrets.PGUSER }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
          PGDATABASE: ${{ secrets.PGDATABASE }}
        run: |
          set -euo pipefail
          chmod +x tools/schema-extract/run_extract.sh
          ./tools/schema-extract/run_extract.sh
          LATEST_DIR="$(ls -1dt tools/schema-extract/output/*/ | head -n 1)"
          echo "latest_dir=${LATEST_DIR%/}" >> "$GITHUB_OUTPUT"
        id: extract

      - name: Upload extraction artifact
        if: steps.check_secrets.outputs.skip == 'false'
        uses: actions/upload-artifact@v5
        with:
          name: schema-extract-${{ github.run_id }}
          path: ${{ steps.extract.outputs.latest_dir }}
          if-no-files-found: error

      - name: Push output branch (optional)
        if: steps.check_secrets.outputs.skip == 'false' && inputs.push_results
        run: |
          set -euo pipefail
          branch="schema-extract/${{ github.run_id }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$branch"
          git add -f tools/schema-extract/output

          if git diff --cached --quiet; then
            echo "No output changes to commit."
            exit 0
          fi

          git commit -m "chore: add schema extract output (${{ github.run_id }})"
          git push --set-upstream origin "$branch"
