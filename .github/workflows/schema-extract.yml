name: Schema Extract

# Reads the live schema and can push output to a branch for review.
# After running, update docs/LIVE_SCHEMA.md with any new columns and open a PR
# for review by @DonSquires before merging the changes into main.
#
# Connection priority:
#   1. DATABASE_URL           – full connection string (copy from Supabase Dashboard)
#   2. PG* secrets            – PGHOST, PGUSER, PGPASSWORD, PGDATABASE (+ optional PGPORT)
#   3. SUPABASE_PROJECT_REF + SUPABASE_DB_PASSWORD – derives a pooler DATABASE_URL

on:
  workflow_dispatch:
    inputs:
      push_results:
        description: "Push generated output to a new branch"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve database connection
        id: resolve_db
        env:
          DATABASE_URL:          ${{ secrets.DATABASE_URL }}
          PGHOST:                ${{ secrets.PGHOST }}
          PGUSER:                ${{ secrets.PGUSER }}
          PGPASSWORD:            ${{ secrets.PGPASSWORD }}
          PGDATABASE:            ${{ secrets.PGDATABASE }}
          PGPORT:                ${{ secrets.PGPORT }}
          SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          # ── Method 1: DATABASE_URL ──
          if [ -n "${DATABASE_URL:-}" ]; then
            echo "mode=database_url" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ── Method 2: individual PG* secrets ──
          if [ -n "${PGHOST:-}" ] && [ -n "${PGUSER:-}" ] && [ -n "${PGPASSWORD:-}" ] && [ -n "${PGDATABASE:-}" ]; then
            echo "mode=pgvars" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ── Method 3: Supabase secrets → derive pooler DATABASE_URL ──
          if [ -n "${SUPABASE_PROJECT_REF:-}" ] && [ -n "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "mode=supabase" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ── No credentials available ──
          echo "::error::No database credentials configured."
          echo "::error::Configure ONE of the following in GitHub → Settings → Secrets → Actions:"
          echo "::error::  Option A (recommended): DATABASE_URL"
          echo "::error::    Copy the URI from: Supabase Dashboard → Project Settings → Database → Connection string → URI"
          echo "::error::    Use the 'Session mode' pooler string (port 5432) for best compatibility."
          echo "::error::  Option B: PGHOST + PGUSER + PGPASSWORD + PGDATABASE (+ optional PGPORT)"
          echo "::error::  Option C: SUPABASE_PROJECT_REF + SUPABASE_DB_PASSWORD"
          exit 1

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install PostgreSQL client
        run: |
          sudo apt-get install -y --no-install-recommends curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-17

      - name: Run schema extraction
        env:
          DATABASE_URL:          ${{ secrets.DATABASE_URL }}
          PGHOST:                ${{ secrets.PGHOST }}
          PGPORT:                ${{ secrets.PGPORT }}
          PGUSER:                ${{ secrets.PGUSER }}
          PGPASSWORD:            ${{ secrets.PGPASSWORD }}
          PGDATABASE:            ${{ secrets.PGDATABASE }}
          SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_POOLER_HOST:  ${{ secrets.SUPABASE_POOLER_HOST }}
          CONNECTION_MODE:       ${{ steps.resolve_db.outputs.mode }}
        run: |
          set -euo pipefail

          # Derive DATABASE_URL from Supabase secrets when using the pooler fallback
          if [ "$CONNECTION_MODE" = "supabase" ] && [ -z "${DATABASE_URL:-}" ]; then
            POOLER_HOST="${SUPABASE_POOLER_HOST:-aws-0-ap-southeast-2.pooler.supabase.com}"
            export DATABASE_URL="postgresql://postgres.${SUPABASE_PROJECT_REF}:${SUPABASE_DB_PASSWORD}@${POOLER_HOST}:5432/postgres?sslmode=require"
            echo "Using derived Supabase pooler connection (host: ${POOLER_HOST})."
            echo "If this fails with 'Tenant or user not found', add a DATABASE_URL secret"
            echo "with the URI copied from Supabase Dashboard → Project Settings → Database → Connection string."
          fi

          chmod +x tools/schema-extract/run_extract.sh
          ./tools/schema-extract/run_extract.sh
          LATEST_DIR="$(ls -1dt tools/schema-extract/output/*/ | head -n 1)"
          echo "latest_dir=${LATEST_DIR%/}" >> "$GITHUB_OUTPUT"
        id: extract

      - name: Upload extraction artifact
        uses: actions/upload-artifact@v5
        with:
          name: schema-extract-${{ github.run_id }}
          path: ${{ steps.extract.outputs.latest_dir }}
          if-no-files-found: error

      - name: Push output branch (optional)
        if: inputs.push_results
        run: |
          set -euo pipefail
          branch="schema-extract/${{ github.run_id }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$branch"
          git add -f tools/schema-extract/output

          if git diff --cached --quiet; then
            echo "No output changes to commit."
            exit 0
          fi

          git commit -m "chore: add schema extract output (${{ github.run_id }})"
          git push --set-upstream origin "$branch"
