name: Schema Extract

# Reads the live schema and can push output to a branch for review.
# After running, update docs/LIVE_SCHEMA.md with any new columns and open a PR
# for review by @DonSquires before merging the changes into main.

on:
  workflow_dispatch:
    inputs:
      push_results:
        description: "Push generated output to a new branch"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Check required secrets
        id: check_secrets
        env:
          PGHOST:                ${{ secrets.PGHOST }}
          PGPORT:                ${{ secrets.PGPORT }}
          PGUSER:                ${{ secrets.PGUSER }}
          PGPASSWORD:            ${{ secrets.PGPASSWORD }}
          PGDATABASE:            ${{ secrets.PGDATABASE }}
          SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          # Prefer individual PG* secrets (consistent with merge_all.yml extract-schema).
          # Fall back to deriving connection details from SUPABASE_PROJECT_REF / SUPABASE_DB_PASSWORD.
          if [ -n "${PGHOST:-}" ] && [ -n "${PGUSER:-}" ] && [ -n "${PGPASSWORD:-}" ]; then
            echo "mode=pg" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif [ -n "${SUPABASE_PROJECT_REF:-}" ] && [ -n "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "mode=supabase" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Required secrets not configured (need PGHOST/PGUSER/PGPASSWORD or SUPABASE_PROJECT_REF/SUPABASE_DB_PASSWORD) – skipping extraction."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.check_secrets.outputs.skip == 'false'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install PostgreSQL client
        if: steps.check_secrets.outputs.skip == 'false'
        run: |
          sudo apt-get install -y --no-install-recommends curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-17

      - name: Run schema extraction
        if: steps.check_secrets.outputs.skip == 'false'
        env:
          # When mode=pg the PG* secrets are used directly.
          # When mode=supabase the connection details are derived below.
          PGHOST:                ${{ secrets.PGHOST }}
          PGPORT:                ${{ secrets.PGPORT }}
          PGUSER:                ${{ secrets.PGUSER }}
          PGPASSWORD:            ${{ secrets.PGPASSWORD }}
          PGDATABASE:            ${{ secrets.PGDATABASE }}
          SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
          CONNECTION_MODE:       ${{ steps.check_secrets.outputs.mode }}
        run: |
          set -euo pipefail

          if [ "$CONNECTION_MODE" = "supabase" ]; then
            export PGHOST="aws-0-ap-southeast-2.pooler.supabase.com"
            export PGPORT="5432"
            export PGUSER="postgres.${SUPABASE_PROJECT_REF}"
            export PGPASSWORD="${SUPABASE_DB_PASSWORD}"
            export PGDATABASE="postgres"
          fi

          # Defaults applied by run_extract.sh: PGSSLMODE=require, PGCONNECT_TIMEOUT=30
          chmod +x tools/schema-extract/run_extract.sh
          ./tools/schema-extract/run_extract.sh
          LATEST_DIR="$(ls -1dt tools/schema-extract/output/*/ | head -n 1)"
          echo "latest_dir=${LATEST_DIR%/}" >> "$GITHUB_OUTPUT"
        id: extract

      - name: Upload extraction artifact
        if: steps.check_secrets.outputs.skip == 'false'
        uses: actions/upload-artifact@v5
        with:
          name: schema-extract-${{ github.run_id }}
          path: ${{ steps.extract.outputs.latest_dir }}
          if-no-files-found: error

      - name: Push output branch (optional)
        if: steps.check_secrets.outputs.skip == 'false' && inputs.push_results
        run: |
          set -euo pipefail
          branch="schema-extract/${{ github.run_id }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$branch"
          git add -f tools/schema-extract/output

          if git diff --cached --quiet; then
            echo "No output changes to commit."
            exit 0
          fi

          git commit -m "chore: add schema extract output (${{ github.run_id }})"
          git push --set-upstream origin "$branch"
