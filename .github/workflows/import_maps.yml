name: Hydrate NZ Maps
on: 
  workflow_dispatch:
    inputs:
      import_mode:
        description: 'Import mode: "territorial" for TA boundaries, "meshblock" for enforcement zones, "campsites" for zone data from DOC/LINZ/councils'
        required: false
        default: 'territorial'
        type: choice
        options:
          - territorial
          - meshblock
          - campsites
      import_sources:
        description: 'Campsite sources (comma-separated): all, doc_campsites, doc_huts, doc_freedom_camping, linz_crown, council'
        required: false
        default: 'all'
        type: string
      organization_id:
        description: 'Organization UUID (required for meshblock mode)'
        required: false
        type: string
      import_bbox:
        description: 'Bounding box filter: minLng,minLat,maxLng,maxLat (recommended for meshblock mode)'
        required: false
        type: string

jobs:
  import-geo:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Dependencies
        # We install packages on the fly so you don't need a package.json
        run: npm install @supabase/supabase-js@2 dotenv@16 typescript@5 ts-node@10 @types/node@20
        
      - name: Run Import Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Stats NZ Geographic Data Service API key (optional for territorial mode, required for meshblock)
          # Falls back to NZTA public data if not set. Register at https://datafinder.stats.govt.nz/
          STATSNZ_API_KEY: ${{ secrets.STATSNZ_API_KEY }}
          IMPORT_MODE: ${{ inputs.import_mode }}
          IMPORT_SOURCES: ${{ inputs.import_sources }}
          ORGANIZATION_ID: ${{ inputs.organization_id }}
          IMPORT_BBOX: ${{ inputs.import_bbox }}
        run: |
          if [ "${{ inputs.import_mode }}" = "campsites" ]; then
            npx ts-node scripts/import_campsites.ts
          else
            npx ts-node scripts/import_boundaries.ts
          fi
