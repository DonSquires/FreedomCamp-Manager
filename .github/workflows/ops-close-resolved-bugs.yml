name: Ops Close Resolved Bugs

# Closes Supabase bug_reports when their linked GitHub Issues are closed via
# a merged pull request.
#
# How it works:
#   1. Triggers on pull_request.closed (merged to main only).
#   2. Reads the PR body for "Closes #N", "Fixes #N", "Resolves #N" patterns.
#   3. For each linked issue, fetches the issue and checks for a
#      <!-- bug-report-id:UUID --> HTML comment written by ops-triage-bug-reports.yml.
#   4. If found, patches the corresponding bug_reports row to status=resolved.
#
# Required secrets:
#   VITE_SUPABASE_URL          — Supabase project URL
#   SUPABASE_SERVICE_ROLE_KEY  — Supabase service role key

on:
  pull_request:
    types: [closed]
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  close-resolved-bugs:
    name: Mark resolved bug reports
    runs-on: ubuntu-latest
    # Only run when the PR was actually merged (not just closed/abandoned).
    if: github.event.pull_request.merged == true

    steps:
      - name: Validate required secrets
        id: validate-secrets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          missing=""
          [ -z "$VITE_SUPABASE_URL" ]         && missing="$missing VITE_SUPABASE_URL"
          [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] && missing="$missing SUPABASE_SERVICE_ROLE_KEY"
          if [ -n "$missing" ]; then
            echo "::warning::Missing secret(s):$missing — skipping close-resolved-bugs."
            echo "can_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "can_run=true" >> "$GITHUB_OUTPUT"

      - name: Find linked issues and mark bug reports resolved
        if: steps.validate-secrets.outputs.can_run == 'true'
        uses: actions/github-script@v7
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const supabaseUrl  = (process.env.VITE_SUPABASE_URL || '').replace(/\/+$/, '')
            const serviceKey   = process.env.SUPABASE_SERVICE_ROLE_KEY
            const pr           = context.payload.pull_request
            const [repoOwner, repoName] = (process.env.GITHUB_REPOSITORY || '/').split('/')

            core.info(`PR #${pr.number} merged: "${pr.title}"`)

            // ── Extract issue numbers linked in the PR body ────────────────────────
            // GitHub-supported closing keywords (case-insensitive):
            // close/closes/closed, fix/fixes/fixed, resolve/resolves/resolved
            const body = String(pr.body || '')
            const issuePattern = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi
            const issueNumbers = []
            let match
            while ((match = issuePattern.exec(body)) !== null) {
              const n = parseInt(match[1], 10)
              if (!isNaN(n) && !issueNumbers.includes(n)) issueNumbers.push(n)
            }

            if (issueNumbers.length === 0) {
              core.info('No linked issue numbers found in PR body — nothing to do.')
              await core.summary
                .addRaw(`## Close Resolved Bugs\n\nPR #${pr.number} merged. No linked \`Closes #N\` references found.`)
                .write()
              return
            }

            core.info(`Found ${issueNumbers.length} linked issue(s): ${issueNumbers.join(', ')}`)

            let resolved = 0
            let skipped  = 0
            let failed   = 0

            for (const issueNumber of issueNumbers) {
              core.info(`Processing issue #${issueNumber}...`)

              // ── Fetch the GitHub issue ─────────────────────────────────────────
              let issue
              try {
                const resp = await github.rest.issues.get({
                  owner: repoOwner,
                  repo: repoName,
                  issue_number: issueNumber,
                })
                issue = resp.data
              } catch (err) {
                core.warning(`  ⚠️  Could not fetch issue #${issueNumber}: ${err.message}`)
                skipped++
                continue
              }

              // Must have the bug-report label to be eligible.
              const hasBugReportLabel = (issue.labels || []).some(l => l.name === 'bug-report')
              if (!hasBugReportLabel) {
                core.info(`  Issue #${issueNumber} does not have 'bug-report' label — skipping.`)
                skipped++
                continue
              }

              // ── Extract bug-report UUID from issue body ────────────────────────
              const issueBody = String(issue.body || '')
              const idMatch   = issueBody.match(/<!--\s*bug-report-id:([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})\s*-->/)
              if (!idMatch) {
                core.info(`  Issue #${issueNumber} has no bug-report-id comment — skipping.`)
                skipped++
                continue
              }

              const bugReportId = idMatch[1]
              core.info(`  Found bug report ID: ${bugReportId}`)

              // ── Patch the Supabase bug_reports row ────────────────────────────
              const patchResp = await fetch(
                `${supabaseUrl}/rest/v1/bug_reports?id=eq.${bugReportId}`,
                {
                  method: 'PATCH',
                  headers: {
                    apikey: serviceKey,
                    Authorization: `Bearer ${serviceKey}`,
                    'Content-Type': 'application/json',
                    Prefer: 'return=minimal',
                  },
                  body: JSON.stringify({
                    status: 'resolved',
                    resolved_at: new Date().toISOString(),
                    resolution_note: `Resolved by PR #${pr.number}: ${pr.title}`,
                  }),
                }
              )

              if (patchResp.ok) {
                core.info(`  ✅ Bug report ${bugReportId} marked resolved.`)
                resolved++
              } else {
                const text = await patchResp.text().catch(() => '')
                core.warning(`  ❌ Failed to patch bug report ${bugReportId}: HTTP ${patchResp.status} ${text.slice(0, 200)}`)
                failed++
              }

              // Throttle to respect Supabase rate limits.
              await new Promise(r => setTimeout(r, 300))
            }

            // ── Summary ───────────────────────────────────────────────────────────
            const summaryLines = [
              `## Close Resolved Bugs`,
              '',
              `PR #${pr.number} merged. Processed ${issueNumbers.length} linked issue(s).`,
              '',
              `| Metric | Count |`,
              `|--------|-------|`,
              `| Linked issues found | ${issueNumbers.length} |`,
              `| ✅ Bug reports marked resolved | ${resolved} |`,
              `| ⏭️  Skipped (no bug-report label or ID) | ${skipped} |`,
              `| ❌ Failed | ${failed} |`,
            ]
            await core.summary.addRaw(summaryLines.join('\n')).write()

            if (failed > 0) {
              core.setFailed(`${failed} bug report(s) could not be marked resolved — check warnings above.`)
            }
