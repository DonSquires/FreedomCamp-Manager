name: Human Trial Release Gate

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Optional base URL override for deep/focused browser runs
        required: false
        type: string

permissions:
  contents: read
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  CI: 'true'
  PLAYWRIGHT_ALLOW_SHARED_CREDENTIAL_FALLBACK: '1'
  PLAYWRIGHT_SKIP_ROLE_ASSERTIONS: '1'

jobs:
  human-trial-gate:
    name: Build And Full Trial Gate
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      PLAYWRIGHT_ADMIN_EMAIL: ${{ secrets.PLAYWRIGHT_ADMIN_EMAIL }}
      PLAYWRIGHT_ADMIN_PASSWORD: ${{ secrets.PLAYWRIGHT_ADMIN_PASSWORD }}
      PLAYWRIGHT_MASTER_EMAIL: ${{ secrets.PLAYWRIGHT_MASTER_EMAIL }}
      PLAYWRIGHT_MASTER_PASSWORD: ${{ secrets.PLAYWRIGHT_MASTER_PASSWORD }}
      PLAYWRIGHT_OFFICER_EMAIL: ${{ secrets.PLAYWRIGHT_OFFICER_EMAIL }}
      PLAYWRIGHT_OFFICER_PASSWORD: ${{ secrets.PLAYWRIGHT_OFFICER_PASSWORD }}
      PLAYWRIGHT_CLIENT_VIEWER_EMAIL: ${{ secrets.PLAYWRIGHT_CLIENT_VIEWER_EMAIL }}
      PLAYWRIGHT_CLIENT_VIEWER_PASSWORD: ${{ secrets.PLAYWRIGHT_CLIENT_VIEWER_PASSWORD }}
      PLAYWRIGHT_CLIENT_STAFF_EMAIL: ${{ secrets.PLAYWRIGHT_CLIENT_STAFF_EMAIL }}
      PLAYWRIGHT_CLIENT_STAFF_PASSWORD: ${{ secrets.PLAYWRIGHT_CLIENT_STAFF_PASSWORD }}
      API_TEST_EMAIL: ${{ secrets.API_TEST_EMAIL }}
      API_TEST_PASSWORD: ${{ secrets.API_TEST_PASSWORD }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      DEFAULT_PLAYWRIGHT_BASE_URL: ${{ secrets.FRONTEND_URL }}
      BOB_SERVICE_URL: ${{ secrets.BOB_SERVICE_URL }}
      INFERENCE_SERVICE_URL: ${{ secrets.INFERENCE_SERVICE_URL }}
      BOB_INFERENCE_API_KEY: ${{ secrets.BOB_INFERENCE_API_KEY }}
      INFERENCE_API_KEY: ${{ secrets.INFERENCE_API_KEY }}
      AI_ASSIST_BASE_URL: ${{ secrets.AI_ASSIST_BASE_URL }}
      AI_ASSIST_ANALYZE_URL: ${{ secrets.AI_ASSIST_ANALYZE_URL }}
      AI_ASSIST_API_KEY: ${{ secrets.AI_ASSIST_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers and system deps
        run: bunx playwright install --with-deps chromium firefox webkit

      - name: Mandatory AI build research triage assistance
        id: mandatory_ai_assist
        continue-on-error: true
        run: node scripts/mandatory-ai-build-assist.mjs --mode human-trial-release-gate --required build,research,triage --out-dir tools/human-trial-gate

      - name: Verify Bob training wiring
        id: verify_training
        continue-on-error: true
        run: node scripts/verify-bob-training-wiring.mjs --json-only

      - name: Validate required credentials
        id: validate_credentials
        continue-on-error: true
        run: |
          missing=""
          for key in \
            PLAYWRIGHT_ADMIN_EMAIL \
            PLAYWRIGHT_ADMIN_PASSWORD \
            VITE_SUPABASE_URL \
            VITE_SUPABASE_ANON_KEY
          do
            if [ -z "${!key}" ]; then
              missing="$missing $key"
            fi
          done

          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing"
            exit 1
          fi

      - name: Lint
        id: lint
        continue-on-error: true
        run: bun run lint

      - name: Navigation parity
        id: nav_parity
        continue-on-error: true
        run: bun run test:nav-parity

      - name: Build
        id: build
        continue-on-error: true
        run: bun run build

      - name: API suite
        id: api_suite
        continue-on-error: true
        run: bun run test:api

      - name: Resolve local preview base URL
        run: |
          TARGET_URL="http://127.0.0.1:4173"
          if [ -n "${{ github.event.inputs.base_url }}" ]; then
            TARGET_URL="${{ github.event.inputs.base_url }}"
          fi

          {
            echo "PLAYWRIGHT_BASE_URL=$TARGET_URL"
            echo "PLAYWRIGHT_FOCUSED_BASE_URL=$TARGET_URL"
          } >> "$GITHUB_ENV"

      - name: Focused Chromium suite
        id: focused_suite
        continue-on-error: true
        run: |
          set -e
          if [ "$PLAYWRIGHT_BASE_URL" = "http://127.0.0.1:4173" ]; then
            bun run preview -- --host 127.0.0.1 --port 4173 > /tmp/human-trial-preview.log 2>&1 &
            PREVIEW_PID=$!
            trap 'kill "$PREVIEW_PID" >/dev/null 2>&1 || true' EXIT

            for i in $(seq 1 40); do
              if curl -fsS --max-time 5 "$PLAYWRIGHT_BASE_URL/login" >/dev/null 2>&1; then
                break
              fi
              if [ "$i" -eq 40 ]; then
                echo "::error::Preview server never became ready"
                tail -n 120 /tmp/human-trial-preview.log || true
                exit 1
              fi
              sleep 2
            done
          fi

          bun run test:focused

      - name: Human module sweep
        id: human_modules
        continue-on-error: true
        run: bun run test:human:modules

      - name: Deep cross-browser functional suite
        id: deep_suite
        continue-on-error: true
        run: |
          set -e
          if [ "$PLAYWRIGHT_BASE_URL" = "http://127.0.0.1:4173" ]; then
            bun run preview -- --host 127.0.0.1 --port 4173 > /tmp/human-trial-preview-deep.log 2>&1 &
            PREVIEW_PID=$!
            trap 'kill "$PREVIEW_PID" >/dev/null 2>&1 || true' EXIT

            for i in $(seq 1 40); do
              if curl -fsS --max-time 5 "$PLAYWRIGHT_BASE_URL/login" >/dev/null 2>&1; then
                break
              fi
              if [ "$i" -eq 40 ]; then
                echo "::error::Preview server never became ready for deep suite"
                tail -n 120 /tmp/human-trial-preview-deep.log || true
                exit 1
              fi
              sleep 2
            done
          fi

          bunx playwright test tests/e2e/deep-functional.spec.ts tests/e2e/tender-workspace.spec.ts \
            --config=playwright.deep-lite.config.ts \
            --project=webkit \
            --project="Mobile Safari" \
            --reporter=list

      - name: Generate trial gate summary
        id: gate_summary
        if: always()
        env:
          OUTCOME_MANDATORY_AI_ASSIST: ${{ steps.mandatory_ai_assist.outcome }}
          OUTCOME_VERIFY_TRAINING: ${{ steps.verify_training.outcome }}
          OUTCOME_VALIDATE_CREDENTIALS: ${{ steps.validate_credentials.outcome }}
          OUTCOME_LINT: ${{ steps.lint.outcome }}
          OUTCOME_NAV_PARITY: ${{ steps.nav_parity.outcome }}
          OUTCOME_BUILD: ${{ steps.build.outcome }}
          OUTCOME_API_SUITE: ${{ steps.api_suite.outcome }}
          OUTCOME_FOCUSED_SUITE: ${{ steps.focused_suite.outcome }}
          OUTCOME_HUMAN_MODULES: ${{ steps.human_modules.outcome }}
          OUTCOME_DEEP_SUITE: ${{ steps.deep_suite.outcome }}
        run: node scripts/human-trial-gate-summary.mjs --out-dir tools/human-trial-gate

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: human-trial-release-gate-evidence-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            tools/bob-human-ux-audit-runs/
            tools/human-trial-gate/
            /tmp/human-trial-preview.log
            /tmp/human-trial-preview-deep.log

      - name: Upload gate summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: human-trial-release-gate-summary-${{ github.run_id }}
          path: |
            tools/human-trial-gate/summary.json
            tools/human-trial-gate/summary.md

      - name: Enforce release gate verdict
        if: always()
        env:
          OUTCOME_MANDATORY_AI_ASSIST: ${{ steps.mandatory_ai_assist.outcome }}
          OUTCOME_VERIFY_TRAINING: ${{ steps.verify_training.outcome }}
          OUTCOME_VALIDATE_CREDENTIALS: ${{ steps.validate_credentials.outcome }}
          OUTCOME_LINT: ${{ steps.lint.outcome }}
          OUTCOME_NAV_PARITY: ${{ steps.nav_parity.outcome }}
          OUTCOME_BUILD: ${{ steps.build.outcome }}
          OUTCOME_API_SUITE: ${{ steps.api_suite.outcome }}
          OUTCOME_FOCUSED_SUITE: ${{ steps.focused_suite.outcome }}
          OUTCOME_HUMAN_MODULES: ${{ steps.human_modules.outcome }}
          OUTCOME_DEEP_SUITE: ${{ steps.deep_suite.outcome }}
        run: |
          failed=""

          for item in \
            "mandatory-ai-assist:$OUTCOME_MANDATORY_AI_ASSIST" \
            "verify-training:$OUTCOME_VERIFY_TRAINING" \
            "validate-credentials:$OUTCOME_VALIDATE_CREDENTIALS" \
            "lint:$OUTCOME_LINT" \
            "nav-parity:$OUTCOME_NAV_PARITY" \
            "build:$OUTCOME_BUILD" \
            "api-suite:$OUTCOME_API_SUITE" \
            "focused-suite:$OUTCOME_FOCUSED_SUITE" \
            "human-modules:$OUTCOME_HUMAN_MODULES" \
            "deep-suite:$OUTCOME_DEEP_SUITE"
          do
            name="${item%%:*}"
            status="${item#*:}"
            if [ "$status" = "failure" ] || [ "$status" = "cancelled" ]; then
              failed="$failed $name($status)"
            fi
          done

          if [ -n "$failed" ]; then
            echo "::error::Human trial release gate failed due to:$failed"
            echo "See tools/human-trial-gate/summary.md for blocker/major/minor details"
            exit 1
          fi

          echo "Human trial release gate passed"