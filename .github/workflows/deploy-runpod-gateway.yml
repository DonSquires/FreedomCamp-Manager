name: Upload RunPod Gateway to Pod

# Deploys runpod-gateway/ to the RunPod bob_brain pod whenever source changes.
# Uses appleboy/ssh-action which properly allocates a PTY (required by RunPod SSH proxy).
#
# Required secrets:
#   RUNPOD_POD_SSH_HOST   – e.g. ssh.runpod.io
#   RUNPOD_POD_SSH_USER   – pod SSH username (e.g. eipnu6bq181q20-64411b6a)
#   RUNPOD_POD_SSH_KEY    – private key (RSA/ED25519, no passphrase)
#   BOB_GATEWAY_KEY       – shared secret for gateway auth
#
# Optional secrets:
#   RUNPOD_POD_SSH_PORT   – defaults to 22
#   BOB_GATEWAY_ADMIN_KEY – elevated key for model management operations

on:
  push:
    branches:
      - main
    paths:
      - runpod-gateway/**
      - .github/workflows/deploy-runpod-gateway.yml
  workflow_dispatch:

concurrency:
  group: runpod-gateway-deploy-main
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-gateway:
    name: Deploy gateway to RunPod pod
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Deploy and start gateway via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_GITHUB_TOKEN }}
          BOB_GATEWAY_KEY: ${{ secrets.BOB_GATEWAY_KEY }}
        with:
          host: ${{ secrets.VPS_IP || secrets.RUNPOD_POD_SSH_HOST }}
          username: ${{ secrets.VPS_USERNAME || secrets.RUNPOD_POD_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY || secrets.RUNPOD_POD_SSH_KEY }}
          port: ${{ secrets.RUNPOD_POD_SSH_PORT || 22 }}
          request_pty: true
          command_timeout: 15m
          envs: GH_TOKEN,BOB_GATEWAY_KEY
          script: |
            set -e
            BASE_DIR=/workspace
            [ -d /workspace ] || BASE_DIR=$HOME
            cd "$BASE_DIR"

            echo "Preparing sparse checkout for runpod-gateway..."
            if [ -d repo/.git ]; then
              rm -rf repo
            fi

            git clone --depth 1 --filter=blob:none --sparse "https://${GH_TOKEN}@github.com/DonSquires/FreedomCamp-Manager.git" repo
            git -C repo sparse-checkout set runpod-gateway
            git -C repo checkout main

            echo "Syncing runpod-gateway files..."
            if [ -d "$BASE_DIR/runpod-gateway" ]; then
              rm -rf "$BASE_DIR/runpod-gateway"
            else
              mkdir -p "$BASE_DIR/runpod-gateway"
            fi
            cp -r "$BASE_DIR/repo/runpod-gateway/." "$BASE_DIR/runpod-gateway/"
            cd "$BASE_DIR/runpod-gateway"

            echo "Installing gateway dependencies..."
            npm install --production
            printf "OLLAMA_HOST=http://127.0.0.1:11434\nPORT=8080\nNODE_ENV=production\nBOB_GATEWAY_KEY=${BOB_GATEWAY_KEY}\n" > .env
            NODE_BIN="$(command -v node || true)"
            if [ -z "$NODE_BIN" ]; then
              echo "node is not installed on pod; aborting deploy."
              exit 1
            fi
            pkill -f "node server.js" 2>/dev/null || true
            set -a
            . ./.env
            set +a
            nohup "$NODE_BIN" server.js > "$BASE_DIR/gateway.log" 2>&1 &
            echo "Gateway started with PID $!"
            sleep 3
            curl -sf http://127.0.0.1:8080/gateway/health && echo "Gateway health check PASSED" || echo "Gateway health check failed - check $BASE_DIR/gateway.log"
