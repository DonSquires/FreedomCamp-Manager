name: Phase 1 Radio Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tests/e2e/radio-*.spec.ts'
      - 'playwright.config.ts'
      - '.github/workflows/phase1-radio-validation.yml'

concurrency:
  group: phase1-radio-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  phase1-radio-validation:
    name: Phase 1 Radio Validation (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      CI: true

      # Keep preflight scoped to the identities required by this suite.
      PLAYWRIGHT_ALLOW_SHARED_CREDENTIAL_FALLBACK: '1'
      PLAYWRIGHT_REQUIRED_TEST_USERS: adminOrg1,officerOrg1

      # Supabase
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Role matrix (required for org isolation + consent/revocation coverage)
      PLAYWRIGHT_ADMIN_ORG1_EMAIL: ${{ secrets.PLAYWRIGHT_ADMIN_EMAIL }}
      PLAYWRIGHT_ADMIN_ORG1_PASSWORD: ${{ secrets.PLAYWRIGHT_ADMIN_PASSWORD }}
      PLAYWRIGHT_ADMIN_ORG2_EMAIL: ${{ secrets.PLAYWRIGHT_ADMIN_EMAIL }}
      PLAYWRIGHT_ADMIN_ORG2_PASSWORD: ${{ secrets.PLAYWRIGHT_ADMIN_PASSWORD }}
      PLAYWRIGHT_OFFICER_ORG1_EMAIL: ${{ secrets.PLAYWRIGHT_OFFICER_EMAIL }}
      PLAYWRIGHT_OFFICER_ORG1_PASSWORD: ${{ secrets.PLAYWRIGHT_OFFICER_PASSWORD }}

      # Inference service (AI-off degradation checks)
      INFERENCE_SERVICE_URL: ${{ secrets.INFERENCE_SERVICE_URL }}
      INFERENCE_API_KEY: ${{ secrets.INFERENCE_API_KEY }}
      RADIO_SPEECH_WEBHOOK_SECRET: ${{ secrets.INTEL_HMAC_KEY || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Validate required env vars
        run: |
          set -euo pipefail
          missing=0
          required_vars=(
            VITE_SUPABASE_URL
            VITE_SUPABASE_ANON_KEY
            PLAYWRIGHT_ADMIN_ORG1_EMAIL
            PLAYWRIGHT_ADMIN_ORG1_PASSWORD
            PLAYWRIGHT_OFFICER_ORG1_EMAIL
            PLAYWRIGHT_OFFICER_ORG1_PASSWORD
          )

          for name in "${required_vars[@]}"; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              echo "::error::Missing required secret/env: $name"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "::error::One or more required secrets are missing."
            exit 1
          fi

          optional_vars=(
            PLAYWRIGHT_ADMIN_ORG2_EMAIL
            PLAYWRIGHT_ADMIN_ORG2_PASSWORD
            INFERENCE_SERVICE_URL
            INFERENCE_API_KEY
          )

          for name in "${optional_vars[@]}"; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              echo "::warning::Optional secret/env not set: $name (some tests may skip)"
            fi
          done

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Phase 1 radio validation suite
        run: |
          npx playwright test \
            tests/e2e/radio-role-access.spec.ts \
            tests/e2e/radio-org-isolation-transcripts.spec.ts \
            tests/e2e/radio-reconnect-resilience.spec.ts \
            tests/e2e/radio-emergency-latency.spec.ts \
            tests/e2e/radio-ai-off-degradation.spec.ts \
            tests/e2e/radio-voice-consent-revocation.spec.ts \
            --project=chromium \
            --reporter=list \
            --timeout=60000

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase1-radio-validation-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
