name: Ops – RunPod Pod Lifecycle (Legacy)

# LEGACY WORKFLOW: pod lifecycle controls.
#
# Serverless-first operations should use endpoint-level autoscaling and health
# checks. This workflow is kept for manual emergency fallback only.
#
# Stops or starts the RunPod GPU pod manually.
#
# Scheduled auto-stop: every 30 minutes, queries Bob's /runpod/pod endpoint.
# If the pod has been idle for longer than BOB_IDLE_STOP_THRESHOLD_MIN (default 15 min)
# it sends a stop command via the RunPod API, saving ~$0.99/hr on the RTX 5090.
#
# Manual triggers let you start/stop/check from the GitHub Actions UI without
# touching the RunPod dashboard.
#
# Required secrets:
#   RUNPOD_API_KEY         — RunPod API key (personal key with pod admin access)
#   RUNPOD_POD_ID          — Pod ID to manage (e.g. eipnu6bq181q20)
#
# Optional — used for idle detection when BOB_SERVICE is stopped:
#   BOB_SERVICE_URL        — Bob service URL for idle query (RunPod-hosted inference service)
#   INFERENCE_API_KEY      — Bob API key for /runpod/pod endpoint
#
# Optional — cost guardrail:
#   BOB_IDLE_STOP_THRESHOLD_MIN — minutes idle before scheduled auto-stop (default: 15)

on:
  workflow_dispatch:
    inputs:
      allow_legacy_pod_ops:
        description: 'Required: set true to allow legacy pod lifecycle actions'
        required: true
        type: boolean
        default: false
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options: [status, stop, start]
        default: status
      pod_id_override:
        description: 'Optional pod ID override (leaves RUNPOD_POD_ID unchanged if blank)'
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  pod-lifecycle:
    name: RunPod Pod ${{ github.event.inputs.action || 'auto-check' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Require explicit legacy opt-in
        id: legacy-gate
        env:
          ALLOW_LEGACY_POD_OPS: ${{ github.event.inputs.allow_legacy_pod_ops }}
        run: |
          if [ "${ALLOW_LEGACY_POD_OPS:-false}" != "true" ]; then
            echo "::warning::Legacy pod lifecycle workflow is disabled by default. Re-run with allow_legacy_pod_ops=true if you intentionally need emergency pod operations."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Check required secrets
        id: check-secrets
        if: steps.legacy-gate.outputs.skip != 'true'
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_POD_ID: ${{ secrets.RUNPOD_POD_ID }}
        run: |
          if [ -z "${RUNPOD_API_KEY:-}" ]; then
            echo "::warning::RUNPOD_API_KEY secret is not set — skipping RunPod pod lifecycle workflow"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${RUNPOD_POD_ID:-}" ]; then
            echo "::warning::RUNPOD_POD_ID secret is not set — skipping RunPod pod lifecycle workflow"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "✅ Required secrets present"

      - name: Checkout repository
        if: steps.legacy-gate.outputs.skip != 'true' && steps.check-secrets.outputs.skip != 'true'
        uses: actions/checkout@v5

      - name: Resolve pod ID and action
        if: steps.legacy-gate.outputs.skip != 'true' && steps.check-secrets.outputs.skip != 'true'
        id: resolve
        env:
          RUNPOD_POD_ID: ${{ secrets.RUNPOD_POD_ID }}
          POD_OVERRIDE: ${{ github.event.inputs.pod_id_override }}
          ACTION_INPUT: ${{ github.event.inputs.action }}
        run: |
          POD="${POD_OVERRIDE:-$RUNPOD_POD_ID}"
          echo "pod_id=${POD}" >> "$GITHUB_OUTPUT"
          echo "action=${ACTION_INPUT:-status}" >> "$GITHUB_OUTPUT"

      - name: Pod status
        if: steps.resolve.outputs.action == 'status'
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_POD_ID: ${{ steps.resolve.outputs.pod_id }}
        run: |
          node scripts/runpod-pod-control.mjs status --pod "$RUNPOD_POD_ID"

      - name: Start pod
        if: steps.resolve.outputs.action == 'start'
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_POD_ID: ${{ steps.resolve.outputs.pod_id }}
        run: |
          node scripts/runpod-pod-control.mjs start --pod "$RUNPOD_POD_ID"
          echo "⏳ Pod is resuming. Allow ~60–120s for Ollama to become available."

      - name: Stop pod
        if: steps.resolve.outputs.action == 'stop'
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_POD_ID: ${{ steps.resolve.outputs.pod_id }}
        run: |
          node scripts/runpod-pod-control.mjs stop --pod "$RUNPOD_POD_ID"

      - name: Auto-check idle and stop if needed
        if: steps.resolve.outputs.action == 'auto-check'
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_POD_ID: ${{ steps.resolve.outputs.pod_id }}
          BOB_SERVICE_URL: ${{ secrets.BOB_SERVICE_URL }}
          INFERENCE_API_KEY: ${{ secrets.INFERENCE_API_KEY }}
          BOB_IDLE_STOP_THRESHOLD_MIN: ${{ vars.BOB_IDLE_STOP_THRESHOLD_MIN || '15' }}
        run: |
          set -euo pipefail
          THRESHOLD_S=$(( ${BOB_IDLE_STOP_THRESHOLD_MIN:-15} * 60 ))

          # --- Query Bob for idle state (preferred: most accurate) ---
          IDLE_S=""
          if [ -n "${BOB_SERVICE_URL:-}" ] && [ -n "${INFERENCE_API_KEY:-}" ]; then
            BASE="${BOB_SERVICE_URL%/}"
            HEALTH=$(curl -sf --max-time 10 \
              -H "x-inference-api-key: ${INFERENCE_API_KEY}" \
              "${BASE}/runpod/pod" 2>/dev/null || echo '{}')
            IDLE_S=$(echo "$HEALTH" | jq -r '.lifecycle.idle_s // empty' 2>/dev/null || echo '')
            LAST_CALL=$(echo "$HEALTH" | jq -r '.lifecycle.last_call_at // empty' 2>/dev/null || echo '')
            if [ -n "$IDLE_S" ]; then
              echo "🔎 Bob reports: idle ${IDLE_S}s (last RunPod call: ${LAST_CALL:-never})"
            fi
          fi

          # --- Fallback: query RunPod directly for recent GPU utilisation ---
          if [ -z "$IDLE_S" ]; then
            echo "ℹ️  Bob /runpod/pod not available — checking pod status directly via RunPod API"
          fi

          POD_STATUS=$(node scripts/runpod-pod-control.mjs status --pod "$RUNPOD_POD_ID" 2>&1 || true)
          echo "$POD_STATUS"

          # If pod is already stopped, nothing to do.
          if echo "$POD_STATUS" | grep -qi 'EXITED\|STOPPED\|stopped\|exited'; then
            echo "✅ Pod is already stopped — no action needed."
            exit 0
          fi

          # Decide whether to stop based on idle time from Bob, or if Bob
          # reports the pod was never called (last_call_at = null).
          SHOULD_STOP="false"
          if [ -n "$IDLE_S" ] && [ "$IDLE_S" -ge "$THRESHOLD_S" ]; then
            echo "⏸  Idle time ${IDLE_S}s ≥ threshold ${THRESHOLD_S}s — stopping pod"
            SHOULD_STOP="true"
          elif [ -z "$IDLE_S" ] && [ -z "$LAST_CALL" ]; then
            echo "⏸  No RunPod calls recorded by Bob and pod is running — stopping to save cost"
            SHOULD_STOP="true"
          else
            echo "✅ Pod is active (idle ${IDLE_S:-?}s < threshold ${THRESHOLD_S}s) — leaving running"
          fi

          if [ "$SHOULD_STOP" = "true" ]; then
            node scripts/runpod-pod-control.mjs stop --pod "$RUNPOD_POD_ID"
          fi
