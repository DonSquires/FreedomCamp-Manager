name: Temporary Train Validate Gate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  train-validate:
    name: train-validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Validate backend build
        working-directory: backend
        run: npm run build
