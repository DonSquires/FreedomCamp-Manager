name: FreedomCamp Manager — All Workflows

# ===========================================================================
# Merged workflow — consolidates all individual .github/workflows/*.yml files.
# The old per-task workflow files have been removed; this is the single source
# of truth for all CI/CD and operational automation.
#
# Auto-triggers:
#   push to main        → deploy-admin-portal, deploy-mobile-app, deploy-railway
#                         (each job path-filters its own area of the repo)
#   schedule 02:00 UTC  → parkpow-sync (nightly)
#   repository_dispatch  → API-triggered deploy-admin-portal runs via
#                         event_type=merge-all-dispatch
#
# Manual trigger (workflow_dispatch):
#   Select the job to run from the "job" dropdown, then fill in any
#   job-specific inputs labelled with [job-name] in the description.
#
# Required secrets (GitHub repo → Settings → Secrets and variables → Actions):
#   Admin portal / Vercel:  VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
#                           VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY
#   Mobile app (EAS/Expo):  EXPO_TOKEN, EXPO_PROJECT_ID
#                           EXPO_PUBLIC_SUPABASE_URL, EXPO_PUBLIC_SUPABASE_ANON_KEY
#                           ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD
#                           ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   Railway:                RAILWAY_TOKEN  (PROJECT token, not personal)
#                           RAILWAY_SERVICE_ID
#                           INFERENCE_SERVICE_URL  (optional, for health check)
#   Supabase:               SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF
#                           SUPABASE_DB_PASSWORD
#   ParkPow / Maps:         SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
#                           STATSNZ_API_KEY  (optional)
#   Data migration:         SUPABASE_DB_PASSWORD_SOURCE, SUPABASE_DB_PASSWORD_TARGET
#   Legacy data migration:  SUPABASEV2_SERVICE_ROLE_KEY
#   Schema extraction:      PGHOST, PGPORT, PGUSER, PGPASSWORD, PGDATABASE
# ===========================================================================

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'
  repository_dispatch:
    types: [merge-all-dispatch]
  workflow_dispatch:
    inputs:
      job:
        description: 'Job to run'
        required: false
        default: 'none'
        type: choice
        options:
          - none
          - deploy-admin-portal
          - deploy-mobile-app
          - deploy-railway
          - deploy-edge-functions
          - edge-functions-runbook
          - run-migrations
          - supabase-db-push
          - push-supabase-config
          - parkpow-sync
          - extract-schema
          - generate-keystore
          - import-maps
          - migrate-data
          - data-migration

      # ── deploy-admin-portal ─────────────────────────────────────────────
      portal_environment:
        description: '[deploy-admin-portal] Deployment target'
        required: false
        default: 'production'
        type: choice
        options: [production, preview]

      # ── deploy-mobile-app ───────────────────────────────────────────────
      mobile_platform:
        description: '[deploy-mobile-app] Target platform'
        required: false
        default: 'android'
        type: choice
        options: [android, ios, all]
      mobile_profile:
        description: '[deploy-mobile-app] EAS build profile'
        required: false
        default: 'production'
        type: choice
        options: [production, preview, development]

      # ── deploy-edge-functions / edge-functions-runbook ──────────────────
      function_name:
        description: '[edge-functions] Function name (blank = all)'
        required: false
        default: ''
      no_verify_jwt:
        description: '[edge-functions] JWT verification mode'
        required: false
        default: 'auto'
        type: choice
        options: ['auto', 'yes', 'no']
      runbook_mode:
        description: '[edge-functions-runbook] Runbook mode'
        required: false
        default: 'deploy+verify'
        type: choice
        options: ['deploy+verify', 'deploy-only', 'verify-only']

      # ── run-migrations ──────────────────────────────────────────────────
      migration_dry_run:
        description: '[run-migrations] Dry run only?'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      migration_file:
        description: '[run-migrations] Specific migration file (blank = all pending)'
        required: false
        default: ''

      # ── supabase-db-push ────────────────────────────────────────────────
      dbpush_fresh_install:
        description: '[supabase-db-push] Fresh install? (brand-new Supabase project)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      dbpush_dry_run:
        description: '[supabase-db-push] Dry run only?'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

      # ── parkpow-sync ────────────────────────────────────────────────────
      parkpow_action:
        description: '[parkpow-sync] What to sync'
        required: false
        default: 'all'
        type: choice
        options: [sync-lots, sync-watchlist, push-violations, all]

      # ── extract-schema ──────────────────────────────────────────────────
      extract_mode:
        description: '[extract-schema] Extraction mode'
        required: false
        default: 'schema-only'
        type: choice
        options: [schema-only, full]
      branch_name:
        description: '[extract-schema] Branch to commit results to (blank = auto)'
        required: false
        default: ''

      # ── generate-keystore ───────────────────────────────────────────────
      keystore_password:
        description: '[generate-keystore] Keystore password (required)'
        required: false
        type: string
      key_alias:
        description: '[generate-keystore] Key alias'
        required: false
        default: 'freedomcamp'
        type: string

      # ── import-maps ─────────────────────────────────────────────────────
      import_mode:
        description: '[import-maps] Import mode'
        required: false
        default: 'territorial'
        type: choice
        options: [territorial, meshblock, campsites]
      import_sources:
        description: '[import-maps] Campsite sources comma-separated (for campsites mode)'
        required: false
        default: 'all'
        type: string
      organization_id:
        description: '[import-maps] Organization UUID (required for meshblock mode)'
        required: false
        type: string
      import_bbox:
        description: '[import-maps] Bounding box filter: minLng,minLat,maxLng,maxLat'
        required: false
        type: string

      # ── migrate-data ────────────────────────────────────────────────────
      migrate_dry_run:
        description: '[migrate-data] Dry run (dump only, skip restore)?'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      migrate_tables:
        description: '[migrate-data] Comma-separated tables to migrate (blank = all)'
        required: false
        default: ''

      # ── data-migration ──────────────────────────────────────────────────
      script_to_run:
        description: '[data-migration] Script to run'
        required: false
        default: 'all'
        type: choice
        options: [all, import-vehicles, import-zones]

jobs:
  # ===========================================================================
  # 0. Detect changed paths (push events only; outputs false on other events)
  # ===========================================================================
  changed-paths:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      admin-portal: ${{ steps.diff.outputs.admin-portal }}
      mobile-app:   ${{ steps.diff.outputs.mobile-app }}
      inference:    ${{ steps.diff.outputs.inference }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changes
        id: diff
        run: |
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            # Non-push events: each job's own 'if:' condition handles routing
            echo "admin-portal=false" >> "$GITHUB_OUTPUT"
            echo "mobile-app=false"   >> "$GITHUB_OUTPUT"
            echo "inference=false"    >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")

          # Admin portal: any change NOT in the ignored paths
          ADMIN=$(echo "$CHANGED" | \
            grep -vE '(^$|\.md$|^supabase/|^proxy-server/|^inference-service/|^mobile-app/)' | \
            grep -c . || true)
          echo "admin-portal=$([ "${ADMIN:-0}" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

          # Mobile app
          MOBILE=$(echo "$CHANGED" | grep -cE '^mobile-app/' || true)
          echo "mobile-app=$([ "${MOBILE:-0}" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

          # Inference service
          INFER=$(echo "$CHANGED" | grep -cE '^inference-service/' || true)
          echo "inference=$([ "${INFER:-0}" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # 1. Deploy Admin Portal to Vercel
  # ===========================================================================
  deploy-admin-portal:
    name: Deploy Admin Portal to Vercel
    runs-on: ubuntu-latest
    needs: [changed-paths]
    permissions:
      contents: read
    if: >-
      (github.event_name == 'push' && needs.changed-paths.outputs.admin-portal == 'true') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'deploy-admin-portal') ||
      (github.event_name == 'repository_dispatch' && github.event.action == 'merge-all-dispatch' && github.event.client_payload.job == 'deploy-admin-portal')

    steps:
      - name: Check required secrets
        id: check-secrets
        run: |
          missing=""
          [ -z "$VITE_SUPABASE_URL" ]      && missing="$missing VITE_SUPABASE_URL"
          [ -z "$VITE_SUPABASE_ANON_KEY" ] && missing="$missing VITE_SUPABASE_ANON_KEY"
          [ -z "$SUPABASE_ACCESS_TOKEN" ]  && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$SUPABASE_PROJECT_REF" ]   && missing="$missing SUPABASE_PROJECT_REF"
          [ -z "$VERCEL_TOKEN" ]           && missing="$missing VERCEL_TOKEN"
          [ -z "$VERCEL_ORG_ID" ]          && missing="$missing VERCEL_ORG_ID"
          [ -z "$VERCEL_PROJECT_ID" ]      && missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::warning::Secrets not configured ($missing) — deployment skipped."
            echo ""
            echo "Add the following repository secrets at:"
            echo "  GitHub repo → Settings → Secrets and variables → Actions"
            echo ""
            echo "  VITE_SUPABASE_URL:      https://YOUR_REF.supabase.co"
            echo "  VITE_SUPABASE_ANON_KEY: Supabase Dashboard → Settings → API → anon key"
            echo "  SUPABASE_ACCESS_TOKEN:  https://supabase.com/dashboard/account/tokens"
            echo "  SUPABASE_PROJECT_REF:   Supabase Dashboard → Project Settings → General → Reference ID"
            echo "  VERCEL_TOKEN:           https://vercel.com/account/tokens"
            echo "  VERCEL_ORG_ID:          Vercel Dashboard → Settings → General → Team ID"
            echo "  VERCEL_PROJECT_ID:      Vercel Dashboard → Project → Settings → Project ID"
            echo "secrets_present=false" >> "$GITHUB_OUTPUT"
          else
            echo "✅ All required secrets present"
            echo "secrets_present=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          VITE_SUPABASE_URL:      ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_ACCESS_TOKEN:  ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF:   ${{ secrets.SUPABASE_PROJECT_REF }}
          VERCEL_TOKEN:           ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID:          ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID:      ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Checkout repository
        if: steps.check-secrets.outputs.secrets_present == 'true'
        uses: actions/checkout@v4

      - name: Setup Bun
        if: steps.check-secrets.outputs.secrets_present == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        if: steps.check-secrets.outputs.secrets_present == 'true'
        run: bun install

      - name: Setup Supabase CLI
        if: steps.check-secrets.outputs.secrets_present == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify generated Supabase types
        if: steps.check-secrets.outputs.secrets_present == 'true'
        run: |
          set -euo pipefail

          tmp_types_file="$(mktemp)"
          diff_file="$(mktemp)"

          supabase gen types typescript \
            --project-id "$SUPABASE_PROJECT_REF" \
            --schema public > "$tmp_types_file"

          if ! diff -u src/types/database.ts "$tmp_types_file" > "$diff_file"; then
            echo "::warning::src/types/database.ts is out of date with Supabase schema."
            echo "Run: supabase gen types typescript --project-id \"$SUPABASE_PROJECT_REF\" --schema public > src/types/database.ts"
            echo ""
            echo "Diff preview:"
            sed -n '1,200p' "$diff_file"
            echo "Proceeding with deployment (type drift check is advisory in this workflow)."
          else
            echo "✅ Supabase generated types are up to date"
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Install Vercel CLI
        if: steps.check-secrets.outputs.secrets_present == 'true'
        run: npm install -g vercel

      - name: Resolve portal environment
        if: steps.check-secrets.outputs.secrets_present == 'true'
        id: resolve-env
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            portal_env="production"
          elif [ "$GITHUB_EVENT_NAME" = "repository_dispatch" ]; then
            portal_env="${{ github.event.client_payload.portal_environment || 'production' }}"
          else
            portal_env="${{ github.event.inputs.portal_environment || 'production' }}"
          fi

          case "$portal_env" in
            production|preview) ;;
            *)
              echo "::warning::Unknown portal environment '$portal_env'; defaulting to production"
              portal_env="production"
              ;;
          esac

          echo "portal_environment=$portal_env" >> "$GITHUB_OUTPUT"
          echo "Resolved portal environment: $portal_env"

      - name: Pull Vercel project settings
        if: steps.check-secrets.outputs.secrets_present == 'true'
        run: vercel pull --yes --environment="${{ steps.resolve-env.outputs.portal_environment }}" --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN:      ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build admin portal
        if: steps.check-secrets.outputs.secrets_present == 'true'
        run: bun run build
        env:
          VITE_SUPABASE_URL:      ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Deploy to Vercel (production)
        if: >-
          steps.check-secrets.outputs.secrets_present == 'true' &&
          steps.resolve-env.outputs.portal_environment == 'production'
        run: |
          vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN" | tee /tmp/deploy-url.txt
          echo ""
          echo "✅ Admin portal production deployment complete!"
          echo "🌐 URL: $(tail -1 /tmp/deploy-url.txt)"
        env:
          VERCEL_TOKEN:      ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel (preview)
        if: >-
          steps.check-secrets.outputs.secrets_present == 'true' &&
          steps.resolve-env.outputs.portal_environment == 'preview'
        run: |
          vercel deploy --prebuilt --token "$VERCEL_TOKEN" | tee /tmp/deploy-url.txt
          echo ""
          echo "✅ Admin portal preview deployment complete!"
          echo "🌐 URL: $(tail -1 /tmp/deploy-url.txt)"
        env:
          VERCEL_TOKEN:      ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ===========================================================================
  # 2. Deploy Mobile App (EAS / Expo)
  # ===========================================================================
  deploy-mobile-app:
    name: Deploy Mobile App (EAS)
    runs-on: ubuntu-latest
    needs: [changed-paths]
    permissions:
      contents: read
    if: >-
      (github.event_name == 'push' && needs.changed-paths.outputs.mobile-app == 'true') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'deploy-mobile-app')

    steps:
      - name: Check required secrets
        id: check-secrets
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PLATFORM="${{ github.event.inputs.mobile_platform }}"
          else
            PLATFORM="android"
          fi

          missing=""
          [ -z "$EXPO_TOKEN" ]                    && missing="$missing EXPO_TOKEN"
          [ -z "$EXPO_PROJECT_ID" ]               && missing="$missing EXPO_PROJECT_ID"
          [ -z "$EXPO_PUBLIC_SUPABASE_URL" ]      && missing="$missing EXPO_PUBLIC_SUPABASE_URL"
          [ -z "$EXPO_PUBLIC_SUPABASE_ANON_KEY" ] && missing="$missing EXPO_PUBLIC_SUPABASE_ANON_KEY"

          NEEDS_ANDROID=false
          if [ "$PLATFORM" = "android" ] || [ "$PLATFORM" = "all" ]; then
            NEEDS_ANDROID=true
            [ -z "$ANDROID_KEYSTORE_BASE64" ]   && missing="$missing ANDROID_KEYSTORE_BASE64"
            [ -z "$ANDROID_KEYSTORE_PASSWORD" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
            [ -z "$ANDROID_KEY_ALIAS" ]         && missing="$missing ANDROID_KEY_ALIAS"
            [ -z "$ANDROID_KEY_PASSWORD" ]      && missing="$missing ANDROID_KEY_PASSWORD"
          fi

          if [ -n "$missing" ]; then
            echo "::warning::Required secrets not configured ($missing) — deployment skipped."
            echo ""
            echo "To enable mobile deployments, add the following secrets at:"
            echo "  GitHub repo → Settings → Secrets and variables → Actions"
            echo ""
            echo "  EXPO_TOKEN:                    https://expo.dev/accounts/[account]/settings/access-tokens"
            echo "  EXPO_PROJECT_ID:               https://expo.dev/accounts/iron-eagle-security/projects/freedomcamp-manager → Project Settings"
            echo "  EXPO_PUBLIC_SUPABASE_URL:      Your Supabase project URL"
            echo "  EXPO_PUBLIC_SUPABASE_ANON_KEY: Your Supabase anon/public key"
            echo ""
            echo "  Android signing (required for android/all platform):"
            echo "  ANDROID_KEYSTORE_BASE64:       base64 freedomcamp.keystore | tr -d '\\n'"
            echo "  ANDROID_KEYSTORE_PASSWORD:     Keystore password"
            echo "  ANDROID_KEY_ALIAS:             Key alias (e.g. freedomcamp)"
            echo "  ANDROID_KEY_PASSWORD:          Key password"
            echo "secrets_present=false" >> "$GITHUB_OUTPUT"
          else
            echo "✅ Required secrets present"
            echo "secrets_present=true" >> "$GITHUB_OUTPUT"
          fi
          echo "needs_android=$NEEDS_ANDROID" >> "$GITHUB_OUTPUT"
        env:
          EXPO_TOKEN:                    ${{ secrets.EXPO_TOKEN }}
          EXPO_PROJECT_ID:               ${{ secrets.EXPO_PROJECT_ID }}
          EXPO_PUBLIC_SUPABASE_URL:      ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          ANDROID_KEYSTORE_BASE64:       ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD:     ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS:             ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD:          ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Checkout repository
        if: steps.check-secrets.outputs.secrets_present == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.check-secrets.outputs.secrets_present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile-app/package-lock.json

      - name: Install dependencies
        if: steps.check-secrets.outputs.secrets_present == 'true'
        run: |
          cd mobile-app
          npm install

      - name: Inject Expo project ID into app.json
        if: steps.check-secrets.outputs.secrets_present == 'true'
        env:
          EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID }}
        run: |
          cd mobile-app
          PLACEHOLDER="REPLACE_WITH_YOUR_EXPO_PROJECT_UUID"
          sed -i "s|$PLACEHOLDER|$EXPO_PROJECT_ID|g" app.json
          echo "✅ Injected EXPO_PROJECT_ID into app.json"
          if grep -q "$PLACEHOLDER" app.json; then
            echo "::error::Placeholder UUID still found in app.json after injection:"
            grep -n "$PLACEHOLDER" app.json
            exit 1
          fi

      - name: Install EAS CLI
        if: steps.check-secrets.outputs.secrets_present == 'true'
        run: npm install -g eas-cli@latest

      - name: Patch EAS project ID into app.json
        if: steps.check-secrets.outputs.secrets_present == 'true'
        env:
          EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID }}
        run: |
          cd mobile-app
          jq --arg id "$EXPO_PROJECT_ID" \
            '.expo.extra.eas.projectId = $id | .expo.updates.url = ("https://u.expo.dev/" + $id)' \
            app.json > app.json.tmp && mv app.json.tmp app.json
          echo "✅ app.json patched with project ID: $EXPO_PROJECT_ID"

      - name: Set up Android signing credentials
        if: >-
          steps.check-secrets.outputs.secrets_present == 'true' &&
          steps.check-secrets.outputs.needs_android == 'true'
        env:
          ANDROID_KEYSTORE_BASE64:   ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS:         ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD:      ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd mobile-app
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode --ignore-garbage > android.keystore
          jq -n \
            --arg keystorePath  "android.keystore" \
            --arg keystorePass  "$ANDROID_KEYSTORE_PASSWORD" \
            --arg keyAlias      "$ANDROID_KEY_ALIAS" \
            --arg keyPassword   "$ANDROID_KEY_PASSWORD" \
            '{
              android: {
                keystore: {
                  keystorePath:     $keystorePath,
                  keystorePassword: $keystorePass,
                  keyAlias:         $keyAlias,
                  keyPassword:      $keyPassword
                }
              }
            }' > credentials.json
          echo "✅ Android credentials written from GitHub secrets."

      - name: Resolve build platform and profile
        if: steps.check-secrets.outputs.secrets_present == 'true'
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "platform=${{ github.event.inputs.mobile_platform }}" >> "$GITHUB_OUTPUT"
            echo "profile=${{ github.event.inputs.mobile_profile }}"   >> "$GITHUB_OUTPUT"
          else
            echo "platform=android"   >> "$GITHUB_OUTPUT"
            echo "profile=production" >> "$GITHUB_OUTPUT"
          fi

      - name: Build mobile app (EAS)
        if: steps.check-secrets.outputs.secrets_present == 'true'
        env:
          EXPO_TOKEN:                    ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL:      ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          cd mobile-app
          printf 'EXPO_PUBLIC_SUPABASE_URL=%s\nEXPO_PUBLIC_SUPABASE_ANON_KEY=%s\n' \
            "$EXPO_PUBLIC_SUPABASE_URL" "$EXPO_PUBLIC_SUPABASE_ANON_KEY" > .env
          PLATFORM="${{ steps.resolve.outputs.platform }}"
          PROFILE="${{ steps.resolve.outputs.profile }}"
          echo "🏗️  Building for platform: $PLATFORM (profile: $PROFILE)"
          eas build \
            --platform "$PLATFORM" \
            --profile  "$PROFILE" \
            --non-interactive \
            --no-wait
          echo ""
          echo "✅ EAS build triggered successfully."
          echo "📱 Monitor: https://expo.dev/accounts/iron-eagle-security/projects/freedomcamp-manager/builds"

      - name: Publish OTA update (EAS Update)
        if: steps.check-secrets.outputs.secrets_present == 'true'
        env:
          EXPO_TOKEN:                    ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL:      ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          cd mobile-app
          printf 'EXPO_PUBLIC_SUPABASE_URL=%s\nEXPO_PUBLIC_SUPABASE_ANON_KEY=%s\n' \
            "$EXPO_PUBLIC_SUPABASE_URL" "$EXPO_PUBLIC_SUPABASE_ANON_KEY" > .env
          PROFILE="${{ steps.resolve.outputs.profile }}"
          echo "📡 Publishing OTA update to branch: $PROFILE"
          eas update \
            --branch  "$PROFILE" \
            --message "Deploy from GitHub Actions — ${{ github.sha }}" \
            --non-interactive
          echo ""
          echo "✅ OTA update published to OnSpace AI (branch: $PROFILE)."
          echo "📡 Verify: https://expo.dev/accounts/iron-eagle-security/projects/freedomcamp-manager/updates"

  # ===========================================================================
  # 3. Deploy Inference Service to Railway
  #
  # Token handling fix: secrets are passed via env vars and checked as $VAR
  # (previously they were directly interpolated as ${{ secrets.X }} in shell,
  # which is a security anti-pattern and can break on special characters).
  # The job now soft-skips when secrets are missing, consistent with other jobs.
  # ===========================================================================
  deploy-railway:
    name: Deploy Inference Service to Railway
    runs-on: ubuntu-latest
    needs: [changed-paths]
    permissions:
      contents: read
    if: >-
      (github.event_name == 'push' && needs.changed-paths.outputs.inference == 'true') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'deploy-railway')

    steps:
      - name: Check required secrets
        id: check-secrets
        run: |
          missing=""
          [ -z "$RAILWAY_TOKEN" ]      && missing="$missing RAILWAY_TOKEN"
          [ -z "$RAILWAY_SERVICE_ID" ] && missing="$missing RAILWAY_SERVICE_ID"
          if [ -n "$missing" ]; then
            echo "::warning::Required secrets not configured ($missing) — deployment skipped."
            echo ""
            echo "To enable Railway deployments, add the following secrets at:"
            echo "  https://github.com/${{ github.repository }}/settings/secrets/actions"
            echo ""
            echo "  RAILWAY_TOKEN:      Railway token with deploy access to the target service/project"
            echo "                      (project token recommended for CI)."
            echo "  RAILWAY_SERVICE_ID: Railway project → Service → Settings → Service ID"
            echo "secrets_present=false" >> "$GITHUB_OUTPUT"
          else
            echo "✅ Railway secrets present"
            echo "secrets_present=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          RAILWAY_TOKEN:      ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}

      - name: Checkout repository
        if: steps.check-secrets.outputs.secrets_present == 'true'
        uses: actions/checkout@v4

      - name: Install Railway CLI
        if: steps.check-secrets.outputs.secrets_present == 'true'
        run: |
          # Avoid GitHub API rate limits in install.sh by pinning a known CLI release.
          RAILWAY_CLI_VERSION="4.31.0"
          TARGET="x86_64-unknown-linux-gnu"
          URL="https://github.com/railwayapp/cli/releases/download/v${RAILWAY_CLI_VERSION}/railway-v${RAILWAY_CLI_VERSION}-${TARGET}.tar.gz"
          TMP_DIR=$(mktemp -d)
          cd "$TMP_DIR"
          curl -fsSL -o railway.tar.gz "$URL"
          tar -xzf railway.tar.gz
          mkdir -p "$HOME/.railway/bin"
          install -m 0755 railway "$HOME/.railway/bin/railway"
          echo "$HOME/.railway/bin" >> $GITHUB_PATH

      - name: Validate Railway token
        if: steps.check-secrets.outputs.secrets_present == 'true'
        env:
          RAILWAY_TOKEN:      ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
        run: |
          echo "🔑 Validating Railway token..."
          # Validate real deploy access against the target service.
          if ! railway service status --service "$RAILWAY_SERVICE_ID" --json > /dev/null 2>&1; then
            echo ""
            echo "::error::RAILWAY_TOKEN is set but invalid."
            echo ""
            echo "Common causes:"
            echo "  1. Token is revoked/expired."
            echo "  2. Token does not have access to the service ID in RAILWAY_SERVICE_ID."
            echo "  3. RAILWAY_SERVICE_ID is wrong (copied from a different project/service)."
            echo ""
            echo "Fix: Update RAILWAY_TOKEN and/or RAILWAY_SERVICE_ID secrets at:"
            echo "  https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi
          echo "✅ Railway token and service access are valid"

      - name: Deploy to Railway
        if: steps.check-secrets.outputs.secrets_present == 'true'
        env:
          RAILWAY_TOKEN:      ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
        run: |
          cd inference-service
          echo "🚂 Deploying inference-service to Railway..."
          railway up --service "$RAILWAY_SERVICE_ID" --detach
          echo "✅ Deploy triggered. Check Railway dashboard for status."
          echo ""
          echo "Railway Dashboard: https://railway.app/dashboard"

      - name: Wait for deployment and verify health
        if: steps.check-secrets.outputs.secrets_present == 'true'
        env:
          RAILWAY_TOKEN:         ${{ secrets.RAILWAY_TOKEN }}
          INFERENCE_SERVICE_URL: ${{ secrets.INFERENCE_SERVICE_URL }}
        run: |
          if [ -z "$INFERENCE_SERVICE_URL" ]; then
            echo "ℹ️  INFERENCE_SERVICE_URL not set — skipping health check."
            echo "   Once deployed, get your URL from Railway → Settings → Networking"
            echo "   Then add it as GitHub secret AND Supabase secret."
            exit 0
          fi

          echo "⏳ Waiting 60s for Railway to finish deploying..."
          sleep 60

          echo "🏥 Checking health at ${INFERENCE_SERVICE_URL}/health ..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            "${INFERENCE_SERVICE_URL}/health" || echo "000")

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Health check passed! Inference service is live."
          else
            echo "⚠️  Health check returned HTTP $HTTP_STATUS"
            echo "   Railway may still be starting. Check dashboard in 1-2 minutes."
          fi

  # ===========================================================================
  # 4. Deploy Supabase Edge Functions
  # ===========================================================================
  deploy-edge-functions:
    name: Deploy Supabase Edge Functions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'deploy-edge-functions'
    env:
      PUBLIC_FUNCTIONS: "orc-ingest vehicle-ingest alpr-process alpr-retry plate-scanner-photo-first stream-webhook get-weather send-push-notification"

    steps:
      - name: Check required secrets
        run: |
          missing=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$SUPABASE_PROJECT_REF"  ] && missing="$missing SUPABASE_PROJECT_REF"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing"
            echo "Add these at: GitHub repo → Settings → Secrets and variables → Actions → New repository secret"
            echo "  SUPABASE_ACCESS_TOKEN: get from https://supabase.com/dashboard/account/tokens"
            echo "  SUPABASE_PROJECT_REF:  get from Supabase → Project Settings → General → Reference ID"
            exit 1
          fi
          echo "✅ Secrets present"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy — single function
        if: github.event.inputs.function_name != ''
        run: |
          PUBLIC_FUNCTIONS="orc-ingest vehicle-ingest alpr-process alpr-retry plate-scanner-photo-first stream-webhook get-weather send-push-notification"
          fn="${{ github.event.inputs.function_name }}"
          mode="${{ github.event.inputs.no_verify_jwt }}"

          JWT_FLAG=""
          if [ "$mode" = "yes" ]; then
            JWT_FLAG="--no-verify-jwt"
          elif [ "$mode" = "auto" ]; then
            for pub in $PUBLIC_FUNCTIONS; do
              [ "$fn" = "$pub" ] && JWT_FLAG="--no-verify-jwt" && break
            done
          fi

          echo "→ Deploying $fn $JWT_FLAG …"
          supabase functions deploy "$fn" \
            --project-ref "$SUPABASE_PROJECT_REF" \
            $JWT_FLAG
          echo "✅ Deployed: $fn"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Deploy — all functions
        if: github.event.inputs.function_name == ''
        run: |
          PUBLIC_FUNCTIONS="orc-ingest vehicle-ingest alpr-process alpr-retry plate-scanner-photo-first stream-webhook get-weather send-push-notification"
          cd supabase/functions
          success=0
          failed=0

          for fn in */; do
            fn="${fn%/}"
            [ "$fn" = "_shared" ] && continue

            JWT_FLAG=""
            for pub in $PUBLIC_FUNCTIONS; do
              [ "$fn" = "$pub" ] && JWT_FLAG="--no-verify-jwt" && break
            done

            echo "→ Deploying $fn $JWT_FLAG …"
            if supabase functions deploy "$fn" \
                --project-ref "$SUPABASE_PROJECT_REF" \
                $JWT_FLAG; then
              echo "  ✅ $fn deployed"
              success=$((success + 1))
            else
              echo "::warning::  ⚠️  $fn failed – continuing with remaining functions"
              failed=$((failed + 1))
            fi
          done

          echo ""
          echo "========================================="
          echo "Deploy complete: $success succeeded, $failed failed"
          echo "========================================="
          [ "$failed" -gt 0 ] && exit 1 || exit 0
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Push Supabase auth config (CORS origins)
        run: |
          if supabase config push --project-ref "$SUPABASE_PROJECT_REF" --include-all; then
            echo "✅ Supabase auth config pushed (site_url + redirect URLs updated)"
          else
            echo "::warning::⚠️  Supabase config push failed – CORS allowed origins may be stale."
            echo "::warning::   Run the 'push-supabase-config' job manually to retry."
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}

  # ===========================================================================
  # 5. Edge Functions — Deploy & Verify Runbook
  # ===========================================================================
  edge-functions-runbook:
    name: Edge Functions Runbook
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'edge-functions-runbook'
    env:
      PUBLIC_FUNCTIONS: "orc-ingest vehicle-ingest alpr-process alpr-retry plate-scanner-photo-first stream-webhook get-weather send-push-notification"

    steps:
      - name: Check required secrets
        run: |
          missing=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$SUPABASE_PROJECT_REF"  ] && missing="$missing SUPABASE_PROJECT_REF"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing"
            echo ""
            echo "HOW TO ADD SECRETS (online / browser only):"
            echo "  Go to: https://github.com/${{ github.repository }}/settings/secrets/actions"
            echo "  Click 'New repository secret' and add:"
            echo ""
            echo "  SUPABASE_ACCESS_TOKEN:"
            echo "    https://supabase.com/dashboard/account/tokens"
            echo "    → 'Generate new token' (name it 'github-actions') → copy the full value"
            echo ""
            echo "  SUPABASE_PROJECT_REF:"
            echo "    Supabase → Your project → Settings → General → Reference ID"
            echo "    (looks like: abcdefghijklmnop)"
            exit 1
          fi
          echo "✅ All required secrets are present"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        if: github.event.inputs.runbook_mode != 'verify-only'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy — single function
        if: github.event.inputs.runbook_mode != 'verify-only' && github.event.inputs.function_name != ''
        run: |
          fn="${{ github.event.inputs.function_name }}"
          mode="${{ github.event.inputs.no_verify_jwt }}"

          JWT_FLAG=""
          if [ "$mode" = "yes" ]; then
            JWT_FLAG="--no-verify-jwt"
          elif [ "$mode" = "auto" ]; then
            for pub in $PUBLIC_FUNCTIONS; do
              [ "$fn" = "$pub" ] && JWT_FLAG="--no-verify-jwt" && break
            done
          fi

          echo "→ Deploying $fn $JWT_FLAG …"
          supabase functions deploy "$fn" \
            --project-ref "$SUPABASE_PROJECT_REF" \
            $JWT_FLAG
          echo "✅ Deployed: $fn"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Deploy — all functions
        if: github.event.inputs.runbook_mode != 'verify-only' && github.event.inputs.function_name == ''
        run: |
          cd supabase/functions
          success=0
          failed=0
          failed_list=""

          for fn in */; do
            fn="${fn%/}"
            [ "$fn" = "_shared" ] && continue

            JWT_FLAG=""
            for pub in $PUBLIC_FUNCTIONS; do
              [ "$fn" = "$pub" ] && JWT_FLAG="--no-verify-jwt" && break
            done

            echo "→ Deploying $fn $JWT_FLAG …"
            if supabase functions deploy "$fn" \
                --project-ref "$SUPABASE_PROJECT_REF" \
                $JWT_FLAG; then
              echo "  ✅ $fn deployed"
              success=$((success + 1))
            else
              echo "::warning::  ⚠️  $fn failed — continuing with remaining functions"
              failed=$((failed + 1))
              failed_list="$failed_list $fn"
            fi
          done

          echo ""
          echo "========================================="
          echo "Deploy complete: $success succeeded, $failed failed"
          [ -n "$failed_list" ] && echo "Failed:$failed_list"
          echo "========================================="
          [ "$failed" -gt 0 ] && exit 1 || exit 0
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Verify — single function
        if: github.event.inputs.runbook_mode != 'deploy-only' && github.event.inputs.function_name != ''
        run: |
          BASE_URL="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1"
          fn="${{ github.event.inputs.function_name }}"

          is_public=false
          for pub in $PUBLIC_FUNCTIONS; do
            [ "$fn" = "$pub" ] && is_public=true && break
          done

          echo "Verifying: $fn  (public=$is_public)"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${BASE_URL}/${fn}" \
            -H "Content-Type: application/json" \
            --max-time 15 \
            --retry 2 \
            --retry-delay 5 \
            --data '{}')

          echo "  HTTP $HTTP_CODE"

          {
            echo "## Edge Function Verification Results"
            echo ""
            echo "| Function | JWT Protected | HTTP Status | Result |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          PROTECTED_LABEL="✅ Yes"
          $is_public && PROTECTED_LABEL="🔓 No"

          if $is_public; then
            if echo "$HTTP_CODE" | grep -qE '^5'; then
              echo "::error::$fn returned HTTP $HTTP_CODE (server error — function may have crashed)"
              echo "| $fn | $PROTECTED_LABEL | $HTTP_CODE | ❌ Server error |" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            else
              echo "  ✅ $fn is live (HTTP $HTTP_CODE)"
              echo "| $fn | $PROTECTED_LABEL | $HTTP_CODE | ✅ Live |" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            if echo "$HTTP_CODE" | grep -qE '^5'; then
              echo "::error::$fn returned HTTP $HTTP_CODE (server error — function may have crashed)"
              echo "| $fn | $PROTECTED_LABEL | $HTTP_CODE | ❌ Server error |" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            elif [ "$HTTP_CODE" = "200" ]; then
              echo "::error::$fn returned HTTP 200 without a JWT — JWT verification may be misconfigured"
              echo "| $fn | $PROTECTED_LABEL | $HTTP_CODE | ❌ JWT bypass |" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            elif [ "$HTTP_CODE" = "401" ]; then
              echo "  ✅ $fn is live and correctly requires JWT (HTTP 401)"
              echo "| $fn | $PROTECTED_LABEL | $HTTP_CODE | ✅ Live (JWT enforced) |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "  ⚠️  $fn returned unexpected HTTP $HTTP_CODE"
              echo "::warning::$fn returned unexpected HTTP $HTTP_CODE"
              echo "| $fn | $PROTECTED_LABEL | $HTTP_CODE | ⚠️ Unexpected status |" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Verify — all functions
        if: github.event.inputs.runbook_mode != 'deploy-only' && github.event.inputs.function_name == ''
        run: |
          BASE_URL="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1"

          passed=0
          failed=0
          warnings=0

          {
            echo "## Edge Function Verification Results"
            echo ""
            echo "| Function | JWT Protected | HTTP Status | Result |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          for fn_dir in supabase/functions/*/; do
            fn=$(basename "$fn_dir")
            [ "$fn" = "_shared" ] && continue

            is_public=false
            for pub in $PUBLIC_FUNCTIONS; do
              [ "$fn" = "$pub" ] && is_public=true && break
            done

            PROTECTED_LABEL="✅ Yes"
            $is_public && PROTECTED_LABEL="🔓 No"

            echo "Probing: $fn  (public=$is_public) …"
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST "${BASE_URL}/${fn}" \
              -H "Content-Type: application/json" \
              --max-time 15 \
              --retry 2 \
              --retry-delay 5 \
              --data '{}' || echo "000")

            echo "  HTTP $HTTP_CODE"

            if $is_public; then
              if echo "$HTTP_CODE" | grep -qE '^5'; then
                echo "::warning::$fn returned HTTP $HTTP_CODE (server error)"
                echo "| \`$fn\` | $PROTECTED_LABEL | $HTTP_CODE | ❌ Server error |" >> "$GITHUB_STEP_SUMMARY"
                failed=$((failed + 1))
              elif [ "$HTTP_CODE" = "000" ]; then
                echo "::warning::$fn — no response (timeout or DNS failure)"
                echo "| \`$fn\` | $PROTECTED_LABEL | timeout | ⚠️ No response |" >> "$GITHUB_STEP_SUMMARY"
                warnings=$((warnings + 1))
              else
                echo "| \`$fn\` | $PROTECTED_LABEL | $HTTP_CODE | ✅ Live |" >> "$GITHUB_STEP_SUMMARY"
                passed=$((passed + 1))
              fi
            else
              if echo "$HTTP_CODE" | grep -qE '^5'; then
                echo "::warning::$fn returned HTTP $HTTP_CODE (server error)"
                echo "| \`$fn\` | $PROTECTED_LABEL | $HTTP_CODE | ❌ Server error |" >> "$GITHUB_STEP_SUMMARY"
                failed=$((failed + 1))
              elif [ "$HTTP_CODE" = "200" ]; then
                echo "::warning::$fn returned HTTP 200 without JWT — possible misconfiguration"
                echo "| \`$fn\` | $PROTECTED_LABEL | $HTTP_CODE | ⚠️ JWT bypass? |" >> "$GITHUB_STEP_SUMMARY"
                warnings=$((warnings + 1))
              elif [ "$HTTP_CODE" = "000" ]; then
                echo "::warning::$fn — no response (timeout or DNS failure)"
                echo "| \`$fn\` | $PROTECTED_LABEL | timeout | ⚠️ No response |" >> "$GITHUB_STEP_SUMMARY"
                warnings=$((warnings + 1))
              elif [ "$HTTP_CODE" = "401" ]; then
                echo "| \`$fn\` | $PROTECTED_LABEL | $HTTP_CODE | ✅ Live (JWT enforced) |" >> "$GITHUB_STEP_SUMMARY"
                passed=$((passed + 1))
              else
                echo "::warning::$fn returned unexpected HTTP $HTTP_CODE"
                echo "| \`$fn\` | $PROTECTED_LABEL | $HTTP_CODE | ⚠️ Unexpected status |" >> "$GITHUB_STEP_SUMMARY"
                warnings=$((warnings + 1))
              fi
            fi
          done

          total=$((passed + failed + warnings))
          {
            echo ""
            echo "**Total: $total functions probed — ✅ $passed passed · ⚠️ $warnings warnings · ❌ $failed failed**"
            echo ""
            echo "> Verification key:"
            echo "> - ✅ **Live** — function responded as expected"
            echo "> - ✅ **Live (JWT enforced)** — protected function correctly returned 401"
            echo "> - ⚠️ **Unexpected status** — function reachable but unexpected HTTP code"
            echo "> - ⚠️ **JWT bypass?** — protected function returned 200 without a token"
            echo "> - ⚠️ **No response** — curl timed out; project ref may be wrong"
            echo "> - ❌ **Server error** — function returned 5xx; check Supabase Edge Function logs"
          } >> "$GITHUB_STEP_SUMMARY"

          echo ""
          echo "========================================="
          echo "Verification: $passed passed, $warnings warnings, $failed failed (of $total)"
          echo "========================================="
          [ "$failed" -gt 0 ] && exit 1 || exit 0
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

  # ===========================================================================
  # 6. Run Database Migrations
  # ===========================================================================
  run-migrations:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'run-migrations'

    steps:
      - name: Check required secrets
        run: |
          missing=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$SUPABASE_PROJECT_REF"  ] && missing="$missing SUPABASE_PROJECT_REF"
          [ -z "$SUPABASE_DB_PASSWORD"  ] && missing="$missing SUPABASE_DB_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing"
            echo "::notice::Add these at: GitHub repo → Settings → Secrets → Actions"
            exit 1
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: List pending migrations (dry run)
        if: github.event.inputs.migration_dry_run == 'true'
        run: |
          echo "=== Pending migrations in supabase/migrations/ ==="
          ls -la supabase/migrations/ || echo "(no migrations folder)"
          echo ""
          echo "=== Would run: supabase db push ==="
          echo "Set 'migration_dry_run' to false and re-run to apply."

      - name: Apply specific migration
        if: github.event.inputs.migration_dry_run == 'false' && github.event.inputs.migration_file != ''
        run: |
          FILE="supabase/migrations/${{ github.event.inputs.migration_file }}"
          if [ ! -f "$FILE" ]; then
            echo "::error::Migration file not found: $FILE"
            exit 1
          fi
          echo "Applying migration: $FILE"
          PGPASSWORD="$SUPABASE_DB_PASSWORD" psql \
            "postgresql://postgres.${SUPABASE_PROJECT_REF}:${SUPABASE_DB_PASSWORD}@aws-0-ap-southeast-2.pooler.supabase.com:5432/postgres" \
            -f "$FILE" \
            -v ON_ERROR_STOP=1
          echo "✅ Migration applied."
        env:
          SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Apply all pending migrations
        if: github.event.inputs.migration_dry_run == 'false' && github.event.inputs.migration_file == ''
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push --include-all --password "$SUPABASE_DB_PASSWORD"
          echo "✅ All pending migrations applied."
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}

  # ===========================================================================
  # 7. Apply Supabase Migrations (db push) — comprehensive variant
  # ===========================================================================
  supabase-db-push:
    name: Apply Supabase migrations (db push)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'supabase-db-push'

    steps:
      - name: Check required secrets
        run: |
          missing=""
          [ -z "$SUPABASE_PROJECT_REF"  ] && missing="$missing SUPABASE_PROJECT_REF"
          [ -z "$SUPABASE_DB_PASSWORD"  ] && missing="$missing SUPABASE_DB_PASSWORD"
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing"
            echo ""
            echo "HOW TO ADD SECRETS (online / browser only):"
            echo "  1. Go to: https://github.com/${{ github.repository }}/settings/secrets/actions"
            echo ""
            echo "  SUPABASE_PROJECT_REF:  Supabase → Project → Settings → General → Reference ID"
            echo "  SUPABASE_DB_PASSWORD:  Supabase → Project → Settings → Database → Database password"
            echo "  SUPABASE_ACCESS_TOKEN: https://supabase.com/dashboard/account/tokens → Generate new token"
            exit 1
          fi
          echo "✅ All required secrets are present"
        env:
          SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: List migrations (dry run)
        if: github.event.inputs.dbpush_dry_run == 'true'
        run: |
          echo "=== Migrations in supabase/migrations/ ($(ls supabase/migrations/*.sql | wc -l) files) ==="
          ls -1 supabase/migrations/*.sql | xargs -n1 basename | sort
          echo ""
          echo "Dry run complete — no changes were applied."
          echo "Set 'dbpush_dry_run' to false and re-run to apply."

      - name: Fresh install — pre-flight instructions
        if: github.event.inputs.dbpush_dry_run == 'false' && github.event.inputs.dbpush_fresh_install == 'true'
        run: |
          echo "╔══════════════════════════════════════════════════════════════════╗"
          echo "║          FRESH INSTALL — PRE-FLIGHT CHECKLIST                   ║"
          echo "╚══════════════════════════════════════════════════════════════════╝"
          echo ""
          echo "Before migrations run, please confirm you have done these steps"
          echo "in your Supabase Dashboard (https://supabase.com):"
          echo ""
          echo "  1. Created a NEW Supabase project"
          echo "     Dashboard → New Project → Region: ap-southeast-2 (Sydney)"
          echo ""
          echo "  2. (Pro plan only) Enabled PostGIS + pg_trgm extensions:"
          echo "     Dashboard → SQL Editor → run:"
          echo "       CREATE EXTENSION IF NOT EXISTS postgis;"
          echo "       CREATE EXTENSION IF NOT EXISTS pg_trgm;"
          echo "     NOTE: On the Free plan these are skipped automatically."
          echo ""
          echo "  3. Created the 4 storage buckets (do this after migrations too):"
          echo "     Dashboard → Storage → New bucket:"
          echo "       scans            (Public: YES)"
          echo "       evidence         (Public: NO)"
          echo "       incident-evidence (Public: NO)"
          echo "       credentials      (Public: NO)"
          echo ""
          echo "Proceeding with supabase db push now…"

      - name: Apply all pending migrations
        if: github.event.inputs.dbpush_dry_run == 'false'
        run: |
          echo "Linking to project $SUPABASE_PROJECT_REF …"
          supabase link --project-ref "$SUPABASE_PROJECT_REF"

          echo "Pushing pending migrations …"
          supabase db push --include-all --password "$SUPABASE_DB_PASSWORD"

          echo ""
          echo "╔══════════════════════════════════════════════════════════════════╗"
          echo "║  ✅ All pending migrations applied successfully.                 ║"
          echo "╚══════════════════════════════════════════════════════════════════╝"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}

  # ===========================================================================
  # 8. Push Supabase Auth Config
  # ===========================================================================
  push-supabase-config:
    name: Push Supabase Auth Config
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'push-supabase-config'

    steps:
      - name: Check required secrets
        run: |
          missing=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$SUPABASE_PROJECT_REF"  ] && missing="$missing SUPABASE_PROJECT_REF"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing"
            echo "Add these at: GitHub repo → Settings → Secrets and variables → Actions → New repository secret"
            echo "  SUPABASE_ACCESS_TOKEN: get from https://supabase.com/dashboard/account/tokens"
            echo "  SUPABASE_PROJECT_REF:  get from Supabase → Project Settings → General → Reference ID"
            exit 1
          fi
          echo "✅ Secrets present"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push auth config to Supabase project
        run: |
          echo "Pushing supabase/config.toml [auth] settings to project $SUPABASE_PROJECT_REF …"
          # Do NOT use --include-all: that flag would also push [api] / [db] / [storage]
          # sections which contain local-only dev settings and can reset the hosted
          # project's PostgREST / storage configuration.
          supabase config push --project-ref "$SUPABASE_PROJECT_REF"
          echo ""
          echo "✅ Auth config pushed successfully."
          echo "   site_url and additional_redirect_urls are now live in the project."
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}

  # ===========================================================================
  # 9. ParkPow Sync (nightly schedule + manual dispatch)
  # ===========================================================================
  parkpow-sync:
    name: ParkPow sync (${{ github.event.inputs.parkpow_action || 'all' }})
    runs-on: ubuntu-latest
    permissions: {}
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'parkpow-sync')

    steps:
      - name: Check required secrets
        run: |
          missing=""
          [ -z "$SUPABASE_URL"              ] && missing="$missing SUPABASE_URL"
          [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] && missing="$missing SUPABASE_SERVICE_ROLE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing"
            echo "::notice::Add these at: GitHub repo → Settings → Secrets → Actions"
            exit 1
          fi
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Determine actions to run
        id: actions
        run: |
          INPUT="${{ github.event.inputs.parkpow_action || 'all' }}"
          if [ "$INPUT" = "all" ]; then
            echo "actions=sync-lots sync-watchlist push-violations" >> "$GITHUB_OUTPUT"
          else
            echo "actions=$INPUT" >> "$GITHUB_OUTPUT"
          fi

      - name: Run ParkPow sync action(s)
        run: |
          for action in ${{ steps.actions.outputs.actions }}; do
            echo "→ Running ParkPow action: $action …"
            RESPONSE=$(curl -s -w "\n%{http_code}" \
              -X POST \
              "${SUPABASE_URL}/functions/v1/parkpow-sync" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Content-Type: application/json" \
              -d "{\"action\": \"$action\"}")

            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | head -n-1)

            echo "  HTTP $HTTP_CODE"
            echo "  $BODY"

            if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
              echo "::error::ParkPow sync action '$action' failed (HTTP $HTTP_CODE)"
              exit 1
            fi
            echo "  ✅ $action complete"
          done
          echo ""
          echo "✅ All ParkPow sync actions complete."
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  # ===========================================================================
  # 10. Extract Database Schema
  # ===========================================================================
  extract-schema:
    name: Extract Database Schema
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'extract-schema'

    steps:
      - name: Check required secrets
        id: check_secrets
        run: |
          missing=""
          for var in PGHOST PGPORT PGUSER PGPASSWORD PGDATABASE; do
            eval "val=\${${var}:-}"
            if [ -z "$val" ]; then
              missing="$missing $var"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::notice::Required secrets not configured:$missing – skipping extraction."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          PGHOST:     ${{ secrets.PGHOST }}
          PGPORT:     ${{ secrets.PGPORT }}
          PGUSER:     ${{ secrets.PGUSER }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
          PGDATABASE: ${{ secrets.PGDATABASE }}

      - name: Checkout repository
        if: steps.check_secrets.outputs.skip == 'false'
        uses: actions/checkout@v4

      - name: Install PostgreSQL client tools
        if: steps.check_secrets.outputs.skip == 'false'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Run schema extraction
        if: steps.check_secrets.outputs.skip == 'false'
        env:
          PGHOST:        ${{ secrets.PGHOST }}
          PGPORT:        ${{ secrets.PGPORT }}
          PGUSER:        ${{ secrets.PGUSER }}
          PGPASSWORD:    ${{ secrets.PGPASSWORD }}
          PGDATABASE:    ${{ secrets.PGDATABASE }}
          EXTRACT_MODE:  ${{ github.event.inputs.extract_mode }}
        run: |
          chmod +x tools/schema-extract/run_extract.sh
          tools/schema-extract/run_extract.sh

      - name: Upload output as artifact
        if: steps.check_secrets.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: schema-extract-${{ github.run_id }}
          path: tools/schema-extract/output/
          retention-days: 30

      - name: Commit results to branch
        if: steps.check_secrets.outputs.skip == 'false'
        run: |
          TARGET_BRANCH="${{ github.event.inputs.branch_name }}"
          if [ -z "$TARGET_BRANCH" ]; then
            TARGET_BRANCH="schema-extract/$(date -u +%Y%m%d)"
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -B "$TARGET_BRANCH"

          # Stage only the extraction output; never stage secrets or .env files.
          git add tools/schema-extract/output/

          if git diff --cached --quiet; then
            echo "No new schema output to commit."
          else
            git commit -m "chore: schema extract $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            git push origin "$TARGET_BRANCH"
            echo "Results committed to branch: $TARGET_BRANCH"
          fi

  # ===========================================================================
  # 11. Generate Android Keystore
  # ===========================================================================
  generate-keystore:
    name: Generate Android Keystore
    runs-on: ubuntu-latest
    permissions: {}
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'generate-keystore'

    steps:
      - name: Generate Keystore
        run: |
          keytool -genkey -v \
            -keystore android.keystore \
            -alias "${{ github.event.inputs.key_alias }}" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "${{ github.event.inputs.keystore_password }}" \
            -keypass  "${{ github.event.inputs.keystore_password }}" \
            -dname "CN=FreedomCamp, OU=App, O=FreedomCamp, L=City, S=State, C=US"

      - name: Convert to Base64
        run: |
          base64 android.keystore | tr -d '\n' > keystore-base64.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-keystore-files
          path: |
            android.keystore
            keystore-base64.txt
          retention-days: 1

  # ===========================================================================
  # 12. Hydrate NZ Maps
  # ===========================================================================
  import-maps:
    name: Hydrate NZ Maps
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'import-maps'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install @supabase/supabase-js@2 dotenv@16 typescript@5 ts-node@10 @types/node@20

      - name: Run Import Script
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STATSNZ_API_KEY:           ${{ secrets.STATSNZ_API_KEY }}
          IMPORT_MODE:               ${{ github.event.inputs.import_mode }}
          IMPORT_SOURCES:            ${{ github.event.inputs.import_sources }}
          ORGANIZATION_ID:           ${{ github.event.inputs.organization_id }}
          IMPORT_BBOX:               ${{ github.event.inputs.import_bbox }}
        run: |
          if [ "${{ github.event.inputs.import_mode }}" = "campsites" ]; then
            npx ts-node scripts/import_campsites.ts
          else
            npx ts-node scripts/import_boundaries.ts
          fi

  # ===========================================================================
  # 13. Migrate Data Between Supabase Projects
  # ===========================================================================
  migrate-data:
    name: Migrate Data Between Supabase Projects
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'migrate-data'
    env:
      SOURCE_REF: xbfnlzmpumthnjmtqufp
      TARGET_REF: kxwjcupuxnnbnzcgmkoi
      DB_HOST:    aws-0-ap-southeast-2.pooler.supabase.com

    steps:
      - name: Check required secrets
        run: |
          missing=""
          [ -z "$SUPABASE_DB_PASSWORD_SOURCE" ] && missing="$missing SUPABASE_DB_PASSWORD_SOURCE"
          [ -z "$SUPABASE_DB_PASSWORD_TARGET" ] && missing="$missing SUPABASE_DB_PASSWORD_TARGET"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing"
            echo ""
            echo "HOW TO ADD SECRETS (browser only):"
            echo "  1. Go to: https://github.com/${{ github.repository }}/settings/secrets/actions"
            echo ""
            echo "  SUPABASE_DB_PASSWORD_SOURCE:"
            echo "    Old Supabase project (${SOURCE_REF}) → Settings → Database → Database password"
            echo ""
            echo "  SUPABASE_DB_PASSWORD_TARGET:"
            echo "    New Supabase project (${TARGET_REF}) → Settings → Database → Database password"
            exit 1
          fi
          echo "✅ All required secrets are present"
        env:
          SUPABASE_DB_PASSWORD_SOURCE: ${{ secrets.SUPABASE_DB_PASSWORD_SOURCE }}
          SUPABASE_DB_PASSWORD_TARGET: ${{ secrets.SUPABASE_DB_PASSWORD_TARGET }}

      - name: Install postgresql-client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Set connection strings
        run: |
          echo "SOURCE_DSN=postgresql://postgres.${SOURCE_REF}:${SUPABASE_DB_PASSWORD_SOURCE}@${DB_HOST}:5432/postgres" >> "$GITHUB_ENV"
          echo "TARGET_DSN=postgresql://postgres.${TARGET_REF}:${SUPABASE_DB_PASSWORD_TARGET}@${DB_HOST}:5432/postgres" >> "$GITHUB_ENV"
        env:
          SUPABASE_DB_PASSWORD_SOURCE: ${{ secrets.SUPABASE_DB_PASSWORD_SOURCE }}
          SUPABASE_DB_PASSWORD_TARGET: ${{ secrets.SUPABASE_DB_PASSWORD_TARGET }}

      - name: Verify source connectivity
        run: |
          echo "Testing connection to SOURCE (${SOURCE_REF})…"
          psql "$SOURCE_DSN" -c "SELECT current_database(), current_user, version();" || {
            echo "::error::Cannot connect to source database. Check SUPABASE_DB_PASSWORD_SOURCE."
            exit 1
          }
          echo "✅ Source connection OK"

      - name: Verify target connectivity
        run: |
          echo "Testing connection to TARGET (${TARGET_REF})…"
          psql "$TARGET_DSN" -c "SELECT current_database(), current_user, version();" || {
            echo "::error::Cannot connect to target database. Check SUPABASE_DB_PASSWORD_TARGET."
            exit 1
          }
          echo "✅ Target connection OK"

      - name: Build table selection flags
        run: |
          TABLES_INPUT="${{ github.event.inputs.migrate_tables }}"
          TABLE_FLAGS=""
          if [ -n "$TABLES_INPUT" ]; then
            IFS=',' read -ra TLIST <<< "$TABLES_INPUT"
            for t in "${TLIST[@]}"; do
              t="$(echo "$t" | xargs)"
              TABLE_FLAGS="$TABLE_FLAGS -t public.${t}"
            done
            echo "Migrating selected tables: $TABLES_INPUT"
          else
            echo "Migrating ALL public tables"
          fi
          echo "TABLE_FLAGS=${TABLE_FLAGS}" >> "$GITHUB_ENV"

      - name: Dump data from source
        run: |
          echo "╔══════════════════════════════════════════════════════════════════╗"
          echo "║  Dumping data from SOURCE: ${SOURCE_REF}                        ║"
          echo "╚══════════════════════════════════════════════════════════════════╝"

          pg_dump "$SOURCE_DSN" \
            --data-only \
            --no-owner \
            --no-privileges \
            --no-comments \
            --schema=public \
            $TABLE_FLAGS \
            --exclude-table=public.schema_migrations \
            --exclude-table=public.supabase_migrations \
            --exclude-table-data=public.audit_log_entries \
            --file=/tmp/data_dump.sql

          DUMP_SIZE=$(wc -l < /tmp/data_dump.sql)
          echo ""
          echo "✅ Dump complete: ${DUMP_SIZE} lines written to /tmp/data_dump.sql"

      - name: Show dump summary
        run: |
          echo "=== Tables found in dump ==="
          grep -oP "(?<=COPY public\.)\w+" /tmp/data_dump.sql | sort | uniq -c | sort -rn || true
          echo ""
          echo "=== Dump size ==="
          wc -c /tmp/data_dump.sql
          echo ""
          if [ "${{ github.event.inputs.migrate_dry_run }}" = "true" ]; then
            echo "DRY RUN — restore step will be skipped."
          fi

      - name: Restore data to target
        if: github.event.inputs.migrate_dry_run == 'false'
        run: |
          echo "╔══════════════════════════════════════════════════════════════════╗"
          echo "║  Restoring data to TARGET: ${TARGET_REF}                        ║"
          echo "╚══════════════════════════════════════════════════════════════════╝"

          psql "$TARGET_DSN" \
            --single-transaction \
            --file=/tmp/data_dump.sql

          echo "✅ Restore complete — no errors."

      - name: Row-count summary
        if: github.event.inputs.migrate_dry_run == 'false'
        run: |
          echo "=== Row counts on SOURCE ==="
          psql "$SOURCE_DSN" -c "
            SELECT schemaname, tablename,
                   n_live_tup::bigint AS rows
            FROM pg_stat_user_tables
            WHERE schemaname = 'public'
              AND n_live_tup > 0
            ORDER BY n_live_tup DESC
            LIMIT 30;
          " || true

          echo ""
          echo "=== Row counts on TARGET ==="
          psql "$TARGET_DSN" -c "
            SELECT schemaname, tablename,
                   n_live_tup::bigint AS rows
            FROM pg_stat_user_tables
            WHERE schemaname = 'public'
              AND n_live_tup > 0
            ORDER BY n_live_tup DESC
            LIMIT 30;
          " || true

          echo ""
          echo "╔══════════════════════════════════════════════════════════════════╗"
          echo "║  ✅ Data migration complete.                                      ║"
          echo "╚══════════════════════════════════════════════════════════════════╝"

  # ===========================================================================
  # 14. Data Migration — Legacy Manual Run (import vehicles / zones)
  # ===========================================================================
  data-migration:
    name: Data Migration (Manual Run)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'data-migration'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install csv-parse
          npm install -g tsx

      - name: Run Vehicles Migration
        if: >-
          github.event.inputs.script_to_run == 'all' ||
          github.event.inputs.script_to_run == 'import-vehicles'
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASEV2_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/import-canonical-vehicles.ts

      - name: Run Zones Migration
        if: >-
          github.event.inputs.script_to_run == 'all' ||
          github.event.inputs.script_to_run == 'import-zones'
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASEV2_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/import-zones.ts
