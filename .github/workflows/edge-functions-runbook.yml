name: Edge Functions — Deploy & Verify Runbook

# -----------------------------------------------------------------------
# Combined deployment and live-verification runbook for all (or a single)
# Supabase Edge Function.  Designed to be run 100% from the GitHub web
# UI — no local tools needed.
#
# ═══════════════════════════════════════════════════════════════════════
# QUICK START (online / browser only)
# ═══════════════════════════════════════════════════════════════════════
#
# 1. Add GitHub repository secrets (one-time setup)
#    Repo → Settings → Secrets and variables → Actions
#
#    Secret name              Where to get it
#    ─────────────────────    ─────────────────────────────────────────
#    SUPABASE_ACCESS_TOKEN    https://supabase.com/dashboard/account/tokens
#                             → "Generate new token" → copy value
#    SUPABASE_PROJECT_REF     Supabase → Your project → Settings → General
#                             → Reference ID  (e.g. abcdefghijklmnop)
#
# 2. Run this workflow
#    Repo → Actions → "Edge Functions — Deploy & Verify Runbook"
#    → "Run workflow" → fill in the inputs → click the green button
#
# ═══════════════════════════════════════════════════════════════════════
# Inputs
# ═══════════════════════════════════════════════════════════════════════
#
#   function_name   – leave blank to process ALL functions, or type a
#                     single function name (e.g. "get-weather") to target
#                     only that one.
#
#   mode            – deploy+verify (default) → deploy then smoke-test
#                     deploy-only             → skip the verify step
#                     verify-only             → skip deploy, just smoke-test
#
#   no_verify_jwt   – auto   (default) auto-detect public functions
#                     yes    → force --no-verify-jwt on a single deploy
#                     no     → force JWT verification on a single deploy
#
# ═══════════════════════════════════════════════════════════════════════
# Verification logic
# ═══════════════════════════════════════════════════════════════════════
#
#   Each function is probed with a POST request (no body, no auth token).
#
#   Public functions (no JWT required):
#     Expected: 200 or 400/405 (function reachable; bad-input is fine)
#     Failure:  5xx  (function crashed or failed to start)
#
#   Protected functions (JWT required):
#     Expected: 401  (function reachable, correctly rejecting unauthenticated calls)
#     Failure:  5xx  (function crashed or failed to start)
#               200  (JWT check missing — security misconfiguration)
#
#   A summary table is written to the GitHub Actions job summary at the
#   end of the run so you can review results at a glance.
#
# -----------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      function_name:
        description: 'Function to process (leave blank for ALL functions)'
        required: false
        default: ''
      mode:
        description: 'What to do'
        required: false
        default: 'deploy+verify'
        type: choice
        options:
          - 'deploy+verify'
          - 'deploy-only'
          - 'verify-only'
      no_verify_jwt:
        description: 'JWT mode for single-function deploy (auto = detect from known public list)'
        required: false
        default: 'auto'
        type: choice
        options:
          - 'auto'
          - 'yes'
          - 'no'

jobs:
  runbook:
    name: Edge Functions Runbook
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Functions deployed with --no-verify-jwt (publicly callable without a JWT)
      PUBLIC_FUNCTIONS: "orc-ingest vehicle-ingest alpr-process alpr-retry plate-scanner-photo-first stream-webhook get-weather send-push-notification"

    steps:
      # ── 0. Validate secrets ──────────────────────────────────────────
      - name: Check required secrets
        run: |
          missing=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$SUPABASE_PROJECT_REF"  ] && missing="$missing SUPABASE_PROJECT_REF"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing"
            echo ""
            echo "HOW TO ADD SECRETS (online / browser only):"
            echo "  Go to: https://github.com/${{ github.repository }}/settings/secrets/actions"
            echo "  Click 'New repository secret' and add:"
            echo ""
            echo "  SUPABASE_ACCESS_TOKEN:"
            echo "    https://supabase.com/dashboard/account/tokens"
            echo "    → 'Generate new token' (name it 'github-actions') → copy the full value"
            echo ""
            echo "  SUPABASE_PROJECT_REF:"
            echo "    Supabase → Your project → Settings → General → Reference ID"
            echo "    (looks like: abcdefghijklmnop)"
            exit 1
          fi
          echo "✅ All required secrets are present"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}

      # ── 1. Checkout ──────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Supabase CLI ──────────────────────────────────────────────
      - name: Setup Supabase CLI
        if: ${{ github.event.inputs.mode != 'verify-only' }}
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # ── 3. Deploy ────────────────────────────────────────────────────
      - name: Deploy — single function
        if: >-
          ${{ github.event.inputs.mode != 'verify-only' &&
              github.event.inputs.function_name != '' }}
        run: |
          fn="${{ github.event.inputs.function_name }}"
          mode="${{ github.event.inputs.no_verify_jwt }}"

          JWT_FLAG=""
          if [ "$mode" = "yes" ]; then
            JWT_FLAG="--no-verify-jwt"
          elif [ "$mode" = "auto" ]; then
            for pub in $PUBLIC_FUNCTIONS; do
              [ "$fn" = "$pub" ] && JWT_FLAG="--no-verify-jwt" && break
            done
          fi

          echo "→ Deploying $fn $JWT_FLAG …"
          supabase functions deploy "$fn" \
            --project-ref "$SUPABASE_PROJECT_REF" \
            $JWT_FLAG
          echo "✅ Deployed: $fn"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Deploy — all functions
        if: >-
          ${{ github.event.inputs.mode != 'verify-only' &&
              github.event.inputs.function_name == '' }}
        run: |
          cd supabase/functions
          success=0
          failed=0
          failed_list=""

          for fn in */; do
            fn="${fn%/}"
            [ "$fn" = "_shared" ] && continue

            JWT_FLAG=""
            for pub in $PUBLIC_FUNCTIONS; do
              [ "$fn" = "$pub" ] && JWT_FLAG="--no-verify-jwt" && break
            done

            echo "→ Deploying $fn $JWT_FLAG …"
            if supabase functions deploy "$fn" \
                --project-ref "$SUPABASE_PROJECT_REF" \
                $JWT_FLAG; then
              echo "  ✅ $fn deployed"
              success=$((success + 1))
            else
              echo "::warning::  ⚠️  $fn failed — continuing with remaining functions"
              failed=$((failed + 1))
              failed_list="$failed_list $fn"
            fi
          done

          echo ""
          echo "========================================="
          echo "Deploy complete: $success succeeded, $failed failed"
          [ -n "$failed_list" ] && echo "Failed:$failed_list"
          echo "========================================="
          [ "$failed" -gt 0 ] && exit 1 || exit 0
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}

      # ── 4. Verify ────────────────────────────────────────────────────
      - name: Verify — single function
        if: >-
          ${{ github.event.inputs.mode != 'deploy-only' &&
              github.event.inputs.function_name != '' }}
        run: |
          BASE_URL="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1"
          fn="${{ github.event.inputs.function_name }}"

          # Determine if this is a public function
          is_public=false
          for pub in $PUBLIC_FUNCTIONS; do
            [ "$fn" = "$pub" ] && is_public=true && break
          done

          echo "Verifying: $fn  (public=$is_public)"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${BASE_URL}/${fn}" \
            -H "Content-Type: application/json" \
            --max-time 15 \
            --retry 2 \
            --retry-delay 5 \
            --data '{}')

          echo "  HTTP $HTTP_CODE"

          # Build job summary
          {
            echo "## Edge Function Verification Results"
            echo ""
            echo "| Function | JWT Protected | HTTP Status | Result |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          PROTECTED_LABEL="✅ Yes"
          $is_public && PROTECTED_LABEL="🔓 No"

          if $is_public; then
            # Public: expect 200/400/405 — any 5xx is a failure
            if echo "$HTTP_CODE" | grep -qE '^5'; then
              echo "::error::$fn returned HTTP $HTTP_CODE (server error — function may have crashed)"
              echo "| $fn | $PROTECTED_LABEL | $HTTP_CODE | ❌ Server error |" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            else
              echo "  ✅ $fn is live (HTTP $HTTP_CODE)"
              echo "| $fn | $PROTECTED_LABEL | $HTTP_CODE | ✅ Live |" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            # Protected: expect 401 — 5xx or 200 is a problem
            if echo "$HTTP_CODE" | grep -qE '^5'; then
              echo "::error::$fn returned HTTP $HTTP_CODE (server error — function may have crashed)"
              echo "| $fn | $PROTECTED_LABEL | $HTTP_CODE | ❌ Server error |" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            elif [ "$HTTP_CODE" = "200" ]; then
              echo "::error::$fn returned HTTP 200 without a JWT — JWT verification may be misconfigured"
              echo "| $fn | $PROTECTED_LABEL | $HTTP_CODE | ❌ JWT bypass |" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            elif [ "$HTTP_CODE" = "401" ]; then
              echo "  ✅ $fn is live and correctly requires JWT (HTTP 401)"
              echo "| $fn | $PROTECTED_LABEL | $HTTP_CODE | ✅ Live (JWT enforced) |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "  ⚠️  $fn returned unexpected HTTP $HTTP_CODE"
              echo "::warning::$fn returned unexpected HTTP $HTTP_CODE"
              echo "| $fn | $PROTECTED_LABEL | $HTTP_CODE | ⚠️ Unexpected status |" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Verify — all functions
        if: >-
          ${{ github.event.inputs.mode != 'deploy-only' &&
              github.event.inputs.function_name == '' }}
        run: |
          BASE_URL="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1"

          passed=0
          failed=0
          warnings=0

          # Start summary table
          {
            echo "## Edge Function Verification Results"
            echo ""
            echo "| Function | JWT Protected | HTTP Status | Result |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          for fn_dir in supabase/functions/*/; do
            fn=$(basename "$fn_dir")
            [ "$fn" = "_shared" ] && continue

            # Determine if public
            is_public=false
            for pub in $PUBLIC_FUNCTIONS; do
              [ "$fn" = "$pub" ] && is_public=true && break
            done

            PROTECTED_LABEL="✅ Yes"
            $is_public && PROTECTED_LABEL="🔓 No"

            echo "Probing: $fn  (public=$is_public) …"
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST "${BASE_URL}/${fn}" \
              -H "Content-Type: application/json" \
              --max-time 15 \
              --retry 2 \
              --retry-delay 5 \
              --data '{}' || echo "000")

            echo "  HTTP $HTTP_CODE"

            if $is_public; then
              if echo "$HTTP_CODE" | grep -qE '^5'; then
                echo "::warning::$fn returned HTTP $HTTP_CODE (server error)"
                echo "| \`$fn\` | $PROTECTED_LABEL | $HTTP_CODE | ❌ Server error |" >> "$GITHUB_STEP_SUMMARY"
                failed=$((failed + 1))
              elif [ "$HTTP_CODE" = "000" ]; then
                echo "::warning::$fn — no response (timeout or DNS failure)"
                echo "| \`$fn\` | $PROTECTED_LABEL | timeout | ⚠️ No response |" >> "$GITHUB_STEP_SUMMARY"
                warnings=$((warnings + 1))
              else
                echo "| \`$fn\` | $PROTECTED_LABEL | $HTTP_CODE | ✅ Live |" >> "$GITHUB_STEP_SUMMARY"
                passed=$((passed + 1))
              fi
            else
              if echo "$HTTP_CODE" | grep -qE '^5'; then
                echo "::warning::$fn returned HTTP $HTTP_CODE (server error)"
                echo "| \`$fn\` | $PROTECTED_LABEL | $HTTP_CODE | ❌ Server error |" >> "$GITHUB_STEP_SUMMARY"
                failed=$((failed + 1))
              elif [ "$HTTP_CODE" = "200" ]; then
                echo "::warning::$fn returned HTTP 200 without JWT — possible misconfiguration"
                echo "| \`$fn\` | $PROTECTED_LABEL | $HTTP_CODE | ⚠️ JWT bypass? |" >> "$GITHUB_STEP_SUMMARY"
                warnings=$((warnings + 1))
              elif [ "$HTTP_CODE" = "000" ]; then
                echo "::warning::$fn — no response (timeout or DNS failure)"
                echo "| \`$fn\` | $PROTECTED_LABEL | timeout | ⚠️ No response |" >> "$GITHUB_STEP_SUMMARY"
                warnings=$((warnings + 1))
              elif [ "$HTTP_CODE" = "401" ]; then
                echo "| \`$fn\` | $PROTECTED_LABEL | $HTTP_CODE | ✅ Live (JWT enforced) |" >> "$GITHUB_STEP_SUMMARY"
                passed=$((passed + 1))
              else
                echo "::warning::$fn returned unexpected HTTP $HTTP_CODE"
                echo "| \`$fn\` | $PROTECTED_LABEL | $HTTP_CODE | ⚠️ Unexpected status |" >> "$GITHUB_STEP_SUMMARY"
                warnings=$((warnings + 1))
              fi
            fi
          done

          # Summary footer
          total=$((passed + failed + warnings))
          {
            echo ""
            echo "**Total: $total functions probed — ✅ $passed passed · ⚠️ $warnings warnings · ❌ $failed failed**"
            echo ""
            echo "> Verification key:"
            echo "> - ✅ **Live** — function responded as expected"
            echo "> - ✅ **Live (JWT enforced)** — protected function correctly returned 401"
            echo "> - ⚠️ **Unexpected status** — function is reachable but returned an unexpected HTTP code; review logs in Supabase Dashboard → Edge Functions"
            echo "> - ⚠️ **JWT bypass?** — protected function returned 200 without a token; verify \`--no-verify-jwt\` was not accidentally set"
            echo "> - ⚠️ **No response** — curl timed out; function may still be starting up, or the project ref is wrong"
            echo "> - ❌ **Server error** — function returned 5xx; check logs in Supabase Dashboard → Edge Functions → \`<name>\` → Logs"
          } >> "$GITHUB_STEP_SUMMARY"

          echo ""
          echo "========================================="
          echo "Verification: $passed passed, $warnings warnings, $failed failed (of $total)"
          echo "========================================="

          # Fail the job if any function returned a 5xx
          [ "$failed" -gt 0 ] && exit 1 || exit 0
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
