name: CI Phase E1 Data Access Consolidation Gate

# Path-filtered gate for Phase E1 target page direct-query drift and hook/service migration baselines.

on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/e2e/phase-e1-data-access-consolidation.spec.ts'
      - 'src/pages/PTTRadio.tsx'
      - 'src/pages/DispatchConsole.tsx'
      - 'src/pages/FieldOfficerPortal.tsx'
      - 'src/pages/AssetManagement.tsx'
      - 'src/pages/VehicleManagement.tsx'
      - 'src/pages/BreachAlerts.tsx'
      - 'src/pages/AdminPortal.tsx'
      - 'src/pages/NoiseControlPortal.tsx'
      - 'src/pages/ClientAccountPage.tsx'
      - 'src/pages/RosterPlanner.tsx'
      - 'src/hooks/**'
      - 'src/lib/**'
      - 'docs/MODULE_ROADMAP.md'
      - 'docs/STAGING.md'
      - 'tests/e2e/setup.ts'
      - 'playwright.api.config.ts'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/ci-phase-e1-data-access-consolidation-gate.yml'
  push:
    branches: [main]
    paths:
      - 'tests/e2e/phase-e1-data-access-consolidation.spec.ts'
      - 'src/pages/PTTRadio.tsx'
      - 'src/pages/DispatchConsole.tsx'
      - 'src/pages/FieldOfficerPortal.tsx'
      - 'src/pages/AssetManagement.tsx'
      - 'src/pages/VehicleManagement.tsx'
      - 'src/pages/BreachAlerts.tsx'
      - 'src/pages/AdminPortal.tsx'
      - 'src/pages/NoiseControlPortal.tsx'
      - 'src/pages/ClientAccountPage.tsx'
      - 'src/pages/RosterPlanner.tsx'
      - 'src/hooks/**'
      - 'src/lib/**'
      - 'docs/MODULE_ROADMAP.md'
      - 'docs/STAGING.md'
      - 'tests/e2e/setup.ts'
      - 'playwright.api.config.ts'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/ci-phase-e1-data-access-consolidation-gate.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  phase-e1-data-access-consolidation-gate:
    name: Phase E1 Data Access Consolidation Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Phase E1 data-access consolidation gate suite
        id: phase_e1_gate
        continue-on-error: true
        run: |
          bunx playwright test \
            tests/e2e/phase-e1-data-access-consolidation.spec.ts \
            --config=playwright.api.config.ts \
            --reporter=list

      - name: Enforce Phase E1 gate (strict mode)
        if: steps.phase_e1_gate.outcome == 'failure' && vars.PHASE_E1_GATE_STRICT == 'true'
        run: |
          echo "::error::Phase E1 data-access consolidation gate failed and strict mode is enabled (PHASE_E1_GATE_STRICT=true)."
          exit 1

      - name: Report Phase E1 gate (non-strict)
        if: steps.phase_e1_gate.outcome == 'failure' && vars.PHASE_E1_GATE_STRICT != 'true'
        run: |
          echo "::warning::Phase E1 data-access consolidation gate failed but strict mode is disabled; continuing."

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase-e1-data-access-consolidation-gate-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
