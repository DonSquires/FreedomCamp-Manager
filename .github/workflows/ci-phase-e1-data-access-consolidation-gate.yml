name: CI Phase E1 Data Access Consolidation Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/e2e/phase-e1-data-access-consolidation.spec.ts'
      - 'src/pages/PTTRadio.tsx'
      - 'src/pages/DispatchConsole.tsx'
      - 'src/pages/FieldOfficerPortal.tsx'
      - 'src/pages/AssetManagement.tsx'
      - 'src/pages/VehicleManagement.tsx'
      - 'src/pages/BreachAlerts.tsx'
      - 'src/pages/AdminPortal.tsx'
      - 'src/pages/NoiseControlPortal.tsx'
      - 'src/pages/ClientAccountPage.tsx'
      - 'src/pages/RosterPlanner.tsx'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/ci-phase-e1-data-access-consolidation-gate.yml'
  push:
    branches: [main]
    paths:
      - 'tests/e2e/phase-e1-data-access-consolidation.spec.ts'
      - 'src/pages/PTTRadio.tsx'
      - 'src/pages/DispatchConsole.tsx'
      - 'src/pages/FieldOfficerPortal.tsx'
      - 'src/pages/AssetManagement.tsx'
      - 'src/pages/VehicleManagement.tsx'
      - 'src/pages/BreachAlerts.tsx'
      - 'src/pages/AdminPortal.tsx'
      - 'src/pages/NoiseControlPortal.tsx'
      - 'src/pages/ClientAccountPage.tsx'
      - 'src/pages/RosterPlanner.tsx'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/ci-phase-e1-data-access-consolidation-gate.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  phase-e1-data-access-consolidation-gate:
    name: Phase E1 Data Access Consolidation Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Phase E1 data access consolidation gate suite
        run: |
          bunx playwright test \
            tests/e2e/phase-e1-data-access-consolidation.spec.ts \
            --reporter=list
