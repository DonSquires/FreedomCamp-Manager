name: Sync database types

# After every successful migration push this workflow generates fresh TypeScript
# types from the live Supabase schema and opens a pull request to update
# src/types/database.ts so the repository always reflects what is actually in
# the database.
#
# This is the primary mechanism by which GitHub "sees" the full live schema —
# the generated types file is a machine-readable snapshot of every table,
# column, view, function, and enum in the public schema.
#
# Triggers:
#   • Automatically after "Apply Supabase migrations (db push)" completes on main
#   • Manually via workflow_dispatch for an on-demand refresh
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN    — personal access token (sbp_…) from
#                              https://supabase.com/dashboard/account/tokens
#   PRODUCTION_PROJECT_ID    — Supabase project reference ID for production
#
# Legacy fallback (accepted when preferred names are absent):
#   SUPABASE_PROJECT_REF     — alias for PRODUCTION_PROJECT_ID
#
# The workflow requires write access to contents and pull-requests so it can
# open the sync PR.  It uses the built-in GITHUB_TOKEN — no extra PAT needed.
#
# See docs/SUPABASE_GITHUB_SETUP.md for full setup instructions.

on:
  # Run automatically after a successful db push to main.
  workflow_run:
    workflows: ['Apply Supabase migrations (db push)']
    types: [completed]
    branches: [main]

  # Allow a manual refresh at any time.
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pull-requests: write

jobs:
  sync_types:
    name: Regenerate src/types/database.ts from live schema
    runs-on: ubuntu-latest
    # For workflow_run triggers, only proceed when the upstream job succeeded.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Full history so the PR branch can be compared accurately.
          fetch-depth: 0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Resolve project credentials
        id: creds
        env:
          SUPABASE_ACCESS_TOKEN:  ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PRODUCTION_PROJECT_ID:  ${{ secrets.PRODUCTION_PROJECT_ID }}
          SUPABASE_PROJECT_REF:   ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail

          # Prefer new PRODUCTION_PROJECT_ID; fall back to legacy SUPABASE_PROJECT_REF.
          PROJECT_ID="${PRODUCTION_PROJECT_ID:-${SUPABASE_PROJECT_REF:-}}"

          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_ID" ]; then
            echo "::error::Missing required secrets for type generation."
            echo "  Set SUPABASE_ACCESS_TOKEN and PRODUCTION_PROJECT_ID in repository secrets."
            echo "  See docs/SUPABASE_GITHUB_SETUP.md for instructions."
            exit 1
          fi

          echo "project_id=${PROJECT_ID}" >> "$GITHUB_OUTPUT"

      - name: Generate TypeScript types from live schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          echo "Generating TypeScript types for project ${{ steps.creds.outputs.project_id }} …"

          supabase gen types typescript \
            --project-id "${{ steps.creds.outputs.project_id }}" \
            --schema public \
            > src/types/database.ts

          echo "✅ Types written to src/types/database.ts"

      - name: Check for changes
        id: diff
        run: |
          set -euo pipefail
          if git diff --quiet src/types/database.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "✅ src/types/database.ts is already up to date — no PR needed."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Schema drift detected:"
            git diff --stat src/types/database.ts
          fi

      - name: Open pull request with updated types
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          BRANCH="chore/sync-db-types-$(date +%Y%m%d%H%M%S)"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add src/types/database.ts
          git commit -m "chore: sync src/types/database.ts with live Supabase schema"
          git push --set-upstream origin "$BRANCH"

          # Write the PR body to a temp file to avoid shell quoting / YAML conflicts.
          PR_BODY_FILE="$(mktemp)"
          cat > "$PR_BODY_FILE" <<'PRBODY'
          ## Automated schema type sync

          This PR was opened automatically by the **Sync database types** workflow
          after a migration was applied to the production database.

          ### What changed

          `src/types/database.ts` has been regenerated from the live Supabase schema
          using `supabase gen types typescript`. The diff shows every table, column,
          view, function, and enum that was added, removed, or modified.

          ### Review checklist

          - [ ] Column additions/removals match the migration that triggered this PR
          - [ ] No unexpected tables or columns appear in the diff
          - [ ] Any new nullable columns are handled correctly in the frontend code
          - [ ] `src/types/index.ts` re-exports are still valid

          ### Merging

          After review, merge this PR to keep the TypeScript types in sync with the
          live database. The `bun run build` CI step will catch any type errors
          introduced by schema changes before merge.
          PRBODY

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: sync database types with live schema" \
            --body-file "$PR_BODY_FILE"

          echo "✅ Pull request opened: $BRANCH"
