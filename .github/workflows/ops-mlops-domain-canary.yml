name: Ops - MLOps Domain Canary

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-mlops-domain-canary.yml'
      - '.github/workflows/ops-mlops-domain-promotion-gate.yml'
      - 'scripts/mlops-domain-inference-canary.mjs'
      - 'scripts/mlops-canary-promotion-gate.mjs'
      - 'package.json'
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      strict_mode:
        description: 'Fail workflow when any domain canary fails'
        required: false
        default: 'true'
        type: string
      timeout_ms:
        description: 'Per-domain timeout in milliseconds'
        required: false
        default: '25000'
        type: string

permissions:
  contents: read

jobs:
  domain-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MLOPS_CANARY_STRICT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.strict_mode || 'true' }}
      MLOPS_CANARY_TIMEOUT_MS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.timeout_ms || '25000' }}
      BOB_SERVICE_URL: ${{ secrets.BOB_SERVICE_URL || secrets.INFERENCE_SERVICE_URL }}
      INFERENCE_SERVICE_URL: ${{ secrets.INFERENCE_SERVICE_URL || secrets.BOB_SERVICE_URL }}
      BOB_INFERENCE_API_KEY: ${{ secrets.BOB_INFERENCE_API_KEY || secrets.INFERENCE_API_KEY }}
      INFERENCE_API_KEY: ${{ secrets.INFERENCE_API_KEY || secrets.BOB_INFERENCE_API_KEY }}
      MLOPS_SLACK_WEBHOOK_URL: ${{ secrets.MLOPS_SLACK_WEBHOOK_URL || secrets.RADIO_SPEECH_WEBHOOK_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run domain canary probe
        id: canary
        continue-on-error: true
        run: |
          node scripts/mlops-domain-inference-canary.mjs --out tools/mlops/domain-canary/${{ github.run_id }}/domain-canary.json

      - name: Enforce strict mode
        if: steps.canary.outcome == 'failure' && env.MLOPS_CANARY_STRICT == 'true'
        run: |
          echo "::error::Domain canary failed in strict mode. Review biosecurity/noise/parking probe details in uploaded artifact and summary."
          exit 1

      - name: Upload canary artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mlops-domain-canary-${{ github.run_id }}
          path: tools/mlops/domain-canary/${{ github.run_id }}/domain-canary.json
          if-no-files-found: warn

      - name: Notify canary failure
        if: steps.canary.outcome == 'failure' && env.MLOPS_SLACK_WEBHOOK_URL != ''
        run: |
          node -e '
            const fs = require("fs");
            const path = "tools/mlops/domain-canary/${{ github.run_id }}/domain-canary.json";
            let details = "(artifact unavailable)";
            if (fs.existsSync(path)) {
              const d = JSON.parse(fs.readFileSync(path, "utf8"));
              const failing = (d.domains || []).filter((item) => !item.ok).map((item) => `${item.domain}:${item.reason}`).join(", ");
              details = failing || "unknown_domain_failure";
            }
            const runUrl = `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const payload = {
              text: `[MLOps Domain Canary] FAILED on ${process.env.GITHUB_REPOSITORY}. Failing domains: ${details}. Run: ${runUrl}`,
            };
            fs.writeFileSync("/tmp/mlops-canary-alert.json", JSON.stringify(payload));
          '
          curl -fsSL -X POST "$MLOPS_SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            --data @/tmp/mlops-canary-alert.json

      - name: Record alert status in summary
        if: always()
        run: |
          if [[ "${{ steps.canary.outcome }}" == "failure" && -n "$MLOPS_SLACK_WEBHOOK_URL" ]]; then
            echo "- Alerting: sent via MLOPS_SLACK_WEBHOOK_URL" >> "$GITHUB_STEP_SUMMARY"
          elif [[ "${{ steps.canary.outcome }}" == "failure" ]]; then
            echo "- Alerting: webhook not configured (set MLOPS_SLACK_WEBHOOK_URL)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish canary summary
        if: always()
        run: |
          echo "## MLOps Domain Canary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Strict mode: $MLOPS_CANARY_STRICT" >> "$GITHUB_STEP_SUMMARY"
          echo "- Step outcome: ${{ steps.canary.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f tools/mlops/domain-canary/${{ github.run_id }}/domain-canary.json ]; then
            node -e '
              const fs = require("fs");
              const p = "tools/mlops/domain-canary/${{ github.run_id }}/domain-canary.json";
              const d = JSON.parse(fs.readFileSync(p, "utf8"));
              const lines = [];
              lines.push(`- Endpoint: ${d.endpoint || "n/a"}`);
              lines.push(`- Status: ${d.status || "unknown"}`);
              lines.push(`- Passed: ${d.passedCount ?? 0}`);
              lines.push(`- Failed: ${d.failedCount ?? 0}`);
              for (const item of d.domains || []) {
                lines.push(`- ${item.domain}: ${item.ok ? "pass" : "fail"} (${item.reason || "n/a"}, ${item.latencyMs || 0}ms)`);
              }
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
            '
          else
            echo "- No canary artifact produced" >> "$GITHUB_STEP_SUMMARY"
          fi
