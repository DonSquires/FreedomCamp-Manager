name: Ops - Lighthouse Performance Budget Gate

# Proactive UX quality gate — runs on every PR and main push.
# Builds the app, serves it with vite preview, and enforces Lighthouse CLS/LCP budgets.
# Failing budgets downgrade to warnings on PRs (advisory) but block push to main.

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'index.html'
      - 'vite.config.*'
      - 'tailwind.config.*'
      - 'package.json'
      - 'bun.lock'
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      advisory_only:
        description: Run in advisory mode (warn instead of fail) regardless of branch
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  pull-requests: write

jobs:
  lighthouse:
    name: Lighthouse CI – Performance Budget
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build production bundle
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
        run: bun run build

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.14.x

      - name: Start vite preview server
        id: preview
        run: |
          # Start preview in background and wait for it to be ready
          bun run preview --port 4173 &
          echo "preview_pid=$!" >> "$GITHUB_OUTPUT"
          # Poll until the server responds or 30 s timeout
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4173 -o /dev/null; then
              echo "Preview server ready after ${i}s"
              break
            fi
            sleep 1
          done

      - name: Run Lighthouse CI
        id: lhci
        continue-on-error: true
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN || '' }}
        run: |
          lhci autorun \
            --upload.target=temporary-public-storage \
            --collect.url=http://localhost:4173 \
            --collect.numberOfRuns=2 \
            --assert.preset=lighthouse:no-pwa \
            --assert.assertions.cumulative-layout-shift=warn,0.1 \
            --assert.assertions.largest-contentful-paint=warn,3000 \
            --assert.assertions.first-contentful-paint=warn,2000 \
            --assert.assertions.total-blocking-time=warn,300 \
            --assert.assertions.speed-index=warn,4000 2>&1 | tee /tmp/lhci-output.txt
          echo "lhci_exit=$?" >> "$GITHUB_OUTPUT"

      - name: Stop preview server
        if: always()
        run: kill "${{ steps.preview.outputs.preview_pid }}" 2>/dev/null || true

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report-${{ github.run_id }}
          path: |
            .lighthouseci/
            /tmp/lhci-output.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Evaluate budget result
        id: budget
        run: |
          exit_code="${{ steps.lhci.outputs.lhci_exit }}"
          advisory="${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.advisory_only == 'true') }}"
          if [ "$exit_code" != "0" ]; then
            echo "::warning::Lighthouse budget violations detected (exit $exit_code). Review .lighthouseci/ artifact."
            if [ "$advisory" = "true" ]; then
              echo "Running in advisory mode on PR – pipeline continues."
              exit 0
            fi
            # Strict on push to main
            echo "::error::Lighthouse budget failure is blocking this push to main. Fix CLS/LCP regressions before merging."
            exit 1
          fi
          echo "All Lighthouse budgets passed."
