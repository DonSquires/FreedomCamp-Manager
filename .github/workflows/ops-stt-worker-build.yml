name: Build & Push STT Worker (RunPod fallback image)

# NOTE: The primary STT service is now railway-stt/ on Railway (CPU, distil-small.en).
# This workflow builds the GHCR image for the RunPod serverless endpoint which is
# kept as a GPU fallback when Railway STT is unavailable.
# Primary deployment is handled by: .github/workflows/deploy-railway-stt.yml

on:
  push:
    branches: [main]
    paths:
      - "runpod-stt-worker/**"
      - "railway-stt/**"
  workflow_dispatch:
    inputs:
      whisper_model:
        description: "Faster-Whisper model to bake in (e.g. distil-large-v3)"
        default: "distil-large-v3"
        required: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/freedomcamp-manager-stt

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine model arg
        id: model
        run: |
          MODEL="${{ github.event.inputs.whisper_model || 'distil-large-v3' }}"
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./runpod-stt-worker
          push: true
          build-args: |
            WHISPER_MODEL=${{ steps.model.outputs.model }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
