name: Verify Historical Records In Production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-historical-records.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUPABASE_BASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Validate secrets
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_BASE_URL:-}" ]; then
            echo "❌ Missing SUPABASE base URL secret (VITE_SUPABASE_URL or SUPABASE_URL)"
            exit 1
          fi
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "❌ Missing SUPABASE_SERVICE_ROLE_KEY in GitHub secrets"
            exit 1
          fi
          echo "✅ Required secrets available"

      - name: Verify tables and expected records
        run: |
          set -euo pipefail
          BASE="$SUPABASE_BASE_URL/rest/v1"
          AUTH="$SUPABASE_SERVICE_ROLE_KEY"

          query() {
            local label="$1"
            local path="$2"
            echo "\n=== $label ==="
            local code
            code=$(curl -sS -o /tmp/q.json -w "%{http_code}" "$BASE/$path" \
              -H "apikey: $AUTH" \
              -H "Authorization: Bearer $AUTH" \
              -H "Prefer: count=exact")
            echo "status=$code"
            cat /tmp/q.json | head -c 1200
            echo
            if [ "$code" -ge 400 ]; then
              echo "❌ Query failed for $label"
              exit 1
            fi
          }

          # 1) Patrol fallback zones expected from Bob setup execution path
          query "Patrol fallback zones" "zones?select=id,name,organization_id,created_at&or=(name.ilike.*587%20Nelson%20patrol*,name.ilike.*586%20Richmond%20patrol*,name.ilike.*583%20Motueka%20patrol*,name.ilike.*585%20Day%20shift%20patrol*)&order=created_at.desc&limit=50"

          # 2) Sites likely created from setup drafts
          query "Client sites with likely blueprint names" "client_sites?select=id,name,organization_id,created_at,notes&or=(name.ilike.*Civic%20House*,name.ilike.*Saxton%20Field*,name.ilike.*Trafalgar%20Centre*,name.ilike.*Refinery*)&order=created_at.desc&limit=50"

          # 3) Patrol schedules generated by Bob execute path
          query "Bob-generated patrol records" "patrols?select=id,description,status,organization_id,created_at,zone_id&or=(description.ilike.*Bob%20autonomous%20patrol%20setup*,description.ilike.*patrol%20setup*)&order=created_at.desc&limit=50"

          # 4) Historical dispatch marker rows from examples used in this workstream
          query "Dispatch jobs by known dispatch numbers" "dispatch_jobs?select=*&or=(despatch_no.eq.58184481,despatch_no.eq.58188644,despatch_no.eq.58196068)&order=created_at.desc&limit=50"

          # 5) Incident records linked to same historical identifiers (if mapped to incidents)
          query "Incidents containing known dispatch numbers" "incidents?select=id,title,description,organization_id,created_at&or=(description.ilike.*58184481*,description.ilike.*58188644*,description.ilike.*58196068*)&order=created_at.desc&limit=50"

          echo "\n✅ Historical verification queries completed"
