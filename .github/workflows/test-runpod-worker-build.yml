name: Test RunPod Worker Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "runpod-worker/**"
      - ".github/workflows/test-runpod-worker-build.yml"

jobs:
  build-test:
    name: Build runpod-worker image (no push)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for validation
        uses: docker/build-push-action@v5
        with:
          context: ./runpod-worker
          file: ./runpod-worker/Dockerfile
          push: false
          pull: true
          no-cache: true
          provenance: false
          tags: freedomcamp-manager-ai:test
