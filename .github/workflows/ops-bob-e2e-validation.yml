name: ops-bob-e2e-validation

on:
  workflow_dispatch:
    inputs:
      run_map_primary_render:
        description: Run map primary render visual spec
        required: false
        default: 'true'
      manual_branch_name:
        description: Branch/org label for manual map flow
        required: false
        default: Ashburton - First Security

jobs:
  visual-and-manual-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PLAYWRIGHT_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      PLAYWRIGHT_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      PLAYWRIGHT_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PLAYWRIGHT_MASTER_EMAIL: ${{ secrets.PLAYWRIGHT_MASTER_EMAIL }}
      PLAYWRIGHT_MASTER_PASSWORD: ${{ secrets.PLAYWRIGHT_MASTER_PASSWORD }}
      TEST_OWNER_EMAIL: ${{ secrets.PLAYWRIGHT_MASTER_EMAIL }}
      TEST_OWNER_PASSWORD: ${{ secrets.PLAYWRIGHT_MASTER_PASSWORD }}
      API_TEST_EMAIL: ${{ secrets.PLAYWRIGHT_MASTER_EMAIL }}
      API_TEST_PASSWORD: ${{ secrets.PLAYWRIGHT_MASTER_PASSWORD }}
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
      PLAYWRIGHT_MANUAL_BRANCH: ${{ github.event.inputs.manual_branch_name || 'Ashburton - First Security' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Seed E2E personas
        run: |
          mkdir -p .runtime
          node scripts/seed-e2e-personas.mjs --out .runtime/e2e-seeded.env
          cat .runtime/e2e-seeded.env >> "$GITHUB_ENV"

      - name: Build
        run: npm run -s build

      - name: Lint
        run: npm run -s lint

      - name: Strict persona preflight
        run: npm run -s e2e:persona:preflight

      - name: API/manual no-browser contracts
        run: npm run -s e2e:api-contracts:no-browser

      - name: Role-map no-browser audit
        run: npm run -s e2e:role-map:no-browser

      - name: Role matrix smoke (visual)
        run: npx playwright test tests/e2e/role-matrix-smoke.spec.ts --project=chromium --workers=1 --reporter=line

      - name: Map primary render (visual)
        if: ${{ github.event.inputs.run_map_primary_render != 'false' }}
        env:
          PLAYWRIGHT_ENABLE_MANUAL_SEED: '1'
        run: npx playwright test tests/e2e/map-primary-render.spec.ts --project=chromium --workers=1 --reporter=line

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
            data/e2e-test-results
          if-no-files-found: warn
