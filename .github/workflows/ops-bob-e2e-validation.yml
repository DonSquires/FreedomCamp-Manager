name: Ops Bob E2E Validation Gate

on:
  schedule:
    # Run daily at 2 AM NZ time (14:00 UTC previous day)
    - cron: '0 14 * * *'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      test_pattern:
        description: 'E2E test pattern (e.g., session-inactivity, *.spec.ts)'
        required: false
        default: '*.spec.ts'
      pr_number:
        description: 'Optional PR number to post results into'
        required: false
        default: ''
      report_findings:
        description: 'Report findings to escalation queue'
        type: boolean
        required: false
        default: true
      auto_amend_manual:
        description: 'Automatically amend INSTRUCTION_MANUAL.md if feature missing'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  e2e-validation:
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, 'run simulation sweep against manuals'))
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Resolve execution context
        id: context
        uses: actions/github-script@v9
        with:
          script: |
            let checkoutRef = context.sha
            let prNumber = ''

            if (context.eventName === 'pull_request') {
              checkoutRef = context.payload.pull_request.head.sha
              prNumber = String(context.payload.pull_request.number)
            } else if (context.eventName === 'issue_comment') {
              const issue = context.payload.issue
              if (!issue || !issue.pull_request) {
                core.setFailed('Comment trigger was not on a pull request.')
                return
              }

              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: issue.number,
              })

              checkoutRef = pr.head.sha
              prNumber = String(pr.number)
            } else if (context.eventName === 'workflow_dispatch') {
              const manualPr = context.payload.inputs?.pr_number || ''
              if (manualPr) {
                prNumber = String(manualPr)
              }
            }

            core.setOutput('checkout_ref', checkoutRef)
            core.setOutput('pr_number', prNumber)

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.context.outputs.checkout_ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests with reporting
        env:
          TEST_PATTERN: ${{ inputs.test_pattern || '*.spec.ts' }}
          REPORT_FINDINGS: ${{ inputs.report_findings }}
          AUTO_AMEND_MANUAL: ${{ inputs.auto_amend_manual || 'false' }}
        run: |
          # Ensure output directory exists
          mkdir -p data/e2e-test-results
          # Run E2E tests and capture JSON results via env var (--output-file is not valid for the json reporter)
          PLAYWRIGHT_JSON_OUTPUT_NAME=data/e2e-test-results/playwright-raw.json \
          npx playwright test tests/e2e/$TEST_PATTERN \
            --reporter=json \
            --reporter=html \
            --reporter=list || true

      - name: Process E2E results and create escalations
        if: always()
        env:
          REPORT_FINDINGS: ${{ inputs.report_findings }}
          AUTO_AMEND_MANUAL: ${{ inputs.auto_amend_manual || 'false' }}
          TEST_PATTERN: ${{ inputs.test_pattern || '*.spec.ts' }}
        run: |
          node scripts/e2e-escalation-processor.mjs \
            --results-file=data/e2e-test-results/playwright-raw.json \
            --test-pattern=$TEST_PATTERN \
            --report-to-bob=$REPORT_FINDINGS \
            --auto-amend-manual=$AUTO_AMEND_MANUAL

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-validation-results-${{ github.run_id }}
          path: |
            data/e2e-test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Create escalation PR if needed
        if: always() && inputs.report_findings == true
        env:
          TEST_PATTERN: ${{ inputs.test_pattern || '*.spec.ts' }}
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs')
            const path = require('path')

            // Derive escalation filename the same way the processor does
            const testPattern = process.env.TEST_PATTERN || '*.spec.ts'
            const safePattern = testPattern.replace(/[*/?]/g, '')
            const escalationPath = path.join(
              process.cwd(),
              'data',
              `e2e-test-escalation-${safePattern}.json`
            )

            if (!fs.existsSync(escalationPath)) {
              core.info('No escalation found; E2E tests passed.')
              return
            }

            const escalation = JSON.parse(fs.readFileSync(escalationPath, 'utf8'))

            // Create or update GitHub issue for escalation
            const title = `E2E Test Escalation: ${escalation.summary || 'Manual discrepancy detected'}`
            const body = [
              `## E2E Validation Escalation`,
              '',
              `**Run**: [${github.run_id}](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${github.run_id})`,
              `**Test Pattern**: ${escalation.testPattern || 'all'}`,
              `**Timestamp**: ${escalation.timestamp}`,
              '',
              `### Finding`,
              `${escalation.summary}`,
              '',
              `### Diagnostic Output`,
              '```json',
              JSON.stringify(escalation, null, 2),
              '```',
              '',
              `### Next Steps`,
              '1. Review test results in artifacts',
              '2. Decide: implement missing feature OR amend manual',
              '3. Create feature ticket if needed',
              '4. Update INSTRUCTION_MANUAL.md if specs differ',
              '',
              `### Artifacts`,
              `- Test Results: [playwright-report/index.html](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${github.run_id})`,
              `- Raw Results: [data/e2e-test-results/](https://github.com/${context.repo.owner}/${context.repo.repo}/tree/feat/costing-surface-fresh/data/e2e-test-results)`,
            ].join('\n')

            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['e2e-validation', 'ops', 'automation', 'escalation'],
            })

            core.info(`Created escalation issue: ${issue.html_url}`)

      - name: Summarize results
        if: always()
        run: |
          echo "## E2E Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f data/e2e-test-results/summary.md ]; then
            cat data/e2e-test-results/summary.md >> $GITHUB_STEP_SUMMARY
          else
            echo "See uploaded artifacts for test results." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Post PR alignment summary
        if: always() && steps.context.outputs.pr_number != ''
        env:
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs')
            const prNumber = Number(process.env.PR_NUMBER)

            if (!Number.isFinite(prNumber) || prNumber <= 0) {
              core.info('No valid PR number found; skipping PR comment.')
              return
            }

            let summary = 'See workflow summary and uploaded artifacts for details.'
            const summaryPath = 'data/e2e-test-results/summary.md'
            if (fs.existsSync(summaryPath)) {
              summary = fs.readFileSync(summaryPath, 'utf8').trim()
              if (!summary) {
                summary = 'Summary file was empty. See workflow artifacts for details.'
              }
            }

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const body = [
              '## Bob Simulation Sweep Report',
              '',
              summary,
              '',
              `Run: ${runUrl}`,
            ].join('\n')

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            })
