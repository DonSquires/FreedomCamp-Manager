name: CI Phase B2 Dispatch Gate

# Path-filtered gate that runs whenever the B2 dispatch E2E spec,
# its migration, the dispatch B2 hook, or the workflow file changes.

on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/e2e/phase-b2-dispatch-command.spec.ts'
      - 'supabase/migrations/20260506000002_phase_b2_dispatch_case_bridge.sql'
      - 'src/hooks/useDispatchB2.ts'
      - 'tests/e2e/setup.ts'
      - 'playwright.api.config.ts'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/ci-phase-b2-dispatch-gate.yml'
  push:
    branches: [main]
    paths:
      - 'tests/e2e/phase-b2-dispatch-command.spec.ts'
      - 'supabase/migrations/20260506000002_phase_b2_dispatch_case_bridge.sql'
      - 'src/hooks/useDispatchB2.ts'
      - 'tests/e2e/setup.ts'
      - 'playwright.api.config.ts'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/ci-phase-b2-dispatch-gate.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  phase-b2-dispatch-gate:
    name: Phase B2 Dispatch and Command Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    env:
      VITE_SUPABASE_URL:         ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY:    ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Phase B2 dispatch and command gate suite
        run: |
          bunx playwright test \
            tests/e2e/phase-b2-dispatch-command.spec.ts \
            --config=playwright.api.config.ts \
            --reporter=list

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase-b2-dispatch-gate-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
