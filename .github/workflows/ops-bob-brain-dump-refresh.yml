name: Bob Brain Dump Refresh

on:
  schedule:
    # Daily at 01:00 UTC — keeps brain dump current before work sessions
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      max_bytes:
        description: 'Max output bytes (default: 30MB)'
        required: false
        default: ''

jobs:
  brain-dump-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate brain dump
        env:
          BOB_BRAIN_DUMP_MAX_BYTES: ${{ inputs.max_bytes || '31457280' }}
        run: node scripts/auto-ingest.mjs

      - name: Verify brain dump size is within VSCode sync limit (50 MB)
        run: |
          size=$(stat -c%s docs/BOB_BRAIN_DUMP.md 2>/dev/null || echo 0)
          echo "Brain dump size: ${size} bytes"
          if [ "$size" -gt 52428800 ]; then
            echo "ERROR: docs/BOB_BRAIN_DUMP.md exceeds 50 MB VSCode sync limit (${size} bytes)"
            exit 1
          fi

      - name: Verify training wiring
        run: node scripts/verify-bob-training-wiring.mjs --non-strict 2>/dev/null || echo "[training-wiring] script not available, skipping"

      - name: Run failure summary scan
        run: node scripts/summarize-failures.mjs

      - name: Commit refreshed artifacts
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore(bob): refresh brain dump and failure summary [skip ci]"
          file_pattern: |
            docs/BOB_BRAIN_DUMP.md
            docs/BOB_FAILURE_SUMMARY.md
            data/bob-failure-summary.json
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
