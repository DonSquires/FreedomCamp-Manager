name: CI Phase E3 Communications Audit Retry Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/e2e/phase-e3-communications-audit-retry.spec.ts'
      - 'src/pages/NotificationsCenter.tsx'
      - 'src/hooks/useNotifications.ts'
      - 'src/hooks/useOfficerNotifications.ts'
      - 'src/lib/edgeFunctions.ts'
      - 'src/lib/pushNotifications.ts'
      - 'supabase/functions/send-push-notification/index.ts'
      - 'supabase/functions/send-report-email/index.ts'
      - 'supabase/functions/send-invite-email/index.ts'
      - 'supabase/functions/_shared/fetchWithRetry.ts'
      - 'supabase/migrations/20260506000001_platform_enhancements_complete.sql'
      - 'docs/BUILD_REALIGNMENT_PLAN_2026-05-04.md'
      - 'docs/MODULE_ROADMAP.md'
      - 'docs/STAGING.md'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/ci-phase-e3-communications-audit-retry-gate.yml'
  push:
    branches: [main]
    paths:
      - 'tests/e2e/phase-e3-communications-audit-retry.spec.ts'
      - 'src/pages/NotificationsCenter.tsx'
      - 'src/hooks/useNotifications.ts'
      - 'src/hooks/useOfficerNotifications.ts'
      - 'src/lib/edgeFunctions.ts'
      - 'src/lib/pushNotifications.ts'
      - 'supabase/functions/send-push-notification/index.ts'
      - 'supabase/functions/send-report-email/index.ts'
      - 'supabase/functions/send-invite-email/index.ts'
      - 'supabase/functions/_shared/fetchWithRetry.ts'
      - 'supabase/migrations/20260506000001_platform_enhancements_complete.sql'
      - 'docs/BUILD_REALIGNMENT_PLAN_2026-05-04.md'
      - 'docs/MODULE_ROADMAP.md'
      - 'docs/STAGING.md'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/ci-phase-e3-communications-audit-retry-gate.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  phase-e3-communications-audit-retry-gate:
    name: Phase E3 Communications Audit Retry Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Phase E3 communications audit retry gate suite
        run: |
          bunx playwright test \
            tests/e2e/phase-e3-communications-audit-retry.spec.ts \
            --reporter=list
