name: Ops Bob Pretrain On Push

on:
  push:
    branches: [main]
    paths:
      - 'inference-service/.pretrain-trigger'
      - '.github/workflows/ops-bob-pretrain-on-push.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  pretrain:
    name: Trigger Bob Runtime Pretrain
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Normalize Bob runtime endpoint and auth key
        run: |
          set -euo pipefail
          BASE_URL="${BOB_SERVICE_URL:-${INFERENCE_SERVICE_URL:-}}"
          API_KEY="${BOB_INFERENCE_API_KEY:-${INFERENCE_API_KEY:-}}"

          echo "INFERENCE_SERVICE_URL=$BASE_URL" >> "$GITHUB_ENV"
          echo "INFERENCE_API_KEY=$API_KEY" >> "$GITHUB_ENV"
        env:
          INFERENCE_SERVICE_URL: ${{ secrets.INFERENCE_SERVICE_URL }}
          BOB_SERVICE_URL: ${{ secrets.BOB_SERVICE_URL }}
          INFERENCE_API_KEY: ${{ secrets.INFERENCE_API_KEY }}
          BOB_INFERENCE_API_KEY: ${{ secrets.BOB_INFERENCE_API_KEY }}

      - name: Validate required secrets
        run: |
          set -euo pipefail
          missing=""
          [ -z "${INFERENCE_SERVICE_URL:-}" ] && missing="$missing INFERENCE_SERVICE_URL"
          [ -z "${INFERENCE_API_KEY:-}" ] && missing="$missing INFERENCE_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing"
            exit 1
          fi
        env:
          INFERENCE_SERVICE_URL: ${{ env.INFERENCE_SERVICE_URL }}
          INFERENCE_API_KEY: ${{ env.INFERENCE_API_KEY }}

      - name: Trigger /learn/pretrain
        env:
          INFERENCE_SERVICE_URL: ${{ env.INFERENCE_SERVICE_URL }}
          INFERENCE_API_KEY: ${{ env.INFERENCE_API_KEY }}
          RUNPOD_ENDPOINT_ID: ${{ secrets.RUNPOD_ENDPOINT_ID }}
          RUNPOD_ENDPOINT_API_KEY: ${{ secrets.RUNPOD_ENDPOINT_API_KEY }}
          PRETRAIN_PROFILE: ${{ vars.SELF_LEARNING_PRETRAIN_PROFILE }}
          PRETRAIN_MULTIPLIER: ${{ vars.SELF_LEARNING_PRETRAIN_MULTIPLIER }}
        run: |
          set -euo pipefail
          PROFILE="${PRETRAIN_PROFILE:-nz-enforcement-v1}"
          MULTIPLIER="${PRETRAIN_MULTIPLIER:-8}"
          BASE_URL="${INFERENCE_SERVICE_URL%/}"
          if [[ "$BASE_URL" != http://* && "$BASE_URL" != https://* ]]; then
            BASE_URL="https://$BASE_URL"
          fi

          HTTP_STATUS=$(curl -sS -o /tmp/pretrain-response.json -w "%{http_code}" \
            -L \
            --max-time 45 \
            -X POST "${BASE_URL}/learn/pretrain" \
            -H "Content-Type: application/json" \
            -H "x-inference-api-key: ${INFERENCE_API_KEY}" \
            -d "{\"profile\":\"${PROFILE}\",\"multiplier\":${MULTIPLIER}}")

          cat /tmp/pretrain-response.json

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Bob runtime pretrain completed"
            exit 0
          fi

          # Fallback: use RunPod serverless endpoint directly with correct API key
          if [ -n "${RUNPOD_ENDPOINT_ID:-}" ] && [ -n "${RUNPOD_ENDPOINT_API_KEY:-}" ]; then
            RUNSYNC_URL="https://api.runpod.ai/v2/${RUNPOD_ENDPOINT_ID}/runsync"
            NOTE="Pretrain trigger profile=${PROFILE} multiplier=${MULTIPLIER}. Use the latest training_memory.json bundle in this worker deployment."

            HTTP_STATUS=$(curl -sS -o /tmp/pretrain-response.json -w "%{http_code}" \
              -L \
              --max-time 60 \
              -X POST "${RUNSYNC_URL}" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${RUNPOD_ENDPOINT_API_KEY}" \
              -d "{\"input\":{\"action\":\"training_note\",\"message\":\"${NOTE}\"}}")

            cat /tmp/pretrain-response.json

            if [ "$HTTP_STATUS" = "200" ]; then
              echo "✅ Bob serverless training note accepted"
              exit 0
            fi

            echo "::warning::Serverless training fallback HTTP $HTTP_STATUS — recording as non-fatal"
            exit 0
          fi

          echo "::warning::Pretrain trigger HTTP $HTTP_STATUS and no RUNPOD_ENDPOINT_ID fallback — skipping non-fatal"
          exit 0
