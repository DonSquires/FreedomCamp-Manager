name: Ops Bob Pretrain On Push

on:
  push:
    branches: [main]
    paths:
      - 'inference-service/.pretrain-trigger'
      - '.github/workflows/ops-bob-pretrain-on-push.yml'
  workflow_dispatch:

jobs:
  pretrain:
    name: Trigger Bob Runtime Pretrain
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Normalize Bob runtime endpoint and auth key
        run: |
          set -euo pipefail
          BASE_URL="${INFERENCE_SERVICE_URL:-${BOB_SERVICE_URL:-}}"
          API_KEY="${INFERENCE_API_KEY:-${BOB_INFERENCE_API_KEY:-}}"

          echo "INFERENCE_SERVICE_URL=$BASE_URL" >> "$GITHUB_ENV"
          echo "INFERENCE_API_KEY=$API_KEY" >> "$GITHUB_ENV"
        env:
          INFERENCE_SERVICE_URL: ${{ secrets.INFERENCE_SERVICE_URL }}
          BOB_SERVICE_URL: ${{ secrets.BOB_SERVICE_URL }}
          INFERENCE_API_KEY: ${{ secrets.INFERENCE_API_KEY }}
          BOB_INFERENCE_API_KEY: ${{ secrets.BOB_INFERENCE_API_KEY }}

      - name: Validate required secrets
        run: |
          set -euo pipefail
          missing=""
          [ -z "${INFERENCE_SERVICE_URL:-}" ] && missing="$missing INFERENCE_SERVICE_URL"
          [ -z "${INFERENCE_API_KEY:-}" ] && missing="$missing INFERENCE_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing"
            exit 1
          fi
        env:
          INFERENCE_SERVICE_URL: ${{ env.INFERENCE_SERVICE_URL }}
          INFERENCE_API_KEY: ${{ env.INFERENCE_API_KEY }}

      - name: Trigger /learn/pretrain
        env:
          INFERENCE_SERVICE_URL: ${{ env.INFERENCE_SERVICE_URL }}
          INFERENCE_API_KEY: ${{ env.INFERENCE_API_KEY }}
          PRETRAIN_PROFILE: ${{ vars.SELF_LEARNING_PRETRAIN_PROFILE }}
          PRETRAIN_MULTIPLIER: ${{ vars.SELF_LEARNING_PRETRAIN_MULTIPLIER }}
        run: |
          set -euo pipefail
          PROFILE="${PRETRAIN_PROFILE:-nz-enforcement-v1}"
          MULTIPLIER="${PRETRAIN_MULTIPLIER:-8}"
          BASE_URL="${INFERENCE_SERVICE_URL%/}"
          if [[ "$BASE_URL" != http://* && "$BASE_URL" != https://* ]]; then
            BASE_URL="https://$BASE_URL"
          fi

          HTTP_STATUS=$(curl -sS -o /tmp/pretrain-response.json -w "%{http_code}" \
            -L \
            --max-time 45 \
            -X POST "${BASE_URL}/learn/pretrain" \
            -H "Content-Type: application/json" \
            -H "x-inference-api-key: ${INFERENCE_API_KEY}" \
            -d "{\"profile\":\"${PROFILE}\",\"multiplier\":${MULTIPLIER}}")

          cat /tmp/pretrain-response.json

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Pretrain trigger failed with HTTP $HTTP_STATUS"
            exit 1
          fi

          echo "✅ Bob runtime pretrain completed"
