name: Ops — Generate Android Keystore

# Generates an Android signing keystore and uploads it as a GitHub Actions artifact.
# The artifact is available for 1 day — download and store the keystore securely;
# do NOT leave it in artifact storage long-term.
#
# After generating, encode the keystore and add it as ANDROID_KEYSTORE_BASE64:
#   base64 android.keystore | tr -d '\n'
#
# No secrets required (keytool is available on all GitHub-hosted runners).

on:
  workflow_dispatch:
    inputs:
      keystore_password:
        description: 'Keystore password (required)'
        required: true
        type: string
      key_alias:
        description: 'Key alias'
        required: false
        default: 'fieldops'
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate-keystore:
    name: Generate Android Keystore
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Generate Keystore
        run: |
          keytool -genkey -v \
            -keystore android.keystore \
            -alias "${{ github.event.inputs.key_alias }}" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "${{ github.event.inputs.keystore_password }}" \
            -keypass  "${{ github.event.inputs.keystore_password }}" \
            -dname "CN=FieldOps, OU=App, O=FieldOps, L=City, S=State, C=US"

      - name: Convert to Base64
        run: |
          base64 android.keystore | tr -d '\n' > keystore-base64.txt
          echo ""
          echo "✅ Keystore generated."
          echo "   Add the contents of keystore-base64.txt as the ANDROID_KEYSTORE_BASE64 secret."

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-keystore-${{ github.run_id }}
          path: |
            android.keystore
            keystore-base64.txt
          retention-days: 1
