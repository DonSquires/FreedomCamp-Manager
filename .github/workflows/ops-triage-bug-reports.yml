name: Triage Bug Reports – Auto-fix or Human Review

# Reads AI-analysed bug reports (status = investigating) and routes them:
#
#   Non-design bugs  → create GitHub issue + assign to @copilot for automatic fixing
#                       → set status = in_progress, requires_human_review = false
#                         (unless Bob's risk score >= 7, then requires_human_review = true)
#
#   Design changes   → create GitHub issue with design-review label for human triage
#   (feature_request,  → status stays at investigating, requires_human_review = true
#    enhancement,
#    ui_ux)
#
# Also processes legacy reports stuck at in_progress that have no github_issue_url
# (created before this workflow existed).
#
# The workflow is idempotent: any report whose ai_analysis->github_issue_url is
# already set is skipped.

on:
  schedule:
    # Every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      max_reports:
        description: 'Maximum reports to process per run (1-50)'
        required: false
        default: '20'
      dry_run:
        description: 'Dry run – inspect without creating issues or updating DB'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  issues: write

jobs:
  triage:
    name: Triage analysed bug reports
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Validate required secrets
        id: validate-secrets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          missing=""
          [ -z "$VITE_SUPABASE_URL" ] && missing="$missing VITE_SUPABASE_URL"
          [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] && missing="$missing SUPABASE_SERVICE_ROLE_KEY"
          if [ -n "$missing" ]; then
            echo "::warning::Missing secret(s):$missing — skipping triage."
            echo "can_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "can_run=true" >> "$GITHUB_OUTPUT"

      - name: Route and create GitHub issues
        if: steps.validate-secrets.outputs.can_run == 'true'
        uses: actions/github-script@v9
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INPUT_MAX_REPORTS: ${{ github.event.inputs.max_reports }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const supabaseUrl = (process.env.VITE_SUPABASE_URL || '').replace(/\/+$/, '')
            const serviceKey  = process.env.SUPABASE_SERVICE_ROLE_KEY
            const maxReports  = Math.max(1, Math.min(50, parseInt(process.env.INPUT_MAX_REPORTS || '20', 10)))
            const dryRun      = process.env.INPUT_DRY_RUN === 'true'
            const [repoOwner, repoName] = (process.env.GITHUB_REPOSITORY || '/').split('/')

            // Issue types that should not be auto-assigned to Copilot — they need
            // a human product decision before any code is written.
            const DESIGN_TYPES = new Set(['feature_request', 'enhancement', 'ui_ux'])

            if (dryRun) core.info('🔍 DRY RUN MODE — no issues will be created, no DB updates will be made')

            // ── Fetch candidate reports ───────────────────────────────────────────
            const fields = [
              'id', 'title', 'description', 'severity', 'issue_type', 'status',
              'ai_analyzed', 'ai_suggested_fix', 'ai_analysis',
              'current_page', 'user_role', 'steps_to_reproduce',
              'expected_behavior', 'actual_behavior', 'created_at',
            ].join(',')

            const fetchUrl = `${supabaseUrl}/rest/v1/bug_reports` +
              `?select=${fields}` +
              `&status=in.(investigating,in_progress)` +
              `&ai_analyzed=eq.true` +
              `&order=created_at.asc` +
              `&limit=${maxReports}`

            const fetchResp = await fetch(fetchUrl, {
              headers: {
                apikey: serviceKey,
                Authorization: `Bearer ${serviceKey}`,
                Accept: 'application/json',
              },
            })

            if (!fetchResp.ok) {
              core.setFailed(`Failed to fetch bug reports from Supabase: HTTP ${fetchResp.status}`)
              return
            }

            const allReports = await fetchResp.json()
            core.info(`Fetched ${allReports.length} AI-analysed report(s)`)

            // Skip any report that already has an issue URL
            const toProcess = allReports.filter(r => !r.ai_analysis?.github_issue_url)
            if (toProcess.length === 0) {
              core.info('✅ All analysed reports already have GitHub issues — nothing to do.')
              await core.summary.addRaw('## Bug Report Triage\n\nAll analysed reports already have GitHub issues.').write()
              return
            }

            core.info(`${toProcess.length} report(s) to process`)

            // ── Ensure labels exist ───────────────────────────────────────────────
            const ALL_LABELS = [
              { name: 'auto-triage',     color: '0075ca', description: 'Automatically triaged by Bob self-healing system' },
              { name: 'bug-report',      color: 'e11d48', description: 'Linked to a user-submitted bug report' },
              { name: 'design-review',   color: 'bfd4f2', description: 'Design change awaiting human product review' },
              { name: 'severity: critical', color: 'd93f0b', description: 'Critical severity bug report' },
              { name: 'severity: high',     color: 'e4e669', description: 'High severity bug report' },
              { name: 'severity: medium',   color: 'fef2c0', description: 'Medium severity bug report' },
              { name: 'severity: low',      color: 'c2e0c6', description: 'Low severity bug report' },
            ]

            async function ensureLabel(labelDef) {
              try {
                await github.rest.issues.getLabel({ owner: repoOwner, repo: repoName, name: labelDef.name })
              } catch {
                try {
                  await github.rest.issues.createLabel({ owner: repoOwner, repo: repoName, ...labelDef })
                } catch { /* exists or insufficient permissions */ }
              }
            }

            if (!dryRun) {
              for (const l of ALL_LABELS) await ensureLabel(l)
            }

            // ── Process each report ───────────────────────────────────────────────
            let autoFixed  = 0   // non-design → assigned to Copilot
            let humanQueue = 0   // design changes → queued for human review
            let linked     = 0   // existing issue found and linked
            let failed     = 0

            for (const report of toProcess) {
              const sev        = (report.severity || 'medium').toLowerCase()
              const issueType  = (report.issue_type || 'bug').toLowerCase()
              const isDesign   = DESIGN_TYPES.has(issueType) || Boolean(report.ai_analysis?.design_change)
              const isLowLiveSession = sev === 'low' && /^Live session diagnostics\b/i.test(String(report.title || ''))
              const shortId    = report.id.slice(0, 8)
              const issueTitle = `[Bug Report #${shortId}] ${report.title || 'Untitled'} [${sev}]`

              core.info(`Processing ${report.id} | type=${issueType} | design=${isDesign} | sev=${sev}`)

              // Low-severity live-session diagnostics are high-volume telemetry.
              // Keep them in Supabase but suppress GitHub issue fan-out.
              if (isLowLiveSession) {
                core.info(`  📉 Suppressing low-severity live-session issue fan-out for ${report.id}`)

                if (dryRun) {
                  linked++
                  continue
                }

                const suppressedAnalysis = {
                  ...(report.ai_analysis || {}),
                  triage_suppressed: true,
                  triage_suppressed_reason: 'low-severity live session diagnostics',
                  triage_suppressed_at: new Date().toISOString(),
                  github_issue_url: 'suppressed://low-severity-live-session-diagnostics',
                }

                const suppressResp = await fetch(
                  `${supabaseUrl}/rest/v1/bug_reports?id=eq.${report.id}`,
                  {
                    method: 'PATCH',
                    headers: {
                      apikey: serviceKey,
                      Authorization: `Bearer ${serviceKey}`,
                      'Content-Type': 'application/json',
                      Prefer: 'return=minimal',
                    },
                    body: JSON.stringify({
                      status: 'in_progress',
                      requires_human_review: false,
                      ai_analysis: suppressedAnalysis,
                    }),
                  }
                )

                if (!suppressResp.ok) {
                  core.warning(`  ⚠️ Failed to suppress report ${report.id} in DB (HTTP ${suppressResp.status})`)
                  failed++
                } else {
                  linked++
                }

                continue
              }

              // ── Idempotency: search for an existing open issue ────────────────
              let existingIssue = null
              try {
                const searchResp = await github.rest.search.issuesAndPullRequests({
                  q: `repo:${repoOwner}/${repoName} is:issue label:bug-report "${shortId}" in:body`,
                  per_page: 1,
                })
                if (searchResp.data.total_count > 0) existingIssue = searchResp.data.items[0]
              } catch { /* search failed — proceed to create */ }

              if (dryRun) {
                core.info(`[DRY RUN] Would ${isDesign ? 'queue for design review' : 'assign to Copilot'}: ${issueTitle}`)
                isDesign ? humanQueue++ : autoFixed++
                continue
              }

              let issueUrl    = existingIssue?.html_url ?? null
              let issueNumber = existingIssue?.number   ?? null

              if (!existingIssue) {
                // ── Build label set ───────────────────────────────────────────
                const severityLabel = `severity: ${sev}`
                const labels = [
                  'auto-triage',
                  'bug-report',
                  severityLabel,
                  ...(isDesign ? ['design-review'] : []),
                ]

                try {
                  const body = buildIssueBody(report, isDesign)
                  const issueResp = await github.rest.issues.create({
                    owner: repoOwner,
                    repo: repoName,
                    title: issueTitle,
                    body,
                    labels,
                  })
                  issueUrl    = issueResp.data.html_url
                  issueNumber = issueResp.data.number
                  core.info(`  ✅ Created issue #${issueNumber}: ${issueUrl}`)
                } catch (err) {
                  core.warning(`  ❌ Failed to create issue for ${report.id}: ${err.message}`)
                  failed++
                  continue
                }
              } else {
                core.info(`  🔗 Existing issue #${issueNumber}: ${issueUrl}`)
                linked++
              }

              // ── Assign to Copilot for non-design bugs ─────────────────────────
              if (!isDesign) {
                try {
                  await github.rest.issues.addAssignees({
                    owner: repoOwner,
                    repo: repoName,
                    issue_number: issueNumber,
                    assignees: ['copilot'],
                  })
                  core.info(`  🤖 Assigned issue #${issueNumber} to @copilot`)
                } catch (err) {
                  // Copilot may not be an assignable user in all repos; log but
                  // don't fail — the issue is still created and labelled.
                  core.warning(`  ⚠️ Could not assign to @copilot: ${err.message}`)
                }
              }

              // ── Determine new status and human-review flag ────────────────────
              // Non-design bugs move to in_progress (Copilot is working on it).
              // Design changes stay at investigating (awaiting human decision).
              const patchTask = report.ai_analysis?.github_assist_escalation?.patch_task
              const newStatus = isDesign ? 'investigating' : 'in_progress'
              const requiresHumanReview = isDesign
                ? true
                : patchTask
                  ? Boolean(patchTask.requires_human_approval)
                  : false

              // ── Persist back to Supabase ──────────────────────────────────────
              const updatedAnalysis = {
                ...(report.ai_analysis || {}),
                github_issue_url: issueUrl,
                github_issue_number: issueNumber,
                triaged_at: new Date().toISOString(),
                auto_fix_requested: !isDesign,
              }

              const patchResp = await fetch(
                `${supabaseUrl}/rest/v1/bug_reports?id=eq.${report.id}`,
                {
                  method: 'PATCH',
                  headers: {
                    apikey: serviceKey,
                    Authorization: `Bearer ${serviceKey}`,
                    'Content-Type': 'application/json',
                    Prefer: 'return=minimal',
                  },
                  body: JSON.stringify({
                    status: newStatus,
                    requires_human_review: requiresHumanReview,
                    ai_analysis: updatedAnalysis,
                  }),
                }
              )

              if (!patchResp.ok) {
                core.warning(`  ⚠️ Failed to update report ${report.id} in DB (HTTP ${patchResp.status})`)
              } else {
                core.info(`  DB: status=${newStatus}, requires_human_review=${requiresHumanReview}`)
                isDesign ? humanQueue++ : autoFixed++
              }

              // Throttle to respect GitHub API rate limits
              await new Promise(r => setTimeout(r, 500))
            }

            // ── Summary ───────────────────────────────────────────────────────────
            const summaryLines = [
              '## Bug Report Triage Summary',
              '',
              `| Metric | Count |`,
              `|--------|-------|`,
              `| Reports fetched | ${allReports.length} |`,
              `| Needed processing | ${toProcess.length} |`,
              `| 🤖 Auto-fixed (assigned to Copilot) | ${autoFixed} |`,
              `| 👤 Human review queue (design changes) | ${humanQueue} |`,
              `| 🔗 Linked to existing issues | ${linked} |`,
              `| ❌ Failed | ${failed} |`,
              dryRun ? '\n> ⚠️ **DRY RUN** — no actual changes were made.' : '',
            ]

            await core.summary.addRaw(summaryLines.join('\n')).write()

            if (failed > 0) {
              core.setFailed(`${failed} report(s) could not be processed — check warnings above.`)
            }

            // ── Issue body builder ────────────────────────────────────────────────

            function buildIssueBody(report, isDesign) {
              const sev       = (report.severity || 'medium').toUpperCase()
              const analysis  = report.ai_analysis || {}
              const escl      = analysis.github_assist_escalation || {}
              const patchTask = escl.patch_task || null
              const shortId   = report.id.slice(0, 8)

              const renderAiSuggestedFix = (value) => {
                if (value == null) return ''
                if (typeof value === 'string') return value

                if (Array.isArray(value)) {
                  const items = value
                    .map((entry) => {
                      if (typeof entry === 'string') return entry
                      try {
                        return JSON.stringify(entry)
                      } catch {
                        return String(entry)
                      }
                    })
                    .filter(Boolean)

                  return items.length > 0
                    ? items.map((entry) => `- ${entry}`).join('\n')
                    : ''
                }

                if (typeof value === 'object') {
                  const obj = value
                  const lines = []

                  if (obj.severity) lines.push(`Severity: ${obj.severity}`)
                  if (obj.bugType) lines.push(`Bug Type: ${obj.bugType}`)
                  if (obj.recommendedOwner) lines.push(`Recommended Owner: ${obj.recommendedOwner}`)
                  if (obj.summary) lines.push('', obj.summary)

                  const appendSection = (title, entries) => {
                    if (!entries) return
                    const list = Array.isArray(entries) ? entries : [entries]
                    const normalized = list
                      .map((entry) => {
                        if (typeof entry === 'string') return entry
                        if (entry && typeof entry === 'object') {
                          return entry.text || entry.title || entry.description || entry.requiredAction || JSON.stringify(entry)
                        }
                        return String(entry)
                      })
                      .filter(Boolean)
                    if (normalized.length === 0) return
                    lines.push('', `### ${title}`)
                    normalized.forEach((entry) => lines.push(`- ${entry}`))
                  }

                  appendSection('Reproduction', obj.reproduction)
                  appendSection('Remediation', obj.remediation)
                  appendSection('Safeguards', obj.safeguards)
                  appendSection('Automation', obj.automation)
                  appendSection('Notes', obj.notes)

                  if (lines.length > 0) {
                    return lines.join('\n')
                  }

                  try {
                    return `\`\`\`json\n${JSON.stringify(obj, null, 2)}\n\`\`\``
                  } catch {
                    return String(value)
                  }
                }

                return String(value)
              }

              const nzDate = (iso) => {
                try { return new Date(iso).toLocaleString('en-NZ', { timeZone: 'Pacific/Auckland' }) }
                catch { return iso }
              }

              const routingNote = isDesign
                ? '> 👤 **Design change** — this requires a human product decision before work begins.'
                : '> 🤖 **Auto-fix requested** — assigned to @copilot to attempt an automated fix.\n> Close this issue once the fix is merged and verified.'

              const lines = [
                `<!-- bug-report-id:${report.id} -->`,
                routingNote,
                `> Linked report ID: \`${report.id}\``,
                '',
                `## 📋 Report Details`,
                '',
                `| Field | Value |`,
                `|-------|-------|`,
                `| **Severity** | ${sev} |`,
                `| **Type** | ${report.issue_type || 'bug'} |`,
                `| **Page** | \`${report.current_page || 'unknown'}\` |`,
                `| **User role** | ${report.user_role || 'unknown'} |`,
                `| **Reported at** | ${nzDate(report.created_at)} (NZT) |`,
                '',
                `## 🐛 Description`,
                '',
                report.description || '_No description provided._',
                '',
              ]

              if (report.steps_to_reproduce) {
                lines.push('## 🔁 Steps to Reproduce', '', report.steps_to_reproduce, '')
              }
              if (report.expected_behavior) {
                lines.push('## ✅ Expected Behaviour', '', report.expected_behavior, '')
              }
              if (report.actual_behavior) {
                lines.push('## ❌ Actual Behaviour', '', report.actual_behavior, '')
              }

              if (report.ai_suggested_fix) {
                lines.push("## 🤖 Bob's Self-Healing Analysis", '', renderAiSuggestedFix(report.ai_suggested_fix), '')
              }

              if (patchTask && !isDesign) {
                const riskEmoji = patchTask.risk_score >= 7 ? '🔴' : patchTask.risk_score >= 4 ? '🟡' : '🟢'
                lines.push(
                  '## 🔧 Patch Checklist',
                  '',
                  `${riskEmoji} Risk score: **${patchTask.risk_score ?? 'unknown'}/10** | Requires human approval: **${patchTask.requires_human_approval ? 'Yes' : 'No'}**`,
                  '',
                  ...(Array.isArray(patchTask.tasks)
                    ? patchTask.tasks.map(t => `- [ ] ${t.title}`)
                    : ['- [ ] Reproduce issue', '- [ ] Apply minimal fix', '- [ ] Add regression test', '- [ ] Run deployment checks']),
                  '',
                )
              }

              lines.push(
                '---',
                `_Report \`${shortId}\` | Auto-triaged by Bob self-healing system._`,
              )

              return lines.join('\n')
            }

      - name: Triage skipped (secrets not configured)
        if: steps.validate-secrets.outputs.can_run != 'true'
        run: |
          echo "ℹ️ Triage skipped: VITE_SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY are not configured."
