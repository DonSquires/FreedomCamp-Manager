name: Upgrade Bob AI Model

# Pulls the best model that fits the RunPod GPU's VRAM and updates Bob's
# OLLAMA_MODEL + OLLAMA_VISION_MODEL env vars via the RunPod GraphQL API.
#
# Strategy (auto-selected by VRAM):
#   ≥ 128 GB → qwen2.5:72b   (frontier reasoning, 8-worker parallel) + llava:34b vision
#   ≥ 80 GB  → qwen2.5:72b   (frontier class reasoning) + llava:13b  vision
#   ≥ 40 GB  → llama3.3:70b  (frontier class reasoning) + llava:13b  vision
#   ≥ 20 GB  → qwen2.5:32b   (strong GPT-3.5+ reasoning) + llava:7b  vision
#   ≥ 10 GB  → mistral:22b   (solid GPT-3.5 class)       + llava:7b  vision
#   fallback → llama3.1:8b   (current)
#
# Required secrets:
#   RUNPOD_POD_SSH_HOST, RUNPOD_POD_SSH_USER, RUNPOD_POD_SSH_KEY, RUNPOD_POD_SSH_PORT
#   RUNPOD_API_KEY, RUNPOD_TEMPLATE_ID (template y53tpqxjt9)
#   BOB_GATEWAY_KEY, BOB_SERVICE_URL, INFERENCE_API_KEY

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  upgrade-model:
    name: Upgrade Bob AI model on RunPod
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # ── Step 1: Check GPU spec and pull the best model ─────────────────────
      - name: Check GPU VRAM and pull optimal model
        id: pull_model
        uses: appleboy/ssh-action@v1.2.0
        env:
          BOB_GATEWAY_KEY: ${{ secrets.BOB_GATEWAY_KEY }}
        with:
          host: ${{ secrets.RUNPOD_POD_SSH_HOST }}
          username: ${{ secrets.RUNPOD_POD_SSH_USER }}
          key: ${{ secrets.RUNPOD_POD_SSH_KEY }}
          port: ${{ secrets.RUNPOD_POD_SSH_PORT || 22 }}
          request_pty: true
          command_timeout: 80m
          envs: BOB_GATEWAY_KEY
          script: |
            set -e

            echo "====== GPU specs ======"
            nvidia-smi --query-gpu=name,memory.total --format=csv,noheader 2>/dev/null || echo "nvidia-smi unavailable"

            # Read total VRAM in MiB
            VRAM_MIB=$(nvidia-smi --query-gpu=memory.total --format=csv,noheader,nounits 2>/dev/null | head -1 | tr -d ' ' || echo "0")
            VRAM_GIB=$(( VRAM_MIB / 1024 ))
            echo "Detected VRAM: ${VRAM_MIB} MiB (${VRAM_GIB} GiB)"

            # Pick model based on VRAM
            if [ "$VRAM_GIB" -ge 128 ]; then
              # 141 GB+ pod: 8-worker setup — run frontier model with large vision and full parallelism
              CHAT_MODEL="qwen2.5:72b"
              VISION_MODEL="llava:34b"
              WRITING_MODEL="qwen2.5:72b"
              NUM_PARALLEL=8
            elif [ "$VRAM_GIB" -ge 80 ]; then
              CHAT_MODEL="qwen2.5:72b"
              VISION_MODEL="llava:13b"
              WRITING_MODEL="qwen2.5:72b"
              NUM_PARALLEL=4
            elif [ "$VRAM_GIB" -ge 40 ]; then
              CHAT_MODEL="llama3.3:70b"
              VISION_MODEL="llava:13b"
              WRITING_MODEL="llama3.3:70b"
              NUM_PARALLEL=2
            elif [ "$VRAM_GIB" -ge 20 ]; then
              CHAT_MODEL="qwen2.5:32b"
              VISION_MODEL="llava:7b"
              WRITING_MODEL="qwen2.5:32b"
              NUM_PARALLEL=2
            elif [ "$VRAM_GIB" -ge 10 ]; then
              CHAT_MODEL="mistral:22b"
              VISION_MODEL="llava:7b"
              WRITING_MODEL="mistral:22b"
              NUM_PARALLEL=1
            else
              echo "VRAM too low or unreadable (${VRAM_GIB} GiB); keeping llama3.1:8b"
              CHAT_MODEL="llama3.1:8b"
              VISION_MODEL="llava:7b"
              WRITING_MODEL="llama3.1:8b"
              NUM_PARALLEL=1
            fi

            echo "Selected models: chat=${CHAT_MODEL} vision=${VISION_MODEL} writing=${WRITING_MODEL}"
            echo "Ollama parallelism: OLLAMA_NUM_PARALLEL=${NUM_PARALLEL}"

            # Persist parallelism setting for the template-update step
            echo "${NUM_PARALLEL}" > /tmp/selected_num_parallel

            # Persist model selection for subsequent workflow steps
            echo "${CHAT_MODEL}"  > /tmp/selected_chat_model
            echo "${VISION_MODEL}" > /tmp/selected_vision_model
            echo "${WRITING_MODEL}" > /tmp/selected_writing_model

            OLLAMA_API="http://127.0.0.1:11434"

            pull_model() {
              local model="$1"
              echo "====== Pulling ${model} ======"
              # Check if already present
              if curl -sf "$OLLAMA_API/api/tags" | grep -q "\"${model}\""; then
                echo "${model} already present, skipping pull."
                return 0
              fi
              # Pull via streaming endpoint — log progress
              curl -sf -X POST "$OLLAMA_API/api/pull" \
                -H "Content-Type: application/json" \
                -d "{\"model\":\"${model}\",\"stream\":false}" \
                --max-time 4200 \
                | tail -c 200 || true
              # Verify
              if curl -sf "$OLLAMA_API/api/tags" | grep -q "\"${model}\""; then
                echo "✅ ${model} ready"
              else
                echo "::warning:: Pull of ${model} may not have completed cleanly — verify manually"
              fi
            }

            # Pull vision model first (smaller, quicker) then chat
            if [ "$VISION_MODEL" != "$(cat /tmp/selected_chat_model)" ]; then
              pull_model "$VISION_MODEL"
            fi
            pull_model "$CHAT_MODEL"

            echo ""
            echo "====== Available models ======"
            curl -sf "$OLLAMA_API/api/tags" | python3 -c "import sys,json; [print(m['name'],m.get('size',0),'bytes') for m in json.load(sys.stdin).get('models',[])]" 2>/dev/null || curl -sf "$OLLAMA_API/api/tags"

      # ── Step 2: Update RunPod template env vars ───────────────────────────
      - name: Update RunPod template env vars
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_TEMPLATE_ID: ${{ secrets.RUNPOD_TEMPLATE_ID }}
          OLLAMA_GATEWAY_KEY: ${{ secrets.BOB_GATEWAY_KEY }}
          RUNPOD_GATEWAY_URL: ${{ secrets.RUNPOD_GATEWAY_URL }}
        run: |
          set -euo pipefail

          TEMPLATE_ID="${RUNPOD_TEMPLATE_ID:-y53tpqxjt9}"
          GATEWAY_URL="${RUNPOD_GATEWAY_URL:-}"
          GATEWAY_KEY="${OLLAMA_GATEWAY_KEY:-}"

          # Determine which model is available from the RunPod Ollama gateway
          if [[ -n "$GATEWAY_URL" && -n "$GATEWAY_KEY" ]]; then
            GATEWAY_URL="${GATEWAY_URL%/}"
            [[ "$GATEWAY_URL" == http://* || "$GATEWAY_URL" == https://* ]] || GATEWAY_URL="https://$GATEWAY_URL"
            echo "Querying available models from gateway..."
            TAGS=$(curl -sfL --max-time 30 \
              -H "Authorization: Bearer $GATEWAY_KEY" \
              "$GATEWAY_URL/api/tags") || TAGS='{"models":[]}'
          else
            echo "::warning::RUNPOD_GATEWAY_URL or BOB_GATEWAY_KEY not set — skipping model query, using SSH-selected models."
            TAGS='{"models":[]}'
          fi

          eval $(echo "$TAGS" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          names = [m['name'] for m in data.get('models', [])]
          # Priority ordered by quality; (chat, vision, num_parallel)
          # num_parallel = how many concurrent inference requests Ollama should allow.
          # Rule of thumb: (available_vram - model_vram) / kv_cache_per_context
          # qwen2.5:72b  ~41 GB Q4 → 141 GB pod: 8 workers; 80 GB pod: 4 workers
          # qwen2.5:32b  ~19 GB Q4 → 30 GB pod:  2 workers
          # smaller models: 2 workers is safe default
          PRIORITY = [
            ('qwen2.5:72b', 'llava:34b', 8),
            ('qwen2.5:72b', 'llava:13b', 4),
            ('llama3.3:70b', 'llava:13b', 4),
            ('qwen2.5:32b', 'llava:7b',  2),
            ('mistral:22b', 'llava:7b',  2),
            ('llama3.1:8b', 'llava:7b',  2),
          ]
          chat, vision, num_parallel = 'llama3.1:8b', 'llava:7b', 2
          for m, v, p in PRIORITY:
            if m in names:
              chat = m
              vision = v if v in names else 'llava:7b'
              num_parallel = p
              break
          print(f'SELECTED_CHAT={chat}')
          print(f'SELECTED_VISION={vision}')
          print(f'SELECTED_NUM_PARALLEL={num_parallel}')
          ")

          echo "SELECTED_CHAT_MODEL=${SELECTED_CHAT}" >> "$GITHUB_ENV"
          echo "SELECTED_VISION_MODEL=${SELECTED_VISION}" >> "$GITHUB_ENV"
          echo "Updating RunPod template ${TEMPLATE_ID}: chat=${SELECTED_CHAT} vision=${SELECTED_VISION} num_parallel=${SELECTED_NUM_PARALLEL}"

          # Update RunPod template env vars via GraphQL API
          MUTATION=$(cat <<GRAPHQL
          {"query": "mutation { saveTemplate(input: { id: \\"${TEMPLATE_ID}\\", containerDiskInGb: 20, env: [ {key: \\"OLLAMA_MODEL\\", value: \\"${SELECTED_CHAT}\\"}, {key: \\"TRANSLATION_MODEL\\", value: \\"${SELECTED_CHAT}\\"}, {key: \\"OLLAMA_MODEL_WRITING\\", value: \\"${SELECTED_CHAT}\\"}, {key: \\"OLLAMA_VISION_MODEL\\", value: \\"${SELECTED_VISION}\\"}, {key: \\"OLLAMA_NUM_PARALLEL\\", value: \\"${SELECTED_NUM_PARALLEL}\\"}, {key: \\"OLLAMA_MAX_LOADED_MODELS\\", value: \\"2\\"}, {key: \\"OLLAMA_MAX_QUEUE\\", value: \\"64\\"}, {key: \\"OLLAMA_KEEP_ALIVE\\", value: \\"24h\\"}, {key: \\"OLLAMA_FLASH_ATTENTION\\", value: \\"1\\"} ] }) { id } }"}
          GRAPHQL
          )
          RESP=$(curl -sfL --max-time 30 \
            "https://api.runpod.io/graphql?api_key=${RUNPOD_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$MUTATION") || RESP='{}'
          echo "RunPod API response: $RESP"
          echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print('✅ Template updated') if d.get('data',{}).get('saveTemplate') else print('::warning::Template update may have failed — check RunPod dashboard')"

      # ── Step 3: Smoke test ─────────────────────────────────────────────────
      - name: Wait for Bob to restart and run chat smoke test
        env:
          INFERENCE_API_KEY: ${{ secrets.INFERENCE_API_KEY }}
          BOB_INFERENCE_API_KEY: ${{ secrets.BOB_INFERENCE_API_KEY }}
          BOB_SERVICE_URL: ${{ secrets.BOB_SERVICE_URL }}
          OLLAMA_GATEWAY_KEY: ${{ secrets.BOB_GATEWAY_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${BOB_SERVICE_URL:-}" ]]; then
            echo "::error::BOB_SERVICE_URL secret is not set — refusing to default to hardcoded production URL"
            exit 1
          fi
          echo "Waiting 90s for Bob to restart..."
          sleep 90

          BOB_URL="${BOB_SERVICE_URL}"
          BOB_URL="${BOB_URL%/}"
          if [[ "$BOB_URL" != http://* && "$BOB_URL" != https://* ]]; then
            BOB_URL="https://$BOB_URL"
          fi
          API_KEY="${INFERENCE_API_KEY:-${BOB_INFERENCE_API_KEY:-}}"

          echo "Health check..."
          HEALTH=$(curl -sfL --max-time 20 "$BOB_URL/health")
          CHAT_MODEL=$(echo "$HEALTH" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('config',{}).get('OLLAMA_MODEL','unknown'))" 2>/dev/null || echo "unknown")
          VISION_MODEL=$(echo "$HEALTH" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('config',{}).get('OLLAMA_VISION_MODEL',''))" 2>/dev/null || echo "")
          SOURCE=$(echo "$HEALTH" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('config',{}).get('SOURCE_VERSION','unknown')[:12])" 2>/dev/null || echo "unknown")
          CB_STATE=$(echo "$HEALTH" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('ollama_circuit_breaker',{}).get('state','unknown'))" 2>/dev/null || echo "unknown")

          echo "Bob status:"
          echo "  OLLAMA_MODEL       = ${CHAT_MODEL}"
          echo "  OLLAMA_VISION_MODEL= ${VISION_MODEL}"
          echo "  SOURCE_VERSION     = ${SOURCE}"
          echo "  Circuit breaker    = ${CB_STATE}"

          if [ -n "${SELECTED_CHAT_MODEL:-}" ] && [ "$CHAT_MODEL" != "$SELECTED_CHAT_MODEL" ]; then
            echo "::error::OLLAMA_MODEL mismatch. Expected ${SELECTED_CHAT_MODEL}, got ${CHAT_MODEL}."
            exit 1
          fi

          if [ -n "${SELECTED_VISION_MODEL:-}" ] && [ "$VISION_MODEL" != "$SELECTED_VISION_MODEL" ]; then
            echo "::error::OLLAMA_VISION_MODEL mismatch. Expected ${SELECTED_VISION_MODEL}, got ${VISION_MODEL}."
            exit 1
          fi

          # Quick chat probe
          if [ -n "$API_KEY" ]; then
            echo ""
            echo "Running chat probe..."
            RESP=$(curl -sfL --max-time 60 \
              -X POST "$BOB_URL/chat" \
              -H "Content-Type: application/json" \
              -H "x-inference-api-key: $API_KEY" \
              -d '{"message":"Respond with: UPGRADE_OK"}') || RESP="{}"
            PROVIDER=$(echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('provider','?'))" 2>/dev/null || echo "?")
            FALLBACK=$(echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('fallback',True))" 2>/dev/null || echo "True")
            MSG=$(echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('message','')[:80])" 2>/dev/null || echo "")
            echo "  Chat provider  = ${PROVIDER}"
            echo "  Fallback       = ${FALLBACK}"
            echo "  Response       = ${MSG}"
            if [ "$FALLBACK" = "False" ] && [ "$PROVIDER" = "ollama" ]; then
              echo "✅ SMOKE PASS — Bob is using Ollama for chat"
            else
              echo "::error::Chat returned fallback=${FALLBACK} provider=${PROVIDER} — refusing to mark upgrade successful"
              exit 1
            fi
          fi
