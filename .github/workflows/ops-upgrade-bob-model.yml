name: Upgrade Bob AI Model

# Pulls the best model that fits the RunPod GPU's VRAM and updates Bob's
# OLLAMA_MODEL + OLLAMA_VISION_MODEL env vars on Railway, then redeploys.
#
# Strategy (auto-selected by VRAM):
#   ≥ 80 GB  → qwen2.5:72b   (frontier class reasoning) + llava:13b  vision
#   ≥ 40 GB  → llama3.3:70b  (frontier class reasoning) + llava:13b  vision
#   ≥ 20 GB  → qwen2.5:32b   (strong GPT-3.5+ reasoning) + llava:7b  vision
#   ≥ 10 GB  → mistral:22b   (solid GPT-3.5 class)       + llava:7b  vision
#   fallback → llama3.1:8b   (current)
#
# Required secrets (all already present):
#   RUNPOD_POD_SSH_HOST, RUNPOD_POD_SSH_USER, RUNPOD_POD_SSH_KEY, RUNPOD_POD_SSH_PORT
#   BOB_GATEWAY_KEY
#   RAILWAY_BOB_TOKEN, RAILWAY_BOB_SERVICE_ID (or RAILWAY_TOKEN, RAILWAY_SERVICE_ID)

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  upgrade-model:
    name: Upgrade Bob AI model on RunPod + Railway
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # ── Step 1: Check GPU spec and pull the best model ─────────────────────
      - name: Check GPU VRAM and pull optimal model
        id: pull_model
        uses: appleboy/ssh-action@v1.2.0
        env:
          BOB_GATEWAY_KEY: ${{ secrets.BOB_GATEWAY_KEY }}
        with:
          host: ${{ secrets.RUNPOD_POD_SSH_HOST }}
          username: ${{ secrets.RUNPOD_POD_SSH_USER }}
          key: ${{ secrets.RUNPOD_POD_SSH_KEY }}
          port: ${{ secrets.RUNPOD_POD_SSH_PORT || 22 }}
          request_pty: true
          command_timeout: 80m
          envs: BOB_GATEWAY_KEY
          script: |
            set -e

            echo "====== GPU specs ======"
            nvidia-smi --query-gpu=name,memory.total --format=csv,noheader 2>/dev/null || echo "nvidia-smi unavailable"

            # Read total VRAM in MiB
            VRAM_MIB=$(nvidia-smi --query-gpu=memory.total --format=csv,noheader,nounits 2>/dev/null | head -1 | tr -d ' ' || echo "0")
            VRAM_GIB=$(( VRAM_MIB / 1024 ))
            echo "Detected VRAM: ${VRAM_MIB} MiB (${VRAM_GIB} GiB)"

            # Pick model based on VRAM
            if [ "$VRAM_GIB" -ge 80 ]; then
              CHAT_MODEL="qwen2.5:72b"
              VISION_MODEL="llava:13b"
              WRITING_MODEL="qwen2.5:72b"
            elif [ "$VRAM_GIB" -ge 40 ]; then
              CHAT_MODEL="llama3.3:70b"
              VISION_MODEL="llava:13b"
              WRITING_MODEL="llama3.3:70b"
            elif [ "$VRAM_GIB" -ge 20 ]; then
              CHAT_MODEL="qwen2.5:32b"
              VISION_MODEL="llava:7b"
              WRITING_MODEL="qwen2.5:32b"
            elif [ "$VRAM_GIB" -ge 10 ]; then
              CHAT_MODEL="mistral:22b"
              VISION_MODEL="llava:7b"
              WRITING_MODEL="mistral:22b"
            else
              echo "VRAM too low or unreadable (${VRAM_GIB} GiB); keeping llama3.1:8b"
              CHAT_MODEL="llama3.1:8b"
              VISION_MODEL="llava:7b"
              WRITING_MODEL="llama3.1:8b"
            fi

            echo "Selected models: chat=${CHAT_MODEL} vision=${VISION_MODEL} writing=${WRITING_MODEL}"

            # Write model selection to a file Bob's Railway deploy step will read
            echo "${CHAT_MODEL}" > /tmp/selected_chat_model
            echo "${VISION_MODEL}" > /tmp/selected_vision_model
            echo "${WRITING_MODEL}" > /tmp/selected_writing_model

            OLLAMA_API="http://127.0.0.1:11434"

            pull_model() {
              local model="$1"
              echo "====== Pulling ${model} ======"
              # Check if already present
              if curl -sf "$OLLAMA_API/api/tags" | grep -q "\"${model}\""; then
                echo "${model} already present, skipping pull."
                return 0
              fi
              # Pull via streaming endpoint — log progress
              curl -sf -X POST "$OLLAMA_API/api/pull" \
                -H "Content-Type: application/json" \
                -d "{\"model\":\"${model}\",\"stream\":false}" \
                --max-time 4200 \
                | tail -c 200 || true
              # Verify
              if curl -sf "$OLLAMA_API/api/tags" | grep -q "\"${model}\""; then
                echo "✅ ${model} ready"
              else
                echo "::warning:: Pull of ${model} may not have completed cleanly — verify manually"
              fi
            }

            # Pull vision model first (smaller, quicker) then chat
            if [ "$VISION_MODEL" != "$(cat /tmp/selected_chat_model)" ]; then
              pull_model "$VISION_MODEL"
            fi
            pull_model "$CHAT_MODEL"

            echo ""
            echo "====== Available models ======"
            curl -sf "$OLLAMA_API/api/tags" | python3 -c "import sys,json; [print(m['name'],m.get('size',0),'bytes') for m in json.load(sys.stdin).get('models',[])]" 2>/dev/null || curl -sf "$OLLAMA_API/api/tags"

      # ── Step 2: Read selected models and update Bob on Railway ────────────
      - name: Read selected models from pod output
        id: models
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.RUNPOD_POD_SSH_HOST }}
          username: ${{ secrets.RUNPOD_POD_SSH_USER }}
          key: ${{ secrets.RUNPOD_POD_SSH_KEY }}
          port: ${{ secrets.RUNPOD_POD_SSH_PORT || 22 }}
          request_pty: true
          command_timeout: 1m
          script: |
            cat /tmp/selected_chat_model
            echo "---VISION---"
            cat /tmp/selected_vision_model
            echo "---WRITING---"
            cat /tmp/selected_writing_model

      - name: Install Railway CLI
        run: |
          RAILWAY_CLI_VERSION="4.31.0"
          TMP_DIR=$(mktemp -d)
          curl -fsSL -o "$TMP_DIR/railway.tar.gz" \
            "https://github.com/railwayapp/cli/releases/download/v${RAILWAY_CLI_VERSION}/railway-v${RAILWAY_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf "$TMP_DIR/railway.tar.gz" -C "$TMP_DIR"
          install -m 0755 "$TMP_DIR/railway" "$HOME/.local/bin/railway"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Update Bob model env vars on Railway
        env:
          RAILWAY_BOB_TOKEN: ${{ secrets.RAILWAY_BOB_TOKEN }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_BOB_SERVICE_ID: ${{ secrets.RAILWAY_BOB_SERVICE_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          RAILWAY_BOB_PROJECT_ID: ${{ secrets.RAILWAY_BOB_PROJECT_ID }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          OLLAMA_GATEWAY_KEY: ${{ secrets.BOB_GATEWAY_KEY }}
        run: |
          set -euo pipefail
          source ./scripts/load-railway-secrets-from-github-env.sh --quiet

          EFFECTIVE_TOKEN="${RAILWAY_BOB_TOKEN:-$RAILWAY_TOKEN}"
          EFFECTIVE_SERVICE="${RAILWAY_BOB_SERVICE_ID:-$RAILWAY_SERVICE_ID}"
          export RAILWAY_TOKEN="$EFFECTIVE_TOKEN"
          export RAILWAY_ENVIRONMENT=production

          [ -n "$EFFECTIVE_SERVICE" ] || { echo "::error::No RAILWAY_BOB_SERVICE_ID set"; exit 1; }

          # We can't directly read the SSH output across job steps, so we query
          # the pod again via the public Ollama gateway to find what largest
          # quantized model is available.

          GATEWAY_URL="${RUNPOD_GATEWAY_URL:-https://eipnu6bq181q20-8080.proxy.runpod.net}"
          GATEWAY_KEY="${OLLAMA_GATEWAY_KEY}"

          echo "Querying available models from gateway..."
          TAGS=$(curl -sfL --max-time 30 \
            -H "Authorization: Bearer $GATEWAY_KEY" \
            "$GATEWAY_URL/api/tags") || TAGS="{\"models\":[]}"

          echo "$TAGS" | python3 -c "
          import sys, json

          data = json.load(sys.stdin)
          models = data.get('models', [])
          names = [m['name'] for m in models]
          sizes = {m['name']: m.get('size', 0) for m in models}

          PRIORITY = [
            ('qwen2.5:72b',  'vision', 'llava:13b'),
            ('llama3.3:70b', 'vision', 'llava:13b'),
            ('qwen2.5:32b',  'vision', 'llava:7b'),
            ('mistral:22b',  'vision', 'llava:7b'),
            ('llama3.1:8b',  'vision', 'llava:7b'),
          ]

          chat_model = 'llama3.1:8b'
          vision_model = 'llava:7b'
          for m, _, v in PRIORITY:
            if m in names:
              chat_model = m
              vision_model = v if v in names else 'llava:7b'
              break

          print(f'SELECTED_CHAT={chat_model}')
          print(f'SELECTED_VISION={vision_model}')
          " > /tmp/model_selection.sh

          source /tmp/model_selection.sh
          echo "Chat model → ${SELECTED_CHAT}"
          echo "Vision model → ${SELECTED_VISION}"

          echo "Setting OLLAMA_MODEL=${SELECTED_CHAT}..."
          railway variables set "OLLAMA_MODEL=${SELECTED_CHAT}" \
            --service "$EFFECTIVE_SERVICE" \
            --environment production

          echo "Setting TRANSLATION_MODEL=${SELECTED_CHAT}..."
          railway variables set "TRANSLATION_MODEL=${SELECTED_CHAT}" \
            --service "$EFFECTIVE_SERVICE" \
            --environment production

          echo "Setting OLLAMA_MODEL_WRITING=${SELECTED_CHAT}..."
          railway variables set "OLLAMA_MODEL_WRITING=${SELECTED_CHAT}" \
            --service "$EFFECTIVE_SERVICE" \
            --environment production

          echo "Setting OLLAMA_VISION_MODEL=${SELECTED_VISION}..."
          railway variables set "OLLAMA_VISION_MODEL=${SELECTED_VISION}" \
            --service "$EFFECTIVE_SERVICE" \
            --environment production

          echo "✅ Bob model config updated: OLLAMA_MODEL=${SELECTED_CHAT}, OLLAMA_VISION_MODEL=${SELECTED_VISION}"

      # ── Step 3: Redeploy Bob to pick up new env vars ───────────────────────
      - name: Redeploy Bob on Railway
        env:
          RAILWAY_BOB_TOKEN: ${{ secrets.RAILWAY_BOB_TOKEN }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_BOB_SERVICE_ID: ${{ secrets.RAILWAY_BOB_SERVICE_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
        run: |
          set -euo pipefail
          source ./scripts/load-railway-secrets-from-github-env.sh --quiet

          EFFECTIVE_TOKEN="${RAILWAY_BOB_TOKEN:-$RAILWAY_TOKEN}"
          EFFECTIVE_SERVICE="${RAILWAY_BOB_SERVICE_ID:-$RAILWAY_SERVICE_ID}"
          export RAILWAY_TOKEN="$EFFECTIVE_TOKEN"
          export RAILWAY_ENVIRONMENT=production

          pushd inference-service
          railway up --service "$EFFECTIVE_SERVICE" --environment production --detach
          popd

          echo "✅ Bob redeployed. Wait ~60s then smoke test."

      # ── Step 4: Smoke test after deploy ────────────────────────────────────
      - name: Wait for Bob to restart and run chat smoke test
        env:
          INFERENCE_API_KEY: ${{ secrets.INFERENCE_API_KEY }}
          BOB_INFERENCE_API_KEY: ${{ secrets.BOB_INFERENCE_API_KEY }}
          BOB_SERVICE_URL: ${{ secrets.BOB_SERVICE_URL || 'https://focused-courage-production-ccee.up.railway.app' }}
          OLLAMA_GATEWAY_KEY: ${{ secrets.BOB_GATEWAY_KEY }}
        run: |
          set -euo pipefail
          echo "Waiting 90s for Bob to restart..."
          sleep 90

          BOB_URL="${BOB_SERVICE_URL:-https://focused-courage-production-ccee.up.railway.app}"
          API_KEY="${INFERENCE_API_KEY:-${BOB_INFERENCE_API_KEY:-}}"

          echo "Health check..."
          HEALTH=$(curl -sfL --max-time 20 "$BOB_URL/health")
          CHAT_MODEL=$(echo "$HEALTH" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('config',{}).get('OLLAMA_MODEL','unknown'))" 2>/dev/null || echo "unknown")
          VISION_MODEL=$(echo "$HEALTH" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('config',{}).get('OLLAMA_VISION_MODEL',''))" 2>/dev/null || echo "")
          SOURCE=$(echo "$HEALTH" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('config',{}).get('SOURCE_VERSION','unknown')[:12])" 2>/dev/null || echo "unknown")
          CB_STATE=$(echo "$HEALTH" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('ollama_circuit_breaker',{}).get('state','unknown'))" 2>/dev/null || echo "unknown")

          echo "Bob status:"
          echo "  OLLAMA_MODEL       = ${CHAT_MODEL}"
          echo "  OLLAMA_VISION_MODEL= ${VISION_MODEL}"
          echo "  SOURCE_VERSION     = ${SOURCE}"
          echo "  Circuit breaker    = ${CB_STATE}"

          # Quick chat probe
          if [ -n "$API_KEY" ]; then
            echo ""
            echo "Running chat probe..."
            RESP=$(curl -sfL --max-time 60 \
              -X POST "$BOB_URL/chat" \
              -H "Content-Type: application/json" \
              -H "x-inference-api-key: $API_KEY" \
              -d '{"message":"Respond with: UPGRADE_OK"}') || RESP="{}"
            PROVIDER=$(echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('provider','?'))" 2>/dev/null || echo "?")
            FALLBACK=$(echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('fallback',True))" 2>/dev/null || echo "True")
            MSG=$(echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('message','')[:80])" 2>/dev/null || echo "")
            echo "  Chat provider  = ${PROVIDER}"
            echo "  Fallback       = ${FALLBACK}"
            echo "  Response       = ${MSG}"
            if [ "$FALLBACK" = "False" ] && [ "$PROVIDER" = "ollama" ]; then
              echo "✅ SMOKE PASS — Bob is using Ollama for chat"
            else
              echo "::warning::Chat returned fallback=${FALLBACK} provider=${PROVIDER} — Ollama may still be loading large model"
            fi
          fi
