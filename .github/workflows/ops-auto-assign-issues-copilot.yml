name: Ops - Auto Assign Issues to Copilot

on:
  issues:
    types: [opened, reopened]

permissions:
  issues: write

jobs:
  auto-assign-copilot:
    runs-on: ubuntu-latest
    steps:
      - name: Assign issue to Copilot
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = context.payload.issue?.number;
            if (!issueNumber) {
              core.info('No issue number in payload; skipping.');
              return;
            }

            const issue = context.payload.issue;
            const currentAssignees = (issue?.assignees || []).map((a) => a.login);
            if (currentAssignees.includes('copilot')) {
              core.info(`Issue #${issueNumber} already assigned to @copilot.`);
              return;
            }

            const labels = (issue?.labels || []).map((l) => String(l.name || '').toLowerCase());
            const text = `${issue?.title || ''}\n${issue?.body || ''}`.toLowerCase();
            const isRiskyScope = labels.some((l) =>
              ['feature', 'enhancement', 'access-control', 'permissions', 'security', 'architecture', 'module'].includes(l)
            ) || /(feature|enhancement|new module|access\s+elevation|permissions?|role\s+change|security)/i.test(text);

            if (isRiskyScope) {
              core.info(`Issue #${issueNumber} appears to be a risky-scope change; leaving unassigned for human routing.`);
              return;
            }

            try {
              await github.rest.issues.addAssignees({
                owner,
                repo,
                issue_number: issueNumber,
                assignees: ['copilot'],
              });
              core.info(`Assigned issue #${issueNumber} to @copilot.`);
            } catch (err) {
              core.warning(`Could not assign issue #${issueNumber} to @copilot: ${err.message}`);
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: 'Ops auto-assignment attempted but could not assign @copilot automatically. Please assign manually so the Copilot loop can pick this up.',
              });
            }
