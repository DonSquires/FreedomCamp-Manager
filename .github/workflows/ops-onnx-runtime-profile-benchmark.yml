name: Ops - ONNX Runtime Profile Benchmark

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: Iterations per profile/model benchmark run
        required: false
        default: '20'
        type: string
      warmup:
        description: Warmup runs before timing starts
        required: false
        default: '5'
        type: string
      profiles:
        description: Comma-separated profile list (latency,balanced,throughput)
        required: false
        default: 'latency,balanced,throughput'
        type: string
  schedule:
    - cron: '15 8 * * 1'
  push:
    branches: [main]
    paths:
      - 'inference-service/server.js'
      - 'inference-service/scripts/benchmark-onnx-runtime-profiles.mjs'
      - 'inference-service/scripts/download-models.js'
      - 'inference-service/package.json'
      - 'inference-service/package-lock.json'
      - '.github/workflows/ops-onnx-runtime-profile-benchmark.yml'

permissions:
  contents: read

jobs:
  onnx-runtime-profile-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      BENCHMARK_ITERATIONS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.iterations || '20' }}
      BENCHMARK_WARMUP: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.warmup || '5' }}
      BENCHMARK_PROFILES: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.profiles || 'latency,balanced,throughput' }}
      BENCHMARK_OUT_PATH: data/onnx-runtime-benchmark-${{ github.run_id }}.json
      BENCHMARK_SUMMARY_PATH: data/onnx-runtime-benchmark-${{ github.run_id }}.md

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install inference dependencies
        working-directory: inference-service
        run: npm ci --silent

      - name: Download ONNX models
        working-directory: inference-service
        run: npm run download-models

      - name: Run ONNX runtime profile benchmark
        working-directory: inference-service
        run: |
          node scripts/benchmark-onnx-runtime-profiles.mjs \
            --profiles "$BENCHMARK_PROFILES" \
            --iterations "$BENCHMARK_ITERATIONS" \
            --warmup "$BENCHMARK_WARMUP" \
            --output "$BENCHMARK_OUT_PATH"

      - name: Generate benchmark markdown summary
        run: |
          node scripts/summarize-onnx-runtime-benchmark.mjs \
            --in "inference-service/$BENCHMARK_OUT_PATH" \
            --out "inference-service/$BENCHMARK_SUMMARY_PATH"

      - name: Upload ONNX benchmark artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: onnx-runtime-benchmark-${{ github.run_id }}
          path: |
            inference-service/${{ env.BENCHMARK_OUT_PATH }}
            inference-service/${{ env.BENCHMARK_SUMMARY_PATH }}
          if-no-files-found: error

      - name: Publish benchmark summary
        if: always()
        shell: bash
        run: |
          echo "## ONNX Runtime Profile Benchmark" >> "$GITHUB_STEP_SUMMARY"
          echo "- Profiles: $BENCHMARK_PROFILES" >> "$GITHUB_STEP_SUMMARY"
          echo "- Iterations: $BENCHMARK_ITERATIONS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Warmup: $BENCHMARK_WARMUP" >> "$GITHUB_STEP_SUMMARY"
          REPORT_PATH="inference-service/${BENCHMARK_OUT_PATH}"
          if [[ ! -f "$REPORT_PATH" ]]; then
            echo "- Report: not generated" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          node -e '
            const fs = require("fs");
            const reportPath = process.argv[1];
            const out = process.env.GITHUB_STEP_SUMMARY;
            const report = JSON.parse(fs.readFileSync(reportPath, "utf8"));
            const lines = [];
            lines.push(`- Recommendation: ${report?.recommendation?.recommendedProfile || "n/a"}`);
            lines.push(`- Reason: ${report?.recommendation?.reason || "n/a"}`);
            for (const row of report.results || []) {
              if (row.error || !row.stats) {
                lines.push(`- ${row.profile}/${row.model}: ERROR (${row.error || "unknown"})`);
                continue;
              }
              lines.push(`- ${row.profile}/${row.model}: p95=${row.stats.p95Ms?.toFixed?.(2) ?? row.stats.p95Ms}ms, mean=${row.stats.meanMs?.toFixed?.(2) ?? row.stats.meanMs}ms, tps=${row.stats.throughputPerSecond?.toFixed?.(2) ?? row.stats.throughputPerSecond}`);
            }
            fs.appendFileSync(out, lines.join("\n") + "\n");
          ' "$REPORT_PATH"
