name: Ops Bob Human Interaction Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-bob-human-interaction-smoke.yml'
      - 'inference-service/server.js'
  schedule:
    - cron: '17 * * * *'

jobs:
  smoke-chat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECT_PROVIDER: ollama
    steps:
      - name: Normalize Bob runtime endpoint and auth key
        run: |
          set -euo pipefail
          BASE_URL="${BOB_SERVICE_URL:-${INFERENCE_SERVICE_URL:-}}"
          API_KEY_PRIMARY="${INFERENCE_API_KEY:-}"
          API_KEY_SECONDARY="${BOB_INFERENCE_API_KEY:-}"

          echo "INFERENCE_SERVICE_URL=$BASE_URL" >> "$GITHUB_ENV"
          echo "INFERENCE_API_KEY_PRIMARY=$API_KEY_PRIMARY" >> "$GITHUB_ENV"
          echo "INFERENCE_API_KEY_SECONDARY=$API_KEY_SECONDARY" >> "$GITHUB_ENV"
        env:
          INFERENCE_SERVICE_URL: ${{ secrets.INFERENCE_SERVICE_URL }}
          BOB_SERVICE_URL: ${{ secrets.BOB_SERVICE_URL }}
          INFERENCE_API_KEY: ${{ secrets.INFERENCE_API_KEY }}
          BOB_INFERENCE_API_KEY: ${{ secrets.BOB_INFERENCE_API_KEY }}

      - name: Validate required secrets
        run: |
          set -euo pipefail
          if [[ -z "${INFERENCE_SERVICE_URL:-}" ]]; then
            echo "INFERENCE_SERVICE_URL is missing"
            exit 1
          fi
        env:
          INFERENCE_SERVICE_URL: ${{ env.INFERENCE_SERVICE_URL }}

      - name: Normalize URL
        run: |
          set -euo pipefail
          URL="${INFERENCE_SERVICE_URL}"
          if [[ "$URL" != http://* && "$URL" != https://* ]]; then
            URL="https://$URL"
          fi
          echo "CHAT_URL=${URL%/}/chat" >> "$GITHUB_ENV"
          echo "HEALTH_URL=${URL%/}/health" >> "$GITHUB_ENV"
        env:
          INFERENCE_SERVICE_URL: ${{ env.INFERENCE_SERVICE_URL }}

      - name: Preflight inference health and Ollama wiring
        run: |
          set -euo pipefail

          HTTP_STATUS=$(curl -sS -m 30 -o /tmp/inference-health.json -w "%{http_code}" "$HEALTH_URL")
          cat /tmp/inference-health.json

          if [[ "$HTTP_STATUS" != "200" ]]; then
            echo "Inference health endpoint returned HTTP $HTTP_STATUS"
            exit 1
          fi

          STATUS="$(jq -r '.status // "unknown"' /tmp/inference-health.json)"
          OPERATING_MODE="$(jq -r '.config.OPERATING_MODE // "unknown"' /tmp/inference-health.json)"
          CHAT_PROVIDER="$(jq -r '.config.CHAT_PROVIDER // ""' /tmp/inference-health.json)"
          TABULAR_PROVIDER="$(jq -r '.config.TABULAR_NLP_PROVIDER // ""' /tmp/inference-health.json)"
          SELF_CONTAINED_MODE="$(jq -r '.config.SELF_CONTAINED_MODE // false' /tmp/inference-health.json)"
          REQUIRE_SELF_CONTAINED_MODE="$(jq -r '.config.REQUIRE_SELF_CONTAINED_MODE // false' /tmp/inference-health.json)"
          SELF_CONTAINED_STRICT_EGRESS="$(jq -r '.config.SELF_CONTAINED_STRICT_EGRESS // false' /tmp/inference-health.json)"
          OPENAI_API_KEY_SET="$(jq -r '.config.OPENAI_API_KEY_SET // false' /tmp/inference-health.json)"
          CHAT_OLLAMA_ENABLED="$(jq -r '.capabilities.chat_local_ollama_enabled // false' /tmp/inference-health.json)"
          TABULAR_OLLAMA_ENABLED="$(jq -r '.capabilities.tabular_nlp_ollama_enabled // false' /tmp/inference-health.json)"

          [[ "$STATUS" == "healthy" ]] || { echo "Inference status is not healthy: $STATUS"; exit 1; }
          [[ "$OPERATING_MODE" == "self-contained" || "$OPERATING_MODE" == "build-training" ]] || { echo "Unexpected OPERATING_MODE=$OPERATING_MODE"; exit 1; }
          [[ "$CHAT_PROVIDER" == "ollama" ]] || { echo "Expected CHAT_PROVIDER=ollama but got $CHAT_PROVIDER"; exit 1; }
          [[ "$TABULAR_PROVIDER" == "ollama" ]] || { echo "Expected TABULAR_NLP_PROVIDER=ollama but got $TABULAR_PROVIDER"; exit 1; }

          if [[ "$OPERATING_MODE" == "self-contained" ]]; then
            [[ "$SELF_CONTAINED_MODE" == "true" ]] || { echo "Expected SELF_CONTAINED_MODE=true but got $SELF_CONTAINED_MODE"; exit 1; }
            [[ "$REQUIRE_SELF_CONTAINED_MODE" == "true" ]] || echo "::warning::REQUIRE_SELF_CONTAINED_MODE is $REQUIRE_SELF_CONTAINED_MODE (expected true)."
            [[ "$SELF_CONTAINED_STRICT_EGRESS" == "true" ]] || echo "::warning::SELF_CONTAINED_STRICT_EGRESS is $SELF_CONTAINED_STRICT_EGRESS (expected true)."
            [[ "$OPENAI_API_KEY_SET" == "false" ]] || { echo "Expected OPENAI_API_KEY_SET=false in self-contained mode but got $OPENAI_API_KEY_SET"; exit 1; }
          else
            [[ "$SELF_CONTAINED_MODE" == "false" ]] || echo "::warning::Expected SELF_CONTAINED_MODE=false in build-training mode; got $SELF_CONTAINED_MODE"
            [[ "$OPENAI_API_KEY_SET" == "false" ]] || echo "::warning::OPENAI_API_KEY_SET is $OPENAI_API_KEY_SET (expected false for Ollama-only runtime)."
          fi

          [[ "$CHAT_OLLAMA_ENABLED" == "true" ]] || { echo "chat_local_ollama_enabled is false"; exit 1; }
          [[ "$TABULAR_OLLAMA_ENABLED" == "true" ]] || { echo "tabular_nlp_ollama_enabled is false"; exit 1; }

          cp /tmp/inference-health.json inference-health-preflight.json

      - name: Human interaction smoke prompts
        run: |
          set -euo pipefail

          LOG_FILE="bob-human-interaction-smoke.log"
          : > "$LOG_FILE"

          snapshot_health () {
            local label="$1"
            local out_file="inference-health-${label}.json"
            curl -sS -m 30 "$HEALTH_URL" > "$out_file" || true
            # Redirect to stderr so this output is never captured when called
            # inside a $() command substitution (e.g. inside retry_chat_prompt).
            {
              echo "Health snapshot ($label):"
              cat "$out_file"
            } | tee -a "$LOG_FILE" >&2
          }

          call_chat () {
            local prompt="$1"
            local payload
            payload="{\"provider\":\"ollama\",\"message\":$(jq -Rn --arg p "$prompt" '$p')}"

            local keys=("${INFERENCE_API_KEY_PRIMARY:-}" "${INFERENCE_API_KEY_SECONDARY:-}")
            local attempts=0

            for key in "${keys[@]}"; do
              [[ -z "$key" ]] && continue
              attempts=$((attempts + 1))

              # Try x-inference-api-key first
              local resp
              resp=$(curl -sS -m 45 -X POST "$CHAT_URL" \
                -H 'Content-Type: application/json' \
                -H "x-inference-api-key: ${key}" \
                -d "$payload" || true)
              if [[ -n "$resp" ]] && ! echo "$resp" | grep -qi 'unauthorized inference request'; then
                echo "$resp"
                return 0
              fi

              # Then try Bearer form with the same key
              resp=$(curl -sS -m 45 -X POST "$CHAT_URL" \
                -H 'Content-Type: application/json' \
                -H "Authorization: Bearer ${key}" \
                -d "$payload" || true)
              if [[ -n "$resp" ]] && ! echo "$resp" | grep -qi 'unauthorized inference request'; then
                echo "$resp"
                return 0
              fi
            done

            # Final fallback: unauthenticated (covers permissive environments)
            # || true: curl exits non-zero on timeout (28) or connection error.
            # With set -euo pipefail that would abort the whole step; we want to
            # return an empty string instead and let retry_chat_prompt handle it.
            # 45 s: Ollama cold-start or first-token latency on Railway free tier
            # typically reaches 30-40 s; 45 s gives a small safety margin while
            # still well within the step's 10-minute job timeout.
            curl -sS -m 45 -X POST "$CHAT_URL" \
              -H 'Content-Type: application/json' \
              -d "$payload" \
              || true
          }

          retry_chat_prompt () {
            local prompt="$1"
            local attempt=1
            local max_attempts=4
            local resp=""

            while [[ "$attempt" -le "$max_attempts" ]]; do
              resp="$(call_chat "$prompt")"

              # Guard: empty response means curl timed out or returned an error.
              if [[ -z "$resp" ]]; then
                echo "Attempt ${attempt}/${max_attempts}: curl returned empty response (timeout or connection error)" | tee -a "$LOG_FILE" >&2
                snapshot_health "attempt-${attempt}"
                if [[ "$attempt" -lt "$max_attempts" ]]; then
                  echo "Retrying..." | tee -a "$LOG_FILE" >&2
                  sleep 5
                fi
                attempt=$((attempt + 1))
                continue
              fi

              local provider
              local fallback
              local message
              # || echo "" prevents jq from exiting non-zero on non-JSON payloads.
              provider="$(echo "$resp" | jq -r '.provider // empty' 2>/dev/null || echo "")"
              fallback="$(echo "$resp" | jq -r '.fallback // false' 2>/dev/null || echo "false")"
              message="$(echo "$resp" | jq -r '.message // empty' 2>/dev/null || echo "")"

              # Redirect diagnostics to stderr so they don't pollute the captured
              # return value when retry_chat_prompt is called inside $().
              echo "Attempt ${attempt}/${max_attempts}: provider=${provider:-<empty>} fallback=${fallback}" | tee -a "$LOG_FILE" >&2
              echo "Response: $resp" | tee -a "$LOG_FILE" >&2

              if [[ -n "$message" && "$provider" == "$EXPECT_PROVIDER" && "$fallback" != "true" ]]; then
                echo "$resp"
                return 0
              fi

              snapshot_health "attempt-${attempt}"

              if [[ "$attempt" -lt "$max_attempts" ]]; then
                echo "Retrying after transient Ollama fallback..." | tee -a "$LOG_FILE" >&2
                sleep 5
              fi

              attempt=$((attempt + 1))
            done

            echo "$resp"
            return 1
          }

          snapshot_health "before-chat"

          RESP1="$(retry_chat_prompt 'Give me a short, human update for officers about an intermittent PTT outage and immediate next steps.')"
          RESP2="$(retry_chat_prompt 'Summarize a bug report for non-technical council managers in plain English.')"
          RESP3="$(retry_chat_prompt 'Ask me one clarifying question before proposing a fix for this intermittent issue.')"

          echo "Response 1: $RESP1" | tee -a "$LOG_FILE"
          echo "Response 2: $RESP2" | tee -a "$LOG_FILE"
          echo "Response 3: $RESP3" | tee -a "$LOG_FILE"

          for RESP in "$RESP1" "$RESP2" "$RESP3"; do
            PROVIDER="$(echo "$RESP" | jq -r '.provider // empty')"
            FALLBACK="$(echo "$RESP" | jq -r '.fallback // false')"
            MESSAGE="$(echo "$RESP" | jq -r '.message // empty')"

            if [[ -z "$MESSAGE" ]]; then
              echo "Empty message in response"
              exit 1
            fi

            if [[ "$PROVIDER" != "$EXPECT_PROVIDER" ]]; then
              echo "Expected provider $EXPECT_PROVIDER but got $PROVIDER"
              exit 1
            fi

            if [[ "$FALLBACK" == "true" ]]; then
              echo "Unexpected fallback=true in response"
              exit 1
            fi
          done
        env:
          INFERENCE_API_KEY_PRIMARY: ${{ env.INFERENCE_API_KEY_PRIMARY }}
          INFERENCE_API_KEY_SECONDARY: ${{ env.INFERENCE_API_KEY_SECONDARY }}
          EXPECT_PROVIDER: ${{ env.EXPECT_PROVIDER }}

      - name: Upload smoke transcript
        uses: actions/upload-artifact@v4
        with:
          name: bob-human-interaction-smoke
          path: |
            bob-human-interaction-smoke.log
            inference-health-preflight.json
            inference-health-before-chat.json
            inference-health-attempt-1.json
            inference-health-attempt-2.json
            inference-health-attempt-3.json
            inference-health-attempt-4.json
          if-no-files-found: ignore
