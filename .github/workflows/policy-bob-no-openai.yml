name: policy-bob-openai-research-training

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  guard-openai-research-training:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Guard Bob OpenAI policy (research/training + NZ privacy)
        run: sh scripts/guard-no-openai-new.sh
