name: Playwright Monitoring Pulse

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'api/**'
      - 'tests/monitoring-pulse.spec.ts'
      - 'playwright.config.ts'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/playwright-monitoring-pulse.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'api/**'
      - 'tests/monitoring-pulse.spec.ts'
      - 'playwright.config.ts'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/playwright-monitoring-pulse.yml'
  workflow_dispatch:

concurrency:
  group: playwright-monitoring-pulse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-preflight:
    name: Typecheck Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck preflight
        run: bun run typecheck

  monitoring-pulse:
    name: Monitoring Pulse Smoke (Ubuntu Chromium)
    needs: [typecheck-preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      CI: true
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
      PLAYWRIGHT_REUSE_EXISTING_SERVER: '1'
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Install Playwright Chromium and OS deps
        run: bunx playwright install --with-deps chromium

      - name: Build app
        run: bun run build

      - name: Start preview server
        run: |
          set -euo pipefail
          bun run preview -- --host 127.0.0.1 --port 4173 > /tmp/monitoring-preview.log 2>&1 &
          echo $! > /tmp/monitoring-preview.pid

      - name: Wait for app
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            if [ -f /tmp/monitoring-preview.pid ] && ! kill -0 "$(cat /tmp/monitoring-preview.pid)" 2>/dev/null; then
              echo 'Preview process exited before becoming reachable.'
              tail -n 200 /tmp/monitoring-preview.log || true
              exit 1
            fi

            if curl -fsS --max-time 5 "${PLAYWRIGHT_BASE_URL}/enterprise-console" >/dev/null 2>&1; then
              exit 0
            fi
            if [ "$i" -eq 40 ]; then
              echo 'Preview did not become reachable in time.'
              tail -n 200 /tmp/monitoring-preview.log || true
              exit 1
            fi
            sleep 2
          done

      - name: Upload preview server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-pulse-preview-log-${{ github.run_id }}
          path: /tmp/monitoring-preview.log
          if-no-files-found: ignore

      - name: Run monitoring pulse smoke test
        run: |
          bunx playwright test monitoring-pulse.spec.ts --config=playwright.config.ts --project=chromium --workers=1 --reporter=line

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-pulse-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

      - name: Stop preview server
        if: always()
        run: |
          if [ -f /tmp/monitoring-preview.pid ]; then
            kill "$(cat /tmp/monitoring-preview.pid)" || true
          fi
