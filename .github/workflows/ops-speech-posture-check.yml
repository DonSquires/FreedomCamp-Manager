name: Ops – Speech Endpoint Posture Check

# Validates that speech-stack env vars do not point to external vendor APIs
# (OpenAI, etc.) outside of an explicitly approved research/training context.
# Runs on every push to main and on PRs touching speech-related files.

on:
  push:
    branches: [main]
    paths:
      - 'ops/speech-intent/**'
      - 'supabase/functions/speech-to-intent/**'
      - 'src/hooks/useSpeechIntent.ts'
  pull_request:
    paths:
      - 'ops/speech-intent/**'
      - 'supabase/functions/speech-to-intent/**'
      - 'src/hooks/useSpeechIntent.ts'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  posture-check:
    name: Speech Endpoint Posture
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Check INTENT_URL default is self-hosted
        run: |
          ENV_FILE="ops/speech-intent/.env.example"
          INTENT_URL=$(grep -E '^INTENT_URL=' "$ENV_FILE" | cut -d= -f2-)
          echo "INTENT_URL default: $INTENT_URL"
          if echo "$INTENT_URL" | grep -qiE 'openai\.com|anthropic\.com|api\.cohere\.ai'; then
            echo "::error::INTENT_URL default points to an external vendor AI API: $INTENT_URL"
            echo "::error::Production speech flows must route to self-hosted Ollama (Railway) or RunPod."
            exit 1
          fi
          echo "✅ INTENT_URL is self-hosted: $INTENT_URL"

      - name: Check STT_URL default is self-hosted
        run: |
          ENV_FILE="ops/speech-intent/.env.example"
          STT_URL=$(grep -E '^STT_URL=' "$ENV_FILE" | cut -d= -f2-)
          echo "STT_URL default: $STT_URL"
          if echo "$STT_URL" | grep -qiE 'openai\.com|anthropic\.com|deepgram\.com|rev\.ai|assemblyai\.com'; then
            echo "::error::STT_URL default points to an external vendor AI API: $STT_URL"
            exit 1
          fi
          echo "✅ STT_URL is self-hosted: $STT_URL"

      - name: Verify ALLOW_OPENAI_RUNTIME defaults to false
        run: |
          ENV_FILE="ops/speech-intent/.env.example"
          VALUE=$(grep -E '^ALLOW_OPENAI_RUNTIME=' "$ENV_FILE" | cut -d= -f2-)
          echo "ALLOW_OPENAI_RUNTIME default: $VALUE"
          if [ "$VALUE" != "false" ]; then
            echo "::error::ALLOW_OPENAI_RUNTIME must default to 'false' in .env.example"
            exit 1
          fi
          echo "✅ ALLOW_OPENAI_RUNTIME=false confirmed"

      - name: Check edge function does not hardcode external AI URLs
        run: |
          FUNC_FILE="supabase/functions/speech-to-intent/index.ts"
          if grep -qiE 'api\.openai\.com|anthropic\.com' "$FUNC_FILE"; then
            echo "::error::Edge function contains hardcoded external AI URL: $FUNC_FILE"
            exit 1
          fi
          echo "✅ Edge function is clean of hardcoded external AI URLs"

      - name: Confirm speech-router runtime block is present
        run: |
          ROUTER_FILE="ops/speech-intent/speech-router/app/main.py"
          if ! grep -q 'BLOCKED_OPENAI_HOSTS' "$ROUTER_FILE"; then
            echo "::error::speech-router is missing BLOCKED_OPENAI_HOSTS runtime policy"
            exit 1
          fi
          if ! grep -q '_assert_runtime_url_policy' "$ROUTER_FILE"; then
            echo "::error::speech-router is missing _assert_runtime_url_policy enforcement"
            exit 1
          fi
          echo "✅ speech-router runtime egress block is present"
