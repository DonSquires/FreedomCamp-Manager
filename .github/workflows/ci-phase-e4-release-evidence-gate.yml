name: CI Phase E4 Release Evidence Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/e2e/phase-e4-release-evidence.spec.ts'
      - 'tests/e2e/phase-e1-data-access-consolidation.spec.ts'
      - 'tests/e2e/phase-e2-enterprise-hardening-tenancy.spec.ts'
      - 'tests/e2e/phase-e3-communications-audit-retry.spec.ts'
      - '.github/workflows/ci-phase-e1-data-access-consolidation-gate.yml'
      - '.github/workflows/ci-phase-e2-enterprise-hardening-tenancy-gate.yml'
      - '.github/workflows/ci-phase-e3-communications-audit-retry-gate.yml'
      - '.github/workflows/ci-phase-e4-release-evidence-gate.yml'
      - 'docs/BUILD_REALIGNMENT_PLAN_2026-05-04.md'
      - 'docs/MODULE_ROADMAP.md'
      - 'docs/STAGING.md'
      - 'package.json'
      - 'bun.lock'
  push:
    branches: [main]
    paths:
      - 'tests/e2e/phase-e4-release-evidence.spec.ts'
      - 'tests/e2e/phase-e1-data-access-consolidation.spec.ts'
      - 'tests/e2e/phase-e2-enterprise-hardening-tenancy.spec.ts'
      - 'tests/e2e/phase-e3-communications-audit-retry.spec.ts'
      - '.github/workflows/ci-phase-e1-data-access-consolidation-gate.yml'
      - '.github/workflows/ci-phase-e2-enterprise-hardening-tenancy-gate.yml'
      - '.github/workflows/ci-phase-e3-communications-audit-retry-gate.yml'
      - '.github/workflows/ci-phase-e4-release-evidence-gate.yml'
      - 'docs/BUILD_REALIGNMENT_PLAN_2026-05-04.md'
      - 'docs/MODULE_ROADMAP.md'
      - 'docs/STAGING.md'
      - 'package.json'
      - 'bun.lock'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  phase-e4-release-evidence-gate:
    name: Phase E4 Release Evidence Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Phase E4 release evidence gate suite
        id: phase_gate_suite
        continue-on-error: true
        run: |
          bunx playwright test \
            tests/e2e/phase-e4-release-evidence.spec.ts \
            --reporter=list

      - name: Enforce Phase gate suite (strict mode)
        if: steps.phase_gate_suite.outcome == 'failure' && vars.PHASE_GATES_STRICT == 'true'
        run: |
          echo "::error::Phase gate suite failed and strict mode is enabled (PHASE_GATES_STRICT=true)."
          exit 1

      - name: Report Phase gate suite (non-strict)
        if: steps.phase_gate_suite.outcome == 'failure' && vars.PHASE_GATES_STRICT != 'true'
        run: |
          echo "::warning::Phase gate suite failed but strict mode is disabled; continuing."
