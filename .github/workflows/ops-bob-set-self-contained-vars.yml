name: Ops — Set Bob Self-Contained Railway Variables

# Sets (or re-sets) the required self-contained mode environment variables on
# the Bob Railway service, then triggers a redeploy.
#
# Run this whenever:
#   - Bob is redeployed to a fresh Railway service and env vars are missing
#   - The health check reports SELF_CONTAINED_MODE=<missing>
#   - You need to reset the privacy-lock variables after a Railway wipe
#
# Required secrets (GitHub Actions):
#   RAILWAY_BOB_TOKEN         — Railway project token for Bob Inference project
#   RAILWAY_BOB_SERVICE_ID    — Bob Assistant service ID (update if stale)

on:
  workflow_dispatch:
    inputs:
      bob_service_id_override:
        description: 'Bob Railway service ID override (leave blank to use RAILWAY_BOB_SERVICE_ID secret)'
        required: false
        type: string
      redeploy:
        description: 'Trigger a Railway redeploy after setting variables?'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  set-bob-vars:
    name: Set Bob Self-Contained Variables
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Resolve inputs
        id: resolve
        env:
          RAILWAY_BOB_TOKEN: ${{ secrets.RAILWAY_BOB_TOKEN }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_BOB_SERVICE_ID: ${{ secrets.RAILWAY_BOB_SERVICE_ID }}
          SERVICE_ID_OVERRIDE: ${{ github.event.inputs.bob_service_id_override }}
        run: |
          set -euo pipefail

          TOKEN="${RAILWAY_BOB_TOKEN:-${RAILWAY_TOKEN:-}}"
          if [ -z "$TOKEN" ]; then
            echo "::error::No Railway token available. Set RAILWAY_BOB_TOKEN or RAILWAY_TOKEN in GitHub Actions secrets."
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "RAILWAY_TOKEN=$TOKEN" >> "$GITHUB_ENV"

          SERVICE_ID="${SERVICE_ID_OVERRIDE:-${RAILWAY_BOB_SERVICE_ID:-}}"
          if [ -z "$SERVICE_ID" ]; then
            echo "::error::No Bob service ID available. Set RAILWAY_BOB_SERVICE_ID secret or pass bob_service_id_override."
            exit 1
          fi
          echo "SERVICE_ID=$SERVICE_ID" >> "$GITHUB_ENV"
          echo "✅ Token and service ID resolved"

      - name: Install Railway CLI
        run: |
          RAILWAY_CLI_VERSION="4.31.0"
          TARGET="x86_64-unknown-linux-gnu"
          URL="https://github.com/railwayapp/cli/releases/download/v${RAILWAY_CLI_VERSION}/railway-v${RAILWAY_CLI_VERSION}-${TARGET}.tar.gz"
          TMP_DIR=$(mktemp -d)
          cd "$TMP_DIR"
          curl -fsSL -o railway.tar.gz "$URL"
          tar -xzf railway.tar.gz
          mkdir -p "$HOME/.railway/bin"
          install -m 0755 railway "$HOME/.railway/bin/railway"
          echo "$HOME/.railway/bin" >> "$GITHUB_PATH"

      - name: Set self-contained privacy-lock variables
        env:
          RAILWAY_TOKEN: ${{ env.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail

          VARS=(
            "SELF_CONTAINED_MODE=true"
            "REQUIRE_SELF_CONTAINED_MODE=true"
            "SELF_CONTAINED_STRICT_EGRESS=true"
            "DEPLOY_SIGNATURE=bob-self-contained-hardlock-v1"
            "BOB_OPERATING_MODE=self-contained"
          )

          for VAR in "${VARS[@]}"; do
            KEY="${VAR%%=*}"
            echo "Setting $KEY ..."
            railway variable set \
              --service "$SERVICE_ID" \
              --environment production \
              --skip-deploys \
              "$VAR"
            echo "  ✅ $KEY set"
          done

          echo ""
          echo "✅ All self-contained variables applied."

      - name: Trigger redeploy
        if: github.event.inputs.redeploy == 'true'
        env:
          RAILWAY_TOKEN: ${{ env.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          echo "🚂 Triggering Railway redeploy for Bob service..."
          railway redeploy --service "$SERVICE_ID" --environment production --yes
          echo "✅ Redeploy triggered. Bob will restart with new variables."

      - name: Verify variables were applied
        env:
          RAILWAY_TOKEN: ${{ env.RAILWAY_TOKEN }}
        run: |
          echo "Current self-contained variables on Bob service:"
          railway variable list \
            --service "$SERVICE_ID" \
            --environment production \
            --kv 2>&1 \
            | grep -E "SELF_CONTAINED_MODE|REQUIRE_SELF_CONTAINED_MODE|SELF_CONTAINED_STRICT_EGRESS|DEPLOY_SIGNATURE|BOB_OPERATING_MODE" \
            || echo "(no matches — CLI may not support --kv flag on this version)"
