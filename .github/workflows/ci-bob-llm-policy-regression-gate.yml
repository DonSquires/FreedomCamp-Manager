name: CI Bob LLM Policy Regression Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/edgeFunctions.ts'
      - 'src/lib/bobMutationCatalog.ts'
      - 'src/pages/BobAssistantStudio.tsx'
      - 'src/lib/__tests__/edgeFunctionsPolicy.test.ts'
      - 'scripts/bob-llm-regression-suite.mjs'
      - '.github/workflows/ci-bob-llm-policy-regression-gate.yml'
  push:
    branches: [main]
    paths:
      - 'src/lib/edgeFunctions.ts'
      - 'src/lib/bobMutationCatalog.ts'
      - 'src/pages/BobAssistantStudio.tsx'
      - 'src/lib/__tests__/edgeFunctionsPolicy.test.ts'
      - 'scripts/bob-llm-regression-suite.mjs'
      - '.github/workflows/ci-bob-llm-policy-regression-gate.yml'
  workflow_dispatch:

jobs:
  bob-llm-policy-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Bob LLM policy regression suite
        run: |
          node scripts/bob-llm-regression-suite.mjs \
            --out tools/llm-regression/${{ github.run_id }}/bob-llm-regression-report.json

      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bob-llm-policy-regression-${{ github.run_id }}
          path: tools/llm-regression/${{ github.run_id }}/bob-llm-regression-report.json
          if-no-files-found: error