name: Ops - RunPod Serverless Smoke

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: Prompt to send in endpoint input.prompt
        required: true
        default: Smoke test from GitHub Actions
      timeout_ms:
        description: Max poll duration in milliseconds
        required: true
        default: "180000"
      interval_ms:
        description: Poll interval in milliseconds
        required: true
        default: "3000"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  smoke:
    name: RunPod Serverless Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Validate required secrets
        env:
          RUNPOD_ENDPOINT_URL: ${{ secrets.RUNPOD_ENDPOINT_URL }}
          RUNPOD_ENDPOINT_API_KEY: ${{ secrets.RUNPOD_ENDPOINT_API_KEY }}
          RUNPOD_ENDPOINT_ID: ${{ secrets.RUNPOD_ENDPOINT_ID }}
        run: |
          set -e
          if [ -z "$RUNPOD_ENDPOINT_URL" ]; then
            echo "::error::Missing secret: RUNPOD_ENDPOINT_URL"
            exit 1
          fi
          if [ -z "$RUNPOD_ENDPOINT_API_KEY" ]; then
            echo "::error::Missing secret: RUNPOD_ENDPOINT_API_KEY"
            exit 1
          fi
          if [ -n "$RUNPOD_ENDPOINT_ID" ]; then
            echo "RUNPOD_ENDPOINT_ID present"
          else
            echo "RUNPOD_ENDPOINT_ID not set; status URL will be derived from RUNPOD_ENDPOINT_URL"
          fi

      - name: Invoke endpoint and poll result
        env:
          RUNPOD_ENDPOINT_URL: ${{ secrets.RUNPOD_ENDPOINT_URL }}
          RUNPOD_ENDPOINT_API_KEY: ${{ secrets.RUNPOD_ENDPOINT_API_KEY }}
          RUNPOD_ENDPOINT_ID: ${{ secrets.RUNPOD_ENDPOINT_ID }}
          SMOKE_PROMPT: ${{ inputs.prompt }}
          SMOKE_TIMEOUT_MS: ${{ inputs.timeout_ms }}
          SMOKE_INTERVAL_MS: ${{ inputs.interval_ms }}
        run: |
          set -e
          started_at=$(date +%s)

          node scripts/invoke-runpod-endpoint.mjs \
            --input "{\"prompt\":\"$SMOKE_PROMPT\"}" \
            --poll true \
            --timeoutMs "$SMOKE_TIMEOUT_MS" \
            --intervalMs "$SMOKE_INTERVAL_MS" | tee runpod-smoke.log

          ended_at=$(date +%s)
          duration=$((ended_at - started_at))

          {
            echo "## RunPod Serverless Smoke"
            echo ""
            echo "- Prompt: $SMOKE_PROMPT"
            echo "- Duration: ${duration}s"
            echo "- Timeout: ${SMOKE_TIMEOUT_MS}ms"
            echo "- Interval: ${SMOKE_INTERVAL_MS}ms"
            echo ""
            echo "### Tail Output"
            echo ""
            echo "\`\`\`json"
            tail -n 40 runpod-smoke.log
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
