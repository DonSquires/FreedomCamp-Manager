name: Bob Spatial Intelligence CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'scripts/spatial-*.mjs'
      - 'scripts/import-*.mjs'
      - 'scripts/roster-*.mjs'
      - 'scripts/field-*.mjs'
      - 'scripts/jurisdiction-*.mjs'
      - 'docs/templates/clients/**'
      - 'data/**'
      - 'tests/spatial-intelligence.test.js'
  pull_request:
    branches: [main, develop]
    paths:
      - 'scripts/spatial-*.mjs'
      - 'scripts/import-*.mjs'
      - 'scripts/roster-*.mjs'
      - 'scripts/field-*.mjs'
      - 'scripts/jurisdiction-*.mjs'
      - 'docs/templates/clients/**'
      - 'data/**'
      - 'tests/spatial-intelligence.test.js'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run spatial intelligence tests
        run: bun run bob:test:spatial

      - name: Validate client geofences
        run: bun run bob:import:clients

      - name: Generate production geofences
        run: bun run bob:geofence:production

      - name: Check build integrity
        run: bun run build --target=lib 2>&1 | head -20

  linting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run ESLint on scripts
        run: |
          bun run lint -- scripts/spatial-*.mjs scripts/import-*.mjs scripts/roster-*.mjs scripts/field-*.mjs scripts/load-*.mjs 2>&1 || true

  auto-ingest:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Auto-ingest updated artifacts
        run: bun run bob:auto-ingest

      - name: Commit brain dump if changed
        run: |
          set -euo pipefail
          git config --local user.email "bob@automated.local"
          git config --local user.name "Bob CI Agent"

          MAX_GITHUB_SAFE_BYTES=95000000

          if [[ -n "$(git status --porcelain docs/BOB_BRAIN_DUMP.md)" ]]; then
            BRAIN_DUMP_SIZE=$(wc -c < docs/BOB_BRAIN_DUMP.md)
            if (( BRAIN_DUMP_SIZE <= MAX_GITHUB_SAFE_BYTES )); then
              git add docs/BOB_BRAIN_DUMP.md
              git commit -m "chore(bob): auto-ingest spatial intelligence artifacts"
              git push
            else
              echo "::warning::Skipping docs/BOB_BRAIN_DUMP.md commit because file size (${BRAIN_DUMP_SIZE}) exceeds safe push size (${MAX_GITHUB_SAFE_BYTES})."
            fi
          fi
