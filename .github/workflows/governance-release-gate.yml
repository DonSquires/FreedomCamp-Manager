name: Governance Release Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/App.tsx'
      - 'src/lib/edgeFunctions.ts'
      - 'src/lib/bobMutationCatalog.ts'
      - 'src/lib/bob-brain.ts'
      - 'src/pages/BobAssistantStudio.tsx'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'docs/INSTRUCTION_MANUAL.md'
      - 'docs/MODULE_ROADMAP.md'
      - 'docs/ENTERPRISE_PAIR_REVIEW_CANONICAL.md'
      - 'docs/PHASE1_WORKFLOW_MATRIX_2026-05-02.json'
      - 'docs/STAGING.md'
      - 'scripts/check-bob-governance-drift.mjs'
      - 'scripts/check-staging-doc.mjs'
      - 'scripts/doc-authority-check.mjs'
      - 'scripts/check-eslint-warning-budget.mjs'
      - 'scripts/check-route-roadmap-coverage.mjs'
      - 'scripts/generate-route-role-matrix.mjs'
      - 'scripts/generate-module-grounding-report.mjs'
      - 'scripts/generate-governance-run-summary.mjs'
      - 'scripts/validate-module-grounding.mjs'
      - 'scripts/validate-roadmap-grounding.mjs'
      - 'scripts/validate-roadmap-role-gates.mjs'
      - 'scripts/collect-workflow-evidence.mjs'
      - 'scripts/get-workflow-ids.mjs'
      - 'scripts/validate-workflow-evidence.mjs'
      - 'tools/budgets/eslint-warning-budget.json'
      - '.github/workflows/governance-release-gate.yml'
      - '.github/workflows/monthly-governance-checkpoint.yml'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - 'src/App.tsx'
      - 'src/lib/edgeFunctions.ts'
      - 'src/lib/bobMutationCatalog.ts'
      - 'src/lib/bob-brain.ts'
      - 'src/pages/BobAssistantStudio.tsx'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'docs/INSTRUCTION_MANUAL.md'
      - 'docs/MODULE_ROADMAP.md'
      - 'docs/ENTERPRISE_PAIR_REVIEW_CANONICAL.md'
      - 'docs/PHASE1_WORKFLOW_MATRIX_2026-05-02.json'
      - 'docs/STAGING.md'
      - 'scripts/check-bob-governance-drift.mjs'
      - 'scripts/check-staging-doc.mjs'
      - 'scripts/doc-authority-check.mjs'
      - 'scripts/check-eslint-warning-budget.mjs'
      - 'scripts/check-route-roadmap-coverage.mjs'
      - 'scripts/generate-route-role-matrix.mjs'
      - 'scripts/generate-module-grounding-report.mjs'
      - 'scripts/generate-governance-run-summary.mjs'
      - 'scripts/validate-module-grounding.mjs'
      - 'scripts/validate-roadmap-grounding.mjs'
      - 'scripts/validate-roadmap-role-gates.mjs'
      - 'scripts/collect-workflow-evidence.mjs'
      - 'scripts/get-workflow-ids.mjs'
      - 'scripts/validate-workflow-evidence.mjs'
      - 'tools/budgets/eslint-warning-budget.json'
      - '.github/workflows/governance-release-gate.yml'
      - '.github/workflows/monthly-governance-checkpoint.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  governance-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Fetch base branch for pull request diffs
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --prune --depth=1 origin "${{ github.base_ref }}"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Lint warning budget gate
        id: lint_warning_budget
        continue-on-error: true
        run: npm run lint:warning-budget

      - name: Enforce lint warning budget gate (strict mode)
        if: steps.lint_warning_budget.outcome == 'failure' && vars.LINT_WARNING_BUDGET_STRICT == 'true' && (github.event_name != 'pull_request' || vars.GOVERNANCE_STRICT_ON_PR == 'true')
        run: |
          echo "::error::Lint warning budget gate failed and strict mode is enabled (LINT_WARNING_BUDGET_STRICT=true)."
          exit 1

      - name: Report lint warning budget gate (non-strict)
        if: steps.lint_warning_budget.outcome == 'failure' && (vars.LINT_WARNING_BUDGET_STRICT != 'true' || (github.event_name == 'pull_request' && vars.GOVERNANCE_STRICT_ON_PR != 'true'))
        run: |
          echo "::warning::Lint warning budget gate failed but strict mode is disabled; continuing."

      - name: Doc authority strict gate
        id: doc_authority
        continue-on-error: ${{ github.event_name == 'pull_request' && vars.GOVERNANCE_STRICT_ON_PR != 'true' }}
        env:
          DOC_AUTHORITY_STRICT: 'true'
          DOC_AUTHORITY_DIFF_RANGE: ${{ github.event_name == 'pull_request' && format('origin/{0}...{1}', github.base_ref, github.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: npm run lint:doc-authority

      - name: Enforce doc authority gate (strict contexts)
        if: steps.doc_authority.outcome == 'failure' && (github.event_name != 'pull_request' || vars.GOVERNANCE_STRICT_ON_PR == 'true')
        run: |
          echo "::error::Doc authority gate failed in strict context."
          exit 1

      - name: Report doc authority gate (advisory PR mode)
        if: steps.doc_authority.outcome == 'failure' && github.event_name == 'pull_request' && vars.GOVERNANCE_STRICT_ON_PR != 'true'
        run: |
          echo "::warning::Doc authority gate failed in advisory PR mode; continuing."

      - name: Bob governance drift strict gate
        id: bob_governance_drift
        continue-on-error: true
        env:
          BOB_GOVERNANCE_DRIFT_STRICT: 'true'
        run: npm run lint:bob-governance-drift

      - name: Enforce Bob governance drift gate
        if: steps.bob_governance_drift.outcome == 'failure' && (github.event_name != 'pull_request' || vars.GOVERNANCE_STRICT_ON_PR == 'true')
        run: |
          echo "::error::Bob governance drift gate failed. Align docs/INSTRUCTION_MANUAL.md with Bob runtime policy surfaces in src/lib/edgeFunctions.ts, src/lib/bobMutationCatalog.ts, src/lib/bob-brain.ts, and src/pages/BobAssistantStudio.tsx."
          exit 1

      - name: Report Bob governance drift gate (advisory PR mode)
        if: steps.bob_governance_drift.outcome == 'failure' && github.event_name == 'pull_request' && vars.GOVERNANCE_STRICT_ON_PR != 'true'
        run: |
          echo "::warning::Bob governance drift gate failed in advisory PR mode; continuing."

      - name: Staging doc presence and freshness gate
        id: staging_doc
        continue-on-error: ${{ github.event_name == 'pull_request' && vars.GOVERNANCE_STRICT_ON_PR != 'true' }}
        env:
          STAGING_MAX_AGE_DAYS: '14'
        run: npm run lint:staging-doc

      - name: Enforce staging doc gate (strict contexts)
        if: steps.staging_doc.outcome == 'failure' && (github.event_name != 'pull_request' || vars.GOVERNANCE_STRICT_ON_PR == 'true')
        run: |
          echo "::error::Staging doc freshness gate failed in strict context."
          exit 1

      - name: Report staging doc gate (advisory PR mode)
        if: steps.staging_doc.outcome == 'failure' && github.event_name == 'pull_request' && vars.GOVERNANCE_STRICT_ON_PR != 'true'
        run: |
          echo "::warning::Staging doc freshness gate failed in advisory PR mode; continuing."

      - name: Route roadmap strict gate
        id: route_roadmap
        continue-on-error: ${{ github.event_name == 'pull_request' && vars.GOVERNANCE_STRICT_ON_PR != 'true' }}
        env:
          ROUTE_ROADMAP_STRICT: 'true'
          ROUTE_ROADMAP_DIFF_RANGE: ${{ github.event_name == 'pull_request' && format('origin/{0}...{1}', github.base_ref, github.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: npm run lint:route-roadmap

      - name: Enforce route roadmap gate (strict contexts)
        if: steps.route_roadmap.outcome == 'failure' && (github.event_name != 'pull_request' || vars.GOVERNANCE_STRICT_ON_PR == 'true')
        run: |
          echo "::error::Route roadmap gate failed in strict context."
          exit 1

      - name: Report route roadmap gate (advisory PR mode)
        if: steps.route_roadmap.outcome == 'failure' && github.event_name == 'pull_request' && vars.GOVERNANCE_STRICT_ON_PR != 'true'
        run: |
          echo "::warning::Route roadmap gate failed in advisory PR mode; continuing."

      - name: Generate route-role matrix artifact
        run: |
          npm run roadmap:route-matrix -- --out tools/route-role-matrix/governance/${{ github.run_id }}/route-role-matrix.json

      - name: Roadmap grounding strict gate
        run: |
          node scripts/validate-roadmap-grounding.mjs --strict --matrix tools/route-role-matrix/governance/${{ github.run_id }}/route-role-matrix.json

      - name: Roadmap role-gate strict validation
        run: |
          node scripts/validate-roadmap-role-gates.mjs --strict --matrix tools/route-role-matrix/governance/${{ github.run_id }}/route-role-matrix.json

      - name: Generate module grounding artifact
        run: |
          npm run roadmap:module-grounding -- --out tools/module-grounding/governance/${{ github.run_id }}/module-grounding-report.json

      - name: Module grounding strict validation
        run: |
          node scripts/validate-module-grounding.mjs --strict --report tools/module-grounding/governance/${{ github.run_id }}/module-grounding-report.json

      - name: Refresh Bob brain dump for wiring checks
        run: node scripts/auto-ingest.mjs

      - name: Bob training wiring verification
        run: node scripts/verify-bob-training-wiring.mjs --non-strict

      - name: Resolve required P0 workflow IDs
        id: required-workflows
        run: |
          echo "ids=$(node scripts/get-workflow-ids.mjs --criticality P0)" >> "$GITHUB_OUTPUT"

      - name: Collect governance evidence snapshot
        run: |
          npm run evidence:workflow -- --workflow "${{ steps.required-workflows.outputs.ids }}" --status governance-gate --notes "governance-release-gate:${{ github.run_id }}" --out-dir tools/workflow-evidence/governance/${{ github.run_id }}

      - name: Validate governance evidence snapshot
        run: |
          npm run evidence:workflow:validate -- --dir tools/workflow-evidence/governance/${{ github.run_id }} --required "${{ steps.required-workflows.outputs.ids }}"

      - name: Generate governance run summary JSON
        run: |
          npm run governance:summary -- --gate governance-release --requiredIds "${{ steps.required-workflows.outputs.ids }}" --evidenceDir tools/workflow-evidence/governance/${{ github.run_id }} --matrixDir tools/route-role-matrix/governance/${{ github.run_id }} --out tools/governance-run-summaries/governance-release/${{ github.run_id }}/run-summary.json --strict-doc-authority --strict-route-roadmap --strict-roadmap-grounding

      - name: Ensure governance artifact directories exist
        if: always()
        run: |
          set -euo pipefail
          mkdir -p tools/workflow-evidence/governance/${{ github.run_id }}
          mkdir -p tools/route-role-matrix/governance/${{ github.run_id }}
          mkdir -p tools/module-grounding/governance/${{ github.run_id }}
          mkdir -p tools/governance-run-summaries/governance-release/${{ github.run_id }}

          printf '{"run_id":"%s","gate":"governance-release","generated_at":"%s"}\n' "${{ github.run_id }}" "$(date -u +%FT%TZ)" > tools/workflow-evidence/governance/${{ github.run_id }}/_artifact-marker.json
          printf '{"run_id":"%s","gate":"governance-release","generated_at":"%s"}\n' "${{ github.run_id }}" "$(date -u +%FT%TZ)" > tools/route-role-matrix/governance/${{ github.run_id }}/_artifact-marker.json
          printf '{"run_id":"%s","gate":"governance-release","generated_at":"%s"}\n' "${{ github.run_id }}" "$(date -u +%FT%TZ)" > tools/module-grounding/governance/${{ github.run_id }}/_artifact-marker.json
          printf '{"run_id":"%s","gate":"governance-release","generated_at":"%s"}\n' "${{ github.run_id }}" "$(date -u +%FT%TZ)" > tools/governance-run-summaries/governance-release/${{ github.run_id }}/_artifact-marker.json

      - name: Upload governance evidence artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: governance-workflow-evidence-${{ github.run_id }}
          path: tools/workflow-evidence/governance/${{ github.run_id }}
          if-no-files-found: warn

      - name: Upload route-role matrix artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: governance-route-role-matrix-${{ github.run_id }}
          path: tools/route-role-matrix/governance/${{ github.run_id }}
          if-no-files-found: warn

      - name: Upload module grounding artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: governance-module-grounding-${{ github.run_id }}
          path: tools/module-grounding/governance/${{ github.run_id }}
          if-no-files-found: warn

      - name: Upload governance run summary artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: governance-run-summary-${{ github.run_id }}
          path: tools/governance-run-summaries/governance-release/${{ github.run_id }}
          if-no-files-found: warn

      - name: Publish governance summary
        if: always()
        run: |
          echo "## Governance Release Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "- Doc authority strict gate: ${{ steps.doc_authority.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Bob governance drift strict gate: ${{ steps.bob_governance_drift.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Staging doc presence/freshness gate: ${{ steps.staging_doc.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Lint warning budget gate: completed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Route roadmap strict gate: ${{ steps.route_roadmap.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Roadmap grounding strict gate: completed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Roadmap role-gate strict validation: completed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Module grounding strict validation: completed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Required workflow evidence IDs: ${{ steps.required-workflows.outputs.ids }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Evidence artifact path: tools/workflow-evidence/governance/${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Route-role matrix path: tools/route-role-matrix/governance/${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Module grounding path: tools/module-grounding/governance/${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Governance summary path: tools/governance-run-summaries/governance-release/${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ steps.bob_governance_drift.outcome }}" == "failure" ]]; then
            echo "- Bob governance drift failure focus: reconcile manual policy language with Bob runtime policy surfaces and rerun lint:bob-governance-drift." >> "$GITHUB_STEP_SUMMARY"
          fi

