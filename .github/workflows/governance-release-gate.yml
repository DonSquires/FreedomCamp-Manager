name: Governance Release Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/App.tsx'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'docs/MODULE_ROADMAP.md'
      - 'docs/ENTERPRISE_PAIR_REVIEW_CANONICAL.md'
      - 'docs/PHASE1_WORKFLOW_MATRIX_2026-05-02.json'
      - 'scripts/doc-authority-check.mjs'
      - 'scripts/collect-workflow-evidence.mjs'
      - 'scripts/validate-workflow-evidence.mjs'
      - '.github/workflows/governance-release-gate.yml'
      - 'package.json'
      - 'bun.lock'
  push:
    branches: [main]
    paths:
      - 'src/App.tsx'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'docs/MODULE_ROADMAP.md'
      - 'docs/ENTERPRISE_PAIR_REVIEW_CANONICAL.md'
      - 'docs/PHASE1_WORKFLOW_MATRIX_2026-05-02.json'
      - 'scripts/doc-authority-check.mjs'
      - 'scripts/collect-workflow-evidence.mjs'
      - 'scripts/validate-workflow-evidence.mjs'
      - '.github/workflows/governance-release-gate.yml'
      - 'package.json'
      - 'bun.lock'
  workflow_dispatch:

jobs:
  governance-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch for pull request diffs
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --prune --depth=1 origin "${{ github.base_ref }}"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Doc authority strict gate
        env:
          DOC_AUTHORITY_STRICT: 'true'
          DOC_AUTHORITY_DIFF_RANGE: ${{ github.event_name == 'pull_request' && format('origin/{0}...{1}', github.base_ref, github.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: bun run lint:doc-authority

      - name: Collect governance evidence snapshot
        run: |
          bun run evidence:workflow --workflow WF-01,WF-07,WF-11 --status governance-gate --notes "governance-release-gate:${{ github.run_id }}" --out-dir tools/workflow-evidence/governance/${{ github.run_id }}

      - name: Validate governance evidence snapshot
        run: |
          bun run evidence:workflow:validate -- --dir tools/workflow-evidence/governance/${{ github.run_id }} --required WF-01,WF-07,WF-11

      - name: Upload governance evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-workflow-evidence-${{ github.run_id }}
          path: tools/workflow-evidence/governance/${{ github.run_id }}
          if-no-files-found: error

      - name: Publish governance summary
        if: always()
        run: |
          echo "## Governance Release Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "- Doc authority strict gate: completed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Required workflow evidence IDs: WF-01, WF-07, WF-11" >> "$GITHUB_STEP_SUMMARY"
          echo "- Evidence artifact path: tools/workflow-evidence/governance/${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
