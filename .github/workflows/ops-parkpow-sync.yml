name: Ops — ParkPow Sync

# Synchronises parking lot data, watchlists, and violations with the ParkPow API
# by invoking the parkpow-sync Supabase Edge Function.
#
# Runs automatically every night at 02:00 UTC and can be triggered manually
# for any subset of sync actions.
#
# Required secrets:
#   SUPABASE_URL              — https://YOUR_REF.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY — Supabase service role key

on:
  schedule:
    # 02:00 UTC daily
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      parkpow_action:
        description: 'What to sync'
        required: false
        default: 'all'
        type: choice
        options: [sync-lots, sync-watchlist, push-violations, all]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  parkpow-sync:
    name: ParkPow sync (${{ github.event.inputs.parkpow_action || 'all' }})
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Check required secrets
        id: check-secrets
        run: |
          missing=""
          [ -z "$SUPABASE_URL"              ] && missing="$missing SUPABASE_URL"
          [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] && missing="$missing SUPABASE_SERVICE_ROLE_KEY"
          if [ -n "$missing" ]; then
            echo "::warning::Missing secrets:$missing — ParkPow sync skipped."
            echo "::notice::Add these at: GitHub repo → Settings → Secrets → Actions"
            echo "secrets_present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "secrets_present=true" >> "$GITHUB_OUTPUT"
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Determine actions to run
        if: steps.check-secrets.outputs.secrets_present == 'true'
        id: actions
        run: |
          INPUT="${{ github.event.inputs.parkpow_action || 'all' }}"
          if [ "$INPUT" = "all" ]; then
            echo "actions=sync-lots sync-watchlist push-violations" >> "$GITHUB_OUTPUT"
          else
            echo "actions=$INPUT" >> "$GITHUB_OUTPUT"
          fi

      - name: Run ParkPow sync action(s)
        if: steps.check-secrets.outputs.secrets_present == 'true'
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          for action in ${{ steps.actions.outputs.actions }}; do
            echo "→ Running ParkPow action: $action …"
            RESPONSE=$(curl -s -w "\n%{http_code}" \
              -X POST \
              "${SUPABASE_URL}/functions/v1/parkpow-sync" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Content-Type: application/json" \
              -d "{\"action\": \"$action\"}")

            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | head -n-1)

            echo "  HTTP $HTTP_CODE"
            echo "  $BODY"

            if [ "$HTTP_CODE" -ge 500 ]; then
              echo "::warning::ParkPow sync action '$action' returned HTTP $HTTP_CODE (upstream issue, will retry next run)"
            elif [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
              echo "::error::ParkPow sync action '$action' failed (HTTP $HTTP_CODE)"
              exit 1
            fi
            echo "  ✅ $action complete"
          done
          echo ""
          echo "✅ All ParkPow sync actions complete."
