name: Generate Android Keystore

on:
  workflow_dispatch:
    inputs:
      keystore_password:
        description: 'Password for the keystore (make up a secure password)'
        required: true
        type: string
      key_alias:
        description: 'Alias for the key'
        required: true
        default: 'freedomcamp'
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Keystore
        run: |
          keytool -genkey -v \
            -keystore android.keystore \
            -alias "${{ github.event.inputs.key_alias }}" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "${{ github.event.inputs.keystore_password }}" \
            -keypass "${{ github.event.inputs.keystore_password }}" \
            -dname "CN=FreedomCamp, OU=App, O=FreedomCamp, L=City, S=State, C=US"

      - name: Convert to Base64
        run: |
          base64 android.keystore | tr -d '\n' > keystore-base64.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-keystore-files
          path: |
            android.keystore
            keystore-base64.txt
          retention-days: 1
