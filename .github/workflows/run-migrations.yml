name: Run Database Migrations

# -----------------------------------------------------------------------
# Applies pending Supabase migrations from the GitHub web UI.
# No local install required.
#
# Required repository secrets:
#   SUPABASE_ACCESS_TOKEN   – from https://supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF    – your project ref (e.g. abcdefghijklmnop)
#   SUPABASE_DB_PASSWORD    – database password (Supabase → Settings → Database)
#
# How to run:
#   GitHub repo → Actions → "Run Database Migrations" → Run workflow
# -----------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run only? (shows what would change without applying)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      migration_file:
        description: 'Run a specific migration file (leave blank for all pending)'
        required: false
        default: ''

jobs:
  migrate:
    name: Apply migrations
    runs-on: ubuntu-latest

    steps:
      - name: Check required secrets
        run: |
          missing=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$SUPABASE_PROJECT_REF"  ] && missing="$missing SUPABASE_PROJECT_REF"
          [ -z "$SUPABASE_DB_PASSWORD"  ] && missing="$missing SUPABASE_DB_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing"
            echo "::notice::Add these at: GitHub repo → Settings → Secrets → Actions"
            exit 1
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: List pending migrations (dry run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          echo "=== Pending migrations in supabase/migrations/ ==="
          ls -la supabase/migrations/ || echo "(no migrations folder)"
          echo ""
          echo "=== Would run: supabase db push ==="
          echo "Set 'dry run' to false and re-run to apply."

      - name: Apply specific migration
        if: ${{ github.event.inputs.dry_run == 'false' && github.event.inputs.migration_file != '' }}
        run: |
          FILE="supabase/migrations/${{ github.event.inputs.migration_file }}"
          if [ ! -f "$FILE" ]; then
            echo "::error::Migration file not found: $FILE"
            exit 1
          fi
          echo "Applying migration: $FILE"
          # Use psql via the Supabase db URL
          PGPASSWORD="$SUPABASE_DB_PASSWORD" psql \
            "postgresql://postgres.${SUPABASE_PROJECT_REF}:${SUPABASE_DB_PASSWORD}@aws-0-ap-southeast-2.pooler.supabase.com:5432/postgres" \
            -f "$FILE" \
            -v ON_ERROR_STOP=1
          echo "✅ Migration applied."
        env:
          SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Apply all pending migrations
        if: ${{ github.event.inputs.dry_run == 'false' && github.event.inputs.migration_file == '' }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push --password "$SUPABASE_DB_PASSWORD"
          echo "✅ All pending migrations applied."
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF:  ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
