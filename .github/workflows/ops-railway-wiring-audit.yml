name: Ops Wiring Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-railway-wiring-audit.yml'
      - '.github/workflows/deploy-*.yml'
      - 'supabase/functions/check-services-health/**'
      - 'docs/ENVIRONMENT_VARIABLES.md'
      - 'docs/DEPLOYMENT_GUIDE.md'
  schedule:
    - cron: '0 0 * * *'   # once a day at midnight UTC
  workflow_dispatch:
    inputs:
      vite_supabase_url_override:
        description: 'Optional VITE_SUPABASE_URL override for this run only'
        required: false
        type: string
      inference_service_url_override:
        description: 'Optional INFERENCE_SERVICE_URL override for this run only'
        required: false
        type: string
      proxy_server_url_override:
        description: 'Optional PROXY_SERVER_URL override for this run only'
        required: false
        type: string
      ptt_server_url_override:
        description: 'Optional PTT_SERVER_URL override for this run only'
        required: false
        type: string
      inference_api_key_override:
        description: 'Optional INFERENCE_API_KEY/BOB_INFERENCE_API_KEY override for this run only'
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  audit:
    name: Validate Service Wiring (Bob/RunPod + Proxy/Railway + PTT/VPS)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Load normalized service credential env
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          INFERENCE_SERVICE_URL: ${{ secrets.INFERENCE_SERVICE_URL }}
          BOB_SERVICE_URL: ${{ secrets.BOB_SERVICE_URL }}
          PROXY_SERVER_URL: ${{ secrets.PROXY_SERVER_URL }}
          PROXY_SERVICE_URL: ${{ secrets.PROXY_SERVICE_URL }}
          NZSCV_PROXY_URL: ${{ secrets.NZSCV_PROXY_URL }}
          PTT_SERVER_URL: ${{ secrets.PTT_SERVER_URL }}
          PTT_SERVICE_URL: ${{ secrets.PTT_SERVICE_URL }}
          INFERENCE_API_KEY: ${{ secrets.INFERENCE_API_KEY }}
          BOB_INFERENCE_API_KEY: ${{ secrets.BOB_INFERENCE_API_KEY }}
        run: |
          source ./scripts/load-railway-secrets-from-github-env.sh --quiet

      - name: Apply workflow dispatch overrides
        if: github.event_name == 'workflow_dispatch'
        env:
          VITE_SUPABASE_URL_OVERRIDE: ${{ github.event.inputs.vite_supabase_url_override }}
          INFERENCE_SERVICE_URL_OVERRIDE: ${{ github.event.inputs.inference_service_url_override }}
          PROXY_SERVER_URL_OVERRIDE: ${{ github.event.inputs.proxy_server_url_override }}
          PTT_SERVER_URL_OVERRIDE: ${{ github.event.inputs.ptt_server_url_override }}
          INFERENCE_API_KEY_OVERRIDE: ${{ github.event.inputs.inference_api_key_override }}
        run: |
          set -euo pipefail
          [ -z "${VITE_SUPABASE_URL_OVERRIDE:-}" ] || echo "VITE_SUPABASE_URL=${VITE_SUPABASE_URL_OVERRIDE}" >> "$GITHUB_ENV"
          [ -z "${INFERENCE_SERVICE_URL_OVERRIDE:-}" ] || echo "INFERENCE_SERVICE_URL=${INFERENCE_SERVICE_URL_OVERRIDE}" >> "$GITHUB_ENV"
          [ -z "${PROXY_SERVER_URL_OVERRIDE:-}" ] || echo "PROXY_SERVER_URL=${PROXY_SERVER_URL_OVERRIDE}" >> "$GITHUB_ENV"
          [ -z "${PTT_SERVER_URL_OVERRIDE:-}" ] || echo "PTT_SERVER_URL=${PTT_SERVER_URL_OVERRIDE}" >> "$GITHUB_ENV"
          if [ -n "${INFERENCE_API_KEY_OVERRIDE:-}" ]; then
            echo "::add-mask::${INFERENCE_API_KEY_OVERRIDE}"
            echo "INFERENCE_API_KEY=${INFERENCE_API_KEY_OVERRIDE}" >> "$GITHUB_ENV"
            echo "BOB_INFERENCE_API_KEY=${INFERENCE_API_KEY_OVERRIDE}" >> "$GITHUB_ENV"
          fi

      - name: Validate required secret presence
        run: |
          set -euo pipefail
          missing=""
          [ -z "${VITE_SUPABASE_URL:-}" ] && missing="$missing VITE_SUPABASE_URL"
          [ -z "${BOB_SERVICE_URL:-${INFERENCE_SERVICE_URL:-}}" ] && missing="$missing BOB_SERVICE_URL-or-INFERENCE_SERVICE_URL"
          [ -z "${PROXY_SERVER_URL:-}" ] && missing="$missing PROXY_SERVER_URL"
          [ -z "${PTT_SERVER_URL:-}" ] && missing="$missing PTT_SERVER_URL"
          [ -z "${INFERENCE_API_KEY:-${BOB_INFERENCE_API_KEY:-}}" ] && missing="$missing INFERENCE_API_KEY-or-BOB_INFERENCE_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing"
            exit 1
          fi

      - name: Query and validate check-services-health
        run: |
          set -euo pipefail

          normalize_url() {
            local value="${1%/}"
            if [[ "$value" != http://* && "$value" != https://* ]]; then
              value="https://$value"
            fi
            printf "%s" "$value"
          }

          EXPECT_INFERENCE_URL="$(normalize_url "${BOB_SERVICE_URL:-$INFERENCE_SERVICE_URL}")"
          EXPECT_PROXY_URL="$(normalize_url "$PROXY_SERVER_URL")"
          EXPECT_PTT_URL="$(normalize_url "$PTT_SERVER_URL")"
          FN_URL="${VITE_SUPABASE_URL%/}/functions/v1/check-services-health"

          HTTP_STATUS=$(curl -sS -o /tmp/railway-health.json -w "%{http_code}" --max-time 30 "$FN_URL")
          cat /tmp/railway-health.json
          [ "$HTTP_STATUS" = "200" ] || { echo "::error::check-services-health returned HTTP $HTTP_STATUS"; exit 1; }

          ACTUAL_PROXY_URL="$(jq -r '.proxy_url // ""' /tmp/railway-health.json)"
          ACTUAL_INFERENCE_URL="$(jq -r '.inference_url // ""' /tmp/railway-health.json)"
          ACTUAL_PTT_URL="$(jq -r '.ptt_url // ""' /tmp/railway-health.json)"
          PROXY_STATUS="$(jq -r '.proxy.status // "unknown"' /tmp/railway-health.json)"
          INFERENCE_STATUS="$(jq -r '.inference.status // "unknown"' /tmp/railway-health.json)"
          PTT_STATUS="$(jq -r '.ptt.status // "unknown"' /tmp/railway-health.json)"
          CHAT_PROVIDER="$(jq -r '.inference.config.CHAT_PROVIDER // ""' /tmp/railway-health.json)"
          TABULAR_PROVIDER="$(jq -r '.inference.config.TABULAR_NLP_PROVIDER // ""' /tmp/railway-health.json)"
          DEPLOY_SIGNATURE="$(jq -r '.inference.config.DEPLOY_SIGNATURE // ""' /tmp/railway-health.json)"
          OPERATING_MODE="$(jq -r '.inference.config.OPERATING_MODE // ""' /tmp/railway-health.json)"
          SELF_CONTAINED_MODE="$(jq -r '.inference.config.SELF_CONTAINED_MODE // false' /tmp/railway-health.json)"
          REQUIRE_SELF_CONTAINED_MODE="$(jq -r '.inference.config.REQUIRE_SELF_CONTAINED_MODE // false' /tmp/railway-health.json)"
          SELF_CONTAINED_STRICT_EGRESS="$(jq -r '.inference.config.SELF_CONTAINED_STRICT_EGRESS // false' /tmp/railway-health.json)"
          OPENAI_API_KEY_SET="$(jq -r '.inference.config.OPENAI_API_KEY_SET // false' /tmp/railway-health.json)"
          INFERENCE_KEY_CONFIGURED="$(jq -r '.inference_api_key_configured // false' /tmp/railway-health.json)"
          CHAT_LOCAL_OLLAMA_ENABLED="$(jq -r '.inference.chat_local_ollama_enabled // .inference.config.OLLAMA_ENABLED // "unknown"' /tmp/railway-health.json)"

          [ "$ACTUAL_PROXY_URL" = "$EXPECT_PROXY_URL" ] || echo "::warning::Proxy URL mismatch. expected=$EXPECT_PROXY_URL actual=$ACTUAL_PROXY_URL"
          [ "$ACTUAL_INFERENCE_URL" = "$EXPECT_INFERENCE_URL" ] || echo "::warning::Inference URL mismatch. expected=$EXPECT_INFERENCE_URL actual=$ACTUAL_INFERENCE_URL"
          [ "$ACTUAL_PTT_URL" = "$EXPECT_PTT_URL" ] || echo "::warning::PTT URL mismatch. expected=$EXPECT_PTT_URL actual=$ACTUAL_PTT_URL (update PTT_SERVER_URL secret to match)"
          [ "$PROXY_STATUS" = "ok" ] || echo "::warning::Proxy status is not ok: $PROXY_STATUS"
          [ "$INFERENCE_STATUS" = "healthy" ] || echo "::warning::Inference status is not healthy: $INFERENCE_STATUS"
          [ "$PTT_STATUS" = "ok" ] || echo "::warning::PTT status is not ok: $PTT_STATUS"
          [ "$INFERENCE_KEY_CONFIGURED" = "true" ] || echo "::warning::Inference API key is not configured from edge perspective"

          # Only validate inference config fields when the service is actually online.
          if [ "$INFERENCE_STATUS" = "healthy" ]; then
            [ "$CHAT_PROVIDER" = "ollama" ] || { echo "::error::Expected CHAT_PROVIDER=ollama but got $CHAT_PROVIDER"; exit 1; }
            [ "$TABULAR_PROVIDER" = "ollama" ] || { echo "::error::Expected TABULAR_NLP_PROVIDER=ollama but got $TABULAR_PROVIDER"; exit 1; }
            [ "$DEPLOY_SIGNATURE" = "bob-build-training-open-v1" ] || echo "::warning::Expected DEPLOY_SIGNATURE=bob-build-training-open-v1 but got $DEPLOY_SIGNATURE"
          else
            echo "ℹ️  Skipping inference config checks — inference service is offline."
          fi

          # Mode-conditional checks: self-contained locks down external egress;
          # build-training mode allows external calls (Ollama still required).
          if [ "$OPERATING_MODE" = "self-contained" ]; then
            [ "$SELF_CONTAINED_MODE" = "true" ] || echo "::warning::Expected SELF_CONTAINED_MODE=true in self-contained mode but got $SELF_CONTAINED_MODE"
            [ "$REQUIRE_SELF_CONTAINED_MODE" = "true" ] || echo "::warning::REQUIRE_SELF_CONTAINED_MODE is $REQUIRE_SELF_CONTAINED_MODE (expected true)."
            [ "$SELF_CONTAINED_STRICT_EGRESS" = "true" ] || echo "::warning::SELF_CONTAINED_STRICT_EGRESS is $SELF_CONTAINED_STRICT_EGRESS (expected true)."
            [ "$OPENAI_API_KEY_SET" = "false" ] || echo "::warning::Expected OPENAI_API_KEY_SET=false in self-contained mode but got $OPENAI_API_KEY_SET"
          elif [ "$OPERATING_MODE" = "build-training" ]; then
            echo "ℹ️  OPERATING_MODE=build-training — skipping self-contained-mode checks."
            [ "$SELF_CONTAINED_MODE" = "false" ] || echo "::warning::Expected SELF_CONTAINED_MODE=false in build-training mode; got $SELF_CONTAINED_MODE"
            [ "$OPENAI_API_KEY_SET" = "false" ] || echo "::warning::OPENAI_API_KEY_SET=$OPENAI_API_KEY_SET (expected false for Ollama-only runtime)."
          else
            echo "::warning::Unrecognised OPERATING_MODE='$OPERATING_MODE'; skipping mode-specific checks."
          fi

          # Ollama private networking check — warning only (Ollama may be warming up).
          if [ "$CHAT_LOCAL_OLLAMA_ENABLED" = "true" ]; then
            echo "✅ chat_local_ollama_enabled=true — Bob ↔ Ollama private networking is working."
          elif [ "$CHAT_LOCAL_OLLAMA_ENABLED" = "false" ]; then
            echo "::warning::chat_local_ollama_enabled=false — Bob cannot reach Ollama via private network."
          echo "  Check: OLLAMA_BASE_URL set to RunPod pod or localhost Ollama endpoint on Bob container."
          echo "  Check: RunPod serverless endpoint n0bp1ifmq01cx2 template has correct env vars."
          echo "  Check: Ollama service is running on the pod (GET <gateway-url>/api/tags)."
          else
            echo "ℹ️  chat_local_ollama_enabled not in health response — Bob build may be older than this check."
          fi

          echo "✅ Railway + Edge wiring is consistent"
