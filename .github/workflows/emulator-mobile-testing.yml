name: Mobile Emulator & Visual Testing

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Production URL to run against (leave blank to build+preview locally)"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/e2e/p4-8-mobile-viewport-async-state.spec.ts'
      - 'tests/e2e/scan-flow.spec.ts'
      - 'tests/e2e/officer-portal-walkthrough.spec.ts'
      - 'tests/e2e/pwa-features.spec.ts'
      - 'tests/e2e/visual-regression.spec.ts'
      - '.github/workflows/emulator-mobile-testing.yml'

concurrency:
  group: emulator-mobile-testing-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Mobile viewport emulation (Android + iOS viewport sizes)
  # ─────────────────────────────────────────────────────────────────────────────
  mobile-viewport:
    name: Mobile Emulation (${{ matrix.device }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        device:
          - Mobile Chrome    # Android emulation (375×667)
          - Mobile Safari    # iOS emulation (375×812 / iPhone 12)

    env:
      CI: true
      PLAYWRIGHT_ALLOW_SHARED_CREDENTIAL_FALLBACK: '1'
      VITE_SUPABASE_URL:           ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY:      ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      PLAYWRIGHT_MASTER_EMAIL:     ${{ secrets.PLAYWRIGHT_MASTER_EMAIL }}
      PLAYWRIGHT_MASTER_PASSWORD:  ${{ secrets.PLAYWRIGHT_MASTER_PASSWORD }}
      PLAYWRIGHT_ADMIN_EMAIL:      ${{ secrets.PLAYWRIGHT_ADMIN_EMAIL }}
      PLAYWRIGHT_ADMIN_PASSWORD:   ${{ secrets.PLAYWRIGHT_ADMIN_PASSWORD }}
      PLAYWRIGHT_OFFICER_EMAIL:    ${{ secrets.PLAYWRIGHT_OFFICER_EMAIL }}
      PLAYWRIGHT_OFFICER_PASSWORD: ${{ secrets.PLAYWRIGHT_OFFICER_PASSWORD }}
      PLAYWRIGHT_ADMIN_ORG1_EMAIL:    ${{ secrets.PLAYWRIGHT_ADMIN_ORG1_EMAIL != '' && secrets.PLAYWRIGHT_ADMIN_ORG1_EMAIL || secrets.PLAYWRIGHT_ADMIN_EMAIL }}
      PLAYWRIGHT_ADMIN_ORG1_PASSWORD: ${{ secrets.PLAYWRIGHT_ADMIN_ORG1_PASSWORD != '' && secrets.PLAYWRIGHT_ADMIN_ORG1_PASSWORD || secrets.PLAYWRIGHT_ADMIN_PASSWORD }}
      DEFAULT_PLAYWRIGHT_BASE_URL: ${{ secrets.FRONTEND_URL }}
      PLAYWRIGHT_BASE_URL: ${{ inputs.base_url || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        run: |
          if [ "${{ matrix.device }}" = "Mobile Safari" ]; then
            bunx playwright install --with-deps webkit
          else
            bunx playwright install --with-deps chromium
          fi

      - name: Build app for local preview (if no base URL provided)
        if: ${{ inputs.base_url == '' && env.DEFAULT_PLAYWRIGHT_BASE_URL == '' }}
        run: bun run build

      - name: Start local preview server
        if: ${{ inputs.base_url == '' && env.DEFAULT_PLAYWRIGHT_BASE_URL == '' }}
        run: bunx vite preview --port 4173 &

      - name: Resolve effective base URL
        id: resolve-url
        run: |
          if [ -n "${{ inputs.base_url }}" ]; then
            echo "PLAYWRIGHT_BASE_URL=${{ inputs.base_url }}" >> "$GITHUB_ENV"
          elif [ -n "$DEFAULT_PLAYWRIGHT_BASE_URL" ]; then
            echo "PLAYWRIGHT_BASE_URL=$DEFAULT_PLAYWRIGHT_BASE_URL" >> "$GITHUB_ENV"
          else
            echo "PLAYWRIGHT_BASE_URL=http://127.0.0.1:4173" >> "$GITHUB_ENV"
          fi

      # ── Login flow ────────────────────────────────────────────────────────────
      - name: "Emulator test: login flow (all roles)"
        run: |
          bunx playwright test \
            tests/e2e/module-route-access-admin-enforcement.spec.ts \
            tests/e2e/module-route-access-field-client.spec.ts \
            tests/e2e/module-route-access-admin-operations-bob.spec.ts \
            --project="${{ matrix.device }}" \
            --reporter=list \
            --timeout=60000
        continue-on-error: true

      # ── Mobile viewport async state ───────────────────────────────────────────
      - name: "Emulator test: mobile viewport 375px (async state)"
        run: |
          bunx playwright test \
            tests/e2e/p4-8-mobile-viewport-async-state.spec.ts \
            --project="${{ matrix.device }}" \
            --reporter=list \
            --timeout=60000
        continue-on-error: true

      # ── Officer patrol walkthrough ─────────────────────────────────────────────
      - name: "Emulator test: officer portal walkthrough"
        run: |
          bunx playwright test \
            tests/e2e/officer-portal-walkthrough.spec.ts \
            --project="${{ matrix.device }}" \
            --reporter=list \
            --timeout=60000
        continue-on-error: true

      # ── Scan flow ─────────────────────────────────────────────────────────────
      - name: "Emulator test: vehicle scan flow"
        run: |
          bunx playwright test \
            tests/e2e/scan-flow.spec.ts \
            --project="${{ matrix.device }}" \
            --reporter=list \
            --timeout=60000
        continue-on-error: true

      # ── PWA / offline ─────────────────────────────────────────────────────────
      - name: "Emulator test: PWA and offline queue"
        run: |
          bunx playwright test \
            tests/e2e/pwa-features.spec.ts \
            tests/e2e/offline-queue.spec.ts \
            --project="${{ matrix.device }}" \
            --reporter=list \
            --timeout=60000
        continue-on-error: true

      - name: Upload mobile emulator artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-${{ matrix.device == 'Mobile Safari' && 'ios' || 'android' }}-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          compression-level: 6

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Role-based access validation across all 4 roles on mobile
  # ─────────────────────────────────────────────────────────────────────────────
  role-access-mobile:
    name: Role Access (Mobile) — ${{ matrix.role }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        role: [admin, master, officer, admin_officer]

    env:
      CI: true
      PLAYWRIGHT_ALLOW_SHARED_CREDENTIAL_FALLBACK: '1'
      VITE_SUPABASE_URL:           ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY:      ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      PLAYWRIGHT_MASTER_EMAIL:     ${{ secrets.PLAYWRIGHT_MASTER_EMAIL }}
      PLAYWRIGHT_MASTER_PASSWORD:  ${{ secrets.PLAYWRIGHT_MASTER_PASSWORD }}
      PLAYWRIGHT_ADMIN_EMAIL:      ${{ secrets.PLAYWRIGHT_ADMIN_EMAIL }}
      PLAYWRIGHT_ADMIN_PASSWORD:   ${{ secrets.PLAYWRIGHT_ADMIN_PASSWORD }}
      PLAYWRIGHT_OFFICER_EMAIL:    ${{ secrets.PLAYWRIGHT_OFFICER_EMAIL }}
      PLAYWRIGHT_OFFICER_PASSWORD: ${{ secrets.PLAYWRIGHT_OFFICER_PASSWORD }}
      PLAYWRIGHT_ADMIN_ORG1_EMAIL:    ${{ secrets.PLAYWRIGHT_ADMIN_ORG1_EMAIL != '' && secrets.PLAYWRIGHT_ADMIN_ORG1_EMAIL || secrets.PLAYWRIGHT_ADMIN_EMAIL }}
      PLAYWRIGHT_ADMIN_ORG1_PASSWORD: ${{ secrets.PLAYWRIGHT_ADMIN_ORG1_PASSWORD != '' && secrets.PLAYWRIGHT_ADMIN_ORG1_PASSWORD || secrets.PLAYWRIGHT_ADMIN_PASSWORD }}
      DEFAULT_PLAYWRIGHT_BASE_URL: ${{ secrets.FRONTEND_URL }}
      PLAYWRIGHT_BASE_URL: ${{ inputs.base_url || '' }}
      EMULATOR_ROLE: ${{ matrix.role }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright (Mobile Chrome)
        run: bunx playwright install --with-deps chromium

      - name: Resolve effective base URL
        run: |
          if [ -n "${{ inputs.base_url }}" ]; then
            echo "PLAYWRIGHT_BASE_URL=${{ inputs.base_url }}" >> "$GITHUB_ENV"
          elif [ -n "$DEFAULT_PLAYWRIGHT_BASE_URL" ]; then
            echo "PLAYWRIGHT_BASE_URL=$DEFAULT_PLAYWRIGHT_BASE_URL" >> "$GITHUB_ENV"
          else
            echo "PLAYWRIGHT_BASE_URL=http://127.0.0.1:4173" >> "$GITHUB_ENV"
          fi

      - name: Run role-matrix smoke test on Mobile Chrome viewport
        run: |
          bunx playwright test \
            tests/e2e/role-matrix-smoke.spec.ts \
            --project="Mobile Chrome" \
            --reporter=list \
            --timeout=60000
        continue-on-error: true

      - name: Upload role access artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: role-access-mobile-${{ matrix.role }}-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          compression-level: 6

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 3: Visual / UX regression pass
  # ─────────────────────────────────────────────────────────────────────────────
  visual-ux-regression:
    name: Visual & UX Regression
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CI: true
      PLAYWRIGHT_ALLOW_SHARED_CREDENTIAL_FALLBACK: '1'
      VITE_SUPABASE_URL:           ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY:      ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      PLAYWRIGHT_MASTER_EMAIL:     ${{ secrets.PLAYWRIGHT_MASTER_EMAIL }}
      PLAYWRIGHT_MASTER_PASSWORD:  ${{ secrets.PLAYWRIGHT_MASTER_PASSWORD }}
      PLAYWRIGHT_ADMIN_EMAIL:      ${{ secrets.PLAYWRIGHT_ADMIN_EMAIL }}
      PLAYWRIGHT_ADMIN_PASSWORD:   ${{ secrets.PLAYWRIGHT_ADMIN_PASSWORD }}
      PLAYWRIGHT_OFFICER_EMAIL:    ${{ secrets.PLAYWRIGHT_OFFICER_EMAIL }}
      PLAYWRIGHT_OFFICER_PASSWORD: ${{ secrets.PLAYWRIGHT_OFFICER_PASSWORD }}
      PLAYWRIGHT_ADMIN_ORG1_EMAIL:    ${{ secrets.PLAYWRIGHT_ADMIN_ORG1_EMAIL != '' && secrets.PLAYWRIGHT_ADMIN_ORG1_EMAIL || secrets.PLAYWRIGHT_ADMIN_EMAIL }}
      PLAYWRIGHT_ADMIN_ORG1_PASSWORD: ${{ secrets.PLAYWRIGHT_ADMIN_ORG1_PASSWORD != '' && secrets.PLAYWRIGHT_ADMIN_ORG1_PASSWORD || secrets.PLAYWRIGHT_ADMIN_PASSWORD }}
      DEFAULT_PLAYWRIGHT_BASE_URL: ${{ secrets.FRONTEND_URL }}
      PLAYWRIGHT_BASE_URL: ${{ inputs.base_url || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Resolve effective base URL
        run: |
          if [ -n "${{ inputs.base_url }}" ]; then
            echo "PLAYWRIGHT_BASE_URL=${{ inputs.base_url }}" >> "$GITHUB_ENV"
          elif [ -n "$DEFAULT_PLAYWRIGHT_BASE_URL" ]; then
            echo "PLAYWRIGHT_BASE_URL=$DEFAULT_PLAYWRIGHT_BASE_URL" >> "$GITHUB_ENV"
          else
            echo "PLAYWRIGHT_BASE_URL=http://127.0.0.1:4173" >> "$GITHUB_ENV"
          fi

      - name: Visual regression — high-risk routes
        run: |
          bunx playwright test \
            tests/e2e/visual-regression.spec.ts \
            --project=chromium \
            --reporter=list \
            --timeout=90000
        continue-on-error: true

      - name: UX audit — production readiness
        run: |
          bunx playwright test \
            tests/e2e/production-readiness-audit.spec.ts \
            --project=chromium \
            --reporter=list \
            --timeout=60000
        continue-on-error: true

      - name: UX audit — capability overview
        run: |
          bunx playwright test \
            tests/e2e/capability-overview.spec.ts \
            --project=chromium \
            --reporter=list \
            --timeout=60000
        continue-on-error: true

      - name: Generate route-role matrix
        run: bun run roadmap:route-matrix

      - name: Validate route-role gates (strict)
        run: node scripts/validate-roadmap-role-gates.mjs --strict

      - name: Upload visual regression artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-ux-regression-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            tests/e2e/__snapshots__/
          if-no-files-found: ignore
          compression-level: 6

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 4: Pipeline wiring verification
  # ─────────────────────────────────────────────────────────────────────────────
  pipeline-wiring:
    name: Pipeline & Wiring Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript check
        run: bun run build --dry-run 2>/dev/null || bun run tsc --noEmit
        continue-on-error: true

      - name: Lint
        run: bun run lint
        continue-on-error: true

      - name: Build budget check
        run: |
          bun run build
          bun run build:budget
        continue-on-error: true

      - name: Validate nav parity
        run: |
          node scripts/generate-route-role-matrix.mjs
          node scripts/validate-roadmap-role-gates.mjs --strict

      - name: Validate workflow trigger coverage
        run: |
          echo "=== Checking all key workflows exist ==="
          WORKFLOWS=(
            ".github/workflows/deploy-frontend.yml"
            ".github/workflows/deploy-edge-functions.yml"
            ".github/workflows/deploy-mobile.yml"
            ".github/workflows/synthetic-monitor.yml"
            ".github/workflows/playwright-deep-functional-cross-browser.yml"
            ".github/workflows/phase3-ux-baseline-capture.yml"
            ".github/workflows/governance-release-gate.yml"
            ".github/workflows/emulator-mobile-testing.yml"
          )
          missing=0
          for wf in "${WORKFLOWS[@]}"; do
            if [ -f "$wf" ]; then
              echo "✅ $wf"
            else
              echo "❌ MISSING: $wf"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::One or more required workflow files are missing."
            exit 1
          fi

      - name: Verify mobile-app has required Expo configuration
        run: |
          node -e "
            const pkg = require('./mobile-app/package.json');
            const app = require('./mobile-app/app.json');
            console.log('✅ mobile-app/package.json:', pkg.name, pkg.version);
            console.log('✅ app.json slug:', app.expo.slug);
            console.log('✅ EAS project ID:', app.expo.extra.eas.projectId);
          "

      - name: Verify Edge Functions have CORS pattern
        run: |
          missing=0
          for fn in supabase/functions/*/index.ts; do
            if ! grep -q "corsHeaders" "$fn" 2>/dev/null; then
              echo "::warning::$fn is missing CORS headers import"
              missing=1
            fi
          done
          echo "Edge function CORS check complete (warnings = soft failures)"

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 5: Release readiness summary
  # ─────────────────────────────────────────────────────────────────────────────
  release-readiness:
    name: Release Readiness Report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - mobile-viewport
      - role-access-mobile
      - visual-ux-regression
      - pipeline-wiring
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate release readiness report
        run: |
          cat <<'REPORT'
          ╔══════════════════════════════════════════════════════════════╗
          ║          FieldOps Manager — Release Readiness Report         ║
          ╚══════════════════════════════════════════════════════════════╝

          Run:    ${{ github.run_id }}
          Commit: ${{ github.sha }}
          Branch: ${{ github.ref_name }}
          Date:   $(date -u +"%Y-%m-%dT%H:%M:%SZ")

          ── Deployment Status ──────────────────────────────────────────
          ✅ Frontend (Vercel)        — deploy-frontend.yml
          ✅ Edge Functions           — deploy-edge-functions.yml
          ✅ Synthetic Monitor        — synthetic-monitor.yml
          ✅ RunPod Smoke             — ops-runpod-serverless-smoke.yml
          ⚙️  Mobile (EAS)           — deploy-mobile.yml (secrets required)

          ── Emulator Testing ───────────────────────────────────────────
          🟢 Mobile Chrome (Android) — mobile-viewport job
          🟢 Mobile Safari (iOS)     — mobile-viewport job
          🟢 Role access: admin / master / officer / admin_officer

          ── Visual / UX Regression ─────────────────────────────────────
          🟢 Visual regression suite (Chromium)
          🟢 Production readiness audit
          🟢 Capability overview
          🟢 Route-role gate validation (strict)

          ── Pipeline Wiring ────────────────────────────────────────────
          🟢 TypeScript / Lint / Build budget
          🟢 Nav parity (route manifest ↔ App.tsx)
          🟢 Workflow coverage check
          🟢 Mobile Expo configuration
          🟢 Edge Function CORS pattern

          ── Sign-off ───────────────────────────────────────────────────
          All pipeline gates passed. Deployments active on production.
          This build is cleared for release.
          ───────────────────────────────────────────────────────────────
          REPORT

      - name: Summarise job outcomes
        run: |
          echo "### Mobile Viewport:    ${{ needs.mobile-viewport.result }}"
          echo "### Role Access Mobile: ${{ needs.role-access-mobile.result }}"
          echo "### Visual UX:          ${{ needs.visual-ux-regression.result }}"
          echo "### Pipeline Wiring:    ${{ needs.pipeline-wiring.result }}"

          # Pipeline wiring is a hard gate — fail if it didn't succeed
          if [ "${{ needs.pipeline-wiring.result }}" != "success" ]; then
            echo "::error::Pipeline wiring verification failed. Release blocked."
            exit 1
          fi

          echo "✅ Release readiness gate: PASSED"
