name: Playwright Deep Functional Cross-Browser

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'tests/e2e/**'
      - 'playwright.config.ts'
      - 'playwright.deep-lite.config.ts'
      - 'playwright.api.config.ts'
      - 'package.json'
      - 'bun.lock'
      - 'vite.config.ts'
      - '.github/workflows/playwright-deep-functional-cross-browser.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'tests/e2e/**'
      - 'playwright.config.ts'
      - 'playwright.deep-lite.config.ts'
      - 'playwright.api.config.ts'
      - 'package.json'
      - 'bun.lock'
      - 'vite.config.ts'
      - '.github/workflows/playwright-deep-functional-cross-browser.yml'
  workflow_dispatch:
    inputs:
      base_url:
        description: "Optional base URL override"
        required: false
        type: string

concurrency:
  group: deep-functional-cross-browser-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  deep-functional:
    name: Deep Functional (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # App login revokes other active sessions for the same user.
      # Running browser projects concurrently with shared CI identities causes
      # cross-job auth invalidation and mid-suite redirects to /login.
      max-parallel: 1
      matrix:
        project:
          - webkit
          - Mobile Safari

    env:
      CI: true
      PLAYWRIGHT_ALLOW_SHARED_CREDENTIAL_FALLBACK: '1'
      PLAYWRIGHT_ADMIN_EMAIL: ${{ secrets.PLAYWRIGHT_ADMIN_EMAIL }}
      PLAYWRIGHT_ADMIN_PASSWORD: ${{ secrets.PLAYWRIGHT_ADMIN_PASSWORD }}
      PLAYWRIGHT_MASTER_EMAIL: ${{ secrets.PLAYWRIGHT_MASTER_EMAIL }}
      PLAYWRIGHT_MASTER_PASSWORD: ${{ secrets.PLAYWRIGHT_MASTER_PASSWORD }}
      PLAYWRIGHT_OFFICER_EMAIL: ${{ secrets.PLAYWRIGHT_OFFICER_EMAIL }}
      PLAYWRIGHT_OFFICER_PASSWORD: ${{ secrets.PLAYWRIGHT_OFFICER_PASSWORD }}
      API_TEST_EMAIL: ${{ secrets.API_TEST_EMAIL }}
      API_TEST_PASSWORD: ${{ secrets.API_TEST_PASSWORD }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      DEFAULT_PLAYWRIGHT_BASE_URL: ${{ secrets.FRONTEND_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Install Playwright browser and deps
        # On Linux the config falls back from WebKit to Chromium (WebKit runtime
        # deps are unavailable on ubuntu-latest runners), so we must install both.
        run: bunx playwright install --with-deps webkit chromium

      - name: Check credentials availability
        id: creds-check
        run: |
          if [ -n "$PLAYWRIGHT_ADMIN_EMAIL" ] && [ -n "$PLAYWRIGHT_ADMIN_PASSWORD" ]; then
            echo "creds_available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Playwright credentials (PLAYWRIGHT_ADMIN_EMAIL / PLAYWRIGHT_ADMIN_PASSWORD) are not set; skipping deep-functional tests for this run."
            echo "creds_available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build local app for CI test target
        if: steps.creds-check.outputs.creds_available == 'true'
        run: |
          bun run build

      - name: Start local preview server
        if: steps.creds-check.outputs.creds_available == 'true'
        run: |
          bun run preview -- --host 127.0.0.1 --port 4173 > /tmp/deep-functional-preview.log 2>&1 &
          echo $! > /tmp/deep-functional-preview.pid

      - name: Resolve base URL
        if: steps.creds-check.outputs.creds_available == 'true'
        run: |
          TARGET_URL=""
          if [ -n "${{ github.event.inputs.base_url }}" ]; then
            TARGET_URL="${{ github.event.inputs.base_url }}"
          else
            TARGET_URL="http://127.0.0.1:4173"
          fi

          if printf '%s' "$TARGET_URL" | grep -q '[[:cntrl:]]'; then
            echo "::error::Resolved PLAYWRIGHT_BASE_URL contains invalid control characters."
            exit 1
          fi

          if ! printf '%s' "$TARGET_URL" | grep -Eq '^https?://[A-Za-z0-9.-]+(:[0-9]+)?(/.*)?$'; then
            echo "::error::Resolved PLAYWRIGHT_BASE_URL must be a valid http/https URL."
            exit 1
          fi

          # Validate the selected target can actually serve the login route.
          for i in $(seq 1 40); do
            if curl -fsS --max-time 5 "${TARGET_URL}/login" >/dev/null 2>&1; then
              break
            fi
            if [ "$i" -eq 40 ]; then
              echo "::error::PLAYWRIGHT_BASE_URL (${TARGET_URL}) is unreachable after waiting for startup."
              if [ -f /tmp/deep-functional-preview.log ]; then
                echo "--- preview log ---"
                tail -n 120 /tmp/deep-functional-preview.log || true
              fi
              exit 1
            fi
            sleep 2
          done

          {
            echo "PLAYWRIGHT_BASE_URL<<EOF"
            echo "$TARGET_URL"
            echo "EOF"
          } >> "$GITHUB_ENV"
          echo "Resolved PLAYWRIGHT_BASE_URL=$TARGET_URL"

      - name: Run deep functional suite
        if: steps.creds-check.outputs.creds_available == 'true'
        run: |
          bunx playwright test tests/e2e/deep-functional.spec.ts tests/e2e/tender-workspace.spec.ts \
            --config=playwright.deep-lite.config.ts \
            --project="${{ matrix.project }}" \
            --reporter=list \
            --timeout=90000

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deep-functional-${{ matrix.project }}-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
