name: Playwright Deep Functional Cross-Browser

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'tests/e2e/**'
      - 'playwright.config.ts'
      - 'playwright.deep-lite.config.ts'
      - 'playwright.api.config.ts'
      - 'package.json'
      - 'bun.lock'
      - 'vite.config.ts'
      - '.github/workflows/playwright-deep-functional-cross-browser.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'tests/e2e/**'
      - 'playwright.config.ts'
      - 'playwright.deep-lite.config.ts'
      - 'playwright.api.config.ts'
      - 'package.json'
      - 'bun.lock'
      - 'vite.config.ts'
      - '.github/workflows/playwright-deep-functional-cross-browser.yml'
  workflow_dispatch:
    inputs:
      base_url:
        description: "Optional base URL override"
        required: false
        type: string

concurrency:
  group: deep-functional-cross-browser-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  deep-functional:
    name: Deep Functional (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project:
          - webkit
          - Mobile Safari

    env:
      CI: true
      PLAYWRIGHT_ALLOW_SHARED_CREDENTIAL_FALLBACK: '1'
      PLAYWRIGHT_ADMIN_EMAIL: ${{ secrets.PLAYWRIGHT_ADMIN_EMAIL }}
      PLAYWRIGHT_ADMIN_PASSWORD: ${{ secrets.PLAYWRIGHT_ADMIN_PASSWORD }}
      PLAYWRIGHT_MASTER_EMAIL: ${{ secrets.PLAYWRIGHT_MASTER_EMAIL }}
      PLAYWRIGHT_MASTER_PASSWORD: ${{ secrets.PLAYWRIGHT_MASTER_PASSWORD }}
      PLAYWRIGHT_OFFICER_EMAIL: ${{ secrets.PLAYWRIGHT_OFFICER_EMAIL }}
      PLAYWRIGHT_OFFICER_PASSWORD: ${{ secrets.PLAYWRIGHT_OFFICER_PASSWORD }}
      API_TEST_EMAIL: ${{ secrets.API_TEST_EMAIL }}
      API_TEST_PASSWORD: ${{ secrets.API_TEST_PASSWORD }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      DEFAULT_PLAYWRIGHT_BASE_URL: ${{ secrets.FRONTEND_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Install Playwright browser and deps
        # On Linux the config falls back from WebKit to Chromium (WebKit runtime
        # deps are unavailable on ubuntu-latest runners), so we must install both.
        run: bunx playwright install --with-deps webkit chromium

      - name: Check credentials availability
        id: creds-check
        run: |
          if [ -n "$PLAYWRIGHT_ADMIN_EMAIL" ] && [ -n "$PLAYWRIGHT_ADMIN_PASSWORD" ]; then
            echo "creds_available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Playwright credentials (PLAYWRIGHT_ADMIN_EMAIL / PLAYWRIGHT_ADMIN_PASSWORD) are not set; skipping deep-functional tests for this run."
            echo "creds_available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve base URL
        if: steps.creds-check.outputs.creds_available == 'true'
        run: |
          TARGET_URL=""
          SAFE_FALLBACK_URL="https://freedom-camp-manager.vercel.app"

          if [ -n "${{ github.event.inputs.base_url }}" ]; then
            TARGET_URL="${{ github.event.inputs.base_url }}"
          elif [ -n "$DEFAULT_PLAYWRIGHT_BASE_URL" ]; then
            TARGET_URL="$DEFAULT_PLAYWRIGHT_BASE_URL"
          else
            TARGET_URL="$SAFE_FALLBACK_URL"
          fi

          # Vercel preview domains may present SSO walls in CI and break login flows.
          # Fall back to a known app host unless user explicitly overrides with workflow input.
          if [ -z "${{ github.event.inputs.base_url }}" ] && echo "$TARGET_URL" | grep -Eiq 'https?://[^/]*\.vercel\.app'; then
            echo "::warning::DEFAULT_PLAYWRIGHT_BASE_URL points to a vercel.app host (${TARGET_URL}); falling back to ${SAFE_FALLBACK_URL} for deep-functional CI."
            TARGET_URL="$SAFE_FALLBACK_URL"
          fi

          # Guard against misrouted domains that serve GitHub Pages 404 instead of the app.
          if [ -z "${{ github.event.inputs.base_url }}" ]; then
            PAGE_HEAD=$(curl -Ls --max-time 20 "${TARGET_URL}/login" | head -n 20 || true)
            if echo "$PAGE_HEAD" | grep -Eq "There isn't a GitHub Pages site here|<h1>404</h1>"; then
              echo "::warning::Resolved PLAYWRIGHT_BASE_URL (${TARGET_URL}) returned a GitHub Pages 404 page; falling back to ${SAFE_FALLBACK_URL}."
              TARGET_URL="$SAFE_FALLBACK_URL"
            fi
          fi

          echo "PLAYWRIGHT_BASE_URL=$TARGET_URL" >> "$GITHUB_ENV"
          echo "Resolved PLAYWRIGHT_BASE_URL=$TARGET_URL"

      - name: Run deep functional suite
        if: steps.creds-check.outputs.creds_available == 'true'
        run: |
          bunx playwright test tests/e2e/deep-functional.spec.ts tests/e2e/tender-workspace.spec.ts \
            --config=playwright.deep-lite.config.ts \
            --project="${{ matrix.project }}" \
            --reporter=list \
            --timeout=90000

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deep-functional-${{ matrix.project }}-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
