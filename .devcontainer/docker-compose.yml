version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspaces/FreedomCamp-Manager:cached
    command: sleep infinity
    depends_on:
      - ollama
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_AUTOSTART: 'false'

  ollama:
    image: ollama/ollama:latest
    container_name: fieldops-ollama
    restart: unless-stopped
    ports:
      - '11434:11434'
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434

  ptt-translator-python:
    build:
      context: ..
      dockerfile: ptt-bridge-python/Dockerfile
    container_name: fieldops-ptt-translator-python
    restart: unless-stopped
    profiles: ["translator"]
    ports:
      - '8274:8274'
    environment:
      WHISPER_MODEL: distil-large-v3
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      TRANSLATOR_MODEL_PATH: nllb-200-distilled-600M
      TOKENIZER_MODEL_NAME: facebook/nllb-200-distilled-600M
      TRANSLATOR_DEVICE: cpu

volumes:
  ollama_data:
