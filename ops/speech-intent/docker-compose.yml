version: "3.9"

services:
  speech-router:
    build:
      context: ./speech-router
      dockerfile: Dockerfile
    container_name: speech-router
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
